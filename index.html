<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Home</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%23d9822b%22 d=%22M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z%22/%3E%3C/svg%3E">
  <style>
/* Home dashboard, second edition. Warm paper by day, charcoal by night.
   Phone first: one column with tabs at the bottom; a side rail from 700px; three columns from 1000px. */

:root {
  --bg: #f3f1ec;
  --surface: #fffdf9;
  --surface-2: #f0ede6;
  --text: #1f1d1a;
  --muted: #6e6960;
  --border: #e4dfd5;
  --primary: #2b6c74;          /* teal: links, buttons, selection */
  --primary-text: #ffffff;
  --accent: #e0912a;           /* amber: lights on, solar */
  --accent-soft: #fbecd5;
  --positive: #2f8a57;         /* sold, money in */
  --negative: #c4553a;         /* bought, money out */
  --warning: #b86e00;
  --danger: #c43d3d;
  --battery: #3c8f7c;
  --shadow: 0 1px 2px rgb(60 45 20 / 0.05), 0 4px 16px rgb(60 45 20 / 0.06);
  --radius: 20px;
  --radius-sm: 12px;
  --gap: 14px;
  --rail: 84px;
  --tabs-h: 64px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131518;
    --surface: #1c1f23;
    --surface-2: #262a30;
    --text: #edeae4;
    --muted: #9c978e;
    --border: #2e3238;
    --primary: #6fb5bd;
    --primary-text: #0f1a1c;
    --accent: #f0a94a;
    --accent-soft: #3a2e1c;
    --positive: #5cc489;
    --negative: #ec8467;
    --warning: #f0a94a;
    --battery: #63c2ab;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131518;
  --surface: #1c1f23;
  --surface-2: #262a30;
  --text: #edeae4;
  --muted: #9c978e;
  --border: #2e3238;
  --primary: #6fb5bd;
  --primary-text: #0f1a1c;
  --accent: #f0a94a;
  --accent-soft: #3a2e1c;
  --positive: #5cc489;
  --negative: #ec8467;
  --warning: #f0a94a;
  --battery: #63c2ab;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
a { color: var(--primary); }
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.icon { width: 24px; height: 24px; fill: currentColor; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 0.8rem; }
small { font-size: 0.8em; }

/* ---------- shell: nav, top bar ---------- */

.nav {
  position: fixed;
  z-index: 50;
  inset: auto 0 0 0;
  display: flex;
  justify-content: space-around;
  height: calc(var(--tabs-h) + var(--safe-bottom));
  padding: 0 var(--safe-right) var(--safe-bottom) var(--safe-left);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
}
.nav .brand { display: none; }
.nav a {
  flex: 1;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 2px;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.7rem;
  font-weight: 600;
}
.nav a .icon { width: 24px; height: 24px; }
.nav a[aria-current] { color: var(--text); }
.nav a[aria-current] .icon { color: var(--primary); }
.kiosk .nav { display: none; }

.main { min-height: 100dvh; padding-bottom: calc(var(--tabs-h) + var(--safe-bottom) + 12px); }
.kiosk .main { padding-bottom: 12px; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(10px + var(--safe-top)) calc(16px + var(--safe-right)) 10px calc(16px + var(--safe-left));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}
.topbar-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.topbar h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
.topbar-clock { color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 600; }
:root[data-view="today"] .topbar-clock { display: none; }
.topbar-actions { display: flex; align-items: center; gap: 6px; }

.icon-btn {
  position: relative;
  display: inline-grid;
  place-items: center;
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--text);
}
.icon-btn:hover { background: var(--surface-2); }
.icon-btn .icon { width: 22px; height: 22px; }
.bell .badge {
  position: absolute;
  top: 3px;
  right: 2px;
  min-width: 18px;
  height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  background: var(--danger);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
  line-height: 18px;
}
.bell.ring .icon { animation: ring 0.9s ease-in-out 2; transform-origin: 50% 10%; }
@keyframes ring { 0%, 100% { rotate: 0deg; } 20% { rotate: 16deg; } 40% { rotate: -14deg; } 60% { rotate: 8deg; } 80% { rotate: -4deg; } }

.status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 32px;
  padding: 0 10px;
  border-radius: 16px;
  color: var(--muted);
  text-decoration: none;
  font-size: 0.78rem;
  font-weight: 600;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-status="connected"] .status-dot { background: var(--positive); }
.status[data-status="connected"] .status-text { display: none; }
.status[data-status="connected"] { padding: 0 8px; }
.status[data-status="disconnected"] .status-dot, .status[data-status="auth_invalid"] .status-dot { background: var(--danger); }
.status[data-status="connecting"] .status-dot { animation: pulse 1.2s infinite; }

.view { padding: 4px calc(14px + var(--safe-right)) 8px calc(14px + var(--safe-left)); outline: none; }

/* ---------- cards and common parts ---------- */

.card {
  display: block;
  padding: 16px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  border: 1px solid color-mix(in srgb, var(--border) 60%, transparent);
  color: inherit;
  text-decoration: none;
  min-width: 0;
}
.card-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.card-title .icon { width: 18px; height: 18px; color: var(--primary); }
.card-title .count {
  margin-left: 2px;
  padding: 1px 8px;
  border-radius: 10px;
  background: var(--surface-2);
  color: var(--text);
  letter-spacing: 0;
}
.card-go { margin-left: auto; display: inline-grid; color: var(--muted); }
.card-go .icon { color: var(--muted); }
.quiet { font-size: 0.9rem; }
.hint { margin-top: 12px; font-size: 0.85rem; color: var(--muted); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
}
.btn .icon { width: 20px; height: 20px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }
.btn.on { background: var(--accent); border-color: var(--accent); color: #241605; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.btn-row .btn { flex: 1 1 auto; }
.link-btn { margin-top: 8px; padding: 6px 0; border: 0; background: none; color: var(--primary); font-weight: 600; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 34px;
  padding: 0 14px;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 17px;
  background: var(--surface);
  font-size: 0.88rem;
  font-weight: 600;
}

.spinner {
  width: 28px;
  height: 28px;
  margin: 16px auto;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: 0.35; } }

.empty { display: grid; justify-items: center; gap: 12px; max-width: 420px; margin: 12vh auto; text-align: center; }
.empty h2 { font-size: 1.3rem; }

.toast {
  position: fixed;
  z-index: 200;
  left: 50%;
  bottom: calc(var(--tabs-h) + var(--safe-bottom) + 16px);
  translate: -50% 0;
  max-width: min(92vw, 420px);
  padding: 12px 18px;
  border-radius: 14px;
  background: var(--text);
  color: var(--bg);
  font-size: 0.9rem;
  box-shadow: 0 8px 30px rgb(0 0 0 / 0.25);
}
.toast[hidden] { display: none; }

/* ---------- Today ---------- */

.v-today { display: grid; gap: var(--gap); }
.v-today .col { display: contents; }
/* Phone order: the day, energy, calendar, shopping, notifications, people, news. */
.hero { order: 1; }
.energy-mini { order: 2; }
.agenda-card { order: 3; }
.shop-card { order: 4; }
.notes-card { order: 5; }
.people-mini { order: 6; }
.news-card { order: 7; }

.hero {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 60%),
    var(--surface);
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.hero-greet { font-weight: 600; color: var(--muted); }
.hero-time {
  font-size: clamp(3.4rem, 9vw + 1rem, 5.6rem);
  font-weight: 250;
  line-height: 0.95;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
}
.hero-date { margin-top: 6px; font-size: 1.05rem; font-weight: 600; }
.hero-weather {
  display: grid;
  justify-items: end;
  gap: 2px;
  padding: 4px 0 0;
  border: 0;
  background: none;
  text-align: right;
}
.wx-now { display: flex; align-items: center; gap: 4px; }
.wx-now .icon { width: 28px; height: 28px; color: var(--accent); }
.wx-now b { font-size: 2.2rem; font-weight: 300; letter-spacing: -0.03em; }
.wx-cond { font-weight: 600; }
.wx-fc { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.warn-banner {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  margin-top: 12px;
  padding: 8px 12px;
  border: 0;
  border-radius: 12px;
  background: color-mix(in srgb, var(--warning) 16%, transparent);
  color: var(--warning);
  font-weight: 600;
  text-align: left;
}
.warn-banner .icon { width: 20px; height: 20px; }
.hero-summary { margin-top: 14px; font-size: 1.05rem; line-height: 1.5; max-width: 60ch; }
.hero-summary small { color: var(--muted); }

.glance { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); gap: 6px; margin: 14px 0 0; padding: 0; list-style: none; }
.glance-item { display: flex; align-items: stretch; border-radius: 14px; background: var(--surface-2); overflow: hidden; }
.glance-item > button {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
  padding: 7px 10px;
  border: 0;
  background: none;
  text-align: left;
  font-size: 0.86rem;
  line-height: 1.2;
  font-weight: 600;
}
.glance-item > button:disabled { cursor: default; }
.glance-item .icon { width: 20px; height: 20px; color: var(--muted); }
.glance-item small { display: block; font-weight: 500; color: var(--muted); font-size: 0.78rem; }
.glance-item.tone-alert { background: color-mix(in srgb, var(--danger) 16%, var(--surface)); }
.glance-item.tone-alert .icon { color: var(--danger); }
.glance-item.tone-warn { background: color-mix(in srgb, var(--warning) 16%, var(--surface)); }
.glance-item.tone-warn .icon { color: var(--warning); }
.glance-item.tone-ok .icon { color: var(--positive); }
.glance-act { border: 0; border-left: 1px solid var(--border); padding: 0 12px; background: none; color: var(--primary); font-weight: 700; font-size: 0.85rem; }

/* Shopping list: tap an item to tick it off. */
.shop { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; padding: 0; list-style: none; }
.shop-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  padding: 6px 12px 6px 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  font-weight: 600;
  text-align: left;
}
.shop-item .tick {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  background: var(--surface);
  color: transparent;
}
.shop-item .tick .icon { width: 16px; height: 16px; }
.shop li.done .shop-item { opacity: 0.5; text-decoration: line-through; }
.shop li.done .tick { background: var(--positive); border-color: var(--positive); color: #fff; }
@media (hover: hover) { .shop-item:hover .tick { border-color: var(--positive); color: var(--positive); } }
.shop-add { display: flex; gap: 6px; align-items: center; }
.shop-add input {
  flex: 1;
  min-width: 0;
  min-height: 40px;
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  color: var(--text);
  font: inherit;
}
.shop-add input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
.shop-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 12px; margin: 8px 0 0; font-size: 0.82rem; }
.shop-foot span { display: inline-flex; align-items: center; gap: 4px; }
.shop-foot .icon { width: 15px; height: 15px; }
.shop-foot .link-btn { margin: 0; }

.agenda-day + .agenda-day { margin-top: 14px; }
.agenda-day h3 { font-size: 0.95rem; margin-bottom: 6px; }
.agenda { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
.agenda li {
  display: grid;
  grid-template-columns: 5.2em 1fr;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 12px;
  background: color-mix(in srgb, var(--cal) 10%, var(--surface));
  border-left: 4px solid var(--cal);
}
.ev-time { font-size: 0.85rem; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.ev-title { font-weight: 600; min-width: 0; }
.ev-title small { display: block; font-weight: 400; color: var(--muted); }

.energy-mini:hover, .energy-mini:focus-visible { border-color: var(--primary); }
.em-row { display: flex; align-items: center; gap: 18px; }
.ring {
  --size: 112px;
  flex: none;
  display: grid;
  place-content: center;
  justify-items: center;
  width: var(--size);
  height: var(--size);
  border-radius: 50%;
  background:
    radial-gradient(closest-side, var(--surface) 80%, transparent 81%),
    conic-gradient(var(--battery) calc(var(--p) * 1%), var(--surface-2) 0);
}
.ring b { font-size: 1.7rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.ring small { color: var(--muted); font-size: 0.72rem; font-weight: 600; text-align: center; max-width: 80px; }
.em-stats { flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px 10px; margin: 0; }
.em-stats dt { color: var(--muted); font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
.em-stats dd { margin: 0; font-size: 1.1rem; white-space: nowrap; font-weight: 600; font-variant-numeric: tabular-nums; }
.em-stats dd small.u { display: inline; font-size: 0.62em; }
.em-stats dd small:not(.u) { display: block; color: var(--muted); font-weight: 500; font-size: 0.78rem; }
.pos { color: var(--positive); }
.neg { color: var(--negative); }

.people-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 0 0 12px; padding: 0; list-style: none; }
.person-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 6px 12px 6px 6px;
  border: 1px solid var(--border);
  border-radius: 28px;
  background: var(--surface);
  text-align: left;
}
.person-chip b { display: block; font-size: 0.95rem; }
.person-chip small { display: block; color: var(--muted); font-size: 0.8rem; }
.person-chip.home small { color: var(--positive); font-weight: 600; }
.pmap-slot.mini .pmap { height: 200px; border-radius: 14px; overflow: hidden; }

.notes { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.note { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 14px; background: var(--surface-2); }
.note-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--surface); color: var(--primary); flex: none; }
.note.ha .note-icon { color: var(--warning); }
.note-icon .icon { width: 18px; height: 18px; }
.note-body { flex: 1; min-width: 0; }
.note-body b { display: block; font-size: 0.95rem; }
.note-body p { font-size: 0.9rem; overflow-wrap: anywhere; }
.note .icon-btn { width: 32px; height: 32px; margin: -4px -4px 0 0; }
.note .icon-btn .icon { width: 18px; height: 18px; }

.news { display: grid; margin: 0; padding: 0; list-style: none; }
.story + .story { border-top: 1px solid var(--border); }
.story-head {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 12px;
  width: 100%;
  padding: 10px 0;
  border: 0;
  background: none;
  text-align: left;
}
.story-img { grid-row: span 2; grid-column: 2; width: 64px; height: 48px; object-fit: cover; border-radius: 8px; }
.story-title { grid-column: 1; font-weight: 600; line-height: 1.3; }
.story-meta { grid-column: 1; color: var(--muted); font-size: 0.78rem; }
.story-body { padding: 0 0 12px; font-size: 0.92rem; }
.story-body p { margin-bottom: 8px; color: var(--muted); }
.story-link { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.story-link .icon { width: 16px; height: 16px; }

/* ---------- Energy ---------- */

.v-energy { display: grid; gap: var(--gap); }
.bat { display: flex; align-items: center; gap: 18px; }
.bat-gauge {
  position: relative;
  flex: none;
  width: 92px;
  height: 150px;
  border-radius: 18px;
  border: 3px solid var(--border);
  background: var(--surface-2);
  overflow: hidden;
  display: grid;
  place-items: center;
}
.bat-gauge::before {
  content: "";
  position: absolute;
  top: -3px;
  left: 50%;
  translate: -50% 0;
  width: 34px;
  height: 7px;
  border-radius: 0 0 4px 4px;
  background: var(--border);
}
.bat-fill {
  position: absolute;
  inset: auto 0 0 0;
  height: calc(var(--p) * 1%);
  background: linear-gradient(to top, var(--battery), color-mix(in srgb, var(--battery) 70%, #fff));
  transition: height 0.6s;
}
.bat-gauge b { position: relative; font-size: 1.6rem; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 6px var(--surface); }
.bat-text { display: grid; gap: 4px; }
.bat-state { font-size: 1.2rem; font-weight: 700; }
.alert-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.alert-row > span { display: flex; gap: 10px; align-items: flex-start; }
.alert-row > span > .icon { width: 20px; height: 20px; color: var(--primary); margin-top: 2px; }
.alert-row b { display: block; font-size: 0.95rem; }
.alert-row small { display: block; }
.switch {
  flex: none;
  position: relative;
  width: 52px;
  height: 32px;
  border: 0;
  border-radius: 16px;
  background: var(--border);
  transition: background 0.2s;
}
.switch::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.3);
  transition: translate 0.2s;
}
.switch.on { background: var(--positive); }
.switch.on::after { translate: 20px 0; }

.flow { position: relative; width: min(100%, 380px); aspect-ratio: 1; margin: 0 auto; }
.flow > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.flow-line { stroke: var(--border); stroke-width: 3; stroke-linecap: round; }
.flow-line.go { stroke-dasharray: 2 10; stroke-width: 4; animation: dash var(--speed) linear infinite; }
.flow-line.go.out { animation-direction: reverse; }
.flow-line.go.solar { stroke: var(--accent); }
.flow-line.go.home { stroke: var(--primary); }
.flow-line.go.battery { stroke: var(--battery); }
.flow-line.go.grid.in { stroke: var(--negative); }
.flow-line.go.grid.out { stroke: var(--positive); }
@keyframes dash { to { stroke-dashoffset: 24; } }
.flow-hub {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  translate: -50% -50%;
  border-radius: 50%;
  background: var(--text);
}
.flow-node {
  position: absolute;
  translate: -50% -50%;
  display: grid;
  justify-items: center;
  gap: 1px;
  min-width: 82px;
  padding: 6px 8px;
  border-radius: 16px;
  background: var(--surface);
  border: 2px solid var(--border);
  text-align: center;
}
.flow-node b { font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.flow-node small { color: var(--muted); font-size: 0.74rem; font-weight: 600; white-space: nowrap; }
.fn-icon .icon { width: 22px; height: 22px; color: var(--muted); }
.flow-node.solar.active { border-color: var(--accent); }
.flow-node.solar.active .icon { color: var(--accent); }
.flow-node.home.active { border-color: var(--primary); }
.flow-node.home .icon { color: var(--primary); }
.flow-node.battery.active { border-color: var(--battery); }
.flow-node.battery .icon { color: var(--battery); }
.flow-node.grid.active { border-color: var(--positive); }
.flow-node.grid.active .icon { color: var(--positive); }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin: 0; }
.tiles > div { padding: 12px; border-radius: 14px; background: var(--surface-2); }
.tiles dt { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 0.8rem; font-weight: 600; }
.tiles dt .icon { width: 16px; height: 16px; }
.tiles dd { margin: 4px 0 0; font-size: 1.45rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.tiles dd small { font-size: 0.6em; color: var(--muted); font-weight: 600; }
.tiles > div > small { display: block; margin-top: 2px; font-weight: 600; font-size: 0.82rem; }
.t-solar dt .icon { color: var(--accent); }
.t-sold { background: color-mix(in srgb, var(--positive) 12%, var(--surface)) !important; }
.t-sold dt .icon, .t-sold > small { color: var(--positive); }
.t-bought dt .icon { color: var(--negative); }
.t-batt dt .icon { color: var(--battery); }
.t-home dt .icon { color: var(--primary); }
.est { margin-left: 6px; font-size: 0.7rem; font-style: normal; color: var(--muted); font-weight: 600; }

.chart { margin: 0; }
.chart + .chart { margin-top: 18px; }
.chart figcaption { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 6px; font-size: 0.85rem; }
.chart .key { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-weight: 600; }
.chart .key::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: currentColor; }
.key.solar { color: var(--accent); }
.key.home { color: var(--primary); }
.key.sold { color: var(--positive); }
.key.bought { color: var(--negative); }
.ch-plot { position: relative; height: 130px; }
.ch-plot svg { width: 100%; height: 100%; display: block; overflow: visible; }
.ch-grid { stroke: var(--border); stroke-width: 1; }
.ch-line { fill: none; stroke-width: 2; }
.ch-area { stroke: none; opacity: 0.25; }
.ch-line.solar { stroke: var(--accent); } .ch-area.solar { fill: var(--accent); }
.ch-line.home { stroke: var(--primary); }
.ch-line.sold { stroke: var(--positive); } .ch-area.sold { fill: var(--positive); }
.ch-line.bought { stroke: var(--negative); } .ch-area.bought { fill: var(--negative); }
.ch-line.soc { stroke: var(--battery); } .ch-area.soc { fill: var(--battery); }
.ch-y { position: absolute; left: 0; font-size: 0.7rem; color: var(--muted); background: color-mix(in srgb, var(--surface) 80%, transparent); padding: 0 3px; border-radius: 4px; }
.ch-x { position: relative; height: 1.2em; font-size: 0.72rem; color: var(--muted); }
.ch-x span { position: absolute; translate: -50% 0; }

/* ---------- Places ---------- */

.v-places { display: grid; gap: var(--gap); }
.map-card { padding: 0; overflow: hidden; }
.pmap-slot.big .pmap { height: 56dvh; }
.people-list { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.person-card {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  border-radius: 16px;
  background: var(--surface-2);
  text-align: left;
}
.person-card .pavatar { width: 46px; height: 46px; font-size: 1rem; }
.pc-text { flex: 1; display: grid; min-width: 0; }
.pc-text b { font-size: 1.05rem; }
.person-card.home .pc-text > span { color: var(--positive); font-weight: 600; }
.pc-batt { display: inline-flex; align-items: center; gap: 2px; font-weight: 600; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.pc-batt .icon { width: 18px; height: 18px; color: var(--positive); }
.pc-batt.low .icon, .pc-batt.low { color: var(--danger); }

/* ---------- Home: plan, rooms, devices ---------- */

.v-home { display: grid; gap: var(--gap); }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; margin: 0; padding: 0; list-style: none; }
.room { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; border-radius: 16px; background: var(--surface-2); }
.room.lit { background: color-mix(in srgb, var(--accent) 14%, var(--surface-2)); }
.room-head { flex: 1; display: grid; min-width: 0; padding: 8px 10px; border: 0; background: none; text-align: left; }
.room-head b { font-size: 0.98rem; }
.room-head span { font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-quick { display: flex; gap: 4px; }
.qt { display: grid; place-items: center; width: 38px; height: 38px; border: 0; border-radius: 12px; background: var(--surface); color: var(--muted); }
.qt .icon { width: 20px; height: 20px; }
.qt.on { background: var(--accent); color: #2a1a04; }

.cams { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; }
.cam {
  position: relative;
  display: block;
  width: 100%;
  aspect-ratio: 16 / 9;
  padding: 0;
  border: 0;
  border-radius: 14px;
  background: #0d0f12;
  overflow: hidden;
}
.cam img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s; }
.cam img.ready { opacity: 1; }
.cam-name {
  position: absolute;
  inset: auto 0 0 0;
  padding: 18px 10px 8px;
  background: linear-gradient(transparent, rgb(0 0 0 / 0.65));
  color: #fff;
  font-size: 0.85rem;
  font-weight: 600;
  text-align: left;
}

.devs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; }
.dev { position: relative; display: flex; border-radius: 16px; background: var(--surface-2); }
.dev-main { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; padding: 12px; border: 0; background: none; text-align: left; }
.dev-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: var(--surface); color: var(--muted); flex: none; }
.dev-icon .icon { width: 20px; height: 20px; }
.dev-text { display: grid; min-width: 0; }
.dev-name { font-weight: 600; font-size: 0.92rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.dev-state { color: var(--muted); font-size: 0.8rem; }
.dev-more { width: 34px; border: 0; background: none; color: var(--muted); border-radius: 0 16px 16px 0; }
.dev-more .icon { width: 18px; height: 18px; }
.dev.on { background: color-mix(in srgb, var(--accent) 20%, var(--surface-2)); }
.dev.on .dev-icon { background: var(--accent); color: #2a1a04; }
.dev.pending { opacity: 0.6; }
.dev-camera .dev-icon, .dev-binary_sensor .dev-icon { color: var(--primary); }

/* ---------- sheets ---------- */

.sheet {
  width: min(560px, 100vw);
  max-width: 100vw;
  max-height: min(88dvh, 860px);
  margin: auto auto 0;
  padding: 0 0 calc(16px + var(--safe-bottom));
  border: 0;
  border-radius: 24px 24px 0 0;
  background: var(--surface);
  color: var(--text);
  box-shadow: 0 -10px 40px rgb(0 0 0 / 0.25);
  overflow: auto;
}
.sheet::backdrop { background: rgb(10 10 10 / 0.45); backdrop-filter: blur(3px); }
.sheet[open] { animation: up 0.22s ease-out; }
@keyframes up { from { translate: 0 30px; opacity: 0; } }
.sheet-head {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 10px 10px 16px;
  background: var(--surface);
}
.sheet-head > div { flex: 1; min-width: 0; }
.sheet-head h2 { font-size: 1.2rem; }
.sheet-head p { font-size: 0.85rem; }
.sheet-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); color: var(--primary); }
.sheet-body { padding: 4px 16px 8px; }
.sheet-body .group + .group { margin-top: 16px; }
.sheet-body h3 { margin-bottom: 8px; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.sheet-body details summary { cursor: pointer; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.sheet-note { margin: 0 0 12px; color: var(--muted); }
.reading { display: grid; gap: 2px; margin-bottom: 14px; }
.reading-value { font-size: 2.2rem; font-weight: 600; letter-spacing: -0.02em; }
.slide { display: grid; gap: 6px; margin: 10px 0 14px; }
.slide-head { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
.slide input { width: 100%; accent-color: var(--primary); height: 32px; }
.climate { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.climate-now { font-size: 2.2rem; font-weight: 300; display: grid; }
.climate-now small { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
.climate-set { display: flex; align-items: center; gap: 12px; }
.climate-set b { font-size: 1.6rem; }
.climate-set .icon-btn { background: var(--surface-2); width: 48px; height: 48px; }
.kv-big { display: grid; gap: 12px; margin: 0 0 16px; }
.kv-big dt { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
.kv-big dd { margin: 0; font-size: 1.05rem; font-weight: 600; }
.kv-big dd small { display: block; font-weight: 400; color: var(--muted); }
.forecast { display: grid; gap: 2px; margin: 0 0 14px; padding: 0; list-style: none; }
.forecast li { display: grid; grid-template-columns: 3em 24px 1fr 3em 3em 3em; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.92rem; }
.forecast .icon { width: 20px; height: 20px; color: var(--accent); }
.forecast small { color: var(--primary); text-align: right; }

.sheet-camera { width: min(960px, 100vw); }
.sheet-camera .cam-stage { margin: 0 0 4px; }
.cam-kind { position: absolute; left: 12px; bottom: 10px; color: #fff; font-size: 0.78rem; font-weight: 600; text-shadow: 0 1px 3px #000; }

/* ---------- Settings ---------- */

.v-settings { display: grid; gap: var(--gap); max-width: 760px; margin: 0 auto; }
.v-settings .card { scroll-margin-top: 80px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.row:last-of-type { border-bottom: 0; }
.row > span { display: grid; gap: 2px; min-width: 0; }
.row small { font-size: 0.8rem; }
.row input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--primary); flex: none; }
.row input[type="number"], .row select { width: 120px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.row select { width: auto; }
.v-settings details { margin-top: 10px; }
.v-settings summary { cursor: pointer; font-weight: 600; color: var(--primary); }
.v-settings details p { margin-top: 8px; font-size: 0.9rem; }
.kv { display: grid; gap: 4px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 0.85rem; }
.kv li { display: flex; justify-content: space-between; gap: 12px; }
.kv code { overflow-wrap: anywhere; color: var(--muted); }
.conn { display: grid; gap: 12px; margin: 12px 0; }
.conn label:not(.row) { display: grid; gap: 4px; font-weight: 600; font-size: 0.9rem; }
.conn input[type="url"], .conn input[type="password"] { padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-2); }
.v-settings .btn { margin-top: 8px; }

/* ============================================================
   Wider screens
   ============================================================ */

@media (min-width: 700px) {
  .shell { display: grid; grid-template-columns: calc(var(--rail) + var(--safe-left)) minmax(0, 1fr); }
  .kiosk .shell { grid-template-columns: minmax(0, 1fr); }
  .nav {
    position: sticky;
    top: 0;
    inset: auto;
    flex-direction: column;
    justify-content: flex-start;
    gap: 4px;
    height: 100dvh;
    padding: calc(14px + var(--safe-top)) 8px 14px calc(8px + var(--safe-left));
    border-top: 0;
    border-right: 1px solid var(--border);
    background: var(--surface);
    backdrop-filter: none;
  }
  .nav .brand { display: grid; place-items: center; height: 44px; margin-bottom: 12px; color: var(--accent); }
  .nav .brand .icon { width: 30px; height: 30px; }
  .nav a { flex: none; height: 64px; border-radius: 16px; font-size: 0.72rem; }
  .nav a[aria-current] { background: var(--surface-2); }
  .nav .nav-settings { margin-top: auto; }
  .main { padding-bottom: 16px; }
  .view { padding: 4px 20px 16px; }
  .topbar { padding-left: 20px; padding-right: calc(20px + var(--safe-right)); }
  .toast { bottom: 24px; }
  .sheet { margin: auto; border-radius: 24px; padding-bottom: 16px; }

  /* Today: the day on the left, energy and people, notifications and news. */
  .v-today { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
  .v-today .col { display: flex; flex-direction: column; gap: var(--gap); }
  .v-today .col-c { grid-column: 2; }
  .v-today .col-b { grid-column: 2; grid-row: 1; }
  .v-today .col-a { grid-row: 1 / span 2; }

  .v-energy { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .today-energy, .month-energy, .charts-card { grid-column: 1 / -1; }

  .v-places { grid-template-columns: minmax(0, 1.7fr) minmax(260px, 1fr); align-items: start; }
  .pmap-slot.big .pmap { height: calc(100dvh - 120px); min-height: 360px; }
  .people-card { position: sticky; top: 72px; }
}

@media (min-width: 1000px) {
  .em-row { gap: 12px; }
  .v-today { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr) minmax(0, 1fr); }
  .v-today .col-a { grid-row: auto; }
  .v-today .col-b { grid-column: 2; grid-row: auto; }
  .v-today .col-c { grid-column: 3; }


  .v-home { grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); align-items: start; }
  .v-home .plan-card { grid-row: span 2; position: sticky; top: 72px; }
  .v-home .rooms { grid-template-columns: 1fr; }
  .v-home:not(:has(.plan-card)) { grid-template-columns: 1fr; }
  .v-home:not(:has(.plan-card)) .rooms { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
}

@media (min-width: 1200px) {
  .v-energy { grid-template-columns: minmax(0, 0.9fr) minmax(0, 1fr) minmax(0, 1.2fr); }
  .today-energy { grid-column: 3; grid-row: 1; }
  .month-energy { grid-column: 1; }
  .charts-card, .month-energy + .charts-card { grid-column: 2 / -1; }
}
@media (min-width: 1400px) {
  .view { max-width: 1680px; margin: 0 auto; }
}

/* Short landscape screens (Nest Hub 1024 x 600, iPad with the address bar): tighten the Today hero. */
@media (min-width: 700px) and (max-height: 820px) {
  .topbar { padding-top: calc(6px + var(--safe-top)); padding-bottom: 6px; }
  .hero-time { font-size: 4rem; }
  .hero-summary { font-size: 0.98rem; margin-top: 10px; }
  .card { padding: 14px; }
  .card-title { margin-bottom: 8px; }
  .ring { --size: 96px; }
  .ring b { font-size: 1.45rem; }
  .pmap-slot.mini .pmap { height: 150px; }
}
@media (min-width: 700px) and (max-height: 640px) {
  .hero-time { font-size: 3.2rem; }
  .hero-date { font-size: 0.95rem; }
  .glance-item > button { padding: 6px 10px; font-size: 0.85rem; }
  .nav a { height: 54px; }
  .nav .brand { display: none; }
  .pmap-slot.mini .pmap { height: 120px; }
}

@media (prefers-reduced-motion: reduce) {
  .flow-line.go, .bell.ring .icon { animation: none; }
}

.plan-card { padding: 6px 0 4px; }
.plan {
  position: relative;
  width: 100%;
  margin: 0 auto;
  aspect-ratio: var(--ar);
  container-type: inline-size;
  -webkit-user-select: none;
  user-select: none;
}
.plan > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

/* Plan colours: a soft paper model by day, the deep navy architectural look in dark. */
.plan-card {
  --plan-floor: #f4f6fa;
  --plan-floor-out: rgb(244 246 250 / 0.45);
  --plan-wall-top: #ffffff;
  --plan-wall-side: #aab4c3;
  --plan-cast: rgb(25 35 60 / 0.45);
  --plan-furn: #e1e6ee;
  --plan-soft: #d3dae6;
  --plan-bench: #c8d0dc;
  --plan-dark: #5d6878;
  --plan-glass: rgb(140 180 225 / 0.35);
  --plan-car: #c2cad7;
  --plan-pillow: #f7f9fc;
  --wall: 5.5px;
}
:root[data-theme="dark"] .plan-card {
  --plan-floor: #222a38;
  --plan-floor-out: rgb(34 42 56 / 0.5);
  --plan-wall-top: #59657a;
  --plan-wall-side: #0b0f16;
  --plan-cast: rgb(0 0 0 / 0.75);
  --plan-furn: #2e3848;
  --plan-soft: #374356;
  --plan-bench: #2a3342;
  --plan-dark: #10151d;
  --plan-glass: rgb(110 160 225 / 0.16);
  --plan-car: #3a4558;
  --plan-pillow: #48546a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .plan-card {
    --plan-floor: #222a38;
    --plan-floor-out: rgb(34 42 56 / 0.5);
    --plan-wall-top: #59657a;
    --plan-wall-side: #0b0f16;
    --plan-cast: rgb(0 0 0 / 0.75);
    --plan-furn: #2e3848;
    --plan-soft: #374356;
    --plan-bench: #2a3342;
    --plan-dark: #10151d;
    --plan-glass: rgb(110 160 225 / 0.16);
    --plan-car: #3a4558;
    --plan-pillow: #48546a;
  }
}

.plan-shape {
  fill: var(--plan-floor);
  cursor: pointer;
  transition: fill 0.25s;
}
.plan-fixed { fill: var(--plan-floor); }
.plan-room.outdoor .plan-shape { fill: var(--plan-floor-out); }
.plan-room.lit .plan-shape { fill: color-mix(in srgb, var(--accent) 12%, var(--plan-floor)); }
.plan-room.unlinked .plan-shape { fill: color-mix(in srgb, var(--plan-floor) 92%, var(--plan-wall-side)); }
.plan-room:active .plan-shape { fill: color-mix(in srgb, var(--primary) 22%, var(--plan-floor)); }
.plan-room:focus { outline: none; }
.plan-room:focus-visible .plan-shape { stroke: var(--primary); stroke-width: 3px; vector-effect: non-scaling-stroke; }
@media (hover: hover) {
  .plan-room:hover .plan-shape { fill: color-mix(in srgb, var(--primary) 9%, var(--plan-floor)); }
  .plan-room.lit:hover .plan-shape { fill: color-mix(in srgb, var(--accent) 20%, var(--plan-floor)); }
}

.plan-furniture, .plan-glows, .plan-porches, [class^="plan-wall"] { pointer-events: none; }
.plan-furn { fill: var(--plan-furn); }
.plan-furn.soft { fill: var(--plan-soft); }
.plan-furn.bench { fill: var(--plan-bench); }
.plan-furn.dark { fill: var(--plan-dark); }
.plan-furn.pillow { fill: var(--plan-pillow); }
.plan-furn.car { fill: var(--plan-car); }
.plan-furn.glass { fill: var(--plan-glass); stroke: var(--plan-bench); stroke-width: 1; }

.plan-wall-cast polygon, .plan-wall-side polygon, .plan-wall-top polygon {
  fill: none;
  stroke-width: var(--wall);
  stroke-linejoin: miter;
  stroke-linecap: square;
}
.plan-wall-cast polygon { stroke: var(--plan-cast); stroke-width: calc(var(--wall) + 2px); }
.plan-wall-side polygon { stroke: var(--plan-wall-side); }
.plan-wall-top polygon { stroke: var(--plan-wall-top); }
.plan-porches polygon {
  fill: none;
  stroke: var(--plan-wall-side);
  stroke-width: 1.5;
  stroke-dasharray: 5 4;
}

.plan-label {
  position: absolute;
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: 1px;
  text-align: center;
  pointer-events: none;
  font-size: clamp(11px, 0.9cqi + 6px, 15px);
  line-height: 1.15;
  color: var(--text);
}
.plan-label strong { position: relative; font-weight: 600; }
.plan-label.compact { font-size: clamp(10px, 0.7cqi + 5px, 13px); }
.plan-label.compact .plan-meta { display: none; }
.plan-label.unlinked { opacity: 0.55; }
/* Keep names readable over a bright glow, light or dark theme. */
.plan-label.lit { text-shadow: 0 0 2px var(--surface), 0 0 8px var(--surface); }
.plan-label.lit .plan-meta { color: var(--text); }
.plan-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 0.88em;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.plan-meta span { display: inline-flex; align-items: center; gap: 1px; }
.plan-meta .icon { width: 1.15em; height: 1.15em; }
.plan-lights { color: color-mix(in srgb, var(--accent) 75%, var(--text)); font-weight: 600; }
.plan-open { color: var(--warning); }
.plan-motion {
  position: absolute;
  top: 0.1em;
  left: -0.75em;
  width: 0.45em;
  height: 0.45em;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
  animation: pulse 1.6s infinite;
}

/* ---------- floor plan: uploaded pictures ---------- */

.plan.picture > svg { overflow: hidden; border-radius: 10px; }
.plan.picture .plan-img { pointer-events: none; }
.plan.picture .plan-shape { fill: transparent; stroke: transparent; stroke-width: 2px; vector-effect: non-scaling-stroke; }
.plan.picture .plan-room.unlinked .plan-shape { fill: transparent; }
.plan.picture .plan-room.lit .plan-shape { fill: color-mix(in srgb, var(--accent) 10%, transparent); }
.plan.picture .plan-room:active .plan-shape { fill: color-mix(in srgb, var(--primary) 22%, transparent); }
.plan.picture .plan-room:focus-visible .plan-shape { stroke: var(--primary); }
@media (hover: hover) {
  .plan.picture .plan-room:hover .plan-shape { fill: color-mix(in srgb, var(--primary) 10%, transparent); stroke: color-mix(in srgb, var(--primary) 55%, transparent); }
}
.plan.picture .plan-glow { mix-blend-mode: multiply; }
/* Names sit on a soft halo so they read over the lines of the picture. */
.plan.picture .plan-label strong, .plan.picture .plan-meta { text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface), 0 0 8px var(--surface); }
:root[data-theme="dark"] .plan.invert-dark .plan-img { filter: url(#plan-invert); }
:root[data-theme="dark"] .plan.invert-dark .plan-glow { mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .plan.invert-dark .plan-img { filter: url(#plan-invert); }
  :root:not([data-theme="light"]) .plan.invert-dark .plan-glow { mix-blend-mode: screen; }
}

.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .icon { width: 18px; height: 18px; }
.chip:disabled { opacity: 0.45; cursor: default; }

.pmap { position: relative; height: 260px; isolation: isolate; }
.pmap-canvas { position: absolute; inset: 0; }
.pmap .leaflet-container { background: var(--surface-2); font: inherit; }
/* Dark mode: the same OpenStreetMap pictures, inverted to a dark map with the colours kept. */
.pmap.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.6); }
.pmap .leaflet-control-attribution {
  background: color-mix(in srgb, var(--surface) 75%, transparent);
  color: var(--muted);
  font-size: 10px;
  border-top-left-radius: 6px;
}
.pmap .leaflet-control-attribution a { color: inherit; }
.pmap .leaflet-bar { border: 0; box-shadow: var(--shadow); border-radius: var(--radius-sm); overflow: hidden; }
.pmap .leaflet-bar a { background: var(--surface); color: var(--text); border-color: var(--border); }
.pmap-msg {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  margin: 0;
  padding: 24px;
  text-align: center;
  font-size: 0.9rem;
  color: var(--muted);
  background: var(--surface-2);
}
.pmap-msg[hidden] { display: none; }
.pmap-tools { position: absolute; top: 10px; right: 10px; z-index: 1000; display: grid; gap: 8px; }
.pmap-btn {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--glass-border, var(--border));
  border-radius: 50%;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  box-shadow: 0 1px 4px rgb(0 0 0 / 0.18);
  color: var(--text);
  cursor: pointer;
}
.pmap-btn .icon { width: 20px; height: 20px; }

/* Full screen: over everything but the clock screen. */
.pmap.expanded {
  position: fixed;
  inset: 0;
  z-index: 80;
  height: auto;
  background: var(--bg);
}
.pmap.expanded .pmap-tools { top: calc(12px + var(--safe-top)); right: calc(12px + var(--safe-right)); }
.pmap-open, .pmap-open body { overflow: hidden; }

/* Zones: Home in the accent blue, others quieter, passive ones dashed. */
.pmap-zone { fill: var(--primary); fill-opacity: 0.08; stroke: var(--primary); stroke-opacity: 0.5; stroke-width: 1.5px; }
.pmap-zone.home { fill-opacity: 0.14; stroke-opacity: 0.8; }
.pmap-zone.passive { stroke-dasharray: 4 4; fill-opacity: 0.04; }
.pmap-acc { fill: var(--primary); fill-opacity: 0.1; stroke: none; }
.pmap-zone-label { width: 0 !important; height: 0 !important; }
.pmap-zone-label span {
  position: absolute;
  /* Above the zone's top edge, clear of anyone standing in it. */
  transform: translate(-50%, calc(-100% - 26px));
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.15);
  pointer-events: none;
}
.pmap-zone-label .icon { width: 12px; height: 12px; color: var(--primary); }
.pmap-zone.shop { fill: var(--accent); stroke: var(--accent); }
.pmap-zone-label.shop span { padding: 3px; transform: translate(-50%, -50%); }
.pmap-zone-label.shop .icon { color: var(--accent); }

/* A person: their picture in a ring, first name underneath. */
.pavatar {
  position: relative;
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--pc, var(--primary));
  color: #fff;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.pavatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pavatar.big { width: 44px; height: 44px; font-size: 1rem; }
.pmap-pin-wrap { background: none; border: 0; }
.pmap-pin { position: relative; display: grid; justify-items: center; gap: 2px; cursor: pointer; }
.pmap-pin .pavatar {
  width: 44px;
  height: 44px;
  border: 3px solid #fff;
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.35), 0 0 0 1px rgb(0 0 0 / 0.08);
}
.pmap-pin.away .pavatar { border-color: var(--pc); }
.pmap-pin.away .pavatar { box-shadow: 0 2px 8px rgb(0 0 0 / 0.35), 0 0 0 2px #fff; }
.pmap-name {
  padding: 1px 7px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.2);
}
.pmap-pin.pulse .pavatar { animation: pmap-pulse 1.2s ease-out 2; }
@keyframes pmap-pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 70%, transparent), 0 2px 8px rgb(0 0 0 / 0.35); }
  100% { box-shadow: 0 0 0 18px transparent, 0 2px 8px rgb(0 0 0 / 0.35); }
}


.cam-stage {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 16 / 9;
  max-height: 70dvh;
  background: #000;
  overflow: hidden;
}
.cam-stage > img, .cam-stage > video {
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.cam-poster { opacity: 0; transition: opacity 0.3s; }
.cam-stage.has-pic .cam-poster { opacity: 1; }
.cam-media { opacity: 0; transition: opacity 0.25s; }
.cam-stage[data-phase="playing"] .cam-media { opacity: 1; }
.cam-stage[data-phase="playing"] .cam-poster { visibility: hidden; }
.cam-status {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  text-align: center;
  color: #fff;
  font-size: 0.9rem;
  text-shadow: 0 1px 3px rgb(0 0 0 / 0.6);
  background: radial-gradient(rgb(0 0 0 / 0.35), transparent 75%);
}
.cam-status .spinner { border-color: rgb(255 255 255 / 0.35); border-top-color: #fff; }
.cam-status .btn { display: none; gap: 6px; background: rgb(255 255 255 / 0.92); color: #16191d; border: 0; text-shadow: none; }
.cam-status .btn .icon { width: 18px; height: 18px; }
.cam-stage[data-phase="playing"] .cam-status { display: none; }
.cam-stage[data-phase="failed"] .spinner { display: none; }

/* Settings forms, the floor plan editor, the month calendar and search boxes. */

/* ---------- forms (floor plan editor and Settings) ---------- */

.panel-text { margin: -2px 0 12px; font-size: 0.9rem; }
.form { display: grid; gap: 14px; }
.form label, .form .field { display: grid; gap: 6px; }
.form label > span, .form .field > span { font-weight: 600; font-size: 0.9rem; }
.form .check, .plan-checks .check { display: flex; align-items: center; gap: 10px; }
.form .check span { font-weight: 400; }
.check input { width: 20px; height: 20px; accent-color: var(--primary); flex: none; }
.plan-checks { display: grid; gap: 8px; }
.form input[type="text"], .conn input, .select, .row select, .pe-room input[type="text"], .pe-room select {
  min-height: 42px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  width: 100%;
}
.row select { width: auto; max-width: 55%; min-height: 38px; }
.conn { display: grid; gap: 10px; }
.conn label:not(.row) { display: grid; gap: 4px; font-weight: 600; font-size: 0.9rem; }
.form-actions, .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.form-actions .btn, .btn-row .btn { flex: 0 1 auto; }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: 0.5; cursor: default; }
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 14px 0 0; font-size: 0.85rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.chips.wrap { flex-wrap: wrap; }
.chips button.chip { cursor: pointer; }
.v-settings code { font-size: 0.85em; padding: 1px 5px; border-radius: 6px; background: var(--surface-2); }
.cal-pick b::before { content: ""; display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 3px; background: var(--cal); }

.eroom-group { border-top: 1px solid var(--border); padding: 8px 0; }
.eroom-group summary { font-weight: 600; cursor: pointer; }
.eroom-group .row:last-child { border-bottom: 0; }

/* ---------- floor plan set-up ---------- */

.plan-floor-tabs { margin-bottom: 10px; }
.plan-rules { margin: 0 0 14px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--surface-2); font-size: 0.9rem; }
.plan-rules summary { font-weight: 600; cursor: pointer; color: var(--text); }
.plan-rules ul { margin: 8px 0 2px; padding-left: 20px; display: grid; gap: 4px; }
.plan-msg { margin: 10px 0; font-size: 0.9rem; color: var(--muted); }
.plan-msg:empty { display: none; }
.plan-msg.error { color: var(--danger); font-weight: 600; }
.plan-floor-form { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; margin-bottom: 14px; }
.plan-floor-form .plan-checks, .plan-floor-form .form-actions { grid-column: 1 / -1; }
.plan-file-actions { margin: 12px 0 6px; }

.pe-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.pe-tools .chip { cursor: pointer; }
.pe-draft { margin-top: 4px; }
.pe-hint { margin: 0 0 8px; font-size: 0.85rem; min-height: 1.3em; }
.pe-stage {
  position: relative;
  width: 100%;
  max-height: 70dvh;
  aspect-ratio: var(--ar);
  margin: 0 auto;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.pe-svg { display: block; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; }
.pe-svg[data-mode="rect"], .pe-svg[data-mode="shape"] { cursor: crosshair; }
.pe-sheet { fill: var(--surface); }
.pe-room-shape { fill: color-mix(in srgb, var(--primary) 14%, transparent); stroke: var(--primary); stroke-width: 2px; vector-effect: non-scaling-stroke; cursor: pointer; }
.pe-room-shape.outdoor { stroke-dasharray: 6 4; }
.pe-room-shape.fixed { fill: color-mix(in srgb, var(--muted) 18%, transparent); stroke: var(--muted); }
.pe-room-shape.on { fill: color-mix(in srgb, var(--accent) 28%, transparent); stroke: var(--accent); stroke-width: 3px; }
.pe-name { fill: var(--text); font-weight: 600; text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.pe-vertex { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5px; vector-effect: non-scaling-stroke; cursor: grab; }
.pe-vertex.on { fill: var(--accent); }
.pe-vertex.first { fill: var(--accent); stroke: var(--surface); }
.pe-mid { fill: var(--accent); opacity: 0.7; cursor: copy; }
.pe-label-handle { fill: var(--text); opacity: 0.55; cursor: move; }
.pe-draft-shape { fill: color-mix(in srgb, var(--accent) 18%, transparent); stroke: var(--accent); stroke-width: 2px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.pe-snap { fill: none; stroke: var(--positive); stroke-width: 2px; vector-effect: non-scaling-stroke; pointer-events: none; }
.pe-rooms { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.pe-rooms .chip { cursor: pointer; min-height: 32px; padding: 0 12px; }
.pe-warn { color: var(--warning); }
.chip.on .muted, .chip.on .pe-warn { color: inherit; opacity: 0.75; }
.pe-room { margin-top: 6px; padding: 14px; border-radius: 12px; background: var(--surface-2); grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
.pe-room .check, .pe-room .form-actions { grid-column: 1 / -1; }
.pe-room input[type="text"], .pe-room select { background: var(--surface); }

/* ---------- calendar: days or month ---------- */

.card-title .seg { margin-left: auto; display: inline-flex; padding: 2px; border-radius: 999px; background: var(--surface-2); text-transform: none; letter-spacing: 0; }
.card-title .seg button { border: 0; background: none; color: var(--muted); font: inherit; font-size: 0.78rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
.card-title .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.cal-month-head { display: flex; align-items: center; justify-content: space-between; padding: 0 0 8px; }
.cal-month-head .icon-btn { width: 36px; height: 36px; background: transparent; }
.cal-month-name { border: 0; background: none; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; padding: 6px 10px; border-radius: 8px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; }
.cal-wd { text-align: center; font-size: 0.72rem; font-weight: 600; color: var(--muted); padding-bottom: 4px; }
.cal-cell {
  display: flex; flex-direction: column; gap: 2px; min-height: 58px; padding: 4px 3px; min-width: 0;
  border: 0; border-radius: 8px; background: var(--surface-2); color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.cal-cell.other { opacity: 0.45; }
.cal-num { font-size: 0.78rem; font-weight: 600; padding-left: 2px; }
.cal-cell.today .cal-num { color: var(--primary-text); background: var(--primary); border-radius: 999px; padding: 0 6px; align-self: flex-start; }
.cal-chip {
  display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  font-size: 0.66rem; line-height: 1.35; padding: 0 4px; border-radius: 4px;
  background: color-mix(in srgb, var(--cal) 22%, transparent); border-left: 2px solid var(--cal);
}
.cal-more { font-size: 0.66rem; color: var(--muted); padding-left: 3px; }
.cal-sheet { display: grid; gap: 8px; }
.cal-ev.big { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px; padding: 8px 0 8px 12px; border-left: 4px solid var(--cal); }
.cal-time { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
.cal-time small { display: block; font-size: 0.74rem; }
.cal-title { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.cal-title small { display: block; font-weight: 400; color: var(--muted); font-size: 0.8rem; }
.cal-desc { display: block; margin-top: 6px; font-weight: 400; font-size: 0.85rem; white-space: pre-line; }

/* ---------- search boxes ---------- */

.search {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 12px;
  padding: 0 12px;
  min-height: 42px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
}
.search .icon { width: 20px; height: 20px; flex: none; }
.search input { flex: 1; min-width: 0; border: 0; background: none; color: var(--text); font: inherit; outline: none; }
.search-results:not(:empty) { margin-bottom: 14px; }

/* ---------- 24-hour history in a device's sheet ---------- */

.hchart { margin: 12px 0 0; display: grid; gap: 6px; }
.hchart-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 0.9rem; flex-wrap: wrap; }
.hchart-head .muted { font-weight: 400; }
.hchart svg { width: 100%; height: 120px; display: block; }
.hchart-line { fill: none; stroke: var(--primary); stroke-width: 2; stroke-linejoin: round; }
.hchart-area { fill: color-mix(in srgb, var(--primary) 14%, transparent); stroke: none; }
.hchart-axis { display: flex; justify-content: space-between; font-size: 0.75rem; }
.hchart-loading { place-items: center; min-height: 120px; }
.htimeline { position: relative; height: 28px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.htimeline span { position: absolute; top: 0; bottom: 0; background: var(--accent); }

/* Live sky background, the wall clock screen, dimming and the full screen button. */

.sky { display: none; }
.sky-on .sky {
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
  width: 100vw;
  height: 100lvh;
  pointer-events: none;
}
.sky-on body { background: #0b1430; }

/* Cards turn to frosted glass over the sky; text sitting straight on it gets a halo. */
.sky-on {
  --on-sky: #ffffff;
  --sky-halo: 0 1px 2px rgb(0 0 0 / 0.35), 0 0 14px rgb(0 0 0 / 0.3);
  --glass: color-mix(in srgb, var(--surface) 84%, transparent);
  --glass-border: color-mix(in srgb, var(--border) 60%, transparent);
}
.sky-on[data-sky="light"] {
  --on-sky: #0d1726;
  --sky-halo: 0 0 12px rgb(255 255 255 / 0.55);
}
.sky-on :is(.topbar h1, .topbar-clock) { color: var(--on-sky); text-shadow: var(--sky-halo); }
.sky-on .card {
  background: var(--glass);
  border-color: var(--glass-border);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
}
.sky-on .topbar { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
.sky-on .nav {
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  border-color: var(--glass-border);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  backdrop-filter: blur(16px) saturate(1.4);
}

/* ---------- wall mode: clock screen and dimming ---------- */

.idle {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: grid;
  place-items: center;
  padding: 24px;
  background: #000;
  color: #fff;
  text-align: center;
  text-shadow: 0 2px 4px rgb(0 0 0 / 0.35), 0 0 24px rgb(0 0 0 / 0.3);
  cursor: pointer;
  touch-action: none;
  animation: idle-in 0.8s ease-out;
}
.sky-on .idle { background: rgb(5 10 25 / 0.25); }
.idle[hidden] { display: none; }
/* Only the sky and the clock while idle, not the cards. */
.is-idle .shell { visibility: hidden; }
.idle-inner { transform: var(--shift, none); transition: transform 2s ease-in-out; }
.idle-time {
  display: block;
  font-size: clamp(4.5rem, 17vw, 12rem);
  font-weight: 200;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}

  automation: 'Automations',
  cover: 'Blinds and doors',
  fan: 'Fans',
  lock: 'Locks',
  media_player: 'Media',
  person: 'People',
  weather: 'Weather',
  camera: 'Cameras',
  input_boolean: 'Toggles',
  button: 'Buttons',
  vacuum: 'Vacuums',
  alarm_control_panel: 'Alarm',
  update: 'Updates',
  sun: 'Sun',
  calendar: 'Calendars',
  timer: 'Timers',
};

// Most useful first; everything else follows alphabetically.
const DOMAIN_ORDER = [
  'light', 'switch', 'climate', 'cover', 'fan', 'lock', 'media_player', 'scene',
  'script', 'sensor', 'binary_sensor', 'person', 'weather', 'camera', 'vacuum',
  'alarm_control_panel', 'input_boolean', 'button', 'automation',
];

const ACTIVE_STATES = new Set([
  'on', 'open', 'opening', 'closing', 'unlocked', 'unlocking', 'home', 'playing',
  'heat', 'cool', 'heat_cool', 'auto', 'dry', 'fan_only', 'cleaning', 'active',
  'armed_home', 'armed_away', 'armed_night', 'triggered', 'above_horizon',
]);

const domainOf = (entityId) => entityId.slice(0, entityId.indexOf('.'));

function domainLabel(domain) {
  return DOMAIN_LABELS[domain] || domain.replace(/_/g, ' ').replace(/^\w/, (c) => c.toUpperCase());
}

function compareDomains(a, b) {
  const ia = DOMAIN_ORDER.indexOf(a);
  const ib = DOMAIN_ORDER.indexOf(b);
  if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  return a.localeCompare(b);
}

const nameOf = (s) => s.attributes?.friendly_name || s.entity_id;

// Scenes and buttons are stateless: their state is the last time they ran, or "unknown" if never.
const STATELESS = new Set(['scene', 'button', 'input_button']);

const isUnavailable = (s) =>
  s.state === 'unavailable' || (s.state === 'unknown' && !STATELESS.has(domainOf(s.entity_id)));

const isActive = (s) => ACTIVE_STATES.has(s.state);

function iconFor(s) {
  const domain = domainOf(s.entity_id);
  const dc = s.attributes?.device_class;
  if (domain === 'light') return isActive(s) ? 'light' : 'lightOff';
  if (domain === 'switch') return dc === 'outlet' ? 'outlet' : isActive(s) ? 'switch' : 'switchOff';
  if (domain === 'climate' && HVAC_ICONS[s.state]) return HVAC_ICONS[s.state];
  if (domain === 'lock') return s.state === 'locked' ? 'lock' : 'lockOpen';
  if (domain === 'cover') {
    const shut = s.state === 'closed';
    if (dc === 'garage' || dc === 'gate' || dc === 'door') return shut ? 'garage' : 'garageOpen';
    return shut ? 'cover' : 'blindOpen';
  }
  if (domain === 'sensor') {
    if (dc === 'temperature') return 'temperature';
    if (dc === 'humidity') return 'humidity';
    if (dc === 'power' || dc === 'energy') return 'power';
    if (dc === 'battery') return 'battery';
  }
  if (domain === 'binary_sensor') {
    if (dc === 'door' || dc === 'window' || dc === 'opening' || dc === 'garage_door') return 'door';
    if (dc === 'occupancy' || dc === 'presence') return 'eye';
  }
  if (domain === 'input_number' || domain === 'number') return 'number';
  if (domain === 'input_select' || domain === 'select') return 'select';
  return domain;
}

const STATE_LABELS = {
  on: 'On', off: 'Off', open: 'Open', closed: 'Closed', opening: 'Opening', closing: 'Closing',
  locked: 'Locked', unlocked: 'Unlocked', home: 'Home', not_home: 'Away',
  playing: 'Playing', paused: 'Paused', idle: 'Idle', standby: 'Standby',
  recording: 'Recording', streaming: 'Streaming',
  unavailable: 'Unavailable', unknown: 'Unknown', heat: 'Heat', cool: 'Cool',
  heat_cool: 'Heat/Cool', auto: 'Auto', dry: 'Dry', fan_only: 'Fan',
  above_horizon: 'Above horizon', below_horizon: 'Below horizon',
};

const WEATHER_LABELS = {
  'clear-night': 'Clear', cloudy: 'Cloudy', exceptional: 'Exceptional', fog: 'Fog', hail: 'Hail',
  lightning: 'Lightning', 'lightning-rainy': 'Storms', partlycloudy: 'Partly cloudy', pouring: 'Pouring',
  rainy: 'Rainy', snowy: 'Snowy', 'snowy-rainy': 'Sleet', sunny: 'Sunny', windy: 'Windy', 'windy-variant': 'Windy',
};

const BINARY_LABELS = {
  door: ['Closed', 'Open'], window: ['Closed', 'Open'], opening: ['Closed', 'Open'],
  garage_door: ['Closed', 'Open'], motion: ['Clear', 'Detected'],
  occupancy: ['Clear', 'Detected'], presence: ['Away', 'Home'], moisture: ['Dry', 'Wet'],
  smoke: ['Clear', 'Detected'], battery: ['Normal', 'Low'], connectivity: ['Offline', 'Online'],
};

function formatState(s) {
  const domain = domainOf(s.entity_id);
  const a = s.attributes || {};
  if (isUnavailable(s)) return STATE_LABELS[s.state];
  if (STATELESS.has(domain)) return 'Tap to run';
  if (domain === 'script') return s.state === 'on' ? 'Running' : 'Tap to run';
  if (domain === 'weather') {
    const label = WEATHER_LABELS[s.state] || s.state;
    return a.temperature != null ? `${label} · ${a.temperature}°` : label;
  }

  if (domain === 'binary_sensor' && BINARY_LABELS[a.device_class]) {
    return BINARY_LABELS[a.device_class][s.state === 'on' ? 1 : 0];
  }
  if (domain === 'climate' && a.current_temperature != null) {
    return `${STATE_LABELS[s.state] || s.state} · ${a.current_temperature}°`;
  }
  if (domain === 'cover' && a.current_position != null && s.state === 'open') {
    const p = Number(a.current_position);
    return p >= 100 ? 'Open' : `${p}% open`;
  }
  if (domain === 'light' && s.state === 'on' && a.brightness != null) {
    return `${Math.round((a.brightness / 255) * 100)}%`;
  }
  if (domain === 'sensor' && a.device_class === 'timestamp') {
    return relativeTime(s.state);
  }
  const num = Number(s.state);
  if (s.state !== '' && Number.isFinite(num)) {
    const rounded = Math.abs(num) >= 100 ? Math.round(num) : Math.round(num * 10) / 10;
    return a.unit_of_measurement ? `${rounded} ${a.unit_of_measurement}` : String(rounded);
  }
  return STATE_LABELS[s.state] || s.state.replace(/_/g, ' ');
}

function relativeTime(iso) {
  const t = new Date(iso).getTime();
  if (!Number.isFinite(t)) return iso;
  const diff = (Date.now() - t) / 1000;
  const abs = Math.abs(diff);
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  if (abs < 45) return 'just now';
  if (abs < 3600) return rtf.format(-Math.round(diff / 60), 'minute');
  if (abs < 86400) return rtf.format(-Math.round(diff / 3600), 'hour');
  return rtf.format(-Math.round(diff / 86400), 'day');
}

// ---------- what a tile does when tapped ----------

const TOGGLE_DOMAINS = new Set(['light', 'switch', 'input_boolean', 'fan']);
const RUN_SERVICES = {
  scene: 'turn_on',
  script: 'turn_on',
  button: 'press',
  input_button: 'press',
};

/**
 * The one-tap action for an entity's tile, or null when a tap should open its details.
 * @returns {{kind: 'toggle'|'run', domain: string, service: string} | null}
 */
function primaryAction(s) {
  if (s.state === 'unavailable') return null;
  const domain = domainOf(s.entity_id);
  if (RUN_SERVICES[domain]) return { kind: 'run', domain, service: RUN_SERVICES[domain] };
  if (domain === 'cover') return coverAction(s);
  if (TOGGLE_DOMAINS.has(domain) && s.state !== 'unknown') {
    return { kind: 'toggle', domain, service: s.state === 'on' ? 'turn_off' : 'turn_on' };
  }
  return null;
}

// ---------- covers: blinds, shades, curtains, garage doors, gates ----------

const COVER_OPEN = 1;
const COVER_CLOSE = 2;
const COVER_STOP = 8;

/** Garage doors and gates: worth a second look before they move, unlike a blind. */
const isCoverDoor = (s) => ['garage', 'gate', 'door'].includes(s.attributes?.device_class);

/** Which of open, close, stop and position this cover takes (all of them when HA does not say). */
function coverFeatures(s) {
  const f = s.attributes?.supported_features;
  if (f == null) return { open: true, close: true, stop: true, position: s.attributes?.current_position != null, tilt: s.attributes?.current_tilt_position != null };
  return {
    open: !!(f & COVER_OPEN),
    close: !!(f & COVER_CLOSE),
    stop: !!(f & COVER_STOP),
    position: !!(f & 4) && s.attributes?.current_position != null,
    tilt: !!(f & 128) && s.attributes?.current_tilt_position != null,
  };
}

/** A tap stops a moving blind, otherwise closes an open one and opens a closed one. Garage doors open their sheet instead. */
function coverAction(s) {
  if (s.state === 'unknown' || isCoverDoor(s)) return null;
  const f = coverFeatures(s);
  if ((s.state === 'opening' || s.state === 'closing') && f.stop) return { kind: 'toggle', domain: 'cover', service: 'stop_cover' };
  if (s.state === 'closed' && f.open) return { kind: 'toggle', domain: 'cover', service: 'open_cover' };
  if (s.state === 'open' && f.close) return { kind: 'toggle', domain: 'cover', service: 'close_cover' };
  return null;
}

// ---------- light capabilities ----------

const COLOR_MODES = new Set(['hs', 'rgb', 'rgbw', 'rgbww', 'xy']);

function lightFeatures(s) {
  const modes = s.attributes?.supported_color_modes || [];
  return {
    brightness: modes.some((m) => m !== 'onoff'),
    colorTemp: modes.includes('color_temp'),
    color: modes.some((m) => COLOR_MODES.has(m)),
  };
}

const brightnessPct = (s) =>
  s.state === 'on' && s.attributes?.brightness != null ? Math.round((s.attributes.brightness / 255) * 100) : 0;

// ---------- climate ----------

const HVAC_LABELS = {
  off: 'Off', heat: 'Heat', cool: 'Cool', heat_cool: 'Heat/Cool', auto: 'Auto', dry: 'Dry', fan_only: 'Fan',
};
const HVAC_ICONS = {
  off: 'power', heat: 'fire', cool: 'snowflake', heat_cool: 'sunSnowflake', auto: 'thermostatAuto',
  dry: 'waterPercent', fan_only: 'fan',
};
const HVAC_ACTION_LABELS = {
  heating: 'Heating', cooling: 'Cooling', drying: 'Drying', fan: 'Fan running', idle: 'Idle',
  off: 'Off', preheating: 'Preheating', defrosting: 'Defrosting',
};

const hvacActionLabel = (a) => HVAC_ACTION_LABELS[a] || (a ? a.replace(/_/g, ' ') : '');

/** Step for the target temperature buttons: HA's own, else 0.5 for °C and 1 for °F. */
function tempStep(s, unit) {
  const a = s.attributes || {};
  if (a.target_temp_step) return a.target_temp_step;
  return unit === '°F' ? 1 : 0.5;
}

/** Which setpoints this thermostat uses right now: a single target or a low/high range. */
function climateTargets(s) {
  const a = s.attributes || {};
  if (a.temperature != null) return { single: a.temperature };
  if (a.target_temp_low != null && a.target_temp_high != null) {
    return { low: a.target_temp_low, high: a.target_temp_high };
  }
  return {};
}

const fmtTemp = (t) => (t == null ? '–' : `${Number(t).toFixed(Number.isInteger(Number(t)) ? 0 : 1)}°`);

// ---- controls.js ----
// Device tiles and the controls inside a device's sheet. Pure HTML builders: main.js wires the
// data-act / data-slide attributes to Home Assistant actions.


const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
}[c]));

/** A name without the room it is already listed under ("Kitchen Light" in Kitchen -> "Light"). */
function shortName(s, room = '') {
  const n = nameOf(s);
  if (!room) return n;
  const cut = n.replace(new RegExp(`^${room.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s+`, 'i'), '');
  return cut && cut !== n ? cut.charAt(0).toUpperCase() + cut.slice(1) : n;
}

/**
 * One device as a tile. A tap runs its one-tap action (toggle, run, open/close a blind)
 * or opens its sheet; the corner button always opens the sheet.
 */
function deviceTile(s, { room = '', note = '', pending = false } = {}) {
  const id = s.entity_id;
  const act = primaryAction(s);
  const on = isActive(s) && !isUnavailable(s);
  const domain = domainOf(id);
  const state = note || formatState(s);
  const cls = ['dev', `dev-${domain}`, on ? 'on' : '', isUnavailable(s) ? 'off-line' : '', pending ? 'pending' : ''].filter(Boolean).join(' ');
  const main = act
    ? `data-act="${act.kind}" aria-pressed="${act.kind === 'toggle' ? on : 'false'}"`
    : 'data-open';
  return `<div class="${cls}" data-entity="${esc(id)}">
    <button type="button" class="dev-main" ${main} aria-label="${esc(`${nameOf(s)}, ${state}`)}">
      <span class="dev-icon">${icon(iconFor(s))}</span>
      <span class="dev-text">
        <span class="dev-name">${esc(shortName(s, room))}</span>
        <span class="dev-state">${esc(state)}</span>
      </span>
    </button>
    ${act ? `<button type="button" class="dev-more" data-open aria-label="${esc(nameOf(s))} settings">${icon('more')}</button>` : ''}
  </div>`;
}

const slider = (name, value, { min = 0, max = 100, step = 1, label, unit = '%' } = {}) => `
  <label class="slide">
    <span class="slide-head"><span>${esc(label)}</span><output>${esc(value)}${unit}</output></span>
    <input type="range" data-slide="${name}" min="${min}" max="${max}" step="${step}" value="${value}">
  </label>`;

const btn = (act, label, ic, { primary = false, on = false } = {}) =>
  `<button type="button" class="btn${primary ? ' primary' : ''}${on ? ' on' : ''}" data-act="${act}">${ic ? icon(ic) : ''}<span>${esc(label)}</span></button>`;

/** The controls in a device's sheet, by kind. */
function deviceControls(s, { unit = '°C', note = '' } = {}) {
  const id = s.entity_id;
  const domain = domainOf(id);
  const a = s.attributes || {};
  if (isUnavailable(s)) return `<p class="muted">Home Assistant says this is ${esc(s.state)} right now.</p>`;

  const parts = [];
  switch (domain) {
    case 'light': {
      const f = lightFeatures(s);
      parts.push(`<div class="btn-row">${btn('toggle', s.state === 'on' ? 'Turn off' : 'Turn on', 'power', { primary: true, on: s.state === 'on' })}</div>`);
      if (f.brightness) parts.push(slider('brightness', brightnessPct(s), { min: 1, label: 'Brightness' }));
      if (f.colorTemp && a.min_color_temp_kelvin) {
        const k = a.color_temp_kelvin || Math.round((a.min_color_temp_kelvin + a.max_color_temp_kelvin) / 2);
        parts.push(slider('kelvin', k, { min: a.min_color_temp_kelvin, max: a.max_color_temp_kelvin, step: 50, label: 'Warm to cool', unit: ' K' }));
      }
      break;
    }
    case 'switch': case 'input_boolean': case 'fan': case 'siren':
      parts.push(`<div class="btn-row">${btn('toggle', s.state === 'on' ? 'Turn off' : 'Turn on', 'power', { primary: true, on: s.state === 'on' })}</div>`);
      if (note) parts.push(`<p class="sheet-note">${esc(note)}</p>`);
      break;
    case 'cover': {
      const f = coverFeatures(s);
      const door = isCoverDoor(s);
      parts.push(`<div class="btn-row">
        ${f.open ? btn('open_cover', door ? 'Open' : 'Open', 'arrowUp', { primary: door && s.state === 'closed' }) : ''}
        ${f.stop ? btn('stop_cover', 'Stop', 'stop') : ''}
        ${f.close ? btn('close_cover', 'Close', 'arrowDown', { primary: door && s.state !== 'closed' }) : ''}
      </div>`);
      if (f.position) parts.push(slider('position', Number(a.current_position) || 0, { label: 'Position (open %)' }));
      if (f.tilt) parts.push(slider('tilt', Number(a.current_tilt_position) || 0, { label: 'Tilt' }));
      break;
    }
    case 'lock':
      parts.push(`<div class="btn-row">${s.state === 'locked' ? btn('unlock', 'Unlock', 'lockOpen') : btn('lock', 'Lock', 'lock', { primary: true })}</div>`);
      break;
    case 'scene': case 'script': case 'button': case 'input_button':
      parts.push(`<div class="btn-row">${btn('run', 'Run', 'play', { primary: true })}</div>`);
      break;
    case 'climate': {
      const t = climateTargets(s);
      const modes = (a.hvac_modes || []).map((m) => `<button type="button" class="chip${m === s.state ? ' on' : ''}" data-act="hvac" data-mode="${esc(m)}">${esc(HVAC_LABELS[m] || m)}</button>`).join('');
      parts.push(`<div class="climate">
        <span class="climate-now">${fmtTemp(a.current_temperature)}<small>${esc(hvacActionLabel(a.hvac_action) || 'Now')}</small></span>
        ${t.single != null ? `<span class="climate-set">
          <button type="button" class="icon-btn" data-act="temp" data-dir="-1" aria-label="Cooler">${icon('minus')}</button>
          <b>${fmtTemp(t.single)}</b>
          <button type="button" class="icon-btn" data-act="temp" data-dir="1" aria-label="Warmer">${icon('plus')}</button>
        </span>` : ''}
      </div>${modes ? `<div class="chips">${modes}</div>` : ''}`);
      break;
    }
    case 'media_player': {
      const playing = s.state === 'playing';
      const title = [a.media_title, a.media_artist || a.app_name].filter(Boolean).join(' · ');
      if (title) parts.push(`<p class="sheet-note">${esc(title)}</p>`);
      parts.push(`<div class="btn-row">
        ${btn('media_previous_track', '', 'chevronLeft')}
        ${btn('media_play_pause', playing ? 'Pause' : 'Play', 'play', { primary: true })}
        ${btn('media_next_track', '', 'chevronRight')}
        ${s.state !== 'off' ? btn('media_off', 'Off', 'power') : btn('media_on', 'On', 'power')}
      </div>`);
      if (a.volume_level != null) parts.push(slider('volume', Math.round(a.volume_level * 100), { label: 'Volume' }));
      break;
    }
    default:
      break;
  }
  return parts.join('');
}

/** The big reading at the top of a sensor's sheet. */
function readingHtml(s) {
  return `<div class="reading">
    <span class="reading-value">${esc(formatState(s))}</span>
    <span class="muted">Changed ${esc(relativeTime(s.last_changed))}</span>
  </div>`;
}

// ---------- 24-hour history in a device's sheet ----------

/** A line for numeric sensors, a timeline of "on" spells for binary sensors. h = { points, loading, error }. */
function historyHtml(s, h) {
  if (!h) return '';
  if (h.loading) return '<div class="hchart hchart-loading"><div class="spinner" aria-hidden="true"></div></div>';
  if (h.error) return `<p class="muted">History unavailable (${esc(h.error)}).</p>`;
  if (domainOf(s.entity_id) === 'binary_sensor') return timelineHtml(s, h.points);
  const pts = h.points.map((p) => ({ t: p.t, v: Number(p.s) })).filter((p) => Number.isFinite(p.v));
  if (pts.length < 2) return '';
  return lineChartHtml(pts, s.attributes?.unit_of_measurement || '');
}

function lineChartHtml(pts, unit) {
  const W = 300;
  const H = 100;
  const now = Date.now();
  const t0 = now - 24 * 3_600_000;
  const vals = pts.map((p) => p.v);
  let min = Math.min(...vals);
  let max = Math.max(...vals);
  if (max - min < 1e-9) { min -= 1; max += 1; }
  const pad = (max - min) * 0.1;
  const x = (t) => (((Math.max(t, t0) - t0) / (now - t0)) * W).toFixed(1);
  const y = (v) => (H - ((v - min + pad) / (max - min + 2 * pad)) * H).toFixed(1);
  // Hold the last value until now so the line reaches the right edge.
  const all = [...pts, { t: now, v: pts[pts.length - 1].v }];
  const line = all.map((p, i) => `${i ? 'L' : 'M'}${x(p.t)},${y(p.v)}`).join('');
  const area = `${line}L${W},${H}L0,${H}Z`;
  const fmt = (v) => `${Math.abs(v) >= 100 ? Math.round(v) : Math.round(v * 10) / 10}${unit ? ` ${unit}` : ''}`;
  return `<figure class="hchart">
    <figcaption class="hchart-head"><span>Last 24 hours</span>
