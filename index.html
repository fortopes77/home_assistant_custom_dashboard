<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Home</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%232f6fde%22 d=%22M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z%22/%3E%3C/svg%3E">
  <style>
/* Home dashboard. Phone first; wider layouts kick in at 700px (tablet) and 1100px (browser). */

:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #eceef2;
  --text: #16191d;
  --muted: #646b75;
  --border: #dde1e6;
  --accent: #e8a33d;          /* "on" / active warm amber */
  --accent-soft: #fbefd9;
  --primary: #2f6fde;
  --primary-text: #ffffff;
  --positive: #1f8a4c;
  --warning: #c77700;
  --danger: #c43d3d;
  --shadow: 0 1px 2px rgb(16 24 40 / 0.06), 0 1px 3px rgb(16 24 40 / 0.08);

  --radius: 16px;
  --radius-sm: 10px;
  --gap: 10px;
  --tile-min: 150px;
  --gutter: 16px;
  --nav-h: 64px;

  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111418;
    --surface: #1b1f25;
    --surface-2: #252a32;
    --text: #eef0f3;
    --muted: #9aa3ae;
    --border: #2d333c;
    --accent: #f0b04f;
    --accent-soft: #3a2f1c;
    --primary: #5b8ff0;
    --positive: #4cc27f;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111418;
  --surface: #1b1f25;
  --surface-2: #252a32;
  --text: #eef0f3;
  --muted: #9aa3ae;
  --border: #2d333c;
  --accent: #f0b04f;
  --accent-soft: #3a2f1c;
  --primary: #5b8ff0;
  --positive: #4cc27f;
  --shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

a { color: var(--primary); }
h1, h2, h3 { margin: 0; line-height: 1.2; }
button, input { font: inherit; color: inherit; }

.icon { width: 24px; height: 24px; fill: currentColor; flex: none; }
.muted { color: var(--muted); }

/* ---------- app shell ---------- */

.app {
  min-height: 100dvh;
  display: grid;
  grid-template-rows: auto 1fr;
  grid-template-areas: "top" "main";
}

.topbar {
  grid-area: top;
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: calc(10px + var(--safe-top)) calc(var(--gutter) + var(--safe-right)) 10px calc(var(--gutter) + var(--safe-left));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.topbar-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.topbar h1 { font-size: 1.35rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clock { display: none; color: var(--muted); font-variant-numeric: tabular-nums; }
.topbar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
.fullscreen-btn { width: 38px; height: 38px; background: var(--surface); border: 1px solid var(--border); color: var(--muted); }
.fullscreen-btn[hidden] { display: none; }
.fullscreen-btn .icon { width: 22px; height: 22px; }

.status {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 36px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.85rem;
  text-decoration: none;
  white-space: nowrap;
}
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-status="connected"] .status-dot { background: var(--positive); }
.status[data-status="connecting"] .status-dot { background: var(--warning); animation: pulse 1.2s infinite; }
.status[data-status="disconnected"] .status-dot,
.status[data-status="auth_invalid"] .status-dot { background: var(--danger); }
/* Once connected, the pill shrinks to a dot on phones to save room. */
.status[data-status="connected"] .status-text { display: none; }
.status[data-status="connected"] { padding: 6px 10px; }

@keyframes pulse { 50% { opacity: 0.35; } }

.view {
  grid-area: main;
  padding: 4px calc(var(--gutter) + var(--safe-right)) calc(var(--nav-h) + var(--safe-bottom) + 24px) calc(var(--gutter) + var(--safe-left));
  outline: none;
  min-width: 0;
}

/* Phone: bottom tab bar. */
.nav {
  position: fixed;
  z-index: 20;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  justify-content: space-around;
  padding: 6px var(--safe-right) calc(6px + var(--safe-bottom)) var(--safe-left);
  background: var(--surface);
  border-top: 1px solid var(--border);
}
.nav a {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  min-height: 48px;
  padding: 4px;
  border-radius: 12px;
  color: var(--muted);
  font-size: 0.75rem;
  text-decoration: none;
}
.nav a[aria-current="page"] { color: var(--primary); }
.nav a[aria-current="page"] .icon { background: color-mix(in srgb, var(--primary) 14%, transparent); border-radius: 999px; }
.nav .icon { width: 44px; height: 28px; padding: 2px 10px; }

.kiosk .nav { display: none; }
.nav a[hidden] { display: none; }
.kiosk .view { padding-bottom: calc(var(--safe-bottom) + 24px); }

/* ---------- home ---------- */

.hero { padding: 8px 0 16px; }
.hero h2 { font-size: 1.6rem; }
.hero p { margin: 4px 0 0; }

.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--gap);
  margin-bottom: 24px;
}
.stat {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-areas: "icon value" "label label";
  align-items: center;
  gap: 4px 10px;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  color: var(--text);
  text-decoration: none;
}
.stat .icon { grid-area: icon; color: var(--muted); }
.stat-value { grid-area: value; font-size: 1.6rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat-label { grid-area: label; color: var(--muted); font-size: 0.85rem; }

.rooms {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr));
  gap: var(--gap);
}
.room {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 14px;
  min-height: 96px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  color: var(--text);
  text-decoration: none;
}
.room .icon { color: var(--muted); margin-bottom: auto; }
.room-name { font-weight: 600; }
.room .muted { font-size: 0.85rem; }

/* ---------- floor plan ---------- */

.section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.section-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow);
  color: var(--text);
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
}
.section-link .icon { width: 18px; height: 18px; color: var(--muted); }

.plan-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.plan-head .section-title { margin: 8px 0 10px; font-size: 1.25rem; }
.plan-head p { margin: 0; font-size: 0.9rem; }
.plan-hint { margin: 10px 2px 0; font-size: 0.85rem; }
.hero-plan { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero-plan .section-link .icon { color: var(--accent); }
.home-side .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 18px 0 0; }
.home-side .stat-value { font-size: 1.3rem; }
.home-side .stat-label { font-size: 0.78rem; }

/* No card: the house sits straight on the page background, lifted by its own shadow. */
.plan-card { padding: 6px 0 4px; }
.plan {
  position: relative;
  width: 100%;
  margin: 0 auto;
  aspect-ratio: var(--ar);
  container-type: inline-size;
  -webkit-user-select: none;
  user-select: none;
}
.plan > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

/* Plan colours: a soft paper model by day, the deep navy architectural look in dark. */
.plan-card {
  --plan-floor: #f4f6fa;
  --plan-floor-out: rgb(244 246 250 / 0.45);
  --plan-wall-top: #ffffff;
  --plan-wall-side: #aab4c3;
  --plan-cast: rgb(25 35 60 / 0.45);
  --plan-furn: #e1e6ee;
  --plan-soft: #d3dae6;
  --plan-bench: #c8d0dc;
  --plan-dark: #5d6878;
  --plan-glass: rgb(140 180 225 / 0.35);
  --plan-car: #c2cad7;
  --plan-pillow: #f7f9fc;
  --wall: 5.5px;
}
:root[data-theme="dark"] .plan-card {
  --plan-floor: #222a38;
  --plan-floor-out: rgb(34 42 56 / 0.5);
  --plan-wall-top: #59657a;
  --plan-wall-side: #0b0f16;
  --plan-cast: rgb(0 0 0 / 0.75);
  --plan-furn: #2e3848;
  --plan-soft: #374356;
  --plan-bench: #2a3342;
  --plan-dark: #10151d;
  --plan-glass: rgb(110 160 225 / 0.16);
  --plan-car: #3a4558;
  --plan-pillow: #48546a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .plan-card {
    --plan-floor: #222a38;
    --plan-floor-out: rgb(34 42 56 / 0.5);
    --plan-wall-top: #59657a;
    --plan-wall-side: #0b0f16;
    --plan-cast: rgb(0 0 0 / 0.75);
    --plan-furn: #2e3848;
    --plan-soft: #374356;
    --plan-bench: #2a3342;
    --plan-dark: #10151d;
    --plan-glass: rgb(110 160 225 / 0.16);
    --plan-car: #3a4558;
    --plan-pillow: #48546a;
  }
}

.plan-shape {
  fill: var(--plan-floor);
  cursor: pointer;
  transition: fill 0.25s;
}
.plan-fixed { fill: var(--plan-floor); }
.plan-room.outdoor .plan-shape { fill: var(--plan-floor-out); }
.plan-room.lit .plan-shape { fill: color-mix(in srgb, var(--accent) 12%, var(--plan-floor)); }
.plan-room.unlinked .plan-shape { fill: color-mix(in srgb, var(--plan-floor) 92%, var(--plan-wall-side)); }
.plan-room:active .plan-shape { fill: color-mix(in srgb, var(--primary) 22%, var(--plan-floor)); }
.plan-room:focus { outline: none; }
.plan-room:focus-visible .plan-shape { stroke: var(--primary); stroke-width: 3px; vector-effect: non-scaling-stroke; }
@media (hover: hover) {
  .plan-room:hover .plan-shape { fill: color-mix(in srgb, var(--primary) 9%, var(--plan-floor)); }
  .plan-room.lit:hover .plan-shape { fill: color-mix(in srgb, var(--accent) 20%, var(--plan-floor)); }
}

.plan-furniture, .plan-glows, .plan-porches, [class^="plan-wall"] { pointer-events: none; }
.plan-furn { fill: var(--plan-furn); }
.plan-furn.soft { fill: var(--plan-soft); }
.plan-furn.bench { fill: var(--plan-bench); }
.plan-furn.dark { fill: var(--plan-dark); }
.plan-furn.pillow { fill: var(--plan-pillow); }
.plan-furn.car { fill: var(--plan-car); }
.plan-furn.glass { fill: var(--plan-glass); stroke: var(--plan-bench); stroke-width: 1; }

.plan-wall-cast polygon, .plan-wall-side polygon, .plan-wall-top polygon {
  fill: none;
  stroke-width: var(--wall);
  stroke-linejoin: miter;
  stroke-linecap: square;
}
.plan-wall-cast polygon { stroke: var(--plan-cast); stroke-width: calc(var(--wall) + 2px); }
.plan-wall-side polygon { stroke: var(--plan-wall-side); }
.plan-wall-top polygon { stroke: var(--plan-wall-top); }
.plan-porches polygon {
  fill: none;
  stroke: var(--plan-wall-side);
  stroke-width: 1.5;
  stroke-dasharray: 5 4;
}

.plan-label {
  position: absolute;
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: 1px;
  text-align: center;
  pointer-events: none;
  font-size: clamp(11px, 0.9cqi + 6px, 15px);
  line-height: 1.15;
  color: var(--text);
}
.plan-label strong { position: relative; font-weight: 600; }
.plan-label.compact { font-size: clamp(10px, 0.7cqi + 5px, 13px); }
.plan-label.compact .plan-meta { display: none; }
.plan-label.unlinked { opacity: 0.55; }
/* Keep names readable over a bright glow, light or dark theme. */
.plan-label.lit { text-shadow: 0 0 2px var(--surface), 0 0 8px var(--surface); }
.plan-label.lit .plan-meta { color: var(--text); }
.plan-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--muted);
  font-size: 0.88em;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.plan-meta span { display: inline-flex; align-items: center; gap: 1px; }
.plan-meta .icon { width: 1.15em; height: 1.15em; }
.plan-lights { color: color-mix(in srgb, var(--accent) 75%, var(--text)); font-weight: 600; }
.plan-open { color: var(--warning); }
.plan-motion {
  position: absolute;
  top: 0.1em;
  left: -0.75em;
  width: 0.45em;
  height: 0.45em;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 25%, transparent);
  animation: pulse 1.6s infinite;
}

.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0 0 8px; padding: 2px 0; }
.chips button.chip { cursor: pointer; }

.room-actions { display: flex; gap: 8px; margin-bottom: 14px; }
.room-actions .btn { flex: 1; gap: 8px; }
.room-actions .icon { width: 20px; height: 20px; }
.room-grid { --tile-min: 140px; }

.panel-text { margin: -4px 0 14px; font-size: 0.9rem; }
#plan-settings { scroll-margin-top: calc(72px + var(--safe-top)); }

/* ---------- floor plan: uploaded pictures ---------- */

.plan.picture > svg { overflow: hidden; border-radius: 10px; }
.plan.picture .plan-img { pointer-events: none; }
.plan.picture .plan-shape { fill: transparent; stroke: transparent; stroke-width: 2px; vector-effect: non-scaling-stroke; }
.plan.picture .plan-room.unlinked .plan-shape { fill: transparent; }
.plan.picture .plan-room.lit .plan-shape { fill: color-mix(in srgb, var(--accent) 10%, transparent); }
.plan.picture .plan-room:active .plan-shape { fill: color-mix(in srgb, var(--primary) 22%, transparent); }
.plan.picture .plan-room:focus-visible .plan-shape { stroke: var(--primary); }
@media (hover: hover) {
  .plan.picture .plan-room:hover .plan-shape { fill: color-mix(in srgb, var(--primary) 10%, transparent); stroke: color-mix(in srgb, var(--primary) 55%, transparent); }
}
.plan.picture .plan-glow { mix-blend-mode: multiply; }
/* Names sit on a soft halo so they read over the lines of the picture. */
.plan.picture .plan-label strong, .plan.picture .plan-meta { text-shadow: 0 0 3px var(--surface), 0 0 3px var(--surface), 0 0 8px var(--surface); }
:root[data-theme="dark"] .plan.invert-dark .plan-img { filter: url(#plan-invert); }
:root[data-theme="dark"] .plan.invert-dark .plan-glow { mix-blend-mode: screen; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .plan.invert-dark .plan-img { filter: url(#plan-invert); }
  :root:not([data-theme="light"]) .plan.invert-dark .plan-glow { mix-blend-mode: screen; }
}

.chip.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip .icon { width: 18px; height: 18px; }
.chip:disabled { opacity: 0.45; cursor: default; }
.plan-floor-tabs { margin-bottom: 10px; }
.plan-floor-tabs .chip { cursor: pointer; }

/* No floor plan yet: the areas as tiles. */
.room-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.room-tile {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  grid-template-rows: auto auto;
  align-items: center;
  gap: 2px 10px;
  padding: 12px;
  border: 0;
  border-radius: var(--radius, 16px);
  background: var(--surface);
  box-shadow: var(--shadow);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.room-tile .tile-icon { grid-row: span 2; }
.room-tile.lit { background: var(--accent-soft); }
.room-tile-name { position: relative; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-tile-name .plan-motion { left: auto; right: -0.2em; top: 0.2em; }
.room-tile-meta { font-size: 0.82rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.room-tile:active { transform: scale(0.97); }
.plan-empty { display: grid; justify-items: center; gap: 6px; padding: 24px 12px; color: var(--muted); text-align: center; }
.plan-empty .icon { width: 40px; height: 40px; }

/* ---------- floor plan set-up (Settings) ---------- */

#plan-settings .btn .icon { width: 20px; height: 20px; margin-right: 6px; }
.btn.danger { color: var(--danger); }
.plan-rules { margin: 0 0 14px; padding: 10px 14px; border-radius: var(--radius-sm, 10px); background: var(--surface-2); font-size: 0.9rem; }
.plan-rules summary { font-weight: 600; cursor: pointer; }
.plan-rules ul { margin: 8px 0 2px; padding-left: 20px; display: grid; gap: 4px; }
.plan-msg { margin: 10px 0; font-size: 0.9rem; color: var(--muted); }
.plan-msg:empty { display: none; }
.plan-msg.error { color: var(--danger); font-weight: 600; }
.plan-floor-form { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; margin-bottom: 14px; }
.plan-floor-form .plan-checks, .plan-floor-form .form-actions { grid-column: 1 / -1; }
.plan-checks { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.plan-file-actions { margin: 14px 0 6px; }

.pe-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.pe-tools .chip { cursor: pointer; }
.pe-draft { margin-top: 4px; }
.pe-hint { margin: 0 0 8px; font-size: 0.85rem; min-height: 1.3em; }
.pe-stage {
  position: relative;
  width: 100%;
  max-height: 70dvh;
  aspect-ratio: var(--ar);
  margin: 0 auto;
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.pe-svg { display: block; width: 100%; height: 100%; touch-action: none; -webkit-user-select: none; user-select: none; }
.pe-svg[data-mode="rect"], .pe-svg[data-mode="shape"] { cursor: crosshair; }
.pe-sheet { fill: var(--surface); }
.pe-room-shape { fill: color-mix(in srgb, var(--primary) 14%, transparent); stroke: var(--primary); stroke-width: 2px; vector-effect: non-scaling-stroke; cursor: pointer; }
.pe-room-shape.outdoor { stroke-dasharray: 6 4; }
.pe-room-shape.fixed { fill: color-mix(in srgb, var(--muted) 18%, transparent); stroke: var(--muted); }
.pe-room-shape.on { fill: color-mix(in srgb, var(--accent) 28%, transparent); stroke: var(--accent); stroke-width: 3px; }
.pe-name { fill: var(--text); font-weight: 600; text-anchor: middle; dominant-baseline: middle; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.pe-vertex { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5px; vector-effect: non-scaling-stroke; cursor: grab; }
.pe-vertex.on { fill: var(--accent); }
.pe-vertex.first { fill: var(--accent); stroke: var(--surface); }
.pe-mid { fill: var(--accent); opacity: 0.7; cursor: copy; }
.pe-label-handle { fill: var(--text); opacity: 0.55; cursor: move; }
.pe-draft-shape { fill: color-mix(in srgb, var(--accent) 18%, transparent); stroke: var(--accent); stroke-width: 2px; stroke-dasharray: 6 4; vector-effect: non-scaling-stroke; pointer-events: none; }
.pe-snap { fill: none; stroke: var(--positive, #2e9d5b); stroke-width: 2px; vector-effect: non-scaling-stroke; pointer-events: none; }
.pe-rooms { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.pe-rooms .chip { cursor: pointer; min-height: 32px; padding: 0 12px; }
.pe-warn { color: var(--warning); }
.chip.on .muted, .chip.on .pe-warn { color: inherit; opacity: 0.75; }
.pe-room { margin-top: 6px; padding: 14px; border-radius: 12px; background: var(--surface-2); grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px 16px; }
.pe-room .check, .pe-room .form-actions { grid-column: 1 / -1; }

#entity-rooms { scroll-margin-top: calc(72px + var(--safe-top)); }
.eroom-search { margin: 0 0 10px; }
.eroom-groups { display: grid; gap: 8px; }
.eroom-group { border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; }
.eroom-group summary { cursor: pointer; font-weight: 600; padding: 12px 0; display: flex; align-items: center; gap: 8px; }
.eroom-group[open] summary { border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.eroom-row { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(130px, 42%); gap: 10px; align-items: center; padding: 8px 0; }
.eroom-row + .eroom-row { border-top: 1px solid var(--border); }
.eroom-row .tile-icon { width: 36px; height: 36px; }
.eroom-name { display: grid; min-width: 0; }
.eroom-name small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.eroom-name strong { font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.eroom-row .select { min-height: 40px; padding: 6px 10px; }

/* ---------- devices ---------- */

.toolbar { display: flex; gap: 8px; align-items: center; margin: 4px 0 10px; }
.search {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 12px;
  border-radius: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  min-width: 0;
}
.search .icon { color: var(--muted); width: 20px; height: 20px; }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; padding: 10px 0; }

.segmented {
  display: inline-flex;
  padding: 3px;
  border-radius: 12px;
  background: var(--surface-2);
  flex: none;
}
.segmented button {
  min-height: 38px;
  padding: 0 12px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  scrollbar-width: none;
  margin: 0 calc(-1 * var(--gutter)) 8px;
  padding: 2px var(--gutter) 6px;
  scroll-padding: 0 var(--gutter);
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-size: 0.9rem;
  text-decoration: none;
  white-space: nowrap;
}
.chip[aria-current="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.chip-count { opacity: 0.6; font-size: 0.8rem; }

.active-filter { margin: 4px 0 8px; color: var(--muted); font-size: 0.9rem; }
.active-filter a { margin-left: 6px; }

.section-title { font-size: 1rem; font-weight: 600; margin: 18px 0 10px; }
.section-title .muted { font-weight: 400; margin-left: 4px; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(var(--tile-min), 1fr));
  gap: var(--gap);
}

.tile {
  position: relative;
  display: grid;
  min-height: 108px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  transition: background-color 0.2s, transform 0.1s;
  min-width: 0;
  -webkit-touch-callout: none;
  user-select: none;
  -webkit-user-select: none;
}
.tile:has(.tile-main:active) { transform: scale(0.97); }
.tile-main {
  display: grid;
  grid-template-rows: auto 1fr auto;
  gap: 6px;
  width: 100%;
  min-width: 0;
  padding: 12px;
  border: 0;
  border-radius: inherit;
  background: transparent;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
}
.tile-more {
  position: absolute;
  top: 4px;
  right: 4px;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
.tile-more .icon { width: 20px; height: 20px; }
.section-link:focus-visible, .tile-main:focus-visible, .tile-more:focus-visible, .step-btn:focus-visible, .chip:focus-visible, .nav a:focus-visible, .stat:focus-visible, .room:focus-visible {
  outline: 2px solid var(--primary);
  outline-offset: 2px;
}
.tile-icon {
  display: inline-grid;
  place-items: center;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--muted);
}
.tile-icon .icon { width: 22px; height: 22px; }
.tile-name {
  font-weight: 600;
  font-size: 0.95rem;
  line-height: 1.25;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow-wrap: anywhere;
}
.tile-state { color: var(--muted); font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tile.active { background: var(--accent-soft); }
.tile.active .tile-icon, .tile-icon.active { background: var(--accent); color: #fff; }
.tile.unavailable { opacity: 0.55; }
/* Waiting for Home Assistant to confirm a tap. */
.tile.pending .tile-icon { animation: pulse 1s infinite; }
.tile.ran .tile-icon { background: var(--positive); color: #fff; }
.tile[data-domain="scene"] .tile-icon, .tile[data-domain="script"] .tile-icon { color: var(--primary); }

/* Thermostat: full-width card on phones with inline - / + */
.tile.wide { grid-column: span 2; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.tile.climate.active { background: var(--surface); }
.tile.climate[data-mode="heat"] .tile-icon, .tile.climate[data-mode="heat_cool"] .tile-icon,
.tile.climate[data-mode="auto"] .tile-icon { background: #e8733d; color: #fff; }
.tile.climate[data-mode="cool"] .tile-icon { background: #3d8be8; color: #fff; }
.tile.climate[data-mode="dry"] .tile-icon, .tile.climate[data-mode="fan_only"] .tile-icon { background: var(--primary); color: #fff; }
.tile.climate.pending .tile-icon { animation: none; }
.tile.climate.pending .stepper-value { color: var(--primary); }
.stepper { display: flex; align-items: center; gap: 4px; padding-right: 12px; }
.stepper-value {
  min-width: 3.2ch;
  text-align: center;
  font-size: 1.5rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.stepper-value.range { font-size: 1.1rem; padding-right: 14px; }
.step-btn {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  flex: none;
  border: 0;
  border-radius: 50%;
  background: var(--surface-2);
  cursor: pointer;
  touch-action: manipulation;
}
.step-btn:active { transform: scale(0.92); }
@media (max-width: 339px) { .tile.wide { grid-column: 1 / -1; } }

.empty-list { padding: 24px 0; }

/* ---------- empty / loading ---------- */

.empty {
  display: grid;
  justify-items: center;
  gap: 12px;
  text-align: center;
  max-width: 420px;
  margin: 12vh auto 0;
}
.empty p { margin: 0; color: var(--muted); }
.spinner {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 3px solid var(--border);
  border-top-color: var(--primary);
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- settings ---------- */

.panel {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin: 8px 0 16px;
  max-width: 640px;
}
.panel h2 { font-size: 1.1rem; margin-bottom: 12px; }

.form { display: grid; gap: 16px; }
.form label, .form .field { display: grid; gap: 6px; }
.form label > span, .form .field > span { font-weight: 600; font-size: 0.9rem; }
.form input[type="url"], .form input[type="password"], .form input[type="text"] {
  min-height: 44px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  width: 100%;
}
.form input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }
.form small { font-size: 0.8rem; }
.form code { font-size: 0.85em; padding: 1px 5px; border-radius: 6px; background: var(--surface-2); }
.select {
  min-height: 44px;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font: inherit;
  width: 100%;
}
.option:disabled, .btn:disabled { opacity: 0.5; cursor: default; }
.install-text { margin: 0 0 12px; }
.panel > .install-text:last-child { margin-bottom: 0; }
.form .check { display: flex; align-items: center; gap: 10px; }
.form .check span { font-weight: 400; }
.form .check input { width: 20px; height: 20px; accent-color: var(--primary); }
.form-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.form-error { margin: 0; color: var(--danger); font-size: 0.9rem; }
.form-error:empty { display: none; }

.note { margin: 0 0 12px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface-2); }
.note.positive { color: var(--positive); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 0 18px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-text); }

.facts { display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; margin: 0; font-size: 0.9rem; }
.facts dt { color: var(--muted); text-transform: capitalize; }
.facts dd { margin: 0; overflow-wrap: anywhere; }

/* ---------- detail sheet ---------- */

.sheet {
  width: 100%;
  max-width: 100%;
  max-height: 85dvh;
  margin: auto 0 0;
  padding: 0;
  border: 0;
  border-radius: 20px 20px 0 0;
  background: var(--surface);
  color: var(--text);
  overflow: auto;
  padding-bottom: var(--safe-bottom);
}
.sheet::backdrop { background: rgb(0 0 0 / 0.45); }
.sheet[open] { animation: sheet-up 0.2s ease-out; }
@keyframes sheet-up { from { transform: translateY(24px); opacity: 0; } }
.sheet-head {
  position: sticky;
  top: 0;
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 16px 16px 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.sheet-head.has-back { grid-template-columns: auto auto 1fr auto; gap: 10px; }
.sheet-head h2 { font-size: 1.1rem; }
.sheet-head p { margin: 2px 0 0; font-size: 0.85rem; overflow-wrap: anywhere; }
.sheet-body { padding: 16px; }
.sheet-body h3 { font-size: 0.95rem; margin: 20px 0 10px; }
.detail-state { font-size: 1.6rem; font-weight: 600; margin: 0; }
.sheet-body > .muted { margin: 4px 0 0; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  background: var(--surface-2);
  cursor: pointer;
}

/* ---------- sheet controls ---------- */

.controls { display: grid; gap: 16px; margin-top: 18px; }
.field-label { font-weight: 600; font-size: 0.9rem; margin-bottom: -8px; }

.power-row {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 64px;
  padding: 10px 14px;
  border: 0;
  border-radius: var(--radius);
  background: var(--surface-2);
  text-align: left;
  cursor: pointer;
}
.power-row strong, .power-row small { display: block; }
.power-row small { font-size: 0.8rem; }
.power-row.on { background: var(--accent-soft); }
.power-row.on .tile-icon { background: var(--accent); color: #fff; }
.power-row.pending .tile-icon { animation: pulse 1s infinite; }
.switch-ui {
  position: relative;
  width: 52px;
  height: 32px;
  border-radius: 999px;
  background: var(--border);
  transition: background-color 0.2s;
}
.switch-ui::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.25);
  transition: transform 0.2s;
}
.power-row.on .switch-ui { background: var(--accent); }
.power-row.on .switch-ui::after { transform: translateX(20px); }

.slider { display: grid; gap: 8px; }
.slider-head { display: flex; justify-content: space-between; font-weight: 600; font-size: 0.9rem; }
.slider output { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.slider input {
  --pct: 50%;
  --fill: var(--accent);
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 48px;
  margin: 0;
  border-radius: 14px;
  background: linear-gradient(to right, var(--fill) var(--pct), var(--surface-2) var(--pct));
  cursor: pointer;
  touch-action: pan-y;
}
.slider.warmth input { background: linear-gradient(to right, #ffa94d, #fff4e0 50%, #cfe3ff); }
.slider input::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 8px;
  height: 36px;
  border-radius: 4px;
  background: #fff;
  box-shadow: 0 0 0 1px rgb(0 0 0 / 0.15), 0 1px 4px rgb(0 0 0 / 0.3);
}
.slider input::-moz-range-thumb {
  width: 8px;
  height: 36px;
  border: 0;
  border-radius: 4px;
  background: #fff;
  box-shadow: 0 0 0 1px rgb(0 0 0 / 0.15), 0 1px 4px rgb(0 0 0 / 0.3);
}
.slider input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.swatches { display: flex; flex-wrap: wrap; gap: 10px; }
.swatch {
  width: 44px;
  height: 44px;
  border: 2px solid var(--surface);
  border-radius: 50%;
  background: var(--c);
  box-shadow: 0 0 0 1px var(--border);
  cursor: pointer;
}

.options { display: flex; flex-wrap: wrap; gap: 8px; }
.option {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 14px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  cursor: pointer;
  text-transform: capitalize;
}
.option .icon { width: 20px; height: 20px; color: var(--muted); }
.option[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.option[aria-pressed="true"] .icon { color: inherit; }

.big-btn { gap: 8px; width: 100%; min-height: 56px; font-size: 1.05rem; }
.big-btn .icon { width: 22px; height: 22px; }

.climate-now { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.badge { padding: 4px 10px; border-radius: 999px; background: var(--surface-2); font-size: 0.85rem; }
.badge[data-action="heating"], .badge[data-action="preheating"] { background: #e8733d; color: #fff; }
.badge[data-action="cooling"] { background: #3d8be8; color: #fff; }
.big-stepper {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px;
  border-radius: var(--radius);
  background: var(--surface-2);
}
.big-stepper .step-btn { width: 56px; height: 56px; background: var(--surface); box-shadow: var(--shadow); }
.big-value { display: grid; justify-items: center; font-size: 2.6rem; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.1; }
.big-value small { font-size: 0.8rem; font-weight: 400; color: var(--muted); }
.stepper-pair { display: grid; gap: 10px; }
.stepper-pair .big-value { font-size: 2rem; }

.chart { margin: 0; display: grid; gap: 6px; }
.chart-head { display: flex; justify-content: space-between; gap: 8px; font-weight: 600; font-size: 0.9rem; flex-wrap: wrap; }
.chart-head .muted { font-weight: 400; }
.chart svg { width: 100%; height: 120px; display: block; }
.chart-line { fill: none; stroke: var(--primary); stroke-width: 2; stroke-linejoin: round; }
.chart-area { fill: color-mix(in srgb, var(--primary) 14%, transparent); stroke: none; }
.chart-axis { display: flex; justify-content: space-between; font-size: 0.75rem; }
.chart-loading { place-items: center; min-height: 120px; }
.timeline { position: relative; height: 28px; border-radius: 8px; background: var(--surface-2); overflow: hidden; }
.timeline span { position: absolute; top: 0; bottom: 0; background: var(--accent); }

.attrs { margin-top: 20px; }
.attrs summary { cursor: pointer; font-weight: 600; font-size: 0.95rem; padding: 8px 0; }
.attrs .facts { margin-top: 8px; }

.toast {
  position: fixed;
  z-index: 50;
  left: 50%;
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
  max-width: calc(100% - 32px);
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--text);
  color: var(--bg);
  font-size: 0.9rem;
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.sheet .toast { bottom: calc(var(--safe-bottom) + 16px); }

/* ---------- tablet (wall panel, portrait or landscape) ---------- */

@media (min-width: 700px) {
  :root { --tile-min: 170px; --gap: 14px; --gutter: 24px; }

  .app {
    grid-template-columns: 88px 1fr;
    grid-template-rows: auto 1fr;
    grid-template-areas: "nav top" "nav main";
  }
  .kiosk .app { grid-template-columns: 1fr; grid-template-areas: "top" "main"; }

  /* Side rail instead of a bottom bar. */
  .nav {
    grid-area: nav;
    position: sticky;
    top: 0;
    height: 100dvh;
    flex-direction: column;
    justify-content: flex-start;
    gap: 8px;
    padding: calc(16px + var(--safe-top)) 8px 16px calc(8px + var(--safe-left));
    border-top: 0;
    border-right: 1px solid var(--border);
  }
  .nav a { flex: none; padding: 8px 4px; }
  .topbar { padding-left: var(--gutter); }
  .view { padding: 4px calc(var(--gutter) + var(--safe-right)) 32px var(--gutter); }
  .kiosk .view, .kiosk .topbar { padding-left: calc(var(--gutter) + var(--safe-left)); }

  .clock { display: inline; font-size: 1.35rem; }
  .status[data-status="connected"] .status-text { display: inline; }
  .status[data-status="connected"] { padding: 6px 12px; }

  .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .hero h2 { font-size: 2rem; }

  .tile { min-height: 124px; }
  .tile-main { padding: 14px; }
  .tile-icon { width: 42px; height: 42px; }

  .hero p { font-size: 1.05rem; }

  /* Keep the whole plan on screen. */
  .plan { max-width: calc((100dvh - 210px) * var(--ar-n)); min-width: min(100%, 420px); }

  .sheet {
    width: min(560px, calc(100% - 48px));
    max-height: 80dvh;
    margin: auto;
    border-radius: 20px;
    padding-bottom: 0;
  }
}

/* ---------- desktop browser ---------- */

@media (min-width: 1100px) {
  :root { --tile-min: 180px; --gutter: 32px; }
  .app { grid-template-columns: 200px 1fr; }
  .nav a { flex-direction: row; gap: 12px; justify-content: flex-start; padding: 8px 12px; font-size: 0.95rem; }
  .nav .icon { width: 24px; height: 24px; padding: 0; }
  .nav a[aria-current="page"] { background: color-mix(in srgb, var(--primary) 12%, transparent); }
  .nav a[aria-current="page"] .icon { background: none; }
  .view > * { max-width: 1600px; }

  /* Home: climate and scenes on the left, rooms down the right. */
  .home-cols:has(.home-main > section) {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(300px, 0.55fr);
    gap: 0 var(--gutter);
    align-items: start;
  }

  /* Devices: rooms side by side in columns instead of one long list. */
  #entity-list { columns: 520px auto; column-gap: var(--gutter); }
  #entity-list .group { break-inside: avoid; display: inline-block; width: 100%; }
  #entity-list .group .section-title:first-child { margin-top: 8px; }
}

@media (min-width: 1700px) {
  :root { --tile-min: 190px; }
  .home-cols:has(.home-main > section) { grid-template-columns: minmax(0, 1fr) minmax(420px, 0.6fr); }
}

@media (hover: hover) {
  .tile:hover, .stat:hover, .room:hover { box-shadow: 0 2px 8px rgb(16 24 40 / 0.12); }
  .chip:hover:not([aria-current]) { background: var(--surface-2); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- live sky ---------- */

.sky { display: none; }
.sky-on .sky {
  display: block;
  position: fixed;
  top: 0;
  left: 0;
  z-index: -1;
  width: 100vw;
  height: 100lvh;
  pointer-events: none;
}
.sky-on body { background: #0b1430; }

/* Text sitting straight on the sky: light on a dark sky, dark on a pale one, with a soft halo. */
.sky-on {
  --on-sky: #ffffff;
  --on-sky-muted: rgb(255 255 255 / 0.86);
  --sky-halo: 0 1px 2px rgb(0 0 0 / 0.35), 0 0 14px rgb(0 0 0 / 0.3);
  --glass: color-mix(in srgb, var(--surface) 82%, transparent);
  --glass-strong: color-mix(in srgb, var(--surface) 90%, transparent);
  --glass-border: color-mix(in srgb, var(--border) 60%, transparent);
}
.sky-on[data-sky="light"] {
  --on-sky: #0d1726;
  --on-sky-muted: rgb(13 23 38 / 0.78);
  --sky-halo: 0 0 12px rgb(255 255 255 / 0.55);
}
.sky-on :is(.topbar h1, .clock, .hero h2, .section-title, .empty h2, .active-filter, .empty-list, .home-side > p) {
  color: var(--on-sky);
  text-shadow: var(--sky-halo);
}
.sky-on :is(.hero p, .section-title .muted, .empty p, .plan-head p, .plan-hint) { color: var(--on-sky-muted); text-shadow: var(--sky-halo); }
.sky-on .active-filter a, .sky-on .plan-hint a { color: inherit; font-weight: 600; }
.sky-on .chip, .sky-on .section-link { color: var(--text); }

.sky-on :is(.tile, .stat, .room, .panel, .search, .chip, .status, .fullscreen-btn, .section-link) {
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
}
.sky-on .chip, .sky-on .status, .sky-on .fullscreen-btn, .sky-on .search { border-color: var(--glass-border); }
.sky-on .chip[aria-current="true"] { background: var(--text); }
.sky-on .segmented:not(.panel .segmented) { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
.sky-on .tile.active { background: color-mix(in srgb, var(--accent-soft) 90%, transparent); }
.sky-on .tile.climate.active { background: var(--glass); }
.sky-on .panel { background: var(--glass-strong); }
.sky-on .topbar { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
.sky-on .nav {
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  border-color: var(--glass-border);
  -webkit-backdrop-filter: blur(16px) saturate(1.4);
  backdrop-filter: blur(16px) saturate(1.4);
}
.sky-on .spinner { border-color: rgb(255 255 255 / 0.35); border-top-color: #fff; }

/* ---------- wall mode: clock screen and dimming ---------- */

.idle {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: grid;
  place-items: center;
  padding: 24px;
  background: rgb(5 10 25 / 0.25);
  color: #fff;
  text-align: center;
  text-shadow: 0 2px 4px rgb(0 0 0 / 0.35), 0 0 24px rgb(0 0 0 / 0.3);
  cursor: pointer;
  touch-action: none;
  animation: fade-in 0.8s ease-out;
}
.idle[hidden] { display: none; }
:root:not(.sky-on) .idle { background: #000; }
/* Only the sky and the clock while idle, not the cards. */
.is-idle .app { visibility: hidden; }
.idle-inner { transform: var(--shift, none); transition: transform 2s ease-in-out; }
.idle-time {
  display: block;
  font-size: clamp(4.5rem, 17vw, 12rem);
  font-weight: 200;
  line-height: 1;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
}
.idle-date { margin: 12px 0 0; font-size: clamp(1.2rem, 4vw, 2rem); font-weight: 500; }
.idle-weather { margin: 6px 0 0; font-size: clamp(1.1rem, 3.4vw, 1.7rem); opacity: 0.92; }
.idle-weather:empty, .idle-summary:empty { display: none; }
.idle-summary { margin: 18px 0 0; font-size: 1rem; opacity: 0.8; }
.idle-hint { margin: 28px 0 0; font-size: 0.85rem; opacity: 0.55; }
@keyframes fade-in { from { opacity: 0; } }

.dimmer {
  position: fixed;
  inset: 0;
  z-index: 95;
  background: #000;
  opacity: 0;
  pointer-events: none;
  transition: opacity 2.5s ease;
}
:root:not(.is-idle) .dimmer { transition-duration: 0.15s; }

.panel .segmented { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.panel .segmented button { white-space: nowrap; flex: none; }
@media (min-width: 700px) {
  .sky-on .nav { background: color-mix(in srgb, var(--surface) 72%, transparent); }
}

/* ---------- cameras ---------- */

.cam-grid { --tile-min: 160px; }
.room-grid .cam-tile { grid-column: span 2; }
@media (max-width: 339px) { .cam-grid { --tile-min: 100%; } }

/* The picture fills the tile; the name sits on a shade along the bottom. */
.cam-tile, .sky-on .cam-tile { background: #0d1117; overflow: hidden; min-height: 0; }
.cam-main { display: block; position: relative; padding: 0; aspect-ratio: 16 / 10; color: #fff; overflow: hidden; }
.cam-frame {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  background: linear-gradient(160deg, #1d2633, #0d1117);
  color: rgb(255 255 255 / 0.4);
}
.cam-frame img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.3s;
}
.cam-frame.has-pic img { opacity: 1; }
.cam-frame.has-pic .cam-none { visibility: hidden; }
.cam-none .icon { width: 34px; height: 34px; }
.cam-play {
  position: absolute;
  top: 8px;
  right: 8px;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: rgb(0 0 0 / 0.45);
  color: #fff;
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}
.cam-play .icon { width: 18px; height: 18px; margin-left: 2px; }
.cam-caption {
  position: absolute;
  inset: auto 0 0;
  display: grid;
  gap: 1px;
  padding: 24px 12px 9px;
  background: linear-gradient(transparent, rgb(0 0 0 / 0.72));
  text-align: left;
}
.cam-caption .tile-name { color: #fff; -webkit-line-clamp: 1; }
.cam-caption .tile-state { color: rgb(255 255 255 / 0.78); }
.cam-tile.unavailable { opacity: 0.7; }

/* Camera sheet: wider than the others, with the video edge to edge. */
.sheet.cam-sheet { overflow-x: hidden; }
.cam-stage {
  position: relative;
  display: grid;
  place-items: center;
  aspect-ratio: 16 / 9;
  max-height: 70dvh;
  background: #000;
  overflow: hidden;
}
.cam-stage > img, .cam-stage > video {
  grid-area: 1 / 1;
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.cam-poster { opacity: 0; transition: opacity 0.3s; }
.cam-stage.has-pic .cam-poster { opacity: 1; }
.cam-media { opacity: 0; transition: opacity 0.25s; }
.cam-stage[data-phase="playing"] .cam-media { opacity: 1; }
.cam-stage[data-phase="playing"] .cam-poster { visibility: hidden; }
.cam-status {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  text-align: center;
  color: #fff;
  font-size: 0.9rem;
  text-shadow: 0 1px 3px rgb(0 0 0 / 0.6);
  background: radial-gradient(rgb(0 0 0 / 0.35), transparent 75%);
}
.cam-status .spinner { border-color: rgb(255 255 255 / 0.35); border-top-color: #fff; }
.cam-status .btn { display: none; gap: 6px; background: rgb(255 255 255 / 0.92); color: #16191d; border: 0; text-shadow: none; }
.cam-status .btn .icon { width: 18px; height: 18px; }
.cam-stage[data-phase="playing"] .cam-status { display: none; }
.cam-stage[data-phase="failed"] .spinner { display: none; }
.cam-stage[data-phase="failed"] .cam-status .btn { display: inline-flex; }
.cam-bar {
  position: absolute;
  inset: auto 0 0;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 24px 10px 10px 14px;
  background: linear-gradient(transparent, rgb(0 0 0 / 0.55));
  color: #fff;
  font-size: 0.8rem;
}
.cam-live { display: none; align-items: center; gap: 6px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.cam-live i { width: 8px; height: 8px; border-radius: 50%; background: #ff4d4d; animation: pulse 1.6s infinite; }
.cam-stage[data-phase="playing"] .cam-live { display: inline-flex; }
.cam-kind { opacity: 0.7; margin-right: auto; }
.cam-btn { width: 40px; height: 40px; background: rgb(0 0 0 / 0.4); color: #fff; }
.cam-btn .icon { width: 22px; height: 22px; }
.cam-stage:fullscreen { max-height: none; aspect-ratio: auto; width: 100vw; height: 100vh; }
.cam-stage:-webkit-full-screen { max-height: none; width: 100vw; height: 100vh; }

.cam-strip {
  display: flex;
  gap: 10px;
  padding: 14px 16px 16px;
  overflow-x: auto;
  scrollbar-width: none;
}
.cam-pick {
  flex: none;
  display: grid;
  gap: 6px;
  width: 132px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--text);
  font-size: 0.82rem;
  text-align: left;
  cursor: pointer;
}
.cam-pick .cam-frame { position: relative; aspect-ratio: 16 / 10; border-radius: var(--radius-sm); overflow: hidden; }
.cam-pick .cam-none .icon { width: 24px; height: 24px; }
.cam-pick-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cam-pick:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: var(--radius-sm); }

.plan-cam { color: color-mix(in srgb, var(--primary) 80%, var(--text)); }

@media (min-width: 700px) {
  .cam-grid { --tile-min: 220px; }
  /* As wide as fits, leaving room under the video for the other cameras. */
  .sheet.cam-sheet { width: min(980px, calc(100% - 48px), (80dvh - 240px) * 16 / 9); min-width: min(520px, calc(100% - 48px)); }
}

/* ---------- people map ---------- */

.map-card {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.pmap { position: relative; height: 260px; isolation: isolate; }
.pmap-canvas { position: absolute; inset: 0; }
.pmap .leaflet-container { background: var(--surface-2); font: inherit; }
/* Dark mode: the same OpenStreetMap pictures, inverted to a dark map with the colours kept. */
.pmap.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9) saturate(0.6); }
.pmap .leaflet-control-attribution {
  background: color-mix(in srgb, var(--surface) 75%, transparent);
  color: var(--muted);
  font-size: 10px;
  border-top-left-radius: 6px;
}
.pmap .leaflet-control-attribution a { color: inherit; }
.pmap .leaflet-bar { border: 0; box-shadow: var(--shadow); border-radius: var(--radius-sm); overflow: hidden; }
.pmap .leaflet-bar a { background: var(--surface); color: var(--text); border-color: var(--border); }
.pmap-msg {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  margin: 0;
  padding: 24px;
  text-align: center;
  font-size: 0.9rem;
  color: var(--muted);
  background: var(--surface-2);
}
.pmap-msg[hidden] { display: none; }
.pmap-tools { position: absolute; top: 10px; right: 10px; z-index: 1000; display: grid; gap: 8px; }
.pmap-btn {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid var(--glass-border, var(--border));
  border-radius: 50%;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  box-shadow: 0 1px 4px rgb(0 0 0 / 0.18);
  color: var(--text);
  cursor: pointer;
}
.pmap-btn .icon { width: 20px; height: 20px; }

/* Full screen: over everything but the clock screen. */
.pmap.expanded {
  position: fixed;
  inset: 0;
  z-index: 80;
  height: auto;
  background: var(--bg);
}
.pmap.expanded .pmap-tools { top: calc(12px + var(--safe-top)); right: calc(12px + var(--safe-right)); }
.pmap-open, .pmap-open body { overflow: hidden; }

/* Zones: Home in the accent blue, others quieter, passive ones dashed. */
.pmap-zone { fill: var(--primary); fill-opacity: 0.08; stroke: var(--primary); stroke-opacity: 0.5; stroke-width: 1.5px; }
.pmap-zone.home { fill-opacity: 0.14; stroke-opacity: 0.8; }
.pmap-zone.passive { stroke-dasharray: 4 4; fill-opacity: 0.04; }
.pmap-acc { fill: var(--primary); fill-opacity: 0.1; stroke: none; }
.pmap-zone-label { width: 0 !important; height: 0 !important; }
.pmap-zone-label span {
  position: absolute;
  /* Above the zone's top edge, clear of anyone standing in it. */
  transform: translate(-50%, calc(-100% - 26px));
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.15);
  pointer-events: none;
}
.pmap-zone-label .icon { width: 12px; height: 12px; color: var(--primary); }

/* A person: their picture in a ring, first name underneath. */
.pavatar {
  position: relative;
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--pc, var(--primary));
  color: #fff;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.pavatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pavatar.big { width: 44px; height: 44px; font-size: 1rem; }
.pmap-pin-wrap { background: none; border: 0; }
.pmap-pin { position: relative; display: grid; justify-items: center; gap: 2px; cursor: pointer; }
.pmap-pin .pavatar {
  width: 44px;
  height: 44px;
  border: 3px solid #fff;
  box-shadow: 0 2px 8px rgb(0 0 0 / 0.35), 0 0 0 1px rgb(0 0 0 / 0.08);
}
.pmap-pin.away .pavatar { border-color: var(--pc); }
.pmap-pin.away .pavatar { box-shadow: 0 2px 8px rgb(0 0 0 / 0.35), 0 0 0 2px #fff; }
.pmap-name {
  padding: 1px 7px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  color: var(--text);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 1px 3px rgb(0 0 0 / 0.2);
}
.pmap-pin.pulse .pavatar { animation: pmap-pulse 1.2s ease-out 2; }
@keyframes pmap-pulse {
  0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--primary) 70%, transparent), 0 2px 8px rgb(0 0 0 / 0.35); }
  100% { box-shadow: 0 0 0 18px transparent, 0 2px 8px rgb(0 0 0 / 0.35); }
}

/* The people under the map: one chip each, Home ones marked green. */
.people-row { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.people-row::-webkit-scrollbar { display: none; }
.person-chip {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-height: 52px;
  padding: 6px 16px 6px 6px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow);
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
}
.person-chip:active { transform: scale(0.97); }
.person-text { display: grid; line-height: 1.2; }
.person-name { font-weight: 600; font-size: 0.92rem; }
.person-place { color: var(--muted); font-size: 0.8rem; }
.person-chip.home .person-place { color: var(--positive); font-weight: 600; }
.person-actions .btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
.person-actions .icon { width: 18px; height: 18px; }
.people .plan-hint { margin-top: 8px; }

.sky-on :is(.map-card, .person-chip) {
  border-color: var(--glass-border);
  -webkit-backdrop-filter: blur(14px) saturate(1.4);
  backdrop-filter: blur(14px) saturate(1.4);
}
.sky-on .person-chip { background: var(--glass); }
.sky-on .map-card { background: var(--glass); }

@media (min-width: 700px) {
  .pmap { height: 320px; }
}
@media (min-width: 1100px) {
  .pmap { height: 360px; }
}

/* ---------- solar and battery flow ---------- */

.energy, .solar-layout {
  --en-solar: #e09a1f;
  --en-grid: #7c5cd6;
  --en-battery: #1f9d55;
  --en-home: #1a8fb0;
  --en-track: #e3e7ed;
}
:root[data-theme="dark"] .energy, :root[data-theme="dark"] .solar-layout {
  --en-solar: #f2b544;
  --en-grid: #a48cf0;
  --en-battery: #4cc27f;
  --en-home: #4cbde0;
  --en-track: #2d333c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .energy, :root:not([data-theme="light"]) .solar-layout {
    --en-solar: #f2b544;
    --en-grid: #a48cf0;
    --en-battery: #4cc27f;
    --en-home: #4cbde0;
    --en-track: #2d333c;
  }
}
.energy-card {
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
  padding: 8px 8px 12px;
}
.energy-svg { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 auto; overflow: visible; }
.en-track { fill: none; stroke: var(--en-track); stroke-width: 3; stroke-linecap: round; }
.en-flow {
  fill: none;
  stroke-width: 5;
  stroke-linecap: round;
  stroke-dasharray: 0.1 14;
  animation: en-flow 1.5s linear infinite;
}
.en-flow.solar { stroke: var(--en-solar); }
.en-flow.grid { stroke: var(--en-grid); }
.en-flow.battery { stroke: var(--en-battery); }
.en-flow.home { stroke: var(--en-home); }
@keyframes en-flow { to { stroke-dashoffset: -14.1; } }
.en-hub { fill: var(--surface); stroke: var(--muted); stroke-width: 2; }
.en-ring { fill: var(--surface-2); stroke-width: 2.5; }
.en-solar { color: var(--en-solar); }
.en-grid { color: var(--en-grid); }
.en-battery { color: var(--en-battery); }
.en-home { color: var(--en-home); }
.en-node .en-ring { stroke: currentColor; }
.en-level { fill: currentColor; }
.en-level.low { fill: var(--danger); }
.en-node[data-energy] { cursor: pointer; pointer-events: bounding-box; }
.en-node[data-energy]:focus-visible { outline: none; }
.en-node[data-energy]:focus-visible .en-ring { stroke-width: 4; }
.en-label { fill: var(--muted); font-size: 12px; }
.en-value { fill: var(--text); font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.en-sub { fill: var(--muted); font-size: 11.5px; }
.energy-today {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 8px;
  margin-top: 6px;
}
.energy-stat {
  display: grid;
  gap: 2px;
  padding: 10px 12px;
  border: 0;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--text);
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.energy-stat-value { font-size: 1.1rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.energy-stat-value small { font-size: 0.75rem; font-weight: 400; color: var(--muted); }
.energy-stat-label { font-size: 0.8rem; color: var(--muted); }
.energy-stat-label small { font-size: 0.7rem; opacity: 0.8; }
div.energy-stat { cursor: default; }

/* ---------- Solar tab ---------- */

.solar-layout { display: grid; gap: 4px 20px; align-items: start; }
.solar-layout .energy-svg { max-width: 480px; }
.en-charts {
  display: grid;
  gap: 18px;
  padding: 14px 16px 12px;
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.en-chart { margin: 0; min-width: 0; }
.en-chart-head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; min-height: 1.5em; margin-bottom: 6px; }
.en-chart-title { font-weight: 600; }
.en-chart-info { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 0.8rem; }
.en-chart-info[hidden], .en-readout[hidden], .en-cursor[hidden] { display: none; }
.en-readout { font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.en-key { display: inline-flex; align-items: center; gap: 5px; }
.en-key::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: currentColor; }
.en-key.solar { color: var(--en-solar); }
.en-key.grid { color: var(--en-grid); }
.en-key.battery { color: var(--en-battery); }
.en-key.home { color: var(--en-home); }
.en-plot { position: relative; height: 120px; touch-action: pan-y; cursor: crosshair; }
.en-plot svg { display: block; width: 100%; height: 100%; overflow: visible; }
.en-grid-line { stroke: var(--border); stroke-width: 1; }
.en-grid-line.zero { stroke: var(--muted); stroke-opacity: 0.5; }
.en-line { fill: none; stroke-width: 2; stroke-linejoin: round; }
.en-area { stroke: none; opacity: 0.22; }
.en-line.solar { stroke: var(--en-solar); }
.en-area.solar { fill: var(--en-solar); }
.en-line.grid { stroke: var(--en-grid); }
.en-area.grid { fill: var(--en-grid); }
.en-line.battery { stroke: var(--en-battery); }
.en-area.battery { fill: var(--en-battery); }
.en-line.home { stroke: var(--en-home); }
.en-area.home { fill: var(--en-home); }
.en-y {
  position: absolute;
  left: 2px;
  transform: translateY(-50%);
  padding: 0 4px;
  border-radius: 4px;

// ---- entities.js ----
// Helpers for turning raw Home Assistant states into things to display.

const DOMAIN_LABELS = {
  light: 'Lights',
  switch: 'Switches',
  climate: 'Climate',
  sensor: 'Sensors',
  binary_sensor: 'Binary sensors',
  scene: 'Scenes',
  script: 'Scripts',
  automation: 'Automations',
  cover: 'Covers',
  fan: 'Fans',
  lock: 'Locks',
  media_player: 'Media',
  person: 'People',
  weather: 'Weather',
  camera: 'Cameras',
  input_boolean: 'Toggles',
  button: 'Buttons',
  vacuum: 'Vacuums',
  alarm_control_panel: 'Alarm',
  update: 'Updates',
  sun: 'Sun',
  calendar: 'Calendars',
  timer: 'Timers',
};

// Most useful first; everything else follows alphabetically.
const DOMAIN_ORDER = [
  'light', 'switch', 'climate', 'cover', 'fan', 'lock', 'media_player', 'scene',
  'script', 'sensor', 'binary_sensor', 'person', 'weather', 'camera', 'vacuum',
  'alarm_control_panel', 'input_boolean', 'button', 'automation',
];

const ACTIVE_STATES = new Set([
  'on', 'open', 'opening', 'closing', 'unlocked', 'unlocking', 'home', 'playing',
  'heat', 'cool', 'heat_cool', 'auto', 'dry', 'fan_only', 'cleaning', 'active',
  'armed_home', 'armed_away', 'armed_night', 'triggered', 'above_horizon',
]);

const domainOf = (entityId) => entityId.slice(0, entityId.indexOf('.'));

function domainLabel(domain) {
  return DOMAIN_LABELS[domain] || domain.replace(/_/g, ' ').replace(/^\w/, (c) => c.toUpperCase());
}

function compareDomains(a, b) {
  const ia = DOMAIN_ORDER.indexOf(a);
  const ib = DOMAIN_ORDER.indexOf(b);
  if (ia !== -1 || ib !== -1) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
  return a.localeCompare(b);
}

const nameOf = (s) => s.attributes?.friendly_name || s.entity_id;

// Scenes and buttons are stateless: their state is the last time they ran, or "unknown" if never.
const STATELESS = new Set(['scene', 'button', 'input_button']);

const isUnavailable = (s) =>
  s.state === 'unavailable' || (s.state === 'unknown' && !STATELESS.has(domainOf(s.entity_id)));

const isActive = (s) => ACTIVE_STATES.has(s.state);

function iconFor(s) {
  const domain = domainOf(s.entity_id);
  const dc = s.attributes?.device_class;
  if (domain === 'light') return isActive(s) ? 'light' : 'lightOff';
  if (domain === 'switch') return dc === 'outlet' ? 'outlet' : isActive(s) ? 'switch' : 'switchOff';
  if (domain === 'climate' && HVAC_ICONS[s.state]) return HVAC_ICONS[s.state];
  if (domain === 'lock') return s.state === 'locked' ? 'lock' : 'lockOpen';
  if (domain === 'sensor') {
    if (dc === 'temperature') return 'temperature';
    if (dc === 'humidity') return 'humidity';
    if (dc === 'power' || dc === 'energy') return 'power';
    if (dc === 'battery') return 'battery';
  }
  if (domain === 'binary_sensor') {
    if (dc === 'door' || dc === 'window' || dc === 'opening' || dc === 'garage_door') return 'door';
    if (dc === 'occupancy' || dc === 'presence') return 'eye';
  }
  if (domain === 'input_number' || domain === 'number') return 'number';
  if (domain === 'input_select' || domain === 'select') return 'select';
  return domain;
}

const STATE_LABELS = {
  on: 'On', off: 'Off', open: 'Open', closed: 'Closed', opening: 'Opening', closing: 'Closing',
  locked: 'Locked', unlocked: 'Unlocked', home: 'Home', not_home: 'Away',
  playing: 'Playing', paused: 'Paused', idle: 'Idle', standby: 'Standby',
  recording: 'Recording', streaming: 'Streaming',
  unavailable: 'Unavailable', unknown: 'Unknown', heat: 'Heat', cool: 'Cool',
  heat_cool: 'Heat/Cool', auto: 'Auto', dry: 'Dry', fan_only: 'Fan',
  above_horizon: 'Above horizon', below_horizon: 'Below horizon',
};

const WEATHER_LABELS = {
  'clear-night': 'Clear', cloudy: 'Cloudy', exceptional: 'Exceptional', fog: 'Fog', hail: 'Hail',
  lightning: 'Lightning', 'lightning-rainy': 'Storms', partlycloudy: 'Partly cloudy', pouring: 'Pouring',
  rainy: 'Rainy', snowy: 'Snowy', 'snowy-rainy': 'Sleet', sunny: 'Sunny', windy: 'Windy', 'windy-variant': 'Windy',
};

const BINARY_LABELS = {
  door: ['Closed', 'Open'], window: ['Closed', 'Open'], opening: ['Closed', 'Open'],
  garage_door: ['Closed', 'Open'], motion: ['Clear', 'Detected'],
  occupancy: ['Clear', 'Detected'], presence: ['Away', 'Home'], moisture: ['Dry', 'Wet'],
  smoke: ['Clear', 'Detected'], battery: ['Normal', 'Low'], connectivity: ['Offline', 'Online'],
};

function formatState(s) {
  const domain = domainOf(s.entity_id);
  const a = s.attributes || {};
  if (isUnavailable(s)) return STATE_LABELS[s.state];
  if (STATELESS.has(domain)) return 'Tap to run';
  if (domain === 'script') return s.state === 'on' ? 'Running' : 'Tap to run';
  if (domain === 'weather') {
    const label = WEATHER_LABELS[s.state] || s.state;
    return a.temperature != null ? `${label} · ${a.temperature}°` : label;
  }

  if (domain === 'binary_sensor' && BINARY_LABELS[a.device_class]) {
    return BINARY_LABELS[a.device_class][s.state === 'on' ? 1 : 0];
  }
  if (domain === 'climate' && a.current_temperature != null) {
    return `${STATE_LABELS[s.state] || s.state} · ${a.current_temperature}°`;
  }
  if (domain === 'light' && s.state === 'on' && a.brightness != null) {
    return `${Math.round((a.brightness / 255) * 100)}%`;
  }
  if (domain === 'sensor' && a.device_class === 'timestamp') {
    return relativeTime(s.state);
  }
  const num = Number(s.state);
  if (s.state !== '' && Number.isFinite(num)) {
    const rounded = Math.abs(num) >= 100 ? Math.round(num) : Math.round(num * 10) / 10;
    return a.unit_of_measurement ? `${rounded} ${a.unit_of_measurement}` : String(rounded);
  }
  return STATE_LABELS[s.state] || s.state.replace(/_/g, ' ');
}

function relativeTime(iso) {
  const t = new Date(iso).getTime();
  if (!Number.isFinite(t)) return iso;
  const diff = (Date.now() - t) / 1000;
  const abs = Math.abs(diff);
  const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });
  if (abs < 45) return 'just now';
  if (abs < 3600) return rtf.format(-Math.round(diff / 60), 'minute');
  if (abs < 86400) return rtf.format(-Math.round(diff / 3600), 'hour');
  return rtf.format(-Math.round(diff / 86400), 'day');
}

// ---------- what a tile does when tapped ----------

const TOGGLE_DOMAINS = new Set(['light', 'switch', 'input_boolean', 'fan']);
const RUN_SERVICES = {
  scene: 'turn_on',
  script: 'turn_on',
  button: 'press',
  input_button: 'press',
};

/**
 * The one-tap action for an entity's tile, or null when a tap should open its details.
 * @returns {{kind: 'toggle'|'run', domain: string, service: string} | null}
 */
function primaryAction(s) {
  if (s.state === 'unavailable') return null;
  const domain = domainOf(s.entity_id);
  if (RUN_SERVICES[domain]) return { kind: 'run', domain, service: RUN_SERVICES[domain] };
  if (TOGGLE_DOMAINS.has(domain) && s.state !== 'unknown') {
    return { kind: 'toggle', domain, service: s.state === 'on' ? 'turn_off' : 'turn_on' };
  }
  return null;
}

// ---------- light capabilities ----------

const COLOR_MODES = new Set(['hs', 'rgb', 'rgbw', 'rgbww', 'xy']);

function lightFeatures(s) {
  const modes = s.attributes?.supported_color_modes || [];
  return {
    brightness: modes.some((m) => m !== 'onoff'),
    colorTemp: modes.includes('color_temp'),
    color: modes.some((m) => COLOR_MODES.has(m)),
  };
}

const brightnessPct = (s) =>
  s.state === 'on' && s.attributes?.brightness != null ? Math.round((s.attributes.brightness / 255) * 100) : 0;

// ---------- climate ----------

const HVAC_LABELS = {
  off: 'Off', heat: 'Heat', cool: 'Cool', heat_cool: 'Heat/Cool', auto: 'Auto', dry: 'Dry', fan_only: 'Fan',
};
const HVAC_ICONS = {
  off: 'power', heat: 'fire', cool: 'snowflake', heat_cool: 'sunSnowflake', auto: 'thermostatAuto',
  dry: 'waterPercent', fan_only: 'fan',
};
const HVAC_ACTION_LABELS = {
  heating: 'Heating', cooling: 'Cooling', drying: 'Drying', fan: 'Fan running', idle: 'Idle',
  off: 'Off', preheating: 'Preheating', defrosting: 'Defrosting',
};

const hvacActionLabel = (a) => HVAC_ACTION_LABELS[a] || (a ? a.replace(/_/g, ' ') : '');

/** Step for the target temperature buttons: HA's own, else 0.5 for °C and 1 for °F. */
function tempStep(s, unit) {
  const a = s.attributes || {};
  if (a.target_temp_step) return a.target_temp_step;
  return unit === '°F' ? 1 : 0.5;
}

/** Which setpoints this thermostat uses right now: a single target or a low/high range. */
function climateTargets(s) {
  const a = s.attributes || {};
  if (a.temperature != null) return { single: a.temperature };
  if (a.target_temp_low != null && a.target_temp_high != null) {
    return { low: a.target_temp_low, high: a.target_temp_high };
  }
  return {};
}

const fmtTemp = (t) => (t == null ? '–' : `${Number(t).toFixed(Number.isInteger(Number(t)) ? 0 : 1)}°`);

// ---- auth.js ----
// Works out how to authenticate, in order of preference:
//  1. Embedded in Home Assistant (a "Webpage" dashboard in the app or browser):
//     reuse the logged-in session of the parent Home Assistant page. No token needed.
//  2. A long-lived access token in the address (?token=...), e.g. for casting with catt to a
//     Nest Hub, which has no keyboard to type one into Settings. It is taken out of the
//     address bar straight away and kept for this tab only (reloads keep working).
//  3. A long-lived access token saved on this device in Settings.

const SETTINGS_KEY = 'ha-dash.settings';
const URL_TOKEN_KEY = 'ha-dash.url-token';

/** Reads ?token= (or ?access_token=) once, removes it from the address, keeps it for this tab. */
function takeUrlToken() {
  let token = '';
  try {
    const params = new URLSearchParams(location.search);
    token = params.get('token') || params.get('access_token') || '';
    if (token) {
      params.delete('token');
      params.delete('access_token');
      const q = params.toString().replace(/=(?=&|$)/g, ''); // keep ?wall, not ?wall=
      history.replaceState(history.state, '', location.pathname + (q ? `?${q}` : '') + location.hash);
    }
  } catch {
    /* no history API; leave the address as it is */
  }
  try {
    if (token) sessionStorage.setItem(URL_TOKEN_KEY, token);
    else token = sessionStorage.getItem(URL_TOKEN_KEY) || '';
  } catch {
    /* storage unavailable; the token still works until the page reloads */
  }
  return token;
}
const urlToken = takeUrlToken();

function loadSettings() {
  try {
    return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
  } catch {
    return {};
  }
}

function saveSettings(settings) {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
  } catch {
    /* storage unavailable (private mode); settings last for this session only */
  }
}

/** Default HA address: the server this page is served from, when that is HA itself. */
function defaultUrl() {
  return /^https?:$/.test(location.protocol) ? location.origin : '';
}

async function parentHassAuth() {
  if (window.parent === window) return null;
  try {
    // Throws for a cross-origin parent; only works when served from HA's /local/.
    const promise = window.parent.hassConnection;
    if (!promise) return null;
    const timeout = new Promise((resolve) => setTimeout(() => resolve(null), 5000));
    const result = await Promise.race([promise, timeout]);
    return result?.auth || null;
  } catch {
    return null;
  }
}

/**
 * @returns {Promise<{mode: 'embedded'|'token'|'none', url: string, getToken?: () => Promise<string>}>}
 */
async function resolveAuth() {
  const settings = loadSettings();

  if (!settings.forceToken && !urlToken) {
    const auth = await parentHassAuth();
    if (auth) {
      return {
        mode: 'embedded',
        url: location.origin, // same origin as the parent, or we could not have read it
        getToken: async () => {
          if (auth.expired) await auth.refreshAccessToken();
          return auth.accessToken;
        },
      };
    }
  }

  const url = settings.url || defaultUrl();
  if (urlToken && url) {
    return { mode: 'token', url, getToken: async () => urlToken };
  }
  if (settings.token && url) {
    return { mode: 'token', url, getToken: async () => settings.token };
  }
  return { mode: 'none', url };
}

// ---- ha.js ----
// Minimal Home Assistant WebSocket client.
// Protocol: https://developers.home-assistant.io/docs/api/websocket
//
// Events dispatched (EventTarget):
//   "status"   detail: { status, message }   status: connecting | connected | disconnected | auth_invalid
//   "ready"    detail: { states, areas, entityAreas, config }
//   "state"    detail: { entityId, newState }  (newState is null when an entity is removed)

const PING_INTERVAL = 30_000;
const PONG_TIMEOUT = 10_000;
const MAX_BACKOFF = 30_000;

class HAClient extends EventTarget {
  /**
   * @param {object} opts
   * @param {string} opts.url       Base URL of Home Assistant, e.g. http://homeassistant.local:8123
   * @param {() => Promise<string>} opts.getToken  Returns a valid access token.
   */
  constructor({ url, getToken }) {
    super();
    this.url = url.replace(/\/+$/, '');
    this.getToken = getToken;
    this.ws = null;
    this.nextId = 1;
    this.pending = new Map();
    this.eventHandlers = new Map();
    this.status = 'idle';
    this.retries = 0;
    this.stopped = false;
    this.reconnectTimer = null;
    this.pingTimer = null;
    this.haVersion = null;

    this._onVisible = () => {
      if (document.visibilityState === 'visible') this._reconnectNowIfDown();
    };
    this._onOnline = () => this._reconnectNowIfDown();
    document.addEventListener('visibilitychange', this._onVisible);
    window.addEventListener('online', this._onOnline);
  }

  get wsUrl() {
    return this.url.replace(/^http/i, 'ws') + '/api/websocket';
  }

  async connect() {
    this.stopped = false;
    clearTimeout(this.reconnectTimer);
    this._setStatus('connecting');

    let token;
    try {
      token = await this.getToken();
    } catch (err) {
      this._setStatus('auth_invalid', err.message || 'Could not get an access token');
      return;
    }
    if (!token) {
      this._setStatus('auth_invalid', 'No access token set');
      return;
    }

    let ws;
    try {
      ws = new WebSocket(this.wsUrl);
    } catch (err) {
      this._setStatus('disconnected', err.message);
      this._scheduleReconnect();
      return;
    }
    this.ws = ws;
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      // HA may batch several messages into one frame (coalesce_messages).
      for (const m of Array.isArray(msg) ? msg : [msg]) this._handle(ws, m, token);
    };
    ws.onclose = () => this._onClose(ws);
  }

  /** Stop and do not reconnect. */
  close() {
    this.stopped = true;
    clearTimeout(this.reconnectTimer);
    clearInterval(this.pingTimer);
    document.removeEventListener('visibilitychange', this._onVisible);
    window.removeEventListener('online', this._onOnline);
    if (this.ws) this.ws.close();
  }

  /** Send a command and resolve with its result. */
  send(payload) {
    return new Promise((resolve, reject) => {
      if (!this.ws || this.ws.readyState !== WebSocket.OPEN) {
        reject(new Error('Not connected'));
        return;
      }
      const id = this.nextId++;
      this.pending.set(id, { resolve, reject });
      this.ws.send(JSON.stringify({ id, ...payload }));
    });
  }

  /** Subscribe to an event bus event. Returns the subscription id. */
  subscribeEvents(eventType, handler) {
    return this.subscribe({ type: 'subscribe_events', event_type: eventType }, handler);
  }

  /** Send a command whose events keep arriving under its id (e.g. a camera's WebRTC offer). */
  async subscribe(payload, handler) {
    const id = this.nextId; // id that send() is about to use
    this.eventHandlers.set(id, handler);
    try {
      await this.send(payload);
    } catch (err) {
      this.eventHandlers.delete(id);
      throw err;
    }
    return id;
  }

  unsubscribe(id) {
    this.eventHandlers.delete(id);
    return this.send({ type: 'unsubscribe_events', subscription: id }).catch(() => {});
  }

  callService(domain, service, serviceData = {}, target) {
    const payload = { type: 'call_service', domain, service, service_data: serviceData };
    if (target) payload.target = target;
    return this.send(payload);
  }

  /**
   * Recorded history of one entity, oldest first, as [{ t: ms, s: state }].
   * Uses the compact format HA's own history graphs use (no attributes).
   */
  async history(entityId, hours = 24) {
    const result = await this.send({
      type: 'history/history_during_period',
      start_time: new Date(Date.now() - hours * 3_600_000).toISOString(),
      entity_ids: [entityId],
      minimal_response: true,
      no_attributes: true,
      significant_changes_only: false,
      include_start_time_state: true,
    });
    return (result?.[entityId] || []).map((p) => ({ t: (p.lu ?? p.lc) * 1000, s: p.s }));
  }

  // ---- internals ----

  _handle(ws, msg, token) {
    switch (msg.type) {
      case 'auth_required':
        ws.send(JSON.stringify({ type: 'auth', access_token: token }));
        break;
      case 'auth_ok':
        this.haVersion = msg.ha_version;
        this._onAuthenticated();
        break;
      case 'auth_invalid':
        this.stopped = true; // retrying with the same token will not help
        this._setStatus('auth_invalid', msg.message || 'Access token rejected');
        ws.close();
        break;
      case 'result': {
        const p = this.pending.get(msg.id);
        if (!p) break;
        this.pending.delete(msg.id);
        if (msg.success) p.resolve(msg.result);
        else p.reject(Object.assign(new Error(msg.error?.message || 'Command failed'), { code: msg.error?.code }));
        break;
      }
      case 'pong': {
        const p = this.pending.get(msg.id);
        if (p) { this.pending.delete(msg.id); p.resolve(); }
        break;
      }
      case 'event': {
        const handler = this.eventHandlers.get(msg.id);
        if (handler) handler(msg.event);
        break;
      }
    }
  }

  async _onAuthenticated() {
    this.retries = 0;
    this._startPing();
    try {
      // Subscribe before fetching states so no change is missed in between.
      await this.subscribeEvents('state_changed', (event) => {
        const { entity_id: entityId, new_state: newState } = event.data;
        this.dispatchEvent(new CustomEvent('state', { detail: { entityId, newState } }));
      });
      const [states, config, registry] = await Promise.all([
        this.send({ type: 'get_states' }),
        this.send({ type: 'get_config' }).catch(() => ({})),
        this._loadRegistries(),
      ]);
      this._setStatus('connected');
      this.dispatchEvent(new CustomEvent('ready', { detail: { states, config, ...registry } }));
    } catch (err) {
      this._setStatus('disconnected', err.message);
      this.ws?.close();
    }
  }

  // Areas are optional: some registry commands need an admin user, so any failure
  // just means entities are grouped by type instead of by room.
  async _loadRegistries() {
    const safe = (p) => p.catch(() => null);
    const [areas, entities, devices] = await Promise.all([
      safe(this.send({ type: 'config/area_registry/list' })),
      safe(this.send({ type: 'config/entity_registry/list_for_display' })),
      safe(this.send({ type: 'config/device_registry/list' })),
    ]);
    const deviceArea = new Map();
    for (const d of devices || []) if (d.area_id) deviceArea.set(d.id, d.area_id);

    // entityInfo: entity_id -> { areaId, hidden, category, deviceId }
    const entityInfo = new Map();
    const categories = entities?.entity_categories || {};
    for (const e of entities?.entities || []) {
      entityInfo.set(e.ei, {
        areaId: e.ai || (e.di && deviceArea.get(e.di)) || null,
        hidden: !!e.hb,
        category: e.ec !== undefined ? categories[e.ec] : null,
        deviceId: e.di || null,
      });
    }
    return { areas: areas || [], entityInfo };
  }

  _startPing() {
    clearInterval(this.pingTimer);
