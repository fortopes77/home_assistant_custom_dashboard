}

function wireEntityRooms() {
  const panel = $('#entity-rooms');
  panel.addEventListener('change', (e) => {
    const sel = e.target.closest('[data-entity-room]');
    if (!sel) return;
    const next = { ...store.prefs.entityAreas };
    if (sel.value) next[sel.dataset.entityRoom] = sel.value;
    else delete next[sel.dataset.entityRoom];
    saveEntityAreas(next);
    roomsUi.open.add('_placed');
    const name = sel.options[sel.selectedIndex].textContent.trim();
    renderEntityRooms();
    toast(sel.value ? `Moved to ${name}` : 'Removed from its room');
  });
  panel.addEventListener('input', (e) => {
    if (e.target.id !== 'eroom-q') return;
    roomsUi.filter = e.target.value;
    renderEntityRooms();
  });
  // Remember which groups are open, so redraws after a pick keep the list where it was.
  panel.addEventListener('toggle', (e) => {
    const g = e.target.dataset?.eroomGroup;
    if (!g || roomsUi.filter) return;
    if (e.target.open) roomsUi.open.add(g);
    else roomsUi.open.delete(g);
  }, true);
}

// Room links and names live in the Home Assistant user's profile so the phone and the wall tablet agree.
async function loadPlanAreas(client) {
  const sync = async (key, pref, save) => {
    try {
      const res = await client.send({ type: 'frontend/get_user_data', key });
      if (client !== store.client) return false;
      if (res?.value && typeof res.value === 'object') {
        store.prefs[pref] = res.value;
        writePrefs();
        return true;
      }
      if (Object.keys(store.prefs[pref]).length) save(store.prefs[pref]); // first time: share what this device has
    } catch { /* older Home Assistant: keep the copy on this device */ }
    return false;
  };
  const changed = await Promise.all([
    sync(PLAN_DATA_KEY, 'planAreas', savePlanAreas),
    sync(PLAN_NAMES_KEY, 'planNames', savePlanNames),
    sync(ENTITY_AREAS_KEY, 'entityAreas', saveEntityAreas),
  ]);
  if (foldLegacyPlan()) changed.push(true);
  if (changed.some(Boolean) && ['home', 'entities', 'settings'].includes(currentView)) render();
}

function openRoom(roomId, areaId) {
  ui.person = null;
  ui.room = { roomId, areaId };
  ui.roomHtml = '';
  renderRoomSheet();
}

function renderRoomSheet() {
  const dialog = $('#detail');
  if (!ui.room) return;
  const { roomId, areaId } = ui.room;
  const room = planRooms(planStore.layout).find((r) => r.id === roomId);
  const areaName = areaId ? store.areas.get(areaId) || areaId : '';
  const name = room ? roomName(room) : areaName;
  // Cameras first: their pictures are the biggest thing in the room.
  const ents = (areaId ? areaEntities(areaId) : [])
    .sort((a, b) => (domainOf(b.entity_id) === 'camera') - (domainOf(a.entity_id) === 'camera'));
  const lights = ents.filter((s) => domainOf(s.entity_id) === 'light' && !isUnavailable(s));
  const on = lights.filter((s) => shown(s).state === 'on').length;
  const sub = [areaName && areaName !== name ? areaName : '', areaId ? `${ents.length} ${ents.length === 1 ? 'device' : 'devices'}` : '',
    lights.length ? (on ? `${on} ${on === 1 ? 'light' : 'lights'} on` : 'Lights off') : ''].filter(Boolean).join(' · ');

  let body;
  if (!areaId) {
    body = `<p class="muted">This room is not linked to a Home Assistant area yet.</p>
      <div class="form-actions"><a class="btn primary" href="#/settings?section=plan">Link rooms</a></div>`;
  } else if (!ents.length) {
    body = `<p class="muted">No devices in ${esc(areaName)} yet. Give devices this area in Home Assistant, or <a href="#/settings?section=rooms">pick devices for it</a> in Settings.</p>`;
  } else {
    body = `${lights.length > 1 ? `<div class="room-actions">
        <button type="button" class="btn" data-room-act="turn_off" ${on ? '' : 'disabled'}>${icon('lightOff')}All off</button>
        <button type="button" class="btn" data-room-act="turn_on" ${on === lights.length ? 'disabled' : ''}>${icon('light')}All on</button>
      </div>` : ''}
      <div class="grid room-grid">${ents.map(renderTile).join('')}</div>`;
  }
  const html = `
    <div class="sheet-head">
      <span class="tile-icon ${on ? 'active' : ''}">${icon('area')}</span>
      <div>
        <h2 id="detail-title">${esc(name)}</h2>
        <p class="muted">${esc(sub)}</p>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Close">${icon('close')}</button>
    </div>
    <div class="sheet-body">${body}</div>`;
  if (dialog.open && !dialog.dataset.entity && html === ui.roomHtml) return;
  const same = dialog.open && dialog.dataset.room === (roomId || areaId) && !dialog.dataset.entity;
  const scroll = dialog.scrollTop;
  stopCamera();
  delete dialog.dataset.entity;
  delete dialog.dataset.person;
  ui.history = null;
  dialog.dataset.room = roomId || areaId;
  ui.roomHtml = html;
  dialog.innerHTML = html;
  paintCameras(dialog);
  if ($('#toast')?.parentNode === dialog) dialog.append($('#toast'));
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = same ? scroll : 0;
}

async function roomLights(service) {
  const ids = areaEntities(ui.room?.areaId)
    .filter((s) => domainOf(s.entity_id) === 'light' && !isUnavailable(s) && shown(s).state !== (service === 'turn_on' ? 'on' : 'off'))
    .map((s) => s.entity_id);
  if (!ids.length) return;
  for (const id of ids) setOptimistic(id, service === 'turn_on' ? 'on' : 'off');
  renderRoomSheet();
  navigator.vibrate?.(8);
  if (!(await call('light', service, {}, ids))) for (const id of ids) clearOptimistic(id);
}

function wirePlan() {
  const view = $('#view');
  const open = (el) => {
    if (el.dataset.area) {
      openRoom(null, el.dataset.area);
      return;
    }
    openRoom(el.dataset.room, planMapping().get(el.dataset.room));
  };
  view.addEventListener('click', (e) => {
    const power = e.target.closest('[data-energy]');
    if (power && (currentView === 'home' || currentView === 'solar')) {
      openDetail(power.dataset.energy);
      return;
    }
    if (currentView === 'home') {
      const calView = e.target.closest('[data-cal-view]');
      if (calView) {
        store.prefs.calView = calView.dataset.calView;
        writePrefs();
        day.monthOffset = 0;
        loadCalendar();
        VIEWS.home();
        return;
      }
      const month = e.target.closest('[data-cal-month]');
      if (month) {
        const n = Number(month.dataset.calMonth);
        day.monthOffset = n ? day.monthOffset + n : 0;
        loadCalendar();
        VIEWS.home();
        return;
      }
      const calDay = e.target.closest('[data-cal-day]');
      if (calDay) {
        openCalDay(calDay.dataset.calDay);
        return;
      }
      const dismiss = e.target.closest('[data-note-dismiss]');
      if (dismiss) {
        dismissNote(dismiss.dataset.noteDismiss);
        return;
      }
      if (e.target.closest('[data-brief-refresh]')) {
        updateBrief(true);
        return;
      }
      const w = e.target.closest('[data-weather]');
      if (w) {
        openDetail(w.dataset.weather);
        return;
      }
    }
    const person = e.target.closest('[data-person]');
    if (person && currentView === 'home') {
      openPerson(person.dataset.person);
      return;
    }
    const floorTab = e.target.closest('[data-plan-floor]');
    if (floorTab && currentView === 'home') {
      store.prefs.planFloor = floorTab.dataset.planFloor;
      writePrefs();
      VIEWS.home();
      return;
    }
    const el = e.target.closest('.plan-room[data-room], [data-area]');
    if (el && currentView === 'home') open(el);
  });
  view.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      const power = e.target.closest?.('g[data-energy]');
      if (power) {
        e.preventDefault();
        openDetail(power.dataset.energy);
        return;
      }
    }
    const el = e.target.closest?.('.plan-room[data-room]');
    if (!el || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault();
    open(el);
  });
  portrait.addEventListener('change', () => { if (currentView === 'home') VIEWS.home(); });
}

// ---------- notifications ----------

const NOTES_DATA_KEY = 'ha-dash.notify-log';
const NOTES_LOCAL_KEY = 'ha-dash.notify-log';
const notes = {
  persistent: [],   // Home Assistant's notification list, as it is now
  sent: (() => { try { return JSON.parse(localStorage.getItem(NOTES_LOCAL_KEY)) || []; } catch { return []; } })(),
  canSeeSent: true, // notify.* calls can only be watched by administrators
};

const NOTES_SEEN_KEY = 'ha-dash.notes-seen';
const ding = new Ding();
// The same sizes the "Tablet on the wall" layout uses (an iPad either way round).
const tabletScreen = matchMedia('(min-width: 700px) and (max-width: 1099.98px) and (min-height: 600px)');
const bell = {
  seenAt: (() => { try { return Number(localStorage.getItem(NOTES_SEEN_KEY)) || 0; } catch { return 0; } })(),
  button: null,
  pop: null,
  popHtml: '',
};

/** Notifications behind a bell in the top bar instead of a section on Home (tablets and wall panels). */
function bellMode() {
  if (!store.prefs.notifications) return false;
  if (store.prefs.notifyBell === 'bell') return true;
  if (store.prefs.notifyBell === 'section') return false;
  return tabletScreen.matches || !!wall?.enabled;
}

function unseenNotes() {
  return noteItems(notes).filter((n) => Date.parse(n.at) > bell.seenAt).length;
}

function setupBell() {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'icon-btn bell-btn';
  b.id = 'bell';
  b.hidden = true;
  b.setAttribute('aria-haspopup', 'dialog');
  b.setAttribute('aria-expanded', 'false');
  b.addEventListener('click', () => (bell.pop.hidden ? openBell() : closeBell()));
  const actions = $('.topbar-actions');
  actions.insertBefore(b, actions.querySelector('.voice-btn') || actions.querySelector('.status'));
  bell.button = b;

  const pop = document.createElement('div');
  pop.className = 'notes-pop';
  pop.id = 'notes-pop';
  pop.hidden = true;
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-label', 'Notifications');
  document.body.append(pop);
  bell.pop = pop;
  pop.addEventListener('click', (e) => {
    const dismiss = e.target.closest('[data-note-dismiss]');
    if (dismiss) {
      dismissNote(dismiss.dataset.noteDismiss);
      return;
    }
    if (e.target.closest('[data-bell-close]')) closeBell();
  });
  // A tap anywhere else closes it.
  document.addEventListener('pointerdown', (e) => {
    if (!pop.hidden && !pop.contains(e.target) && !b.contains(e.target)) closeBell();
  }, true);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !pop.hidden) closeBell(); });
  const changed = () => {
    if (!bellMode()) closeBell();
    renderBell();
    if (currentView === 'home') VIEWS.home();
  };
  tabletScreen.addEventListener('change', changed);
  renderBell();
}

function renderBell() {
  const b = bell.button;
  if (!b) return;
  const on = bellMode();
  b.hidden = !on;
  if (!on) return;
  const unseen = unseenNotes();
  const label = unseen ? `Notifications, ${unseen} new` : 'Notifications';
  const html = `${icon('bell')}${unseen ? `<span class="bell-badge">${unseen > 9 ? '9+' : unseen}</span>` : ''}`;
  if (b.dataset.html !== html) {
    b.innerHTML = html;
    b.dataset.html = html;
  }
  b.setAttribute('aria-label', label);
  b.classList.toggle('has-new', !!unseen);
  if (!bell.pop.hidden) renderBellPop();
}

function renderBellPop() {
  const soundHint = store.prefs.notifySound && ding.supported && !ding.ready;
  const html = `<div class="notes-pop-head">
      <h2>Notifications</h2>
      <button type="button" class="icon-btn" data-bell-close aria-label="Close">${icon('close')}</button>
    </div>
    ${notesListHtml({ persistent: notes.persistent, sent: notes.sent, canSeeSent: notes.canSeeSent, limit: NOTE_POP_LIMIT })}
    ${soundHint ? '<p class="muted notes-pop-hint">Sound is switched on by your first tap on the screen.</p>' : ''}`;
  if (html === bell.popHtml) return;
  bell.popHtml = html;
  bell.pop.innerHTML = html;
}
const NOTE_POP_LIMIT = 25;

function openBell() {
  bell.popHtml = '';
  bell.pop.hidden = false;
  bell.button.setAttribute('aria-expanded', 'true');
  renderBellPop();
  markNotesSeen();
}

function closeBell() {
  if (!bell.pop || bell.pop.hidden) return;
  bell.pop.hidden = true;
  bell.button.setAttribute('aria-expanded', 'false');
  markNotesSeen();
}

function markNotesSeen() {
  const newest = Math.max(Date.now(), ...noteItems(notes).map((n) => Date.parse(n.at) || 0));
  bell.seenAt = newest;
  try { localStorage.setItem(NOTES_SEEN_KEY, String(newest)); } catch { /* ignore */ }
  renderBell();
}

function dismissNote(id) {
  notes.persistent = notes.persistent.filter((n) => n.id !== id);
  if (currentView === 'home') VIEWS.home();
  renderBell();
  call('persistent_notification', 'dismiss', { notification_id: id });
}

/** A notification has just arrived (not one already there when the dashboard connected). */
function noteArrived() {
  if (!bellMode()) return;
  if (!bell.pop.hidden) {
    markNotesSeen();
    return;
  }
  bell.button.classList.remove('ring');
  void bell.button.offsetWidth; // restart the wiggle
  bell.button.classList.add('ring');
  if (store.prefs.notifySound) ding.play();
}

function saveNotesLocal() {
  try { localStorage.setItem(NOTES_LOCAL_KEY, JSON.stringify(notes.sent)); } catch { /* ignore */ }
}

/** Follow Home Assistant's notification list, and notify.* actions as automations send them. */
async function subscribeNotes(client) {
  const byId = new Map();
  client.subscribe({ type: 'persistent_notification/subscribe' }, (ev) => {
    if (ev.type === 'current') byId.clear();
    let arrived = false;
    for (const [id, n] of Object.entries(ev.notifications || {})) {
      if (ev.type === 'removed') byId.delete(id);
      else {
        if (ev.type === 'added' && !byId.has(id)) arrived = true;
        byId.set(id, { id, title: noteText(n.title), message: noteText(n.message), at: n.created_at });
      }
    }
    notes.persistent = [...byId.values()];
    queueRefresh();
    if (arrived) noteArrived();
  }).catch(() => {});

  // Sent notifications are not stored by Home Assistant, so they are kept in the user's profile,
  // where every screen that saw one adds it (the wall tablet is usually on to see them all).
  const shared = await client.send({ type: 'frontend/get_user_data', key: NOTES_DATA_KEY }).catch(() => null);
  if (client !== store.client) return;
  notes.sent = noteMerge(notes.sent, Array.isArray(shared?.value) ? shared.value : []);
  saveNotesLocal();
  queueRefresh();
  try {
    await client.subscribeEvents('call_service', async (event) => {
      const note = noteFromCall(event);
      if (!note) return;
      const fresh = !notes.sent.some((n) => n.id === note.id);
      notes.sent = noteMerge(notes.sent, [note]);
      if (fresh) noteArrived();
      saveNotesLocal();
      queueRefresh();
      const latest = await client.send({ type: 'frontend/get_user_data', key: NOTES_DATA_KEY }).catch(() => null);
      notes.sent = noteMerge(notes.sent, Array.isArray(latest?.value) ? latest.value : []);
      client.send({ type: 'frontend/set_user_data', key: NOTES_DATA_KEY, value: notes.sent }).catch(() => {});
    });
    notes.canSeeSent = true;
  } catch {
    notes.canSeeSent = false; // not an administrator
    queueRefresh();
  }
}

/** Events from HA: the calendar.get_events action, or the REST API on older versions. */
async function fetchEvents(ids, start, end) {
  const client = store.client;
  try {
    const res = await client.send({
      type: 'call_service', domain: 'calendar', service: 'get_events',
      service_data: { start_date_time: start.toISOString(), end_date_time: end.toISOString() },
      target: { entity_id: ids }, return_response: true,
    });
    const r = res?.response || {};
    return ids.flatMap((id) => (r[id]?.events || []).map((e) => calParse(e, id)));
  } catch (err) {
    const token = await client.getToken?.().catch(() => null);
    if (!token) throw err;
    const lists = await Promise.all(ids.map(async (id) => {
      const q = new URLSearchParams({ start: start.toISOString(), end: end.toISOString() });
      const r = await fetch(`${client.url}/api/calendars/${id}?${q}`, { headers: { Authorization: `Bearer ${token}` } });
      if (!r.ok) throw new Error(`calendar ${r.status}`);
      return (await r.json()).map((e) => calParse(e, id));
    }));
    return lists.flat();
  }
}

async function loadRange(slot, start, end, force) {
  const ids = shownCalendars().map((s) => s.entity_id);
  const key = `${ids.join()}|${+start}|${+end}`;
  const fresh = slot.key === key && Date.now() - (slot.at || 0) < 10 * 60_000;
  if (!ids.length || slot.loading || (fresh && !force)) {
    if (!ids.length && slot.events.length) { slot.events = []; slot.key = key; queueRefresh(); }
    return;
  }
  if (slot.key !== key) { // another range: show the spinner, not the old range's events
    slot.key = '';
    slot.events = [];
    slot.error = '';
  }
  slot.loading = true;
  try {
    slot.events = await fetchEvents(ids, start, end);
    slot.error = '';
  } catch (err) {
    slot.error = err?.message || 'Could not load the calendar';
  }
  slot.key = key;
  slot.at = Date.now();
  slot.loading = false;
  queueRefresh();
}

function monthShown() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth() + day.monthOffset, 1);
}

function loadCalendar(force = false) {
  if (!store.client || !store.prefs.calendar) return;
  const today = calStartOfDay(new Date());
  loadRange(day.cal, today, calAddDays(today, 14), force);
  if (store.prefs.calView === 'month') {
    const start = calGridStart(monthShown());
    loadRange(day.month, start, calAddDays(start, 42), force);
  }
}

// A calendar entity's state flips when an event starts or ends, or when events change; fetch again soon after.

async function askAgent(agent, prompt) {
  const client = store.client;
  if (agent.kind === 'ai_task') {
    const res = await client.send({
      type: 'call_service', domain: 'ai_task', service: 'generate_data',
      service_data: { task_name: 'Day ahead summary', instructions: prompt, entity_id: agent.id },
      return_response: true,
    });
    const data = res?.response?.data;
    return typeof data === 'string' ? data : JSON.stringify(data);
  }
  const res = await client.send({ type: 'conversation/process', text: prompt, agent_id: agent.id, language: navigator.language });
  const speech = res?.response?.speech?.plain?.speech;
  if (res?.response?.response_type === 'error' || !speech) throw new Error(speech || 'The agent did not answer');
  return speech;
}

function saveBrief(b, share) {
  day.brief = b;
  try { localStorage.setItem(BRIEF_LOCAL_KEY, JSON.stringify(b)); } catch { /* ignore */ }
  if (share) store.client?.send({ type: 'frontend/set_user_data', key: BRIEF_DATA_KEY, value: b }).catch(() => {});
  queueRefresh();
}

/** Write a new summary when the day's facts change (or on request). Shared through the HA profile. */
async function updateBrief(force = false) {
  if (!store.prefs.brief || !store.client || day.briefBusy) return;
  // Wait for the calendar, so the first summary is not written without it.
  if (shownCalendars().length && store.prefs.calendar && !day.cal.key) return;
  const facts = briefInputs();
  const agent = briefAgent();
  const by = agent ? agent.id : 'local';
  const have = day.brief;
  if (!force && have && have.key === facts.key && have.by === by) return;
  if (!agent) {
    saveBrief({ key: facts.key, by, text: briefLocal(facts), at: Date.now(), ai: false }, false);
    return;
  }
  if (!force && day.briefTried === facts.key + by) return;
  day.briefTried = facts.key + by;
  day.briefBusy = true;
  queueRefresh();
  try {
    // Another screen may have written this one already.
    if (!force) {
      const shared = (await store.client.send({ type: 'frontend/get_user_data', key: BRIEF_DATA_KEY }).catch(() => null))?.value;
      if (shared?.key === facts.key && shared.by === by && shared.text) {
        day.briefError = '';
        saveBrief(shared, false);
        return;
      }
    }
    const text = (await askAgent(agent, briefPrompt(facts))).trim().replace(/^["“]|["”]$/g, '');
    day.briefError = '';
    saveBrief({ key: facts.key, by, agent: agent.name, text, at: Date.now(), ai: true }, true);
  } catch (err) {
    day.briefError = err?.message || String(err);
    saveBrief({ key: facts.key, by: 'local', text: briefLocal(facts), at: Date.now(), ai: false }, false);
  } finally {
    day.briefBusy = false;
    queueRefresh();
  }
}

function briefHtml() {
  if (!store.prefs.brief) return '';
  const b = day.brief;
  const today = calDayKey(new Date());
  const current = b && calDayKey(new Date(b.at)) === today ? b : null;
  const agent = briefAgent();
  const when = current ? new Date(current.at).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) : '';
  const source = current?.ai ? `Written by ${esc(current.agent || 'AI')} at ${when}`
    : day.briefError ? `AI summary failed (${esc(day.briefError)}), showing a plain one`
      : agent ? 'Writing your summary…' : 'Plain summary. <a href="#/settings?section=brief">Turn on AI</a>';
  return `<section class="brief${day.briefBusy ? ' busy' : ''}" aria-live="polite">
    <span class="brief-icon">${icon('sparkle')}</span>
    <div class="brief-body">
      <h2 class="brief-title">Your ${dayPart() === 'evening' || dayPart() === 'night' ? 'evening and tomorrow' : 'day ahead'}</h2>

}

function energySigns() {

    grid: ENERGY_SIGN[p.energyGrid] || p.energyLearned.grid || 1,

// The sensors in use and their readings now; null when there are none (or Solar is turned off).
function energyNow() {
  if (!store.prefs.energy) return null;
  const ids = energyEntities(store.states, store.prefs.energyPicks);
  if (!ids.solar && !ids.battery && !ids.grid) return null;
  // Work out which way the grid and battery numbers point, from readings that add up.
  const raw = energyFlow(store.states, ids, { grid: 1, battery: 1 }).raw;
  const learned = energyLearnSigns(raw);
  if (learned && Object.entries(learned).some(([k, v]) => store.prefs.energyLearned[k] !== v)) {
    store.prefs.energyLearned = { ...store.prefs.energyLearned, ...learned };
    writePrefs();
  }
  return { ids, flow: energyFlow(store.states, ids, energySigns()) };
}

// The last 24 hours of each sensor, fetched again every 5 minutes while Solar is open.
const energyHist = { key: '', at: 0, end: 0, data: null, loading: false, error: '' };

function loadEnergyHistory(ids) {
  if (!store.client || store.status !== 'connected') return;
  const roles = ['solar', 'grid', 'battery', 'home', 'soc'].filter((r) => ids[r]);
  const key = roles.map((r) => ids[r]).join(',');
  if (energyHist.loading || (energyHist.key === key && Date.now() - energyHist.at < ENERGY_SLOT)) return;
  energyHist.loading = true;
  const end = Math.ceil(Date.now() / ENERGY_SLOT) * ENERGY_SLOT;
  Promise.all(roles.map((r) => store.client.history(ids[r]))).then(
    (lists) => {
      energyHist.data = Object.fromEntries(roles.map((r, i) => [r, lists[i]]));
      energyHist.error = '';
    },
    (err) => {
      energyHist.error = err.message;
      if (energyHist.key !== key) energyHist.data = null;
    },
  ).finally(() => {
    Object.assign(energyHist, { key, end, at: Date.now(), loading: false });
    if (currentView === 'solar') VIEWS.solar();
  });
}

function phoneOf(p) {
  const trackerId = p.source;
  const tracker = trackerId ? store.states.get(trackerId) : null;
  if (!tracker) return null;
  const deviceId = store.entityInfo.get(trackerId)?.deviceId;
  const prefix = `sensor.${trackerId.split('.')[1]}_`;
  const sensors = [...store.states.values()].filter((s) => domainOf(s.entity_id) === 'sensor'
    && ((deviceId && store.entityInfo.get(s.entity_id)?.deviceId === deviceId) || s.entity_id.startsWith(prefix)));
  const battery = sensors.find((s) => s.attributes?.device_class === 'battery' && s.attributes?.unit_of_measurement === '%' && !isUnavailable(s));
  const batteryState = sensors.find((s) => /_battery_state$/.test(s.entity_id));
  const address = sensors.find((s) => /_geocoded_location$/.test(s.entity_id) && !isUnavailable(s));
  const level = battery ? Number(battery.state) : Number(tracker.attributes?.battery_level);
  return {
    name: nameOf(tracker),
    updated: tracker.last_updated,
    battery: Number.isFinite(level) ? Math.round(level) : null,
    charging: /^(charging|full)$/i.test(batteryState?.state || ''),
    address: address?.state || '',
  };
}

function openPerson(id) {
  ui.room = null;
  ui.person = id;
  ui.personHtml = '';
  renderPersonSheet();
}

function renderPersonSheet() {
  const dialog = $('#detail');
  const p = ui.person && peopleOf(store.states).find((x) => x.id === ui.person);
  if (!p) {
    if (dialog.dataset.person) dialog.close();
    return;
  }
  const phone = phoneOf(p);
  const home = homeZone();
  const facts = [
    ['Address', phone?.address],
    ['From home', p.located && home && p.state !== 'home' ? formatDistance(distanceKm(home, p), lengthUnit()) : ''],
    ['Accuracy', p.located && p.acc ? `Within ${lengthUnit() === 'mi' ? `${Math.round(p.acc * 3.281)} ft` : `${Math.round(p.acc)} m`}` : ''],
    ['Location sent', phone ? relativeTime(phone.updated) : ''],
    ['Battery', phone?.battery != null ? `${phone.battery}%${phone.charging ? ', charging' : ''}` : ''],
    ['Phone', phone?.name],
  ].filter(([, v]) => v);
  const html = `
    <div class="sheet-head">
      ${avatarHtml(p, store.client?.url || '', 'pavatar big')}
      <div>
        <h2 id="detail-title">${esc(p.name)}</h2>
        <p class="muted">${esc(placeLabel(p))} · ${p.state === 'not_home' ? 'left' : 'arrived'} ${esc(relativeTime(p.changed))}</p>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Close">${icon('close')}</button>
    </div>
    <div class="sheet-body">
      ${facts.length ? `<dl class="facts">${facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>` : ''}
      ${p.located ? `<div class="form-actions person-actions">
        <button type="button" class="btn" data-person-map>${icon('mapMarker')}Show on map</button>
        <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}" target="_blank" rel="noopener">${icon('directions')}Open in Maps</a>
      </div>` : `<p class="muted">${esc(p.name)}'s phone is not sharing a location. In the Home Assistant app on that phone, allow location all the time and turn on background location.</p>`}
    </div>`;
  if (dialog.open && dialog.dataset.person === p.id && html === ui.personHtml) return;
  stopCamera();
  delete dialog.dataset.entity;
  delete dialog.dataset.room;
  ui.history = null;
  dialog.dataset.person = p.id;
  ui.personHtml = html;
  dialog.innerHTML = html;
  if ($('#toast')?.parentNode === dialog) dialog.append($('#toast'));
  if (!dialog.open) dialog.showModal();
}

// ---------- cameras ----------

const camThumbs = new Map(); // entity_id -> { src, loading }: the latest picture each camera sent
let camPlayer = null;        // the live video open in the sheet

function refreshThumb(entityId) {
  const s = store.states.get(entityId);
  const entry = camThumbs.get(entityId) || {};
  camThumbs.set(entityId, entry);
  if (entry.loading || !s || isUnavailable(s) || !store.client) return;
  const url = cameraStillUrl(store.client.url, s, 640);
  if (!url) return;
  entry.loading = true;
  // Load off screen and swap once it is ready, so the picture never blanks.
  const img = new Image();
  img.onload = () => { entry.loading = false; entry.src = url; entry.at = Date.now(); showThumb(entityId); };
  img.onerror = () => { entry.loading = false; };
  img.src = url;
}

function showThumb(entityId, root = document) {
  const src = camThumbs.get(entityId)?.src;
  for (const img of root.querySelectorAll(`img[data-cam="${CSS.escape(entityId)}"]`)) {
    if (src && img.getAttribute('src') !== src) img.src = src;
    img.closest('.cam-frame, .cam-stage')?.classList.toggle('has-pic', !!src);
  }
}

/** Fill in the camera pictures under `root` after it was drawn. */
function paintCameras(root) {
  const ids = new Set([...root.querySelectorAll('img[data-cam]')].map((i) => i.dataset.cam));
  for (const id of ids) {
    showThumb(id, root);
    // Picture addresses stop working once Home Assistant rotates the camera's token.
    if (!(Date.now() - (camThumbs.get(id)?.at || 0) < 120_000)) refreshThumb(id);
  }
}

// New pictures every 10 seconds, as Home Assistant's own cards do, for the cameras on screen.
setInterval(() => {
  if (document.hidden || wall?.idle) return;
  const dialog = $('#detail');
  const ids = new Set();
  for (const img of document.querySelectorAll('img[data-cam]')) {
    if (dialog.open && !dialog.contains(img)) continue; // behind the sheet
    const r = img.getBoundingClientRect();
    if (r.bottom < 0 || r.top > innerHeight || (!r.width && !img.closest('.cam-stage'))) continue;
    ids.add(img.dataset.cam);
  }
  ids.delete(camPlayer?.entityId); // already live
  for (const id of ids) refreshThumb(id);
}, 10_000);

function cameraIds() {
  return [...store.states.values()]
    .filter((s) => domainOf(s.entity_id) === 'camera' && isListed(s.entity_id))
    .sort((a, b) => nameOf(a).localeCompare(nameOf(b)))
    .map((s) => s.entity_id);
}

function cameraSub(s) {
  const area = areaOf(s.entity_id);
  return [area ? store.areas.get(area) || area : '', formatState(s)].filter(Boolean).join(' · ');
}

/** The camera sheet: live video over the latest picture, and the other cameras to switch to. */
function openCamera(entityId) {
  const s = store.states.get(entityId);
  if (!s) return;
  const dialog = $('#detail');
  if (dialog.open && dialog.dataset.entity === entityId && camPlayer?.entityId === entityId) {
    $('.cam-sub', dialog).textContent = cameraSub(s); // a state update; leave the video alone
    return;
  }
  stopCamera();
  ui.history = null;
  dialog.dataset.entity = entityId;
  dialog.classList.add('cam-sheet');
  const others = cameraIds().filter((id) => id !== entityId);
  dialog.innerHTML = `
    <div class="sheet-head${ui.room ? ' has-back' : ''}">
      ${ui.room ? `<button type="button" class="icon-btn" data-back aria-label="Back to the room">${icon('back')}</button>` : ''}
      <span class="tile-icon">${icon('camera')}</span>
      <div>
        <h2 id="detail-title">${esc(nameOf(s))}</h2>
        <p class="muted cam-sub">${esc(cameraSub(s))}</p>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Close">${icon('close')}</button>
    </div>
    <div class="cam-stage" data-phase="connecting">
      <img class="cam-poster" data-cam="${esc(entityId)}" alt="">
      <div class="cam-status" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <span class="cam-status-text">Connecting…</span>
        <button type="button" class="btn" data-cam-act="retry">${icon('update')}Try again</button>
      </div>
      <div class="cam-bar">
        <span class="cam-live"><i></i>Live</span>
        <span class="cam-kind"></span>
        <button type="button" class="icon-btn cam-btn" data-cam-act="sound" hidden aria-label="Turn sound on">${icon('volumeOff')}</button>
        <button type="button" class="icon-btn cam-btn" data-cam-act="full" aria-label="Full screen">${icon('fullscreen')}</button>
      </div>
    </div>
    ${others.length ? `<div class="cam-strip" role="group" aria-label="Other cameras">
      ${others.map((id) => {
        const o = store.states.get(id);
        return `<button type="button" class="cam-pick" data-cam-pick="${esc(id)}">
          <span class="cam-frame"><img data-cam="${esc(id)}" alt="" decoding="async"><span class="cam-none">${icon('camera')}</span></span>
          <span class="cam-pick-name">${esc(nameOf(o))}</span>
        </button>`;
      }).join('')}
    </div>` : ''}`;
  if ($('#toast')?.parentNode === dialog) dialog.append($('#toast'));
  if (!dialog.open) dialog.showModal();
  dialog.scrollTop = 0;
  paintCameras(dialog);
  refreshThumb(entityId); // a fresh picture to look at while the video connects

  camPlayer = new CameraPlayer({
    client: store.client,
    entityId,
    getState: () => store.states.get(entityId),
    stage: $('.cam-stage', dialog),
    onState: cameraState,
  });
  if (!store.client || store.status !== 'connected') cameraState({ phase: 'failed', message: 'Not connected to Home Assistant.' });
  else if (isUnavailable(s)) cameraState({ phase: 'failed', message: `${nameOf(s)} is unavailable in Home Assistant.` });
  else camPlayer.start();
}

function cameraState({ phase, kind, message }) {
  const stage = $('#detail .cam-stage');
  if (!stage) return;
  stage.dataset.phase = phase;
  $('.cam-status-text', stage).textContent = phase === 'connecting'
    ? `Connecting${kind ? ` (${streamLabel(kind)})` : ''}…`
    : phase === 'failed' ? `No live video. ${message || ''}`.trim() : '';
  $('.cam-kind', stage).textContent = phase === 'playing' ? streamLabel(kind) : '';
  const sound = $('[data-cam-act="sound"]', stage);
  sound.hidden = !(phase === 'playing' && camPlayer?.hasAudio);
  paintSoundButton();
}

function paintSoundButton() {
  const b = $('#detail [data-cam-act="sound"]');
  if (!b || !camPlayer) return;
  b.innerHTML = icon(camPlayer.muted ? 'volumeOff' : 'volumeHigh');
  b.setAttribute('aria-label', camPlayer.muted ? 'Turn sound on' : 'Turn sound off');
}

function cameraAction(act) {
  if (!camPlayer) return;
  const stage = $('#detail .cam-stage');
  if (act === 'retry') camPlayer.start();
  if (act === 'sound') {
    camPlayer.setMuted(!camPlayer.muted);
    paintSoundButton();
  }
  if (act === 'full') {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (stage.requestFullscreen || stage.webkitRequestFullscreen) {
      (stage.requestFullscreen || stage.webkitRequestFullscreen).call(stage)?.catch?.(() => {});
    } else {
      camPlayer.video?.webkitEnterFullscreen?.(); // iPhone: only the video itself can go full screen
    }
  }
}

function stopCamera() {
  if (!camPlayer) return;
  camPlayer.stop();
  camPlayer = null;
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  if (fs?.classList.contains('cam-stage')) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  $('#detail').classList.remove('cam-sheet');
}

// Hang up while the app is in the background; call again on return.
document.addEventListener('visibilitychange', () => {
  if (!camPlayer) return;
  if (document.hidden) camPlayer.stop();
  else camPlayer.start();
});

// ---------- entity list ----------

/** The state to draw: HA's, or the one we expect after a tap HA has not confirmed yet. */
function shown(s) {
  const o = ui.optimistic.get(s.entity_id);
  return o ? { ...s, state: o.state } : s;
}

function renderTile(s) {
  const id = s.entity_id;
  return tileHtml(shown(s), {
    pending: ui.optimistic.has(id),
    ran: ui.ran.has(id),
    targets: ui.targets.get(id)?.values,
  });
}

function renderEntityList() {
  const list = $('#entity-list');
  if (!list) return;
  const { params } = parseRoute();
  const domain = params.get('domain');
  const area = params.get('area');
  const onlyState = params.get('state');
  const q = (store.search || '').trim().toLowerCase();

  const items = [...store.states.values()].filter((s) => {
    if (!isListed(s.entity_id)) return false;
    if (domain && domainOf(s.entity_id) !== domain) return false;
    if (area && areaOf(s.entity_id) !== area) return false;
    if (onlyState && !isUnavailable(s)) return false;
    if (q && !nameOf(s).toLowerCase().includes(q) && !s.entity_id.includes(q)) return false;
    return true;
  });

  if (!items.length) {
    list.innerHTML = `<p class="muted empty-list">Nothing matches${q ? ` “${esc(q)}”` : ''}.</p>`;
    return;
  }

  // Group by room when rooms are known, otherwise (or on request) by type.
  const byArea = store.prefs.groupBy === 'area' && store.areas.size > 0;
  const groups = new Map();
  for (const s of items) {
    const key = byArea ? areaOf(s.entity_id) || '' : domainOf(s.entity_id);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  }
  const label = (key) => (byArea ? (key ? store.areas.get(key) || key : 'No room') : domainLabel(key));
  const keys = [...groups.keys()].sort((a, b) => {
    if (byArea) {
      if (!a) return 1;
      if (!b) return -1;
      return label(a).localeCompare(label(b));
    }
    return compareDomains(a, b);
  });

  list.innerHTML = keys.map((key) => {
    const entities = groups.get(key).sort((a, b) =>
      compareDomains(domainOf(a.entity_id), domainOf(b.entity_id)) || nameOf(a).localeCompare(nameOf(b)));
    return `<section class="group">
      <h2 class="section-title">${esc(label(key))} <span class="muted">${entities.length}</span>${byArea && !key
        ? ' <a class="section-link" href="#/settings?section=rooms">Put in rooms</a>' : ''}</h2>
      <div class="grid">${entities.map(renderTile).join('')}</div>
    </section>`;
  }).join('');
  paintCameras(list);
}

// Update an entity's tiles in place instead of redrawing the whole view.
function updateTile(entityId) {
  const s = store.states.get(entityId);
  const els = document.querySelectorAll(`:is(#view, #detail) .tile[data-entity="${CSS.escape(entityId)}"]`);
  if (!els.length || !s) return false;
  for (const el of els) el.outerHTML = renderTile(s);
  if (domainOf(entityId) === 'camera') showThumb(entityId);
  return true;
}

function refreshEntity(entityId) {
  updateTile(entityId);
  if ($('#detail').dataset.entity === entityId) openDetail(entityId);
}

// ---------- actions ----------

function toast(message) {
  // Inside the sheet when it is open, since a modal dialog covers everything else.
  const dialog = $('#detail');
  const host = dialog.open ? dialog : document.body;
  let el = $('#toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('role', 'status');
  }
  if (el.parentNode !== host) host.append(el);
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => el.classList.remove('show'), 4000);
}

async function call(domain, service, data, entityId) {
  const client = store.client;
  if (!client || store.status !== 'connected') {
    toast('Not connected to Home Assistant');
    return false;
  }
  try {
    await client.callService(domain, service, data, { entity_id: entityId });
    return true;
  } catch (err) {
    const s = !Array.isArray(entityId) && store.states.get(entityId);
    toast(`${s ? nameOf(s) : Array.isArray(entityId) ? domainLabel(domain) : entityId}: ${err.message}`);
    return false;
  }
}

function setOptimistic(entityId, state) {
  clearTimeout(ui.optimistic.get(entityId)?.timer);
  // If HA never reports the change, fall back to the real state.
  const timer = setTimeout(() => clearOptimistic(entityId), 10_000);
  ui.optimistic.set(entityId, { state, timer });
  refreshEntity(entityId);
}

function clearOptimistic(entityId, refresh = true) {
  const o = ui.optimistic.get(entityId);
  if (!o) return;
  clearTimeout(o.timer);
  ui.optimistic.delete(entityId);
  if (refresh) refreshEntity(entityId);
}

async function toggle(entityId) {
  const s = store.states.get(entityId);
  const action = s && primaryAction(shown(s));
  if (!action || action.kind !== 'toggle') return;
  setOptimistic(entityId, action.service === 'turn_on' ? 'on' : 'off');
  navigator.vibrate?.(8);
  if (!(await call(action.domain, action.service, {}, entityId))) clearOptimistic(entityId);
}

async function run(entityId) {
  const s = store.states.get(entityId);
  const action = s && primaryAction(s);
  if (!action || action.kind !== 'run') return;
  clearTimeout(ui.ran.get(entityId));
  ui.ran.set(entityId, setTimeout(() => { ui.ran.delete(entityId); refreshEntity(entityId); }, 1500));
  refreshEntity(entityId);
  navigator.vibrate?.(8);
  if (!(await call(action.domain, action.service, {}, entityId))) {
    clearTimeout(ui.ran.get(entityId));
    ui.ran.delete(entityId);
    refreshEntity(entityId);
  }
}

// Thermostat +/-: show the new setpoint at once, send it after taps settle.
function stepTemp(entityId, dir, which = 'single') {
  const s = store.states.get(entityId);
  if (!s) return;
  const a = s.attributes || {};
  const step = tempStep(s, store.config.unit_system?.temperature);
  const entry = ui.targets.get(entityId) || { values: {} };
  const cur = { ...climateTargets(s), ...entry.values };
  if (cur[which] == null) return;
  let v = Math.round((cur[which] + dir * step) / step) * step;
  v = Math.min(a.max_temp ?? Infinity, Math.max(a.min_temp ?? -Infinity, Number(v.toFixed(2))));
  if (which === 'low' && cur.high != null) v = Math.min(v, cur.high);
  if (which === 'high' && cur.low != null) v = Math.max(v, cur.low);
  entry.values = { ...entry.values, [which]: v };
  entry.sent = false;
  clearTimeout(entry.sendTimer);
  clearTimeout(entry.clearTimer);
  entry.sendTimer = setTimeout(() => sendTargets(entityId), 900);
  ui.targets.set(entityId, entry);
  refreshEntity(entityId);
}

async function sendTargets(entityId) {
  const entry = ui.targets.get(entityId);
  const s = store.states.get(entityId);
  if (!entry || !s) return;
  const t = { ...climateTargets(s), ...entry.values };
  const data = entry.values.single != null
    ? { temperature: t.single }
    : { target_temp_low: t.low, target_temp_high: t.high };
  entry.sent = true;
  const ok = await call('climate', 'set_temperature', data, entityId);
  if (ui.targets.get(entityId) !== entry || !entry.sent) return; // changed again meanwhile
  const clear = () => {
    if (ui.targets.get(entityId) === entry) ui.targets.delete(entityId);
    refreshEntity(entityId);
  };
  if (!ok) clear();
  else entry.clearTimer = setTimeout(clear, 6000);
}

// Drop an unconfirmed setpoint once HA reports it.
function settleTargets(entityId, newState) {
  const entry = ui.targets.get(entityId);
  if (!entry?.sent || !newState) return;
  const t = climateTargets(newState);
  if (Object.entries(entry.values).every(([k, v]) => t[k] === v)) {
    clearTimeout(entry.clearTimer);
    ui.targets.delete(entityId);
  }
}

const MODE_SERVICES = {
  hvac: ['set_hvac_mode', 'hvac_mode'],
  preset: ['set_preset_mode', 'preset_mode'],
  fan_mode: ['set_fan_mode', 'fan_mode'],
};

function handleAct(act, entityId, el) {
  switch (act) {
    case 'open': openDetail(entityId); break;
    case 'toggle': toggle(entityId); break;
    case 'run': run(entityId); break;
    case 'temp': stepTemp(entityId, Number(el.dataset.dir), el.dataset.which || 'single'); break;
    case 'hvac':
    case 'preset':
    case 'fan_mode': {
      const [service, key] = MODE_SERVICES[act];
      for (const b of el.parentNode.querySelectorAll('[data-act]')) b.setAttribute('aria-pressed', b === el);
      call('climate', service, { [key]: el.dataset.value }, entityId);
      break;
    }
    case 'color':
      call('light', 'turn_on', { hs_color: [Number(el.dataset.h), Number(el.dataset.s)] }, entityId);
      break;
  }
}

const SLIDERS = {
  brightness: (v) => ['light', 'turn_on', { brightness_pct: v }],
  color_temp: (v) => ['light', 'turn_on', { color_temp_kelvin: v }],
  fan_speed: (v) => ['fan', 'set_percentage', { percentage: v }],
};

function sliderText(ctl, v) {
  return ctl === 'color_temp' ? `${v} K` : `${v}%`;
}

// ---------- detail sheet ----------

function loadHistory(entityId) {
  const s = store.states.get(entityId);
  const domain = domainOf(entityId);
  const numeric = domain === 'sensor' && s.state !== '' && Number.isFinite(Number(s.state));
  if (!store.client || !(numeric || domain === 'binary_sensor')) {
    ui.history = null;
    return;
  }
  ui.history = { entityId, points: [], loading: true };
  store.client.history(entityId).then(
    (points) => { if (ui.history?.entityId === entityId) ui.history = { entityId, points }; },
    (err) => { if (ui.history?.entityId === entityId) ui.history = { entityId, points: [], error: err.message }; },
  ).then(() => {
    if ($('#detail').dataset.entity === entityId) openDetail(entityId);
  });
}

// Something to find the same control again after the sheet is redrawn.
function controlKey(el) {
  if (!el?.dataset || !(el.dataset.act || el.dataset.ctl)) return null;
  return ['act', 'ctl', 'value', 'dir', 'which', 'h']
    .filter((k) => el.dataset[k] != null)
    .map((k) => `[data-${k}="${CSS.escape(el.dataset[k])}"]`).join('');
}

function openDetail(entityId) {
  const real = store.states.get(entityId);
  if (!real) return;
  if (domainOf(entityId) === 'camera') {
    openCamera(entityId);
    return;
  }
  stopCamera();
  const dialog = $('#detail');
  const same = dialog.open && dialog.dataset.entity === entityId;
  if (same && ui.dragging) {
    ui.deferredSheet = true;
    return;
  }
  if (!same) {
    ui.attrsOpen = false;
    loadHistory(entityId);
  }
  const s = shown(real);
  const focusKey = same && dialog.contains(document.activeElement) ? controlKey(document.activeElement) : null;
  const scroll = dialog.scrollTop;
  const controls = controlsHtml(s, {
    targets: ui.targets.get(entityId)?.values,
    history: ui.history?.entityId === entityId ? ui.history : null,
    pending: ui.optimistic.has(entityId),
  });
  const attrs = Object.entries(s.attributes || {})
    .filter(([k]) => k !== 'friendly_name')
    .map(([k, v]) => `<dt>${esc(k.replace(/_/g, ' '))}</dt><dd>${esc(typeof v === 'object' ? JSON.stringify(v) : v)}</dd>`)
    .join('');
  const area = areaOf(entityId);
  dialog.dataset.entity = entityId;
  dialog.innerHTML = `
    <div class="sheet-head${ui.room ? ' has-back' : ''}">
      ${ui.room ? `<button type="button" class="icon-btn" data-back aria-label="Back to the room">${icon('back')}</button>` : ''}
      <span class="tile-icon ${isActive(s) ? 'active' : ''}">${icon(iconFor(s))}</span>
      <div>
        <h2 id="detail-title">${esc(nameOf(s))}</h2>
        <p class="muted">${esc(entityId)}${area ? ` · ${esc(store.areas.get(area) || area)}` : ''}</p>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Close">${icon('close')}</button>
    </div>
    <div class="sheet-body">
      <p class="detail-state">${esc(formatState(s))}</p>
      <p class="muted">Changed ${esc(relativeTime(real.last_changed))}</p>
      ${controls ? `<div class="controls">${controls}</div>` : ''}
      ${attrs ? `<details class="attrs" ${ui.attrsOpen ? 'open' : ''}><summary>Attributes</summary><dl class="facts">${attrs}</dl></details>` : ''}
    </div>`;
  if ($('#toast')?.parentNode === dialog) dialog.append($('#toast'));
  if (!dialog.open) dialog.showModal();
  if (same) {
    dialog.scrollTop = scroll;
    if (focusKey) dialog.querySelector(focusKey)?.focus({ preventScroll: true });
  }
}

function wireDetail() {
  const dialog = $('#detail');
  dialog.addEventListener('click', (e) => {
    // Clicking the backdrop (the dialog element itself) or the close button closes it.
    if (e.target === dialog || e.target.closest('[data-close]')) {
      dialog.close();
      return;
    }
    if (e.target.closest('[data-back]')) {
      ui.roomHtml = '';
      renderRoomSheet();
      return;
    }
    const camAct = e.target.closest('[data-cam-act]');
    if (camAct) {
      cameraAction(camAct.dataset.camAct);
      return;
    }
    const camPick = e.target.closest('[data-cam-pick]');
    if (camPick) {
      openCamera(camPick.dataset.camPick);
      return;
    }
    if (e.target.closest('[data-person-map]')) {
      const id = ui.person;
      dialog.close();
      peopleMap.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      peopleMap.focus(id);
      return;
    }
    const roomAct = e.target.closest('[data-room-act]');
    if (roomAct) {
      roomLights(roomAct.dataset.roomAct);
      return;
    }
    if (e.target.closest('.tile[data-entity]')) return; // the room's tiles: see wireTiles
    const el = e.target.closest('[data-act]');
    if (el && dialog.dataset.entity) handleAct(el.dataset.act, dialog.dataset.entity, el);
  });
  dialog.addEventListener('toggle', (e) => {
    if (e.target.matches?.('details.attrs')) ui.attrsOpen = e.target.open;
  }, true);
  dialog.addEventListener('close', () => {
    stopCamera();
    delete dialog.dataset.entity;
    delete dialog.dataset.room;
    delete dialog.dataset.person;
    ui.room = null;
    ui.person = null;
    ui.history = null;
    ui.dragging = false;
  });

  // Sliders: live label while dragging, one service call on release.
  dialog.addEventListener('input', (e) => {
    const r = e.target;
    if (!r.matches('input[type="range"]')) return;
    const min = Number(r.min);
    const max = Number(r.max);
    r.style.setProperty('--pct', `${((r.value - min) / (max - min)) * 100}%`);
    const out = r.closest('.slider')?.querySelector('output');
    if (out) out.textContent = sliderText(r.dataset.ctl, r.value);
  });
  dialog.addEventListener('change', (e) => {
    const r = e.target;
    const make = SLIDERS[r.dataset?.ctl];
    if (!make || !dialog.dataset.entity) return;
    const [domain, service, data] = make(Number(r.value));
    call(domain, service, data, dialog.dataset.entity);
  });
  dialog.addEventListener('pointerdown', (e) => {
    if (e.target.matches('input[type="range"]')) ui.dragging = true;
  });
  const endDrag = () => {
    if (!ui.dragging) return;
    // Let the slider's change event fire before the sheet can be redrawn.
    setTimeout(() => {
      ui.dragging = false;
      if (ui.deferredSheet && dialog.dataset.entity) openDetail(dialog.dataset.entity);
      ui.deferredSheet = false;
    }, 250);
  };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);

  wireTiles($('#view'));
  wireTiles(dialog);
}

// The click that ends a long press would land on whatever the new sheet put under the
// finger, so swallow it wherever it goes.
document.addEventListener('pointerdown', () => { ui.suppressClick = false; }, true);
document.addEventListener('click', (e) => {
  if (!ui.suppressClick) return;
  ui.suppressClick = false;
  e.preventDefault();
  e.stopPropagation();
}, true);

// Tap a tile for its main action; long-press (or right-click) opens its details.
// `view` is the page or the sheet, which shows a room's tiles.
function wireTiles(view) {
  let press = null;
  const cancelPress = () => {
    if (press) clearTimeout(press.timer);
    press = null;
  };

  view.addEventListener('pointerdown', (e) => {
    const tile = e.target.closest('.tile[data-entity]');
    if (!tile || e.button > 0 || e.target.closest('.tile-more, .stepper')) return;
    const entityId = tile.dataset.entity;
    press = {
      x: e.clientX,
      y: e.clientY,
      timer: setTimeout(() => {
        press = null;
        ui.suppressClick = true;
        navigator.vibrate?.(15);
        openDetail(entityId);
      }, 500),
    };
  });
  view.addEventListener('pointermove', (e) => {
    if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) cancelPress();
  });
  view.addEventListener('pointerup', cancelPress);
  view.addEventListener('pointercancel', cancelPress);
  window.addEventListener('scroll', cancelPress, { passive: true });
  view.addEventListener('scroll', cancelPress, { passive: true });

  view.addEventListener('contextmenu', (e) => {
    const tile = e.target.closest('.tile[data-entity]');
    if (!tile) return;
    e.preventDefault();
    cancelPress();
    ui.suppressClick = true;
    openDetail(tile.dataset.entity);
  });

  view.addEventListener('click', (e) => {
    const tile = e.target.closest('.tile[data-entity]');
    if (!tile) return;
    const el = e.target.closest('[data-act]');
    handleAct(el?.dataset.act || 'open', tile.dataset.entity, el);
  });
}

// ---------- connection ----------

async function start() {
  store.client?.close();
  store.client = null;
  store.states.clear();
  store.status = 'connecting';
  renderStatus();

  const auth = await resolveAuth();
  store.authMode = auth.mode;
  if (auth.mode === 'none') {
    store.status = 'none';
    renderStatus();
    render();
    return;
  }

  const client = new HAClient({ url: auth.url, getToken: auth.getToken });
  store.client = client;
  voice.attach(client);

  client.addEventListener('status', (e) => {
    store.status = e.detail.status;
    store.statusMessage = e.detail.message;
    renderStatus();
    if (e.detail.status === 'auth_invalid') render();
  });

  client.addEventListener('ready', (e) => {
    const { states, areas, entityInfo, config } = e.detail;
    store.states = new Map(states.map((s) => [s.entity_id, s]));
    store.areas = new Map(areas.map((a) => [a.area_id, a.name]));
    store.entityInfo = entityInfo;
    store.config = config || {};
    if (store.config.location_name) {
      $('#title').textContent = store.config.location_name;
      document.title = store.config.location_name;
    }
    updateSky({ instant: true });
    render();
    loadPlanAreas(client);
    loadFloorPlan(client);
    subscribeNotes(client);
  });

  client.addEventListener('state', (e) => {
    const { entityId, newState } = e.detail;
    const existed = store.states.has(entityId);
    const oldState = store.states.get(entityId);
    if (newState) store.states.set(entityId, newState);
    else store.states.delete(entityId);

    if (ui.optimistic.get(entityId)?.state === newState?.state || !newState) clearOptimistic(entityId, false);
    settleTargets(entityId, newState);
    if (newState && ui.history?.entityId === entityId && !ui.history.loading && oldState?.state !== newState.state) {
      ui.history.points.push({ t: Date.parse(newState.last_changed), s: newState.state });
    }

    if (entityId === 'sun.sun' || domainOf(entityId) === 'weather') updateSky();
    if (domainOf(entityId) === 'calendar') calendarChanged();
    if ($('#detail').dataset.entity === entityId) {
      if (newState) openDetail(entityId);
      else $('#detail').close();
    }
    if (ui.room || ui.person) queueRefresh();
    const sameListing = store.prefs.showUnavailable || !oldState || !newState || isUnavailable(oldState) === isUnavailable(newState);
    if (currentView === 'entities' && existed && newState && sameListing && updateTile(entityId)) return;
    queueRefresh();
  });

  await client.connect();
}

// ---------- boot ----------

setupInstall();
applyTheme();
applySky();
renderNav();
wireDetail();
wirePlan();
setupWall();
setupBell();
const voice = new Voice(); // mic button in the top bar, talks to Home Assistant's Assist
onInstallChange(() => { if (currentView === 'settings') render(); });
tickClock();
setInterval(() => {
  tickClock();
  updateSky(); // keeps the clock-based sun moving when there is no sun.sun
  renderBell(); // "5 min ago" in the popup
  if (currentView === 'home') VIEWS.home(); // greeting, Today, the calendar and the summary follow the clock
  if (currentView === 'solar') VIEWS.solar(); // fetches the last 24 hours again every 5 minutes
  if (store.prefs.theme === 'sky') applyTheme();
}, 15_000);
window.addEventListener('hashchange', () => {
  $('#detail').close();
  if (peopleMap.expanded) peopleMap.setExpanded(false);
  render();
  $('#view').focus({ preventScroll: true });
  window.scrollTo(0, 0);
});
// ?kiosk hides the navigation as well, for a wall panel that only shows Home.
if (urlParams.has('kiosk')) document.documentElement.classList.add('kiosk');
render();
start();
</script>
</head>

      </div>
      <div class="topbar-actions">
        <button type="button" class="icon-btn fullscreen-btn" id="fullscreen" aria-label="Full screen" hidden></button>
        <a class="status" id="status" href="#/settings" data-status="connecting">
        <span class="status-dot"></span><span class="status-text">Connecting…</span>
        </a>
      </div>

    <nav class="nav" aria-label="Main">
