  return {
    id: event.context?.id || `${event.time_fired}-${d.service}`,
    title: noteText(sd.title),
    message,
    to: noteTarget(d.service, sd),
    at: event.time_fired || new Date().toISOString(),
  };
}

/** Keep the newest, drop duplicates (every open screen records the same event) and old ones. */
function noteMerge(...lists) {
  const cutoff = Date.now() - NOTE_DAYS * 86_400_000;
  const byId = new Map();
  for (const n of lists.flat()) if (n?.id && Date.parse(n.at) > cutoff) byId.set(n.id, n);
  return [...byId.values()].sort((a, b) => Date.parse(b.at) - Date.parse(a.at)).slice(0, NOTE_KEEP);
}

/** Both kinds of notification, newest first. */
function noteItems({ persistent = [], sent = [] } = {}) {
  return [
    ...persistent.map((n) => ({ ...n, kind: 'ha' })),
    ...sent.map((n) => ({ ...n, kind: 'sent' })),
  ].sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
}

/** The list of notifications (or a note that there are none), as used on Home and in the bell's popup. */
function notesListHtml({ persistent = [], sent = [], canSeeSent = true, limit = 8 } = {}) {
  const items = noteItems({ persistent, sent }).slice(0, limit);
  const row = (n) => `<li class="note ${n.kind}">
      <span class="note-icon">${icon(n.kind === 'ha' ? 'alert' : 'bell')}</span>
      <div class="note-body">
        ${n.title ? `<strong>${esc(n.title)}</strong>` : ''}
        <p>${esc(n.message)}</p>
        <small class="muted">${esc(relativeTime(n.at))}${n.kind === 'sent' && n.to ? ` · to ${esc(n.to)}` : n.kind === 'ha' ? ' · in Home Assistant' : ''}</small>
      </div>
      ${n.kind === 'ha' ? `<button type="button" class="icon-btn note-dismiss" data-note-dismiss="${esc(n.id)}" aria-label="Dismiss">${icon('close')}</button>` : ''}
    </li>`;
  return items.length ? `<ul class="notes">${items.map(row).join('')}</ul>`
    : `<p class="muted notes-empty">No notifications in the last week.${canSeeSent ? '' : ' Notifications sent to phones show here for administrator logins.'}</p>`;
}

function notesHtml(opts = {}) {
  return `<section class="notes-wrap">
    <h2 class="section-title">Notifications</h2>
    <div class="notes-card">${notesListHtml(opts)}</div>
  </section>`;
}

/**
 * A soft bell "ding", made with Web Audio so there is no sound file to upload.
 * Safari (and the Home Assistant app on iPad and iPhone) only lets a page make sound after it has
 * been tapped, so the sound is switched on by the first tap anywhere; until then play() returns false.
 */
class Ding {
  constructor() {
    this.ctx = null;
    this.AC = window.AudioContext || window.webkitAudioContext;
    // Leave navigator.audioSession alone: 'playback' would stop the voice assistant's microphone on iPad.
    const unlock = () => this.unlock();
    for (const ev of ['pointerdown', 'touchend', 'keydown']) document.addEventListener(ev, unlock, { capture: true, passive: true });
  }

  get supported() { return !!this.AC; }
  get ready() { return this.ctx?.state === 'running'; }

  /** Call from a tap: creates or wakes the audio (Safari suspends it again when the page is hidden). */
  unlock() {
    if (!this.AC || this.ready) return;
    try {
      if (!this.ctx) this.ctx = new this.AC();
      // A silent blip inside the tap is what actually unlocks iOS.
      const buf = this.ctx.createBuffer(1, 1, 22050);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.ctx.destination);
      src.start(0);
      this.ctx.resume?.().catch(() => {});
    } catch { /* ignore */ }
  }

  /** Ring once. Returns false when the browser has not allowed sound yet. */
  play(volume = 0.5) {
    if (!this.ready) return false;
    const ctx = this.ctx;
    const t = ctx.currentTime + 0.02;
    const out = ctx.createGain();
    out.gain.value = volume;
    out.connect(ctx.destination);
    // A struck bell: a fundamental and a few inharmonic partials that die away at different rates.
    for (const [ratio, gain, decay] of [[1, 0.6, 1.6], [2.0, 0.22, 0.9], [2.76, 0.14, 0.6], [5.4, 0.05, 0.25]]) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 1046.5 * ratio; // C6
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      osc.connect(g).connect(out);
      osc.start(t);
      osc.stop(t + decay + 0.05);
    }
    return true;
  }
}

// ---- voice.js ----
// Talk to Home Assistant's Assist, the voice assistant set up in Home Assistant (Settings → Voice assistants).
// Speech goes to Home Assistant over the same WebSocket (assist_pipeline/run): Home Assistant turns it into
// text, hands it to the conversation agent (its own, or an AI such as Claude, OpenAI or Gemini) and speaks
// the answer back. Typed questions take the same route without the speech parts.


const VOICE_KEY = 'ha-dash.voice';
const VOICE_RATE = 16000;          // what Home Assistant's speech-to-text expects: 16 kHz, 16-bit, mono
const VOICE_MAX_MS = 15_000;       // stop listening after this even if Home Assistant hears no end
const VOICE_CLOSE_MS = 60_000;     // close the panel this long after the last answer (the wall clock screen goes over it)

const VOICE_PATHS = {
  mic: 'M12,2A3,3 0 0,1 15,5V11A3,3 0 0,1 12,14A3,3 0 0,1 9,11V5A3,3 0 0,1 12,2M19,11C19,14.53 16.39,17.44 13,17.93V21H11V17.93C7.61,17.44 5,14.53 5,11H7A5,5 0 0,0 12,16A5,5 0 0,0 17,11H19Z',
  micOff: 'M19,11C19,12.19 18.66,13.3 18.1,14.28L16.87,13.05C17.14,12.43 17.3,11.74 17.3,11H19M15,11.16L9,5.18V5A3,3 0 0,1 12,2A3,3 0 0,1 15,5V11L15,11.16M4.27,3L21,19.73L19.73,21L15.54,16.81C14.77,17.27 13.91,17.58 13,17.72V21H11V17.72C7.72,17.23 5,14.41 5,11H6.7C6.7,14 9.24,16.1 12,16.1C12.81,16.1 13.6,15.91 14.31,15.58L12.65,13.92L12,14A3,3 0 0,1 9,11V10.28L3,4.27L4.27,3Z',
  send: 'M2,21L23,12L2,3V10L17,12L2,14V21Z',

const voiceIcon = (name, cls = 'icon') =>

// Styles live here rather than in styles.css, so the voice assistant stays one self-contained file.

const VOICE_ERRORS = {
  'stt-no-text-recognized': "Sorry, I didn't catch that.",
  'stt-stream-failed': 'Home Assistant could not turn the speech into text.',
  'stt-provider-missing': 'This assistant has no speech-to-text set up in Home Assistant.',
  'pipeline-not-found': 'That assistant no longer exists in Home Assistant. Pick another one.',
  'intent-failed': 'The assistant could not answer.',
  'tts-failed': 'Home Assistant could not speak the answer.',
  timeout: 'The assistant took too long to answer.',
};

// Records the microphone as 16 kHz 16-bit PCM in an AudioWorklet (on the audio thread), or a
// ScriptProcessor where worklets are missing. Resampling is done here, as Safari ignores a 16 kHz context
// for microphone input.
const VOICE_WORKLET = `
class VoiceCapture extends AudioWorkletProcessor {
  process(inputs) {
    const ch = inputs[0] && inputs[0][0];
    if (ch) this.port.postMessage(ch.slice(0));
    return true;
  }
}
registerProcessor('voice-capture', VoiceCapture);`;

/** Downsamples Float32 chunks at `rate` to 16 kHz Int16, averaging the samples that fold into each one. */
function voiceResampler(rate) {
  const step = rate / VOICE_RATE;
  let pos = 0; // position of the next output sample, in input samples, relative to this chunk
  let carry = new Float32Array(0);
  return (chunk) => {
    const input = new Float32Array(carry.length + chunk.length);
    input.set(carry);
    input.set(chunk, carry.length);
    const out = [];
    while (pos + step <= input.length) {
      const a = Math.floor(pos);
      const b = Math.min(input.length, Math.max(a + 1, Math.floor(pos + step)));
      let sum = 0;
      for (let i = a; i < b; i++) sum += input[i];
      const v = Math.max(-1, Math.min(1, sum / (b - a)));
      out.push(v < 0 ? v * 0x8000 : v * 0x7fff);
      pos += step;
    }
    const keep = Math.floor(pos);
    carry = input.slice(keep);
    pos -= keep;
    return Int16Array.from(out);
  };
}

/** Why the microphone cannot be used here, or '' when it can be tried. */
function micBlockedReason() {
  // Browsers hide the microphone from http pages, unless told to trust the address (Chrome can be,
  // see below), so try whenever it is on offer rather than going by the address.
  if (!navigator.mediaDevices?.getUserMedia) {
    if (!window.isSecureContext) {
      const origin = `${location.protocol}//${location.host}`;
      return `The browser keeps the microphone from http addresses like ${origin}. `
        + `In Chrome on a computer or Android, open chrome://flags/#unsafely-treat-insecure-origin-as-secure, `
        + `add ${origin}, set it to Enabled and relaunch Chrome. On an iPad or iPhone (Chrome and Safari alike) `
        + 'it needs an https address. You can still type below.';
    }
    return 'This browser does not offer the microphone to web pages. You can still type below.';
  }
  if (!(window.AudioContext || window.webkitAudioContext)) return 'This browser cannot record audio. You can still type below.';
  return '';
}

class Voice {
  constructor() {
    this.client = null;
    this.pipelines = [];
    this.preferred = null;
    this.settings = (() => { try { return JSON.parse(localStorage.getItem(VOICE_KEY)) || {}; } catch { return {}; } })();
    this.log = [];              // [{ who: 'you'|'ha', text, error }]
    this.phase = 'idle';        // idle | listening | thinking | speaking
    this.conversationId = null;
    this.ctx = null;            // AudioContext, created on the first tap (iOS only allows it in a tap)
    this.audioEl = null;        // fallback player, unlocked in the same tap
    this.run = null;            // the pipeline run in progress
    this.level = 0;
    this.closeTimer = null;

    const style = document.createElement('style');
    style.textContent = VOICE_CSS;
    document.head.append(style);

    this.button = document.createElement('button');
    this.button.type = 'button';
    this.button.className = 'icon-btn voice-btn';
    this.button.setAttribute('aria-label', 'Talk to the assistant');
    this.button.innerHTML = voiceIcon('mic');
    this.button.hidden = true;
    this.button.addEventListener('click', () => this.open({ listen: true }));
    const actions = document.querySelector('.topbar-actions');
    actions?.insertBefore(this.button, actions.querySelector('.status'));

    this.dialog = document.createElement('dialog');
    this.dialog.className = 'sheet voice';
    this.dialog.setAttribute('aria-label', 'Assistant');
    document.body.append(this.dialog);
    this.dialog.addEventListener('close', () => this._onClosed());
    this.dialog.addEventListener('click', (e) => {
      if (e.target === this.dialog) { this.dialog.close(); return; } // tap on the backdrop
      if (e.target.closest('[data-voice-close]')) this.dialog.close();
      else if (e.target.closest('[data-voice-mic]')) this.toggleListening();
    });
    this.dialog.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = this.dialog.querySelector('.voice-text');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      this.ask(text);
    });
    this.dialog.addEventListener('change', (e) => {
      if (!e.target.matches('.voice-pipeline')) return;
      this.settings.pipeline = e.target.value;
      try { localStorage.setItem(VOICE_KEY, JSON.stringify(this.settings)); } catch { /* ignore */ }
      this.conversationId = null;
      this._render();
    });
  }

  /** Follow a (new) Home Assistant connection: the button shows while it is connected. */
  attach(client) {
    this.client = client;
    this._stop('');
    const sync = () => {
      if (client !== this.client) return;
      const up = client.status === 'connected';
      this.button.hidden = !up;
      if (up) this._loadPipelines();
      else if (this.run) this._stop('Lost the connection to Home Assistant. It will reconnect by itself.');
    };
    client.addEventListener('status', sync);
    sync();
  }

  get pipeline() {
    const want = this.settings.pipeline || this.preferred;
    return this.pipelines.find((p) => p.id === want) || this.pipelines.find((p) => p.id === this.preferred) || this.pipelines[0] || null;
  }

  get canSpeak() {
    // No list (not allowed to read it): try anyway, Home Assistant says if speech is not set up.
    return !this.pipelines.length || !!this.pipeline?.stt_engine;
  }

  async _loadPipelines() {
    const client = this.client;
    try {
      const res = await client.send({ type: 'assist_pipeline/pipeline/list' });
      if (client !== this.client) return;
      this.pipelines = res?.pipelines || [];
      this.preferred = res?.preferred_pipeline || null;
    } catch {
      this.pipelines = [];
    }
    if (this.dialog.open) this._render();
  }

  open({ listen = false } = {}) {
    // Everything that needs a tap on iOS happens here, before anything waits.
    this._unlockAudio();
    if (!this.dialog.open) {
      this.dialog.showModal();
      this._render();
    }
    if (listen && this.phase === 'idle' && this.canSpeak && !micBlockedReason()) this.listen();
    else this.dialog.querySelector('.voice-text')?.focus({ preventScroll: true });
  }

  toggleListening() {
    this._unlockAudio();
    if (this.phase === 'listening') this._endAudio();
    else if (this.phase === 'speaking') this._stopSpeaking();
    else if (this.phase === 'idle') this.listen();
  }

  _unlockAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC && !this.ctx) {
      try { this.ctx = new AC(); } catch { /* no audio */ }
    }
    if (this.ctx?.state === 'suspended') this.ctx.resume().catch(() => {});
    if (!this.audioEl) {
      this.audioEl = new Audio();
      this.audioEl.playsInline = true;
      // A moment of silence, so later answers may play without another tap.
      this.audioEl.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=';
      this.audioEl.play().catch(() => {});
    }
    if (window.speechSynthesis && !this.ttsUnlocked) {
      this.ttsUnlocked = true;
      try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch { /* ignore */ }
    }
  }

  // ---------- one question ----------

  /** Ask out loud: record until Home Assistant hears the end, then think and speak. */
  async listen() {
    const blocked = micBlockedReason();
    if (blocked) { this._say('ha', blocked, true); return; }
    if (!this.client || this.client.status !== 'connected') { this._say('ha', 'Not connected to Home Assistant.', true); return; }
    clearTimeout(this.closeTimer);

    const run = { handler: null, queue: [], pending: [], pendingLen: 0, ended: false, stream: null, nodes: [], subId: null, voice: true };
    this.run = run;
    this._setPhase('listening');

    // Ask Home Assistant first; the microphone starts while it gets ready and the first words are queued.
    const pipeline = this.pipeline;
    const tts = !this.pipelines.length || !!pipeline?.tts_engine;
    this._start(run, {
      start_stage: 'stt',
      end_stage: tts ? 'tts' : 'intent',
      input: { sample_rate: VOICE_RATE },
    });

    // Safari (iPad and iPhone) refuses to record unless the page's audio session allows recording.
    try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch { /* ignore */ }
    try {
      run.stream = await navigator.mediaDevices.getUserMedia({
        audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch (err) {
      if (this.run !== run) return;
      const denied = err?.name === 'NotAllowedError' || err?.name === 'SecurityError';
      this._stop(denied
        ? 'Microphone access is blocked. On an iPad allow it in Settings → Safari → Microphone (or tap aA → Website Settings), then try again. You can still type below.'
        : `The microphone could not start (${err?.message || err?.name || 'unknown error'}).`);
      return;
    }
    if (this.run !== run || run.ended) { this._releaseMic(run); return; }

    const ctx = this.ctx;
    if (ctx.state === 'suspended') await ctx.resume().catch(() => {});
    const source = ctx.createMediaStreamSource(run.stream);
    const resample = voiceResampler(ctx.sampleRate);
    const onChunk = (floats) => {
      if (this.run !== run || run.ended) return;
      let peak = 0;
      for (let i = 0; i < floats.length; i += 8) peak = Math.max(peak, Math.abs(floats[i]));
      this.level = this.level * 0.7 + peak * 0.3;
      // Send about a tenth of a second at a time, not one tiny frame per audio block.
      const pcm = resample(floats);
      run.pending.push(pcm);
      run.pendingLen += pcm.length;
      if (run.pendingLen >= VOICE_RATE / 10) this._flushAudio(run);
    };
    let node;
    try {
      if (!ctx.audioWorklet) throw new Error('no worklet');
      if (!this.workletReady) {
        const url = URL.createObjectURL(new Blob([VOICE_WORKLET], { type: 'application/javascript' }));
        this.workletReady = ctx.audioWorklet.addModule(url);
      }
      await this.workletReady;
      node = new AudioWorkletNode(ctx, 'voice-capture');
      node.port.onmessage = (e) => onChunk(e.data);
      source.connect(node);
    } catch {
      node = ctx.createScriptProcessor(4096, 1, 1);
      node.onaudioprocess = (e) => onChunk(e.inputBuffer.getChannelData(0));
      source.connect(node);
      node.connect(ctx.destination); // a ScriptProcessor only runs while connected; it outputs silence
    }
    run.nodes = [source, node];
    if (this.run !== run || run.ended) { this._releaseMic(run); return; }
    run.maxTimer = setTimeout(() => this._endAudio(), VOICE_MAX_MS);
    this._meter(run);
  }

  /** Ask in writing: the same assistant, answered on screen. */
  async ask(text) {
    if (!this.client || this.client.status !== 'connected') { this._say('ha', 'Not connected to Home Assistant.', true); return; }
    if (this.run) this._stop('');
    clearTimeout(this.closeTimer);
    this._say('you', text);
    const run = { handler: null, queue: [], pending: [], pendingLen: 0, ended: true, nodes: [], subId: null, voice: false, text };
    this.run = run;
    this._setPhase('thinking');
    this._start(run, { start_stage: 'intent', end_stage: 'intent', input: { text } });
  }

  async _start(run, payload) {
    const pipeline = this.pipeline;
    const msg = { type: 'assist_pipeline/run', ...payload, timeout: 60 };
    if (pipeline && this.pipelines.length > 1) msg.pipeline = pipeline.id;
    if (this.conversationId) msg.conversation_id = this.conversationId;
    try {
      run.subId = await this.client.subscribe(msg, (event) => this._onEvent(run, event));
    } catch (err) {
      if (this.run !== run) return;
      if (!run.voice && err.code === 'unknown_command') return this._askOld(run); // Home Assistant before Assist pipelines
      this._stop(err.message || 'The assistant did not answer.');
    }
  }

  async _askOld(run) {
    try {
      const msg = { type: 'conversation/process', text: run.text, language: navigator.language };
      if (this.conversationId) msg.conversation_id = this.conversationId;
      const res = await this.client.send(msg);
      if (this.run !== run) return;
      this.conversationId = res?.conversation_id || null;
      this._say('ha', res?.response?.speech?.plain?.speech || 'Done.', res?.response?.response_type === 'error');
      this._finish(run);
    } catch (err) {
      if (this.run === run) this._stop(err.message || 'The assistant did not answer.');
    }
  }

  _onEvent(run, event) {
    if (this.run !== run) return;
    const d = event.data || {};
    switch (event.type) {
      case 'run-start':
        run.handler = d.runner_data?.stt_binary_handler_id ?? null;
        if (run.handler != null) {
          for (const pcm of run.queue) this._sendAudio(run, pcm);
          run.queue = [];
          if (run.ended) this._sendEnd(run);
        }
        break;
      case 'stt-vad-end':
      case 'stt-end':
        if (!run.ended) this._endAudio();
        if (event.type === 'stt-end') {
          const heard = d.stt_output?.text?.trim();
          if (heard) this._say('you', heard);
        }
        this._setPhase('thinking');
        break;
      case 'intent-end': {
        const out = d.intent_output || {};
        this.conversationId = out.conversation_id || this.conversationId;
        run.continue = !!out.continue_conversation;
        const speech = out.response?.speech?.plain?.speech || '';
        run.speech = speech;
        this._say('ha', speech || 'Done.', out.response?.response_type === 'error');
        break;
      }
      case 'tts-end': {
        const url = d.tts_output?.url;
        if (url) run.ttsUrl = new URL(url, this.client.url + '/').href;
        break;
      }
      case 'run-end':
        this._finish(run);
        break;
      case 'error':
        this._stop(VOICE_ERRORS[d.code] || d.message || 'The assistant ran into a problem.');
        break;
    }
  }

  async _finish(run) {
    this._release(run);
    if (this.run !== run) return;
    if (run.voice && (run.ttsUrl || run.speech)) {
      this._setPhase('speaking');
      await this._speak(run);
      if (this.run !== run) return;
    }
    this.run = null;
    this._setPhase('idle');
    // The assistant asked something back: listen for the answer straight away.
    if (run.voice && run.continue && this.dialog.open) this.listen();
    else this._scheduleClose();
  }

  // ---------- audio ----------

  _sendAudio(run, pcm) {
    if (run.handler == null) { run.queue.push(pcm); return; }
    const ws = this.client?.ws;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const frame = new Uint8Array(1 + pcm.byteLength);
    frame[0] = run.handler;
    frame.set(new Uint8Array(pcm.buffer, pcm.byteOffset, pcm.byteLength), 1);
    ws.send(frame);
  }

  _flushAudio(run) {
    if (!run.pendingLen) return;
    const pcm = new Int16Array(run.pendingLen);
    let at = 0;
    for (const part of run.pending) { pcm.set(part, at); at += part.length; }
    run.pending = [];
    run.pendingLen = 0;
    this._sendAudio(run, pcm);
  }

  _sendEnd(run) {
    this._flushAudio(run);
    if (run.handler == null || run.endSent) return;
    run.endSent = true;
    const ws = this.client?.ws;
    if (ws?.readyState === WebSocket.OPEN) ws.send(new Uint8Array([run.handler]));
  }

  /** Done speaking: stop the microphone and tell Home Assistant the audio is over. */
  _endAudio() {
    const run = this.run;
    if (!run || run.ended) return;
    run.ended = true;
    this._releaseMic(run);
    this._sendEnd(run);
    if (this.phase === 'listening') this._setPhase('thinking');
  }

  _releaseMic(run) {
    clearTimeout(run.maxTimer);
    for (const n of run.nodes) { try { n.disconnect(); } catch { /* ignore */ } }
    if (run.nodes[1]?.port) run.nodes[1].port.onmessage = null;
    run.nodes = [];
    for (const t of run.stream?.getTracks() || []) t.stop(); // iOS plays answers quietly while the mic is open
    run.stream = null;
    // Back to normal playback, so answers and the notification ding use the loudspeaker as usual.
    try { if (navigator.audioSession?.type === 'play-and-record') navigator.audioSession.type = 'auto'; } catch { /* ignore */ }
  }

  _release(run) {
    this._releaseMic(run);
    if (run.subId != null && this.client) {
      // The run is over on Home Assistant's side; only forget the handler here.
      this.client.eventHandlers.delete(run.subId);
      run.subId = null;
    }
  }

  async _speak(run) {
    if (run.ttsUrl) {
      try {
        await this._playUrl(run.ttsUrl);
        return;
      } catch { /* fall back to the device's own voice */ }
    }
    if (run.speech && window.speechSynthesis) {
      await new Promise((resolve) => {
        const u = new SpeechSynthesisUtterance(run.speech);
        u.lang = this.pipeline?.language || navigator.language;
        u.onend = u.onerror = resolve;
        this.stopSpeaking = () => { speechSynthesis.cancel(); resolve(); };
        speechSynthesis.speak(u);
      });
    }
  }

  async _playUrl(url) {
    // Through the audio context first: it was unlocked by the tap, so iOS lets it play.
    if (this.ctx) {
      try {
        const buf = await (await fetch(url)).arrayBuffer();
        const audio = await new Promise((res, rej) => this.ctx.decodeAudioData(buf, res, rej));
        if (this.ctx.state === 'suspended') await this.ctx.resume();
        await new Promise((resolve) => {
          const src = this.ctx.createBufferSource();
          src.buffer = audio;
          src.connect(this.ctx.destination);
          src.onended = resolve;
          this.stopSpeaking = () => { try { src.stop(); } catch { /* ignore */ } resolve(); };
          src.start();
        });
        return;
      } catch { /* try the audio element */ }
    }
    const el = this.audioEl || new Audio();
    await new Promise((resolve, reject) => {
      el.onended = resolve;
      el.onerror = () => reject(new Error('Could not play the answer'));
      this.stopSpeaking = () => { el.pause(); resolve(); };
      el.src = url;
      el.play().catch(reject);
    });
  }

  _stopSpeaking() {
    this.stopSpeaking?.();
    this.stopSpeaking = null;
  }

  _meter(run) {
    const ring = this.dialog.querySelector('.voice-mic');
    if (this.run !== run || this.phase !== 'listening' || !ring) {
      ring?.style.setProperty('--level', 0);
      return;
    }
    ring.style.setProperty('--level', Math.min(1, this.level * 3).toFixed(2));
    requestAnimationFrame(() => this._meter(run));
  }

  /** Abandon whatever is going on; `message` explains why (nothing for a quiet stop). */
  _stop(message) {
    const run = this.run;
    this.run = null;
    if (run) {
      if (!run.ended) { run.ended = true; this._sendEnd(run); }
      // Unsubscribing cancels the run in Home Assistant.
      if (run.subId != null) this.client?.unsubscribe(run.subId);
      run.subId = null;
      this._release(run);
    }
    this._stopSpeaking();
    if (message) this._say('ha', message, true);
    this._setPhase('idle');
    if (message) this._scheduleClose();
  }

  _onClosed() {
    clearTimeout(this.closeTimer);
    this._stop('');
    this.conversationId = null;
    this.log = [];
  }

  _scheduleClose() {
    clearTimeout(this.closeTimer);
    this.closeTimer = setTimeout(() => {
      if (this.phase === 'idle' && !this.dialog.querySelector('.voice-text')?.value) this.dialog.close();
    }, VOICE_CLOSE_MS);
  }

  // ---------- drawing ----------

  _say(who, text, error = false) {
    this.log.push({ who, text, error });
    if (this.log.length > 30) this.log.shift();
    this._render();
  }

  _setPhase(phase) {
    this.phase = phase;
    this.dialog.dataset.phase = phase;
    this._render();
  }

  _render() {
    if (!this.dialog.open) return;
    const blocked = micBlockedReason();
    const noStt = !blocked && !this.canSpeak;
    const choices = this.pipelines.length > 1
      ? `<select class="select voice-pipeline" aria-label="Assistant">${this.pipelines.map((p) =>
        `<option value="${esc(p.id)}" ${p.id === this.pipeline?.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>`
      : `<p class="muted">${esc(this.pipeline?.name || 'Home Assistant')}</p>`;
    const label = {
      idle: blocked || noStt ? '' : 'Tap to talk',
      listening: 'Listening…',
      thinking: 'Thinking…',
      speaking: 'Speaking…',
    }[this.phase];
    const micIcon = this.phase === 'listening' || this.phase === 'speaking' ? 'stop' : (blocked || noStt ? 'micOff' : 'mic');
    const hint = this.log.length ? '' : `<p class="voice-hint muted">Try “Turn off the kitchen lights”, “What's the temperature outside?” or “Is the garage door open?”</p>`;
    const note = blocked ? `<p class="voice-note">${esc(blocked)}</p>`
      : noStt ? `<p class="voice-note">This assistant has no speech-to-text, so it can only be typed to. Add one in Home Assistant under Settings → Voice assistants.</p>` : '';
    const html = `
      <div class="sheet-head voice-head">
        <span class="voice-badge">${voiceIcon('mic')}</span>
        <div><h2>Assist</h2>${choices}</div>
        <button type="button" class="icon-btn" data-voice-close aria-label="Close">${icon('close')}</button>
      </div>
      <div class="voice-log" aria-live="polite">${hint}${this.log.map((m) =>
        `<p class="voice-msg ${m.who}${m.error ? ' error' : ''}">${esc(m.text)}</p>`).join('')}</div>
      ${note}
      <div class="voice-foot">
        <button type="button" class="voice-mic" data-voice-mic ${blocked || noStt ? 'disabled' : ''}
          aria-label="${this.phase === 'listening' ? 'Stop listening' : this.phase === 'speaking' ? 'Stop speaking' : 'Talk'}">${voiceIcon(micIcon)}</button>
        <span class="voice-state">${label}</span>
        <form class="voice-form">
          <input class="voice-text" type="text" enterkeyhint="send" autocomplete="off" placeholder="Or type a question" aria-label="Question">
          <button type="submit" class="icon-btn" aria-label="Send">${voiceIcon('send')}</button>
        </form>
      </div>`;
    // Keep the text box (and what is being typed in it) across redraws.
    const typed = this.dialog.querySelector('.voice-text');
    const focused = typed && document.activeElement === typed;
    if (!typed) { this.dialog.innerHTML = html; return; }
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    this.dialog.querySelector('.voice-head').replaceWith(tmp.querySelector('.voice-head'));
    this.dialog.querySelector('.voice-log').replaceWith(tmp.querySelector('.voice-log'));
    this.dialog.querySelector('.voice-note')?.remove();
    const newNote = tmp.querySelector('.voice-note');
    if (newNote) this.dialog.querySelector('.voice-foot').before(newNote);
    this.dialog.querySelector('.voice-mic').replaceWith(tmp.querySelector('.voice-mic'));
    this.dialog.querySelector('.voice-state').replaceWith(tmp.querySelector('.voice-state'));
    if (focused) typed.focus({ preventScroll: true });
    const log = this.dialog.querySelector('.voice-log');
    log.scrollTop = log.scrollHeight;
  }
}

function readPrefs() {
  try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch { return {}; }
}
function writePrefs() {
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(store.prefs)); } catch { /* ignore */ }
}

// Short-lived UI state for the controls.
const ui = {
  optimistic: new Map(), // entity_id -> { state, timer }: shown before HA confirms a toggle
  ran: new Map(),        // entity_id -> timer: scene/script just ran, tile shows a tick
  targets: new Map(),    // entity_id -> { values, sendTimer, clearTimer, sent }: unconfirmed setpoints
  history: null,         // { entityId, points, loading, error } for the open sheet
  attrsOpen: false,
  dragging: false,       // a slider in the sheet is being dragged; hold re-renders
  deferredSheet: false,
  suppressClick: false,  // the click that ends a long press
  room: null,            // { roomId, areaId } while a room's devices are open in the sheet
  person: null,          // entity_id while a person's sheet is open

  roomHtml: '',

  solarParts: {},        // last Solar flow card and charts drawn, redrawn separately

// ---------- helpers ----------

const $ = (sel, root = document) => root.querySelector(sel);

function areaOf(entityId) {
  const picked = store.prefs.entityAreas[entityId];
  if (picked && store.areas.has(picked)) return picked;
  return store.entityInfo.get(entityId)?.areaId || null;
}

// Unavailable entities, hidden entities and config/diagnostic entities clutter the dashboard, as in HA's own UI.
function isListed(entityId) {
  if (!store.prefs.showUnavailable) {
    const s = store.states.get(entityId);
    if (s && isUnavailable(s)) return false;
  }
  if (store.prefs.showHidden) return true;
  const info = store.entityInfo.get(entityId);
  return !(info && (info.hidden || info.category));
}

function parseRoute() {
  const [path, query = ''] = location.hash.replace(/^#\/?/, '').split('?');
  return { view: path || 'home', params: new URLSearchParams(query) };
}

function routeTo(view, params = {}) {
  const q = new URLSearchParams(Object.entries(params).filter(([, v]) => v)).toString();
  location.hash = `#/${view}${q ? `?${q}` : ''}`;
}

// ---------- chrome: nav, status, clock, theme ----------

const NAV = {
  home: { label: 'Home', icon: 'home' },
  solar: { label: 'Solar', icon: 'solar' },
  entities: { label: 'Devices', icon: 'entities' },
  settings: { label: 'Settings', icon: 'settings' },
};

function renderNav() {
  for (const a of document.querySelectorAll('.nav a')) {
    const item = NAV[a.dataset.view];
    a.innerHTML = `${icon(item.icon)}<span>${item.label}</span>`;
  }
}

function updateNav(view) {
  for (const a of document.querySelectorAll('.nav a')) {
    // No Solar tab for homes without solar or battery sensors.
    if (a.dataset.view === 'solar') a.hidden = !store.prefs.energy || (store.states.size > 0 && !energyNow());
    if (a.dataset.view === view) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  }
}

const STATUS_TEXT = {
  connecting: 'Connecting…',
  connected: 'Connected',
  disconnected: 'Offline, retrying',
  auth_invalid: 'Sign-in needed',
  none: 'Set up',
};

function renderStatus() {
  const el = $('#status');
  el.dataset.status = store.status;
  $('.status-text', el).textContent = STATUS_TEXT[store.status] || store.status;
  el.title = store.statusMessage || STATUS_TEXT[store.status] || '';
}

function tickClock() {
  const now = new Date();
  const time = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  $('#clock').textContent = time;
  for (const el of document.querySelectorAll('[data-clock]')) el.textContent = time;
}

function applyTheme() {
  let t = store.prefs.theme;
  // "Sky" follows the sun: dark cards once it has set.
  if (t === 'sky') t = sky?.night ?? clockSun().elevation < -4 ? 'dark' : 'light';
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.dataset.theme = t;
}

// ---------- sky background ----------

let sky = null;
let skyPreview = '';   // a scene picked in Settings to look at; not saved

function weatherEntity() {
  const chosen = store.prefs.weatherEntity && store.states.get(store.prefs.weatherEntity);
  if (chosen) return chosen;
  for (const s of store.states.values()) {
    if (domainOf(s.entity_id) === 'weather' && !isUnavailable(s)) return s;
  }
  return null;
}

function updateSky({ instant = false } = {}) {
  if (!sky) return;
  const sun = store.states.get('sun.sun');
  const a = sun?.attributes || {};
  const fromClock = clockSun();
  const weather = weatherEntity();
  const wind = Number(weather?.attributes?.wind_speed);
  const windKmh = weather?.attributes?.wind_speed_unit === 'mph' ? wind * 1.609
    : weather?.attributes?.wind_speed_unit === 'm/s' ? wind * 3.6 : wind;
  sky.setInputs({
    elevation: Number.isFinite(a.elevation) ? a.elevation : fromClock.elevation,
    rising: typeof a.rising === 'boolean' ? a.rising : fromClock.rising,
    condition: weather && !isUnavailable(weather) ? weather.state : (sun?.state === 'below_horizon' ? 'clear-night' : 'sunny'),
    wind: Number.isFinite(windKmh) ? windKmh : 0,
  }, { instant });
}

function applySky() {
  const on = store.prefs.sky;
  document.documentElement.classList.toggle('sky-on', on);
  if (!on) {
    sky?.destroy();
    sky = null;
    document.documentElement.removeAttribute('data-sky');
    applyTheme();
    setThemeColor(null);
    return;
  }
  if (!sky) {
    sky = new Sky($('#sky'), {
      onTone: ({ tone, top }) => {
        document.documentElement.dataset.sky = tone;
        setThemeColor(top);
        applyTheme();
        wall?.applyDim();
      },
    });
  }
  sky.animate = store.prefs.skyAnimate;
  sky.setPreview(skyPreview);
  updateSky();
  sky.start();
}

// Match the phone's status bar to the top of the sky.
function setThemeColor(color) {
  for (const m of document.querySelectorAll('meta[name="theme-color"]')) {
    if (!m.dataset.orig) m.dataset.orig = m.content;
    m.content = color || m.dataset.orig;
  }
}

// ---------- wall mode ----------

const urlParams = new URLSearchParams(location.search);
// ?kiosk (no navigation) and ?wall both switch wall mode on for that address.
const urlWall = urlParams.has('wall') || urlParams.has('kiosk');
let wall = null;

function wallPrefs() {
  const p = { ...store.prefs, wall: store.prefs.wall || urlWall };
  // Someone watching a camera is not touching the screen; give them longer before the clock.
  if (camPlayer && p.idleMinutes) p.idleMinutes = Math.max(p.idleMinutes, 10);
  return p;
}

function lightsOnCount() {
  let n = 0;
  for (const s of store.states.values()) if (domainOf(s.entity_id) === 'light' && s.state === 'on' && isListed(s.entity_id)) n++;
  return n;
}

function paintIdle() {
  const now = new Date();
  $('#idle-time').textContent = now.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  $('#idle-date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' });
  const w = weatherEntity();
  $('#idle-weather').textContent = w ? formatState(w) : '';
  const lights = lightsOnCount();
  $('#idle-summary').textContent = store.states.size
    ? lights ? `${lights} ${lights === 1 ? 'light' : 'lights'} on` : 'All lights off'
    : '';
}

function renderFullscreenButton() {
  const b = $('#fullscreen');
  b.hidden = !(wall?.enabled && Wall.canFullscreen);
  const full = !!(document.fullscreenElement || document.webkitFullscreenElement);
  b.innerHTML = icon(full ? 'fullscreenExit' : 'fullscreen');
  b.setAttribute('aria-label', full ? 'Leave full screen' : 'Full screen');
}

function setupWall() {
  wall = new Wall({
    overlay: $('#idle'),
    dimmer: $('#dimmer'),
    prefs: wallPrefs,
    isNight: () => sky?.night ?? clockSun().elevation < -4,
    paint: paintIdle,
    onIdle: () => {
      $('#detail').close();
      closeBell();
      if (currentView !== 'home') routeTo('home');
    },
    onWake: () => { ui.suppressClick = true; },
  });
  wall.update();
  $('#fullscreen').addEventListener('click', () => Wall.toggleFullscreen());
  document.addEventListener('fullscreenchange', renderFullscreenButton);
  document.addEventListener('webkitfullscreenchange', renderFullscreenButton);
  renderFullscreenButton();
}

// ---------- views ----------

let currentView = null;
let refreshQueued = false;

function render() {
  const { view, params } = parseRoute();
  ui.homeHtml = '';
  const fn = (view !== 'plan' && VIEWS[view]) || VIEWS.home; // #/plan: older links to the plan
  currentView = view !== 'plan' && VIEWS[view] ? view : 'home';
  document.documentElement.dataset.view = currentView;
  updateNav(currentView);
  fn(params);
  renderBell(); // wall mode or the setting may have changed
}

// Coalesce bursts of state changes into one refresh per frame.
function queueRefresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  requestAnimationFrame(() => {
    refreshQueued = false;
    if (currentView === 'home') VIEWS.home(parseRoute().params);
    if (currentView === 'entities') renderEntityList();
    if (currentView === 'solar') VIEWS.solar();
    if (ui.room && !$('#detail').dataset.entity) renderRoomSheet();
    if (ui.person) renderPersonSheet();
    renderBell();
  });
}

function emptyState(title, body, action = '') {
  return `<div class="empty">
    <h2>${esc(title)}</h2>
    <p>${body}</p>
    ${action}
  </div>`;
}

function notReadyMessage() {
  if (store.authMode === 'none' || store.status === 'auth_invalid') {
    return emptyState(
      'Connect to Home Assistant',
      store.status === 'auth_invalid'
        ? `Home Assistant did not accept the access token. ${esc(store.statusMessage)}`
        : 'Add your Home Assistant address and a long-lived access token to get started.',
      '<a class="btn primary" href="#/settings">Open settings</a>',
    );
  }
  return `<div class="empty"><div class="spinner" aria-hidden="true"></div><p>Loading your home…</p></div>`;
}

const VIEWS = {

    const rotated = portrait.matches;

    const infos = new Map(rooms.map((r) => [r.id, roomInfo(r, mapping.get(r.id))]));
    const unlinked = rooms.filter((r) => !mapping.get(r.id)).length;
    const lights = all.filter((s) => domainOf(s.entity_id) === 'light' && shown(s).state === 'on' && isListed(s.entity_id)).length;
    const areaTiles = planStore.layout ? [] : roomTiles();
    const litRooms = planStore.layout ? [...infos.values()].filter((i) => i.lightsOn).length : areaTiles.filter((t) => t.info.lightsOn).length;

    const html = `<div class="home-layout">

          <h2>${greetingFor(now)}</h2>
          <p class="muted">${esc(date)}</p>
        </div>
        <div class="hero-now">
          <time class="hero-clock" data-clock></time>
          ${weatherHeroHtml(weather)}
        </div>
      </section>

      ${briefHtml()}

        <div class="home-left">
          <div class="plan-head">
            <h2 class="section-title">${planStore.layout ? 'Floor plan' : 'Rooms'}</h2>
            <a class="section-link" href="#/entities?domain=light">${icon('light')}${lights
              ? `${lights} ${lights === 1 ? 'light' : 'lights'} on${litRooms ? ` in ${litRooms} ${litRooms === 1 ? 'room' : 'rooms'}` : ''}`

// ---------- floor plan ----------

const PLAN_DATA_KEY = 'ha-dash.plan-areas';
const PLAN_NAMES_KEY = 'ha-dash.plan-names';
const ENTITY_AREAS_KEY = 'ha-dash.entity-areas';
// Only phones turn the plan on its side; a tablet in portrait is wide enough for it as drawn.
const portrait = matchMedia('(orientation: portrait) and (max-width: 699.98px)');

function planMapping() {
  return matchRooms(planRooms(planStore.layout), store.areas, store.prefs.planAreas, store.prefs.planNames);
}

/** The room's name: what was typed in Settings on an older version, or the layout's own. */
function roomName(room) {
  return store.prefs.planNames[room.id] || room.name;
}

/** The floor Home shows, with its floor switcher when the home has more than one. */
function homePlanHtml(infos, rotated) {
  const floors = planStore.layout.floors;
  const floor = floors.find((f) => f.id === store.prefs.planFloor) || floors[0];
  const tabs = floors.length > 1 ? `<div class="chips plan-floor-tabs" role="tablist" aria-label="Floors">${floors.map((f) => `
    <button type="button" class="chip${f === floor ? ' on' : ''}" role="tab" aria-selected="${f === floor}" data-plan-floor="${esc(f.id)}">${esc(f.name)}</button>`).join('')}
  </div>` : '';
  return `${tabs}<div class="plan-card">${planHtml(floor, (r) => infos.get(r.id), { rotated, image: planStore.images.get(floor.id) || '' })}</div>`;
}

/** Without a floor plan, Home lists Home Assistant's areas as tiles instead. */
function roomTiles() {
  return [...store.areas]
    .map(([id, name]) => ({ id, name, count: areaEntities(id).length }))
    .filter((a) => a.count)
    .sort((a, b) => a.name.localeCompare(b.name))
    .map((a) => ({ ...a, info: roomInfo({ id: `area:${a.id}`, name: a.name }, a.id) }));
}

function roomTilesHtml(tiles) {
  if (!tiles.length) {
    return `<div class="plan-empty">${icon('floorplan')}<p>${store.areas.size
      ? 'None of your Home Assistant areas have devices in them yet.'
      : 'Home Assistant did not share any areas with this login.'}</p></div>`;
  }
  return `<div class="room-tiles">${tiles.map(({ id, name, info }) => {
    const meta = [info.temp, info.lightsOn ? `${info.lightsOn} ${info.lightsOn === 1 ? 'light' : 'lights'} on` : '', info.open ? 'Open' : ''].filter(Boolean).join(' · ');
    return `<button type="button" class="room-tile${info.lightsOn ? ' lit' : ''}" data-area="${esc(id)}">
      <span class="tile-icon${info.lightsOn ? ' active' : ''}">${icon('area')}</span>
      <span class="room-tile-name">${info.motion ? '<i class="plan-motion"></i>' : ''}${esc(name)}</span>
      <span class="room-tile-meta muted">${esc(meta || '\u00a0')}</span>
    </button>`;
  }).join('')}</div>`;
}

function areaEntities(areaId) {
  return [...store.states.values()]
    .filter((s) => areaOf(s.entity_id) === areaId && isListed(s.entity_id))
    .sort((a, b) => compareDomains(domainOf(a.entity_id), domainOf(b.entity_id)) || nameOf(a).localeCompare(nameOf(b)));
}

const MOTION_CLASSES = new Set(['motion', 'occupancy', 'presence']);
const OPENING_CLASSES = new Set(['door', 'window', 'opening', 'garage_door']);

/** What the plan shows for one room: lights, temperature, open doors, motion. */
function roomInfo(room, areaId) {
  const info = { areaId: areaId || null, name: roomName(room), label: roomName(room) };
  if (!areaId) return info;
  const ents = areaEntities(areaId).map(shown);
  const lightsOn = ents.filter((s) => domainOf(s.entity_id) === 'light' && s.state === 'on');
  info.lightsOn = lightsOn.length;
  if (lightsOn.length) {
    const lvl = lightsOn.map((s) => (s.attributes?.brightness != null ? s.attributes.brightness / 255 : 1));
    info.glow = {
      color: lightGlowColor(lightsOn[0]),
      strength: Math.round((lvl.reduce((a, b) => a + b, 0) / lvl.length) * 10) / 10,
    };
  }
  const temp = ents.find((s) => domainOf(s.entity_id) === 'sensor' && s.attributes?.device_class === 'temperature'
    && Number.isFinite(Number(s.state)) && s.state !== '');
  const climate = ents.find((s) => domainOf(s.entity_id) === 'climate' && s.attributes?.current_temperature != null);
  if (temp) info.temp = `${Number(Number(temp.state).toFixed(1))}°`;
  else if (climate) info.temp = `${Number(Number(climate.attributes.current_temperature).toFixed(1))}°`;
  const binary = (classes) => ents.some((s) => domainOf(s.entity_id) === 'binary_sensor'
    && classes.has(s.attributes?.device_class) && s.state === 'on');
  info.motion = binary(MOTION_CLASSES);
  info.open = binary(OPENING_CLASSES);
  info.cameras = ents.filter((s) => domainOf(s.entity_id) === 'camera').length;
  return info;
}

function savePlanAreas(next) {
  store.prefs.planAreas = next;
  writePrefs();
  store.client?.send({ type: 'frontend/set_user_data', key: PLAN_DATA_KEY, value: next }).catch(() => {});
}

function savePlanNames(next) {
  store.prefs.planNames = next;
  writePrefs();
  store.client?.send({ type: 'frontend/set_user_data', key: PLAN_NAMES_KEY, value: next }).catch(() => {});
}

function saveEntityAreas(next) {
  store.prefs.entityAreas = next;
  writePrefs();
  store.client?.send({ type: 'frontend/set_user_data', key: ENTITY_AREAS_KEY, value: next }).catch(() => {});
}

// ---------- floor plan layout: loading, saving, Settings ----------

// The layout (rooms drawn over each floor) and each floor's picture are kept in Home Assistant.
// System data is shared by every login (administrators save it); older Home Assistant versions,
// and logins that are not administrators, keep their own copy in their user data instead.
const PLAN_LAYOUT_KEY = 'ha-dash.floorplan';
const planImageKey = (floorId) => `ha-dash.floorplan.img.${floorId}`;
const PLAN_FILE_KIND = 'ha-dash-floorplan';

function readLocalJson(key) {
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function writeLocalJson(key, value) {
  try {
    if (value == null) localStorage.removeItem(key);
    else localStorage.setItem(key, JSON.stringify(value));
  } catch { /* full or blocked: Home Assistant still has it */ }
}

const planStore = {
  layout: cleanLayout(readLocalJson(PLAN_LAYOUT_KEY)),
  images: new Map(),   // floor id -> picture as a data URL
  source: readLocalJson(`${PLAN_LAYOUT_KEY}.source`) || 'local', // where the layout came from: 'system', 'user' or 'local'
  scope: '',           // where saving works: 'system', 'user', or '' until tried
  saveTimer: 0,
  message: '',         // last outcome shown in Settings
  error: false,
  busy: false,
  floorId: '',         // floor open in Settings
};
for (const f of planStore.layout?.floors || []) {
  const cached = f.img && readLocalJson(planImageKey(f.id));
  if (cached?.rev === f.img && typeof cached.data === 'string') planStore.images.set(f.id, cached.data);
}

const validPicture = (data) => typeof data === 'string' && /^data:image\/(png|jpeg|webp|svg\+xml)[;,]/.test(data) && data.length <= PLAN_RULES.keepBytes * 1.1;

async function planGet(client, scope, key) {
  try {
    return (await client.send({ type: `frontend/get_${scope}_data`, key }))?.value ?? null;
  } catch {
    return undefined; // not supported (older Home Assistant)
  }
}

/** Save to system data when allowed, else to this login's user data. Returns where it went. */
async function planPut(key, value) {
  const client = store.client;
  if (!client) return 'local';
  if (planStore.scope !== 'user') {
    try {
      await client.send({ type: 'frontend/set_system_data', key, value });
      planStore.scope = 'system';
      return 'system';
    } catch (err) {
      if (!['unauthorized', 'unknown_command', 'invalid_format'].includes(err.code)) throw err;
    }
  }
  await client.send({ type: 'frontend/set_user_data', key, value });
  planStore.scope = 'user';
  return 'user';
}

function setLayout(layout, source) {
  planStore.layout = layout;
  planStore.source = source;
  writeLocalJson(PLAN_LAYOUT_KEY, layout);
  writeLocalJson(`${PLAN_LAYOUT_KEY}.source`, source);
  for (const id of [...planStore.images.keys()]) {
    if (!layout?.floors.some((f) => f.id === id && f.img)) planStore.images.delete(id);
  }
}

/** Fetch each floor's picture that this device does not have yet, from wherever it was saved. */
async function loadPlanImages(client) {
  let got = false;
  for (const f of planStore.layout?.floors || []) {
    if (!f.img || planStore.images.has(f.id)) continue;
    const cached = readLocalJson(planImageKey(f.id));
    let pic = cached?.rev === f.img ? cached : null;
    for (const scope of planStore.source === 'user' ? ['user', 'system'] : ['system', 'user']) {
      if (pic) break;
      const v = await planGet(client, scope, planImageKey(f.id));
      if (v?.rev === f.img && validPicture(v.data)) pic = v;
    }
    if (client !== store.client) return;
    if (pic && validPicture(pic.data)) {
      planStore.images.set(f.id, pic.data);
      writeLocalJson(planImageKey(f.id), { rev: pic.rev, data: pic.data });
      got = true;
    }
  }
  if (got && ['home', 'settings'].includes(currentView)) render();
}

function applyRemoteLayout(raw, source, client) {
  const layout = cleanLayout(raw);
  if (JSON.stringify(layout) === JSON.stringify(cleanLayout(planStore.layout))) return false;
  if (planStore.saveTimer) return false; // an edit here is about to be saved over it
  setLayout(layout, source);
  foldLegacyPlan();
  loadPlanImages(client);
  return true;
}

async function loadFloorPlan(client) {
  const mine = await planGet(client, 'user', PLAN_LAYOUT_KEY);
  const shared = mine ? null : await planGet(client, 'system', PLAN_LAYOUT_KEY);
  if (client !== store.client) return;
  let changed = false;
  if (mine) changed = applyRemoteLayout(mine, 'user', client);
  else if (shared) changed = applyRemoteLayout(shared, 'system', client);
  else if (planStore.layout && planStore.source === 'local') savePlanSoon(0); // set up before connecting: share it now
  else if (planStore.layout && mine !== undefined) {
    // Removed on another device.
    setLayout(null, 'local');
    changed = true;
  }
  if (foldLegacyPlan()) changed = true;
  if (changed && ['home', 'entities', 'settings'].includes(currentView)) render();
  loadPlanImages(client);
  // Keep up with changes made on other devices.
  for (const scope of ['user', 'system']) {
    client.subscribe({ type: `frontend/subscribe_${scope}_data`, key: PLAN_LAYOUT_KEY }, (ev) => {
      if (client !== store.client || !ev?.value) return;
      if (scope === 'system' && planStore.source === 'user') return; // this login has its own copy
      if (applyRemoteLayout(ev.value, scope, client) && ['home', 'entities', 'settings'].includes(currentView)) render();
    }).catch(() => {});
  }
}

/**
 * Room links and names picked on older versions of the dashboard were kept per device;
 * move them into the layout itself, where every device sees them.
 */
function foldLegacyPlan() {
  if (!planStore.layout) return false;
  const areas = { ...store.prefs.planAreas };
  const names = { ...store.prefs.planNames };
  let moved = false;
  for (const f of planStore.layout.floors) {
    for (const r of f.rooms) {
      if (areas[r.id]) {
        r.area = areas[r.id];
        delete areas[r.id];
        moved = true;
      }
      if (names[r.id]) {
        r.name = names[r.id];
        delete names[r.id];
        moved = true;
      }
    }
  }
  if (!moved) return false;
  savePlanAreas(areas);
  savePlanNames(names);
  savePlanSoon(0);
  return true;
}

function savePlanSoon(delay = 700) {
  clearTimeout(planStore.saveTimer);
  writeLocalJson(PLAN_LAYOUT_KEY, planStore.layout);
  planStore.saveTimer = setTimeout(saveLayoutNow, delay);
}

async function saveLayoutNow() {
  clearTimeout(planStore.saveTimer);
  planStore.saveTimer = 0;
  const layout = cleanLayout(planStore.layout);
  writeLocalJson(PLAN_LAYOUT_KEY, layout);
  try {
    const where = await planPut(PLAN_LAYOUT_KEY, layout);
    if (where === 'system' && planStore.source === 'user') {
      // An administrator saved it for everyone: drop this login's own older copy.
      store.client?.send({ type: 'frontend/set_user_data', key: PLAN_LAYOUT_KEY, value: null }).catch(() => {});
    }
    if (where === 'user' && planStore.source === 'system') {
      // Not allowed to change the shared plan: this login now has its own copy, pictures included.
      for (const f of layout?.floors || []) {
        if (f.img && planStore.images.has(f.id)) await planPut(planImageKey(f.id), { rev: f.img, data: planStore.images.get(f.id) });
      }
    }
    planStore.source = where;
    writeLocalJson(`${PLAN_LAYOUT_KEY}.source`, where);
    planNote(where === 'system' ? 'Saved for everyone in Home Assistant.'
      : where === 'user' ? 'Saved for your Home Assistant login. Sign in as an administrator to share it with everyone.'
      : 'Saved on this device. Connect to Home Assistant to share it.');
  } catch (err) {
    planNote(`Could not save the floor plan: ${err.message}`, true);
  }
}

/** Store a floor's picture; the layout then points at it by its revision. */
async function savePlanImage(floor, data) {
  const rev = Math.random().toString(36).slice(2, 10);
  planStore.images.set(floor.id, data);
  writeLocalJson(planImageKey(floor.id), { rev, data });
  if (store.client) await planPut(planImageKey(floor.id), { rev, data });
  floor.img = rev;
}

function planNote(message, error = false) {
  planStore.message = message;
  planStore.error = error;
  const el = $('#plan-msg');
  if (el) {
    el.textContent = message;
    el.classList.toggle('error', error);
  }
}

function planFloorOpen() {
  const floors = planStore.layout?.floors || [];
  return floors.find((f) => f.id === planStore.floorId) || floors[0] || null;
}

function newFloorId() {
  const used = new Set((planStore.layout?.floors || []).map((f) => f.id));
  let id;
  do id = `f${Math.random().toString(36).slice(2, 6)}`; while (used.has(id));
  return id;
}

function planRulesHtml(open) {
  const types = Object.values(PLAN_RULES.types);
  return `<details class="plan-rules" ${open ? 'open' : ''}>
    <summary>What picture to use</summary>
    <ul>
      <li><strong>File type:</strong> ${types.slice(0, -1).join(', ')} or ${types.at(-1)}. Not PDF or iPhone HEIC photos; take a screenshot of those instead.</li>
      <li><strong>File size:</strong> up to ${PLAN_RULES.maxFileMB} MB. Big pictures are shrunk to ${PLAN_RULES.keepSide} pixels on the longest side.</li>
      <li><strong>Sharpness:</strong> at least ${PLAN_RULES.minSide} pixels on the longest side, so walls stay crisp on a tablet.</li>
      <li><strong>Shape:</strong> no more than ${PLAN_RULES.maxRatio} times as wide as it is tall (or tall as it is wide).</li>
      <li><strong>One floor per picture</strong>, seen from above. Add a floor for each storey.</li>
      <li><strong>Crop close to the house.</strong> Titles, notes and measurements around the edge waste space; or turn on "Crop to the rooms" after drawing them.</li>
      <li>A builder's plan, a real estate floor plan or a neat drawing all work. Dark lines on a light background look best, and are darkened to match dark mode.</li>
    </ul>
  </details>`;
}

function floorPlanSettingsHtml() {
  const layout = planStore.layout;
  const msg = `<p id="plan-msg" class="plan-msg${planStore.error ? ' error' : ''}" role="status">${esc(planStore.message)}</p>`;
  const files = `<input type="file" id="plan-file" accept="${PLAN_RULES.accept}" hidden>
    <input type="file" id="plan-import-file" accept=".json,application/json" hidden>`;
  if (!layout) {
    return `<h2>Floor plan</h2>
      <p class="muted panel-text">Show your home as it really is: upload a picture of your floor plan, draw the rooms over it, and link each room to a Home Assistant area. Lights glow in their rooms, and tapping a room opens its devices.${store.client ? ' The plan is saved in Home Assistant, so every screen in the house shows it.' : ''}</p>
      ${planRulesHtml(true)}
      <div class="form-actions">
        <button type="button" class="btn primary" data-plan-act="upload">${icon('upload')}Upload a floor plan picture</button>
        <button type="button" class="btn" data-plan-act="blank">Draw rooms without a picture</button>
        <button type="button" class="btn" data-plan-act="import">Import a floor plan file</button>
      </div>
      ${msg}${files}`;
  }
  const floor = planFloorOpen();
  const image = planStore.images.get(floor.id) || '';
  const where = planStore.source === 'system' ? 'Shared with everyone in Home Assistant.'
    : planStore.source === 'user' ? 'Saved for your Home Assistant login only.'
    : 'Saved on this device only.';
  return `<h2>Floor plan</h2>
    <p class="muted panel-text">Draw each room over the plan and link it to a Home Assistant area. Changes save as you go. ${where}</p>
    <div class="chips plan-floor-tabs" role="tablist" aria-label="Floors">
      ${layout.floors.map((f) => `<button type="button" class="chip${f === floor ? ' on' : ''}" role="tab" aria-selected="${f === floor}" data-plan-edit-floor="${esc(f.id)}">${esc(f.name)}</button>`).join('')}
      ${layout.floors.length < PLAN_MAX_FLOORS ? `<button type="button" class="chip" data-plan-act="add-floor">${icon('plus')}Add a floor</button>` : ''}
    </div>
    <div class="form plan-floor-form">
      <label class="field"><span>Floor name</span>
        <input type="text" id="plan-floor-name" maxlength="30" autocomplete="off" value="${esc(floor.name)}">
      </label>
      <label class="field"><span>Look</span>
        <select class="select" id="plan-style">
          <option value="picture" ${floor.style === 'picture' ? 'selected' : ''} ${image ? '' : 'disabled'}>Your picture</option>
          <option value="drawn" ${floor.style === 'drawn' || !image ? 'selected' : ''}>Drawn 3D walls</option>
        </select>
      </label>
      <div class="plan-checks">
        <label class="check"><input type="checkbox" id="plan-crop" ${floor.crop ? 'checked' : ''} ${image && floor.style === 'picture' ? '' : 'disabled'}><span>Crop to the rooms</span></label>
        <label class="check"><input type="checkbox" id="plan-invert" ${floor.invert !== false ? 'checked' : ''} ${image && floor.style === 'picture' ? '' : 'disabled'}><span>Darken the picture in dark mode</span></label>
        <label class="check"><input type="checkbox" id="plan-labels" ${floor.labels !== false ? 'checked' : ''}><span>Show room names on the plan</span></label>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" data-plan-act="upload">${icon('upload')}${image ? 'Replace picture' : floor.img ? 'Upload the picture again' : 'Add a picture'}</button>
        ${floor.img ? '<button type="button" class="btn" data-plan-act="remove-picture">Remove picture</button>' : ''}
      </div>
    </div>
    <div class="plan-editor" id="plan-editor"></div>
    ${msg}
    <div class="form-actions plan-file-actions">
      <button type="button" class="btn" data-plan-act="export">${icon('download')}Export to a file</button>
      <button type="button" class="btn" data-plan-act="import">Import a file</button>
      ${layout.floors.length > 1 ? `<button type="button" class="btn danger" data-plan-act="delete-floor">${icon('delete')}Delete ${esc(floor.name)}</button>` : ''}
      <button type="button" class="btn danger" data-plan-act="delete-all">${icon('delete')}Remove the floor plan</button>
    </div>
    <small class="muted">Export saves the plan and its pictures to a file, to keep as a backup or to load into another Home Assistant.</small>
    ${planRulesHtml(false)}

}

let planEditor = null;

function redrawPlanPanel() {
  const panel = $('#plan-settings');
  if (!panel) return;
  panel.innerHTML = floorPlanSettingsHtml();
  wireFloorPlanSettings();
  renderEntityRooms();
}

function wireFloorPlanSettings() {
  const panel = $('#plan-settings');
  if (!panel) return;
  const floor = planFloorOpen();
  if (floor) {
    planEditor = new PlanEditor($('#plan-editor'), {
      floor,
      image: planStore.images.get(floor.id) || '',
      areas: store.areas,
      // What "Automatic" would pick for a room: matched by name, as if no area were chosen for it.
      autoArea: (room) => {
        const rooms = planRooms(planStore.layout).map((r) => (r.id === room.id ? { ...r, area: undefined } : r));
        const id = matchRooms(rooms, store.areas, { ...store.prefs.planAreas, [room.id]: undefined }, store.prefs.planNames).get(room.id);
        return id ? store.areas.get(id) : '';
      },
      onChange: () => {
        planStore.message = '';
        savePlanSoon();
        renderEntityRooms();
      },
    });
  }
  // Fields that change the floor redraw the panel; the editor keeps its own place.
  const redraw = redrawPlanPanel;
  const changeFloor = (fn) => {
    fn(floor);
    savePlanSoon();
    redraw();
  };
  $('#plan-floor-name')?.addEventListener('change', (e) => {
    const v = e.target.value.replace(/\s+/g, ' ').trim();
    if (v) changeFloor((f) => { f.name = v; });
    else e.target.value = floor.name;
  });
  $('#plan-floor-name')?.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.target.blur(); });
  $('#plan-style')?.addEventListener('change', (e) => changeFloor((f) => { f.style = e.target.value; }));
  $('#plan-crop')?.addEventListener('change', (e) => changeFloor((f) => { f.crop = e.target.checked; }));
  $('#plan-invert')?.addEventListener('change', (e) => changeFloor((f) => { f.invert = e.target.checked; }));
  $('#plan-labels')?.addEventListener('change', (e) => changeFloor((f) => { f.labels = e.target.checked; }));

  const pick = $('#plan-file');
  let pickFor = 'replace';
  panel.onclick = async (e) => {
    const tab = e.target.closest('[data-plan-edit-floor]');
    if (tab) {
      planStore.floorId = tab.dataset.planEditFloor;
      redraw();
      return;
    }
    const act = e.target.closest('[data-plan-act]')?.dataset.planAct;
    if (!act || planStore.busy) return;
    if (act === 'upload') {
      pickFor = planStore.layout ? 'replace' : 'new';
      pick.value = '';
      pick.click();
    } else if (act === 'blank') {
      const id = newFloorId();
      planStore.layout = { v: 1, floors: [{ id, name: 'Ground floor', w: 1200, h: 800, style: 'drawn', img: '', crop: true, invert: true, labels: true, rooms: [] }] };
      planStore.floorId = id;
      Object.assign(planEditState, { floorId: id, mode: 'rect', selected: null, undo: [] });
      savePlanSoon(0);
      redraw();
    } else if (act === 'add-floor') {
      // A new floor starts as a blank sheet; "Add a picture" then puts its plan under it.
      const id = newFloorId();
      planStore.layout.floors.push({ id, name: `Floor ${planStore.layout.floors.length + 1}`, w: 1200, h: 800, style: 'drawn', img: '', crop: true, invert: true, labels: true, rooms: [] });
      planStore.floorId = id;
      savePlanSoon(0);
      redraw();
      planNote('Floor added. Add a picture of it, or draw its rooms straight onto the sheet.');
    } else if (act === 'remove-picture') {
      if (!confirm(`Remove the picture from ${floor.name}? The rooms you drew stay, drawn as walls.`)) return;
      floor.img = '';
      floor.style = 'drawn';
      planStore.images.delete(floor.id);
      writeLocalJson(planImageKey(floor.id), null);
      planPut(planImageKey(floor.id), null).catch(() => {});
      savePlanSoon(0);
      redraw();
    } else if (act === 'delete-floor') {
      if (!confirm(`Delete ${floor.name} and the rooms drawn on it?`)) return;
      planStore.layout.floors = planStore.layout.floors.filter((f) => f !== floor);
      if (floor.img) planPut(planImageKey(floor.id), null).catch(() => {});
      writeLocalJson(planImageKey(floor.id), null);
      planStore.floorId = '';
      savePlanSoon(0);
      redraw();
    } else if (act === 'delete-all') {
      if (!confirm('Remove the floor plan, its pictures and all the rooms drawn on it? Export it to a file first if you might want it back.')) return;
      for (const f of planStore.layout.floors) {
        writeLocalJson(planImageKey(f.id), null);
        if (f.img) planPut(planImageKey(f.id), null).catch(() => {});
      }
      setLayout(null, planStore.source);
      try { await planPut(PLAN_LAYOUT_KEY, null); } catch { /* removed here at least */ }
      planStore.message = 'Floor plan removed. Home shows your rooms as tiles instead.';
      planStore.error = false;
      redraw();
    } else if (act === 'export') {
      exportFloorPlan();
    } else if (act === 'import') {
      $('#plan-import-file').value = '';
      $('#plan-import-file').click();
    }
  };

  pick?.addEventListener('change', async () => {
    const file = pick.files?.[0];
    if (!file) return;
    planStore.busy = true;
    planNote('Checking the picture…');
    try {
      const pic = await readPlanPicture(file);
      let target;
      if (pickFor === 'new') {
        const id = newFloorId();
        target = { id, name: 'Ground floor', w: pic.w, h: pic.h, style: 'picture', img: '', crop: false, invert: true, labels: true, rooms: [] };
        planStore.layout = { v: 1, floors: [target] };
        planStore.floorId = id;
        Object.assign(planEditState, { floorId: id, mode: 'rect', selected: null, undo: [] });
      } else {
        target = floor;
        // Rooms already drawn stretch with the new picture; their corners may need a nudge.
        const sx = pic.w / target.w;
        const sy = pic.h / target.h;
        if (target.rooms.length && (Math.abs(sx - 1) > 0.001 || Math.abs(sy - 1) > 0.001)) {
          for (const r of target.rooms) {
            r.points = r.points.map(([x, y]) => [Math.round(x * sx * 10) / 10, Math.round(y * sy * 10) / 10]);
            if (r.label) r.label = [Math.round(r.label[0] * sx * 10) / 10, Math.round(r.label[1] * sy * 10) / 10];
          }
          for (const it of target.furniture || []) it.rect = [it.rect[0] * sx, it.rect[1] * sy, it.rect[2] * sx, it.rect[3] * sy];
          delete target.box;
        }
        target.w = pic.w;
        target.h = pic.h;
        target.style = 'picture';
      }
      planNote('Saving the picture…');
      await savePlanImage(target, pic.data);
      await saveLayoutNow();
      const drawn = target.rooms.length ? 'Check the rooms still line up with it.' : 'Now pick Rectangle and drag across each room.';
      planStore.message = `${pic.note ? `${pic.note} ` : ''}${planStore.message} ${drawn}`;
    } catch (err) {
      planStore.message = err.message;
      planStore.error = true;
    } finally {
      planStore.busy = false;
    }
    redraw();
  });

  $('#plan-import-file')?.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (file) await importFloorPlan(file);
  });
}

async function exportFloorPlan() {
  const layout = cleanLayout(planStore.layout);
  if (!layout) return;
  const images = {};
  for (const f of layout.floors) {
    if (f.img && planStore.images.has(f.id)) images[f.id] = { rev: f.img, data: planStore.images.get(f.id) };
  }
  const blob = new Blob([JSON.stringify({ kind: PLAN_FILE_KIND, v: 1, layout, images })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `floor-plan-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10_000);
  planNote('Floor plan exported.');
}

async function importFloorPlan(file) {
  try {
    if (file.size > 30 * 1024 * 1024) throw new Error('That file is too big to be a floor plan export.');
    let raw;
    try { raw = JSON.parse(await file.text()); } catch { throw new Error('That file is not a floor plan export (it is not JSON).'); }
    const layout = cleanLayout(raw?.kind === PLAN_FILE_KIND ? raw.layout : raw);
    if (!layout) throw new Error('That file has no floor plan in it.');
    if (planStore.layout && !confirm('Replace the floor plan you have now with the one in this file?')) return;
    planStore.busy = true;
    planNote('Importing…');
    const old = planStore.layout?.floors || [];
    const pictures = [];
    for (const f of layout.floors) {
      const pic = raw?.images?.[f.id];
      if (f.img && validPicture(pic?.data)) pictures.push([f, pic.data]);
      else {
        f.img = '';
        if (f.style === 'picture') f.style = 'drawn';
      }
    }
    setLayout(layout, planStore.source);
    for (const [f, data] of pictures) await savePlanImage(f, data);
    for (const f of old) {
      if (f.img && !layout.floors.some((n) => n.id === f.id)) planPut(planImageKey(f.id), null).catch(() => {});
    }
    planStore.floorId = '';
    foldLegacyPlan();
    await saveLayoutNow();
    const rooms = planRooms(layout).length;
    planStore.message = `Imported ${layout.floors.length} ${layout.floors.length === 1 ? 'floor' : 'floors'} with ${rooms} ${rooms === 1 ? 'room' : 'rooms'}. ${planStore.message}`;
  } catch (err) {
    planStore.message = err.message;
    planStore.error = true;
  } finally {
    planStore.busy = false;
  }
  redrawPlanPanel();
}

// Whole-home things that do not belong in a room, so they are not offered for one.
const ROOMLESS_DOMAINS = new Set([
  'person', 'device_tracker', 'zone', 'sun', 'weather', 'update', 'automation', 'calendar', 'todo',
  'tts', 'stt', 'conversation', 'wake_word', 'event', 'persistent_notification', 'input_text', 'image',
]);
const roomsUi = { open: new Set(), filter: '' };

/** Rooms to offer: floor plan rooms by their names, then any other Home Assistant areas. */
function roomChoices() {
  const mapping = planMapping();
  const seen = new Set();
  const choices = [];
  const rooms = planRooms(planStore.layout);
  for (const r of rooms) {
    const areaId = mapping.get(r.id);
    if (!areaId || seen.has(areaId)) continue;
    seen.add(areaId);
    choices.push([areaId, roomName(r)]);
  }
  choices.sort((a, b) => a[1].localeCompare(b[1]));
  const rest = [...store.areas].filter(([id]) => !seen.has(id)).sort((a, b) => a[1].localeCompare(b[1]));
  return { plan: choices, rest, unlinked: rooms.filter((r) => !mapping.get(r.id)).map(roomName), total: rooms.length };
}

function entityRoomsHtml() {
  const head = `<h2>Devices without a room</h2>`;
  if (!store.states.size) return `${head}<p class="muted">Connect to Home Assistant to see devices that are not in a room.</p>`;
  if (!store.areas.size) {
    return `${head}<p class="muted">Home Assistant did not share its areas with this login, so devices cannot be put in rooms. Areas need an administrator account.</p>`;
  }
  const picked = store.prefs.entityAreas;
  const haArea = (id) => store.entityInfo.get(id)?.areaId || null;
  const candidates = [...store.states.values()].filter((s) => isListed(s.entity_id)
    && !ROOMLESS_DOMAINS.has(domainOf(s.entity_id)) && !haArea(s.entity_id));
  const loose = candidates.filter((s) => !(picked[s.entity_id] && store.areas.has(picked[s.entity_id])));
  const placed = candidates.filter((s) => picked[s.entity_id] && store.areas.has(picked[s.entity_id]))
    .sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
  const q = roomsUi.filter.trim().toLowerCase();
  const match = (s) => !q || nameOf(s).toLowerCase().includes(q) || s.entity_id.includes(q);
  const { plan, rest, unlinked, total } = roomChoices();
  const options = (cur) => `
    <option value="" ${cur ? '' : 'selected'}>No room</option>
    ${plan.length ? `<optgroup label="Floor plan">${plan.map(([id, name]) => `
      <option value="${esc(id)}" ${cur === id ? 'selected' : ''}>${esc(name)}</option>`).join('')}</optgroup>` : ''}
    ${rest.length ? `<optgroup label="${plan.length ? 'Other areas' : 'Areas'}">${rest.map(([id, name]) => `
      <option value="${esc(id)}" ${cur === id ? 'selected' : ''}>${esc(name)}</option>`).join('')}</optgroup>` : ''}`;
  const row = (s) => `<div class="eroom-row">
      <span class="tile-icon">${icon(iconFor(s))}</span>
      <div class="eroom-name"><strong>${esc(nameOf(s))}</strong><small class="muted">${esc(formatState(s))}</small></div>
      <select class="select" data-entity-room="${esc(s.entity_id)}" aria-label="Room for ${esc(nameOf(s))}">${options(picked[s.entity_id] || '')}</select>
    </div>`;

  const groups = new Map();
  for (const s of loose.filter(match)) {
    const d = domainOf(s.entity_id);
    if (!groups.has(d)) groups.set(d, []);
    groups.get(d).push(s);
  }
  const shownPlaced = placed.filter(match);
  return `${head}
    <p class="muted panel-text">${loose.length
      ? `${loose.length} ${loose.length === 1 ? 'device is' : 'devices are'} not in any room. Pick a room and ${loose.length === 1 ? 'it shows' : 'they show'} up there on the floor plan and in Devices.`
      : 'Every device is in a room.'} This only changes the dashboard, not Home Assistant.${store.client ? ' It is saved to your Home Assistant profile, so your other devices use it too.' : ''}</p>
    ${unlinked.length && plan.length < total ? `<p class="muted panel-text">${esc(unlinked.join(', '))} ${unlinked.length === 1 ? 'is' : 'are'} not linked to an area yet, so ${unlinked.length === 1 ? 'it is' : 'they are'} not offered. <a href="#/settings?section=plan">Link rooms</a>.</p>` : ''}
    ${loose.length + placed.length > 8 ? `<label class="search eroom-search">${icon('search')}
      <input id="eroom-q" type="search" placeholder="Search devices" autocomplete="off" value="${esc(roomsUi.filter)}" aria-label="Search devices without a room">
    </label>` : ''}
    <div class="eroom-groups">
      ${[...groups.keys()].sort(compareDomains).map((d) => {
        const list = groups.get(d).sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
        return `<details class="eroom-group" data-eroom-group="${esc(d)}" ${q || roomsUi.open.has(d) ? 'open' : ''}>
          <summary>${esc(domainLabel(d))} <span class="chip-count">${list.length}</span></summary>
          ${list.map(row).join('')}
        </details>`;
      }).join('')}
      ${shownPlaced.length ? `<details class="eroom-group" data-eroom-group="_placed" ${q || roomsUi.open.has('_placed') ? 'open' : ''}>
        <summary>Put in a room here <span class="chip-count">${shownPlaced.length}</span></summary>
        ${shownPlaced.map(row).join('')}
      </details>` : ''}
      ${q && !groups.size && !shownPlaced.length ? `<p class="muted">Nothing matches “${esc(roomsUi.filter)}”.</p>` : ''}
    </div>`;
}

function renderEntityRooms() {
  const panel = $('#entity-rooms');
