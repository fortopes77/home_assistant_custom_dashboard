          for (const it of target.furniture || []) it.rect = [it.rect[0] * sx, it.rect[1] * sy, it.rect[2] * sx, it.rect[3] * sy];
          delete target.box;
        }
        target.w = pic.w;
        target.h = pic.h;
        target.style = 'picture';
      }
      planNote('Saving the picture…');
      await savePlanImage(target, pic.data);
      await saveLayoutNow();
      const drawn = target.rooms.length ? 'Check the rooms still line up with it.' : 'Now pick Rectangle and drag across each room.';
      planStore.message = `${pic.note ? `${pic.note} ` : ''}${planStore.message} ${drawn}`;
    } catch (err) {
      planStore.message = err.message;
      planStore.error = true;
    } finally {
      planStore.busy = false;
    }
    redraw();
  });

  $('#plan-import-file')?.addEventListener('change', async (e) => {
    const file = e.target.files?.[0];
    if (file) await importFloorPlan(file);
  });
}

async function exportFloorPlan() {
  const layout = cleanLayout(planStore.layout);
  if (!layout) return;
  const images = {};
  for (const f of layout.floors) {
    if (f.img && planStore.images.has(f.id)) images[f.id] = { rev: f.img, data: planStore.images.get(f.id) };
  }
  const blob = new Blob([JSON.stringify({ kind: PLAN_FILE_KIND, v: 1, layout, images })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `floor-plan-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10_000);
  planNote('Floor plan exported.');
}

async function importFloorPlan(file) {
  try {
    if (file.size > 30 * 1024 * 1024) throw new Error('That file is too big to be a floor plan export.');
    let raw;
    try { raw = JSON.parse(await file.text()); } catch { throw new Error('That file is not a floor plan export (it is not JSON).'); }
    const layout = cleanLayout(raw?.kind === PLAN_FILE_KIND ? raw.layout : raw);
    if (!layout) throw new Error('That file has no floor plan in it.');
    if (planStore.layout && !confirm('Replace the floor plan you have now with the one in this file?')) return;
    planStore.busy = true;
    planNote('Importing…');
    const old = planStore.layout?.floors || [];
    const pictures = [];
    for (const f of layout.floors) {
      const pic = raw?.images?.[f.id];
      if (f.img && validPicture(pic?.data)) pictures.push([f, pic.data]);
      else {
        f.img = '';
        if (f.style === 'picture') f.style = 'drawn';
      }
    }
    setLayout(layout, planStore.source);
    for (const [f, data] of pictures) await savePlanImage(f, data);
    for (const f of old) {
      if (f.img && !layout.floors.some((n) => n.id === f.id)) planPut(planImageKey(f.id), null).catch(() => {});
    }
    planStore.floorId = '';
    await saveLayoutNow();
    const rooms = planRooms(layout).length;
    planStore.message = `Imported ${layout.floors.length} ${layout.floors.length === 1 ? 'floor' : 'floors'} with ${rooms} ${rooms === 1 ? 'room' : 'rooms'}. ${planStore.message}`;
  } catch (err) {
    planStore.message = err.message;
    planStore.error = true;
  } finally {
    planStore.busy = false;
  }
  redrawPlanPanel();
}

// ---- camera.js ----
// Camera pictures and live video, using Home Assistant's own camera APIs and the existing sign-in.
//
//  - Stills come from the camera's entity_picture (/api/camera_proxy/<id>?token=…). Home Assistant
//    rotates that token every few minutes and sends the new one with the camera's state, so the
//    address works in a plain <img> without any headers.
//  - Live video tries, in order, what the camera offers: WebRTC (go2rtc, Nest and others; lowest
//    delay), then HLS (the stream integration), then the Motion JPEG proxy every camera has.

const HLS_JS = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js';
const KIND_LABELS = { web_rtc: 'WebRTC', hls: 'HLS', mjpeg: 'MJPEG' };

const streamLabel = (kind) => KIND_LABELS[kind] || kind;

/** Address of a camera's current picture, `width` pixels wide where the camera can resize. */
function cameraStillUrl(base, s, width) {
  const pic = s?.attributes?.entity_picture;
  if (!pic) return '';
  const u = new URL(pic, `${base}/`);
  if (width) u.searchParams.set('width', String(width));
  u.searchParams.set('t', String(Date.now())); // a fresh picture, not the browser's copy
  return u.href;
}

let hlsLoading = null;
function loadHlsJs() {
  if (window.Hls) return Promise.resolve(window.Hls);
  hlsLoading ||= new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = HLS_JS;
    s.onload = () => (window.Hls ? resolve(window.Hls) : reject(new Error('hls.js did not load')));
    s.onerror = () => { hlsLoading = null; reject(new Error('Could not load the HLS player')); };
    document.head.append(s);
  });
  return hlsLoading;
}

const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

function haAtLeast(version, year, month) {
  const [y, m] = String(version || '').split('.').map(Number);
  if (!y) return true; // unknown: assume current
  return y > year || (y === year && m >= month);
}

function waitIceGathered(pc, ms) {
  if (pc.iceGatheringState === 'complete') return Promise.resolve();
  return new Promise((resolve) => {
    const done = () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); } };
    const t = setTimeout(resolve, ms);
    pc.addEventListener('icegatheringstatechange', done);
  });
}

/**
 * Plays one camera's live video into `stage`, falling back through the stream types.
 * onState({ phase: 'connecting' | 'playing' | 'failed', kind, message })
 */
class CameraPlayer {
  constructor({ client, entityId, getState, stage, onState }) {
    this.client = client;
    this.getState = getState;
    this.entityId = entityId;
    this.stage = stage;
    this.onState = onState;
    this.run = 0;
    this.kind = null;
    this.media = null;
    this.muted = true;
  }

  get video() {
    return this.media?.tagName === 'VIDEO' ? this.media : null;
  }

  async start() {
    this.stop();
    const run = ++this.run;
    const kinds = [...(await this._streamKinds()), 'mjpeg'];
    let lastError = null;
    for (const kind of kinds) {
      if (run !== this.run) return;
      this.kind = kind;
      this.onState({ phase: 'connecting', kind });
      try {
        await this[`_${kind}`](run);
        if (run !== this.run) return;
        this.onState({ phase: 'playing', kind });
        return;
      } catch (err) {
        lastError = err;
        this._teardown();
      }
    }
    if (run === this.run) this.onState({ phase: 'failed', kind: null, message: lastError?.message || 'No live video' });
  }

  stop() {
    this.run++;
    this._teardown();
  }

  setMuted(muted) {
    this.muted = muted;
    if (this.video) {
      this.video.muted = muted;
      if (!muted) this.video.play().catch(() => {});
    }
  }

  get hasAudio() {
    const v = this.video;
    if (!v) return false;
    if (v.srcObject) return v.srcObject.getAudioTracks().length > 0;
    return this.hls ? !!this.hls.audioTracks?.length || this.hls.levels?.some((l) => l.audioCodec) : true;
  }

  // ---- internals ----

  async _streamKinds() {
    const s = this.getState();
    let types;
    try {
      const res = await this.client.send({ type: 'camera/capabilities', entity_id: this.entityId });
      types = res?.frontend_stream_types;
    } catch {
      // Older Home Assistant: the camera says in its attributes, else try HLS and see.
      const attr = s?.attributes?.frontend_stream_type;
      types = attr ? [attr] : ['hls'];
    }
    return ['web_rtc', 'hls'].filter((k) => types?.includes(k));
  }

  _teardown() {
    clearTimeout(this.timer);
    if (this.sub != null) {
      this.client.unsubscribe?.(this.sub);
      this.sub = null;
    }
    this.pc?.close();
    this.pc = null;
    this.hls?.destroy();
    this.hls = null;
    const m = this.media;
    if (m) {
      if (m.tagName === 'VIDEO') {
        m.pause();
        m.srcObject = null;
        m.removeAttribute('src');
        m.load();
      } else {
        m.src = ''; // closes the Motion JPEG connection
      }
      m.remove();
    }
    this.media = null;
  }

  _newVideo() {
    const v = document.createElement('video');
    v.className = 'cam-media';
    v.muted = this.muted;
    v.autoplay = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.disablePictureInPicture = false;
    this.stage.prepend(v);
    this.media = v;
    return v;
  }

  // Resolves once frames are on screen; rejects on `failed`, or when nothing shows within `ms`.
  _whenPlaying(el, ms, failed) {
    return new Promise((resolve, reject) => {
      let done = false;
      const finish = (err) => {
        if (done) return;
        done = true;
        clearInterval(poll);
        clearTimeout(this.timer);
        err ? reject(err) : resolve();
      };
      const shown = () => (el.tagName === 'VIDEO' ? el.videoWidth > 0 && el.readyState >= 2 : el.naturalWidth > 0);
      const poll = setInterval(() => shown() && finish(), 150);
      this.timer = setTimeout(() => finish(new Error('The camera did not send any video')), ms);
      el.addEventListener('playing', () => shown() && finish());
      el.addEventListener('error', () => finish(new Error('The video could not be played')));
      failed?.catch((err) => finish(err));
      if (el.tagName === 'VIDEO') el.play().catch(() => {});
    });
  }

  async _web_rtc(run) {
    if (!window.RTCPeerConnection) throw new Error('This browser has no WebRTC');
    const { client, entityId } = this;
    let cfg = {};
    try {
      cfg = (await client.send({ type: 'camera/webrtc/get_client_config', entity_id: entityId })) || {};
    } catch { /* older Home Assistant: no extra settings */ }
    if (run !== this.run) return;

    const pc = new RTCPeerConnection(cfg.configuration || {});
    this.pc = pc;
    if (cfg.dataChannel) pc.createDataChannel(cfg.dataChannel);
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.addTransceiver('audio', { direction: 'recvonly' });
    const stream = new MediaStream();
    pc.addEventListener('track', (e) => stream.addTrack(e.track));
    const video = this._newVideo();
    video.srcObject = stream;

    await pc.setLocalDescription(await pc.createOffer());
    if (cfg.getCandidatesUpfront) await waitIceGathered(pc, 3000);
    if (run !== this.run) return;

    // Home Assistant 2024.11 sent ICE candidates as bare strings; later versions as objects.
    const objects = haAtLeast(client.haVersion, 2024, 12);
    let session = null;
    const outbox = [];
    const remote = [];
    let answered = false;
    const sendCandidate = (c) => client.send({
      type: 'camera/webrtc/candidate', entity_id: entityId, session_id: session,
      candidate: objects ? c : c.candidate,
    }).catch(() => {});
    pc.addEventListener('icecandidate', (e) => {
      if (cfg.getCandidatesUpfront || !e.candidate?.candidate) return;
      const c = e.candidate.toJSON();
      if (session) sendCandidate(c);
      else outbox.push(c);
    });
    const addRemote = (c) => pc.addIceCandidate(typeof c === 'string' ? { candidate: c, sdpMid: '0' } : c).catch(() => {});

    const failed = new Promise((_, reject) => {
      pc.addEventListener('connectionstatechange', () => {
        if (pc.connectionState === 'failed') reject(new Error('Could not reach the camera over WebRTC'));
      });
      const onEvent = async (ev) => {
        switch (ev.type) {
          case 'session':
            session = ev.session_id;
            outbox.splice(0).forEach(sendCandidate);
            break;
          case 'answer':
            try {
              await pc.setRemoteDescription({ type: 'answer', sdp: ev.answer });
              answered = true;
              remote.splice(0).forEach(addRemote);
            } catch (err) { reject(err); }
            break;
          case 'candidate':
            if (answered) addRemote(ev.candidate);
            else remote.push(ev.candidate);
            break;
          case 'error':
            reject(new Error(ev.message || ev.code || 'The camera refused the video call'));
            break;
        }
      };
      client.subscribe({ type: 'camera/webrtc/offer', entity_id: entityId, offer: pc.localDescription.sdp }, onEvent)
        .then((id) => {
          if (run === this.run) this.sub = id;
          else client.unsubscribe(id);
        })
        .catch(async (err) => {
          if (err.code !== 'unknown_command') { reject(err); return; }
          // Before 2024.11: one request with the full offer, one answer back.
          try {
            await waitIceGathered(pc, 3000);
            const res = await client.send({ type: 'camera/web_rtc_offer', entity_id: entityId, offer: pc.localDescription.sdp });
            await pc.setRemoteDescription({ type: 'answer', sdp: res.answer });
          } catch (e) { reject(e); }
        });
    });
    failed.catch(() => {});
    await this._whenPlaying(video, 15_000, failed);
  }

  async _hls(run) {
    const { client, entityId } = this;
    const res = await client.send({ type: 'camera/stream', entity_id: entityId, format: 'hls' });
    if (run !== this.run) return;
    const src = new URL(res.url, `${client.url}/`).href;
    const video = this._newVideo();
    // Like Home Assistant's own player: hls.js where the browser has Media Source (it copes
    // better with live streams), the built-in player on iPhone and iPad.
    let Hls = null;
    if (!isIOS && window.MediaSource) Hls = await loadHlsJs().catch(() => null);
    if (run !== this.run) return;
    let failed = null;
    if (Hls?.isSupported()) {
      const hls = new Hls({
        backBufferLength: 60, fragLoadingTimeOut: 30_000, manifestLoadingTimeOut: 30_000,
        levelLoadingTimeOut: 30_000, maxLiveSyncPlaybackRate: 2, lowLatencyMode: true,
      });
      this.hls = hls;
      failed = new Promise((_, reject) => {
        hls.on(Hls.Events.ERROR, (_e, data) => {
          if (data.fatal) reject(new Error(`HLS: ${data.details}`));
        });
      });
      failed.catch(() => {});
      hls.loadSource(src);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = src;
    } else {
      throw new Error('This browser cannot play HLS');
    }
    await this._whenPlaying(video, 30_000, failed);
  }

  async _mjpeg() {
    const s = this.getState();
    const pic = s?.attributes?.entity_picture;
    const token = pic ? new URL(pic, `${this.client.url}/`).searchParams.get('token') : '';
    if (!token) throw new Error('The camera has no picture address');
    const img = document.createElement('img');
    img.className = 'cam-media';
    img.alt = '';
    img.src = `${this.client.url}/api/camera_proxy_stream/${encodeURIComponent(this.entityId)}?token=${encodeURIComponent(token)}`;
    this.stage.prepend(img);
    this.media = img;
    await this._whenPlaying(img, 15_000);
  }
}

// ---- people.js ----
// Where everyone is: Home Assistant's person entities (fed by the Companion app's GPS) and zones,
// on a Leaflet map. Leaflet and the map pictures come from the internet; the positions never
// leave Home Assistant except as the map area the tiles are fetched for.


const LEAFLET_URL = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist';
const LEAFLET_FILES = {
  js: ['leaflet.js', 'sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo='],
  css: ['leaflet.css', 'sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY='],
};
// OpenStreetMap's own map pictures: free, no key. Dark mode inverts them in CSS.
const MAP_TILES = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
const MAP_CREDIT = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors';
const PERSON_COLORS = ['#2f6fde', '#d0475c', '#1f8a4c', '#8a4fd8', '#d27a12', '#0f8f9a', '#b8478f', '#5a6b84'];

// ---------- reading Home Assistant's states ----------

function personFrom(s) {
  const a = s.attributes || {};
  const lat = Number(a.latitude);
  const lon = Number(a.longitude);
  const tracker = domainOf(s.entity_id) === 'device_tracker';
  return {
    id: s.entity_id,
    name: nameOf(s),
    state: s.state,
    located: Number.isFinite(lat) && Number.isFinite(lon) && !(lat === 0 && lon === 0),
    lat,
    lon,
    acc: Number(a.gps_accuracy) || 0,
    pic: a.entity_picture || '',
    source: tracker ? s.entity_id : a.source || '',
    changed: s.last_changed,
    unavailable: isUnavailable(s),
  };
}

/** Everyone to show: each person, plus GPS trackers (a car, a spare phone) no person uses. */
function peopleOf(states) {
  const all = [...states.values()];
  const persons = all.filter((s) => domainOf(s.entity_id) === 'person');
  const claimed = new Set(persons.flatMap((p) => p.attributes?.device_trackers || []));
  const loose = all.filter((s) => domainOf(s.entity_id) === 'device_tracker' && !claimed.has(s.entity_id)
    && s.attributes?.source_type === 'gps' && Number.isFinite(Number(s.attributes?.latitude)));
  return [...persons, ...loose].map(personFrom).sort((a, b) => a.name.localeCompare(b.name));
}

function zonesOf(states) {
  return [...states.values()]
    .filter((s) => domainOf(s.entity_id) === 'zone' && Number.isFinite(Number(s.attributes?.latitude)))
    .map((s) => ({
      id: s.entity_id,
      name: nameOf(s),
      lat: Number(s.attributes.latitude),
      lon: Number(s.attributes.longitude),
      radius: Number(s.attributes.radius) || 100,
      passive: !!s.attributes.passive,
      home: s.entity_id === 'zone.home',
      shop: s.attributes.icon === 'mdi:cart', // the supermarket zones the shopping reminder uses
    }));
}

/** "Home", "Away", or the zone they are in (Home Assistant puts the zone's name in the state). */
function placeLabel(p) {
  if (p.state === 'home') return 'Home';
  if (p.state === 'not_home') return 'Away';
  if (p.unavailable) return 'Unknown';
  return p.state;
}

function distanceKm(a, b) {
  const rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad;
  const dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 12742 * Math.asin(Math.sqrt(h));
}

function formatDistance(km, unit = 'km') {
  if (unit === 'mi') {
    const mi = km * 0.621371;
    return `${mi < 10 ? mi.toFixed(1) : Math.round(mi)} mi`;
  }
  if (km < 1) return `${Math.max(10, Math.round(km * 100) * 10)} m`;
  return `${km < 10 ? km.toFixed(1) : Math.round(km)} km`;
}

function personColor(name) {
  let h = 0;
  for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return PERSON_COLORS[h % PERSON_COLORS.length];
}

/** A round picture of the person (their Home Assistant picture, or initials). */
function avatarHtml(p, base, cls = 'pavatar') {
  const initials = p.name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '?';
  let src = '';
  try { src = p.pic ? new URL(p.pic, `${base}/`).href : ''; } catch { /* no picture */ }
  return `<span class="${cls}" style="--pc:${personColor(p.name)}" aria-hidden="true">${esc(initials)}${src
    ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;
}

// ---------- loading Leaflet ----------

let leafletLoading = null;
function loadLeaflet() {
  if (window.L?.map) return Promise.resolve(window.L);
  const add = (tag, attrs) => new Promise((resolve, reject) => {
    const el = Object.assign(document.createElement(tag), attrs, { crossOrigin: 'anonymous' });
    el.onload = resolve;
    el.onerror = () => { el.remove(); reject(new Error('The map could not load')); };
    document.head.append(el);
  });
  leafletLoading ||= Promise.all([
    add('link', { rel: 'stylesheet', href: `${LEAFLET_URL}/${LEAFLET_FILES.css[0]}`, integrity: LEAFLET_FILES.css[1] }),
    add('script', { src: `${LEAFLET_URL}/${LEAFLET_FILES.js[0]}`, integrity: LEAFLET_FILES.js[1] }),
  ]).then(() => {
    if (!window.L?.map) throw new Error('The map could not load');
    return window.L;
  }).catch((err) => {
    leafletLoading = null;
    throw err;
  });
  return leafletLoading;
}

function prefersDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
}

// ---------- the map ----------

/**
 * One map kept alive across redraws of Home: `el` is moved into each new page's slot.
 * On touch screens a finger scrolls the page past the map; pinch zooms it, and full screen
 * lets one finger pan too.
 */
class PeopleMap {
  constructor({ onPick }) {
    this.onPick = onPick;
    this.people = [];
    this.zones = [];
    this.base = '';
    this.markers = new Map();  // id -> { marker, ring, key }
    this.zoneLayers = new Map(); // id -> { circle, label, key }
    this.auto = true;          // keep everyone in view until the map is moved by hand
    this.fitKey = '';
    this.expanded = false;
    this.map = null;
    this.loading = null;
    this.fine = matchMedia('(hover: hover) and (pointer: fine)').matches;

    this.el = document.createElement('div');
    this.el.className = 'pmap';
    this.el.innerHTML = `
      <div class="pmap-canvas" role="region" aria-label="Map of where everyone is"></div>
      <div class="pmap-tools">
        <button type="button" class="pmap-btn" data-pmap="fit" aria-label="Show everyone">${icon('people')}</button>
        <button type="button" class="pmap-btn" data-pmap="expand" aria-label="Full screen map">${icon('fullscreen')}</button>
      </div>
      <p class="pmap-msg" hidden></p>`;
    this.canvas = this.el.querySelector('.pmap-canvas');
    this.msg = this.el.querySelector('.pmap-msg');

    this.el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-pmap]');
      if (b?.dataset.pmap === 'fit') this.fitAll({ force: true });
      else if (b?.dataset.pmap === 'expand') this.setExpanded(!this.expanded);
      else if (e.target.closest('.leaflet-control-zoom')) this.auto = false;
    });
    // Moving the map by hand stops it following everyone, until "Show everyone".
    const manual = () => { this.auto = false; };
    this.canvas.addEventListener('wheel', manual, { passive: true });
    this.canvas.addEventListener('dblclick', manual);
    this.canvas.addEventListener('touchmove', (e) => { if (e.touches.length > 1) manual(); }, { passive: true });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && this.expanded) this.setExpanded(false); });

    const retheme = () => this.applyTiles();
    new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', retheme);
  }

  /** Put the map into `slot` (a fresh page from a redraw), loading Leaflet the first time. */
  attach(slot) {
    if (!slot) return;
    this.slot = slot;
    if (!this.expanded && this.el.parentNode !== slot) slot.append(this.el);
    if (!this.loading) {
      this.msg.hidden = false;
      this.msg.textContent = 'Loading map…';
      this.loading = loadLeaflet().then((L) => this.create(L), () => {
        this.loading = null; // try again on the next redraw
        this.msg.hidden = false;
        this.msg.textContent = 'The map could not load. It needs an internet connection; the list below still shows where everyone is.';
      });
    }
    if (this.map) requestAnimationFrame(() => this.map?.invalidateSize(false));
  }

  create(L) {
    this.L = L;
    this.msg.hidden = true;
    this.map = L.map(this.canvas, {
      zoomControl: this.fine,
      dragging: this.fine,
      scrollWheelZoom: false,
      keyboard: this.fine,
      zoomSnap: 0.5,
      worldCopyJump: true,
    });
    this.map.attributionControl.setPrefix(false);
    this.map.on('dragstart', () => { this.auto = false; });
    this.applyTiles();
    this.sync();
  }

  applyTiles() {
    this.el.classList.toggle('dark', prefersDark());
    if (!this.map || this.tiles) return;
    // Home Assistant serves pages with "Referrer-Policy: no-referrer", and OpenStreetMap refuses
    // tiles asked for by an unnamed site. Send just the address of Home Assistant, as its own map does.
    this.tiles = this.L.tileLayer(MAP_TILES, { maxZoom: 19, attribution: MAP_CREDIT, referrerPolicy: 'origin' }).addTo(this.map);
  }

  update({ people, zones, base }) {
    this.people = people;
    this.zones = zones;
    this.base = base;
    this.sync();
  }

  sync() {
    if (!this.map) return;
    const L = this.L;

    const zoneSeen = new Set();
    for (const z of this.zones) {
      zoneSeen.add(z.id);
      const key = `${z.lat},${z.lon},${z.radius},${z.name},${z.passive},${z.shop}`;
      let entry = this.zoneLayers.get(z.id);
      if (entry?.key === key) continue;
      if (entry) { entry.circle.remove(); entry.label.remove(); }
      const cls = `pmap-zone${z.home ? ' home' : ''}${z.passive ? ' passive' : ''}${z.shop ? ' shop' : ''}`;
      const circle = L.circle([z.lat, z.lon], { radius: z.radius, className: cls, interactive: false }).addTo(this.map);
      // The name sits on the zone's top edge, clear of anyone standing in the middle.
      const top = z.shop ? [z.lat, z.lon] : [z.lat + z.radius / 111_320, z.lon];
      const label = L.marker(top, {
        interactive: false,
        keyboard: false,
        // Shops are many and small, so they get a cart instead of a name.
        icon: L.divIcon({ className: `pmap-zone-label${z.shop ? ' shop' : ''}`, html: z.shop ? `<span title="${esc(z.name)}">${icon('cart')}</span>` : `<span>${z.home ? icon('home') : ''}${esc(z.name)}</span>`, iconSize: null }),
      }).addTo(this.map);
      this.zoneLayers.set(z.id, { circle, label, key });
    }
    for (const [id, entry] of this.zoneLayers) {
      if (zoneSeen.has(id)) continue;
      entry.circle.remove();
      entry.label.remove();
      this.zoneLayers.delete(id);
    }

    // People in the same spot (everyone at home) stand side by side instead of on top of each other.
    const located = this.people.filter((p) => p.located);
    const spots = new Map();
    for (const p of located) {
      const k = `${p.lat.toFixed(3)},${p.lon.toFixed(3)}`;
      spots.set(k, [...(spots.get(k) || []), p.id]);
    }
    const seen = new Set();
    for (const p of located) {
      seen.add(p.id);
      const group = spots.get(`${p.lat.toFixed(3)},${p.lon.toFixed(3)}`);
      const shift = (group.indexOf(p.id) - (group.length - 1) / 2) * 46;
      const away = p.state !== 'home';
      const key = `${p.name}|${p.pic}|${away}|${shift}|${this.base}`;
      let entry = this.markers.get(p.id);
      if (!entry) {
        const marker = L.marker([p.lat, p.lon], { title: p.name, riseOnHover: true, keyboard: true })
          .on('click', () => this.onPick?.(p.id))
          .addTo(this.map);
        const ring = L.circle([p.lat, p.lon], { radius: p.acc, className: 'pmap-acc', interactive: false }).addTo(this.map);
        entry = { marker, ring, key: '' };
        this.markers.set(p.id, entry);
      }
      entry.marker.setLatLng([p.lat, p.lon]);
      entry.ring.setLatLng([p.lat, p.lon]).setRadius(p.acc);
      if (entry.key !== key) {
        entry.key = key;
        entry.marker.setIcon(L.divIcon({
          className: 'pmap-pin-wrap',
          iconSize: [44, 60],
          iconAnchor: [22 - shift, 22],
          html: `<span class="pmap-pin${away ? ' away' : ''}">${avatarHtml(p, this.base)}<span class="pmap-name">${esc(p.name.split(/\s+/)[0])}</span></span>`,
        }));
      }
    }
    for (const [id, entry] of this.markers) {
      if (seen.has(id)) continue;
      entry.marker.remove();
      entry.ring.remove();
      this.markers.delete(id);
    }

    if (this.pendingFocus) {
      const id = this.pendingFocus;
      this.pendingFocus = null;
      this.focus(id);
    } else if (this.auto) this.fitAll();
  }

  /** Frame everyone who shares a location, and home. */
  fitAll({ force = false } = {}) {
    if (force) this.auto = true;
    if (!this.map) return;
    const pts = this.people.filter((p) => p.located).map((p) => [p.lat, p.lon]);
    const home = this.zones.find((z) => z.home);
    if (home) pts.push([home.lat, home.lon]);
    // Small moves inside the frame do not need the map to jump about.
    const key = pts.map(([a, b]) => `${a.toFixed(2)},${b.toFixed(2)}`).join(';');
    if (!force && key === this.fitKey) return;
    const first = !this.fitKey;
    this.fitKey = key;
    const animate = !first;
    if (!pts.length) {
      this.map.setView([20, 0], 2, { animate });
      return;
    }
    const bounds = this.L.latLngBounds(pts);
    if (bounds.getNorthEast().distanceTo(bounds.getSouthWest()) < 300) {
      this.map.setView(bounds.getCenter(), 16, { animate });
      return;
    }
    this.map.fitBounds(bounds, { padding: [48, 48], maxZoom: 17, animate });
  }

  /** Centre the map on one person. */
  focus(id) {
    const p = this.people.find((x) => x.id === id);
    if (!p?.located) return;
    if (!this.map) {
      this.pendingFocus = id;
      return;
    }
    this.auto = false;
    this.map.setView([p.lat, p.lon], Math.max(this.map.getZoom(), 15), { animate: true });
    const pin = this.markers.get(id)?.marker.getElement()?.querySelector('.pmap-pin');
    if (pin) {
      pin.classList.remove('pulse');
      void pin.offsetWidth;
      pin.classList.add('pulse');
    }
  }

  setExpanded(on) {
    this.expanded = on;
    // Full screen lives on <body>: the frosted card around the map would trap a fixed element.
    if (on) document.body.append(this.el);
    else if (this.slot?.isConnected) this.slot.append(this.el);
    else this.el.remove();
    this.el.classList.toggle('expanded', on);
    document.documentElement.classList.toggle('pmap-open', on);
    const b = this.el.querySelector('[data-pmap="expand"]');
    b.innerHTML = icon(on ? 'close' : 'fullscreen');
    b.setAttribute('aria-label', on ? 'Close full screen map' : 'Full screen map');
    if (this.map) {
      // Full screen: one finger pans and the mouse wheel zooms. Inline on a phone they scroll the page.
      for (const h of ['dragging', 'keyboard']) if (!this.fine) this.map[h][on ? 'enable' : 'disable']();
      this.map.scrollWheelZoom[on ? 'enable' : 'disable']();
      requestAnimationFrame(() => {
        this.map.invalidateSize(false);
        if (this.auto) this.fitAll({ force: true });
      });
    }
  }
}

// ---- energy.js ----
// Solar, battery, grid and home power flow, drawn like the Sigen app.
// Works with Sigenergy Cloud or Sigenergy Local Modbus sensors (or any similar ones):
// sensors are found by name, and can be picked by hand in Settings.


const ENERGY_ROLES = [
  { key: 'solar', label: 'Solar power' },
  { key: 'grid', label: 'Grid power' },
  { key: 'battery', label: 'Battery power' },
  { key: 'home', label: 'Home use' },
  { key: 'soc', label: 'Battery level' },
];

const ENERGY_MATCH = {
  solar: { test: /\b(pv|solar|photovoltaic)\b/, skip: /string|mppt|daily|today|total|month|annual|year|lifetime|third.?party|rated|max/ },
  grid: { test: /\bgrid\b/, skip: /phase|frequency|voltage|current|reactive|limit|max|rated|daily|today|total/ },
  battery: { test: /\b(battery|bat|ess)\b/, skip: /available|max|rated|limit|capacity|daily|today|total|evdc|dc.?charger/ },
  home: { test: /\b(load|consumption|consumed|house|home)\b/, skip: /daily|today|total|month|annual|limit/ },
};

const ENERGY_TODAY = [
  { key: 'pvToday', label: 'Solar today', test: /(daily|today).*(pv|solar|generation)|(pv|solar).*(daily|today)/, skip: /month|annual|third|import|export|grid|battery|charg|consum|load|home/ },
  { key: 'importToday', label: 'Bought today', test: /(daily|today).*import|import.*(daily|today)/ },
  { key: 'exportToday', label: 'Sold today', test: /(daily|today).*export|export.*(daily|today)/ },
  { key: 'chargeToday', label: 'Charged today', test: /(daily|today).*charg|charg.*(daily|today)/, skip: /discharg|ev|charger/ },
  { key: 'dischargeToday', label: 'Discharged today', test: /(daily|today).*discharg|discharg.*(daily|today)/, skip: /ev|charger/ },
  { key: 'homeToday', label: 'Used today', test: /(daily|today).*(load|consum)|(load|consum).*(daily|today)/ },
];

function enText(s) {
  return `${s.entity_id.replace(/[._]/g, ' ')} ${s.attributes?.friendly_name || ''}`.toLowerCase();
}

function enIsPower(s) {
  const u = s.attributes?.unit_of_measurement;
  return s.entity_id.startsWith('sensor.') && (s.attributes?.device_class === 'power' || u === 'W' || u === 'kW');
}

function enIsEnergy(s) {
  const u = s.attributes?.unit_of_measurement;
  return s.entity_id.startsWith('sensor.') && (u === 'kWh' || u === 'Wh');
}

// Whole-system sensors win over one inverter's: shorter ids, no "_2" copies, Sigenergy "plant" names.
function enScore(s) {
  const id = s.entity_id;
  return id.length + (/_\d+$/.test(id) ? 40 : 0) - (/plant|sigen/.test(id) ? 15 : 0)
    + (/inverter|meter|gateway/.test(enText(s)) ? 30 : 0);
}

function enBest(list) {
  return list.sort((a, b) => enScore(a) - enScore(b))[0]?.entity_id || null;
}

// All power sensors, for the pickers in Settings.
function energyPowerSensors(states) {
  return [...states.values()].filter(enIsPower);
}

function energyBatterySensors(states) {
  return [...states.values()].filter((s) => s.entity_id.startsWith('sensor.')
    && s.attributes?.unit_of_measurement === '%'
    && (s.attributes?.device_class === 'battery' || /\b(soc|state of charge)\b/.test(enText(s))));
}

// role -> entity_id the dashboard would use on its own.
function energyAuto(states) {
  const power = energyPowerSensors(states);
  const found = {};
  for (const [role, m] of Object.entries(ENERGY_MATCH)) {
    found[role] = enBest(power.filter((s) => {
      const t = enText(s);
      return m.test.test(t) && !m.skip.test(t);
    }));
  }
  // The battery level: prefer the solar system's battery over phones and sensors.
  const socs = energyBatterySensors(states).filter((s) => /\b(soc|state of charge|plant|sigen|ess)\b/.test(enText(s)));
  found.soc = enBest(socs);
  return found;
}

function energyEntities(states, picks = {}) {
  const auto = energyAuto(states);
  const ids = {};
  for (const { key } of ENERGY_ROLES) {
    const p = picks[key];
    ids[key] = p === 'none' ? null : (p && states.has(p) ? p : auto[key]);
  }
  const energy = [...states.values()].filter(enIsEnergy);
  ids.today = {};
  for (const t of ENERGY_TODAY) {
    ids.today[t.key] = enBest(energy.filter((s) => {
      const x = enText(s);
      return t.test.test(x) && !(t.skip && t.skip.test(x));
    }));
  }
  return ids;
}

function enKw(s) {
  if (!s) return null;
  const v = Number(s.state);
  if (!Number.isFinite(v)) return null;
  return s.attributes?.unit_of_measurement === 'W' ? v / 1000 : v;
}

// Which way the grid and battery numbers point varies by integration. With all four powers known,
// the combination that adds up (solar + bought - sold + discharged - charged = home) tells us.
// sign.grid = 1: positive grid means buying; sign.battery = 1: positive battery means charging.
function energyLearnSigns({ solar, grid, battery, home }) {
  if ([solar, grid, battery, home].some((v) => v === null)) return null;
  const tries = [];
  for (const g of [1, -1]) for (const b of [1, -1]) tries.push({ g, b, err: Math.abs(solar + g * grid - b * battery - home) });
  tries.sort((x, y) => x.err - y.err);
  const scale = Math.max(home, solar, Math.abs(grid), Math.abs(battery), 0.3);
  if (tries[0].err > 0.2 * scale) return null; // the numbers do not add up; don't guess
  const out = {};
  // Only a sign that changes the sum can be learned from this reading.
  if (Math.abs(grid) > 0.1 && Math.abs(grid) > 0.15 * scale) out.grid = tries[0].g;
  if (Math.abs(battery) > 0.1 && Math.abs(battery) > 0.15 * scale) out.battery = tries[0].b;
  if (out.grid && out.battery) {
    const rival = tries.find((t) => t.g !== tries[0].g || t.b !== tries[0].b);
    if (rival.err - tries[0].err < 0.05) return null;
  }
  return Object.keys(out).length ? out : null;
}

// Positive, directional flows in kW, ready to draw.
function energyFlow(states, ids, sign = {}) {
  const get = (id) => (id ? states.get(id) : null);
  const raw = {
    solar: enKw(get(ids.solar)),
    grid: enKw(get(ids.grid)),
    battery: enKw(get(ids.battery)),
    home: enKw(get(ids.home)),
  };
  const sg = sign.grid || 1;
  const sb = sign.battery || 1;
  const solar = raw.solar === null ? null : Math.max(0, raw.solar);
  let grid = raw.grid === null ? null : sg * raw.grid;           // + buying
  const battery = raw.battery === null ? null : sb * raw.battery; // + charging
  let home = raw.home === null ? null : Math.max(0, raw.home);
  if (home === null && solar !== null && grid !== null) home = Math.max(0, solar + grid - (battery || 0));
  if (grid === null && solar !== null && home !== null) grid = home + (battery || 0) - solar;
  const socState = get(ids.soc);
  const soc = socState && Number.isFinite(Number(socState.state)) ? Number(socState.state) : null;
  const today = {};
  for (const t of ENERGY_TODAY) {
    const s = get(ids.today?.[t.key]);
    const v = s ? Number(s.state) : NaN;
    if (Number.isFinite(v)) today[t.key] = { id: s.entity_id, label: t.label, kwh: s.attributes?.unit_of_measurement === 'Wh' ? v / 1000 : v };
  }
  return {
    raw,
    solar,
    home,
    buying: grid === null ? null : Math.max(0, grid),
    selling: grid === null ? null : Math.max(0, -grid),
    charging: battery === null ? null : Math.max(0, battery),
    discharging: battery === null ? null : Math.max(0, -battery),
    hasGrid: grid !== null,
    hasBattery: battery !== null || soc !== null,
    soc,
    today,
    found: !!(ids.solar || ids.battery || ids.grid),
  };
}

function energyPower(kw) {
  if (kw === null || kw === undefined) return '–';
  const a = Math.abs(kw);
  if (a < 0.995) return `${Math.round(a * 1000)} W`;
  return `${a.toFixed(a < 10 ? 1 : 0)} kW`;
}

const EN_IDLE = 0.02; // kW; below this a line is drawn still

// Geometry (viewBox 360 x 280): solar on top, grid left, home right, battery below, the inverter in the middle.
const EN_HUB = { x: 180, y: 140 };
const EN_NODES = {
  solar: { x: 180, y: 46 },
  grid: { x: 52, y: 140 },
  home: { x: 308, y: 140 },
  battery: { x: 180, y: 234 },
};
const EN_R = 30;

function enLine(from, to, curve) {
  // From the edge of one circle to the edge of the other, bowed slightly so it reads as flowing.
  const a = EN_NODES[from] || EN_HUB;
  const b = EN_NODES[to] || EN_HUB;
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  const len = Math.hypot(dx, dy);
  const ra = EN_NODES[from] ? EN_R + 4 : 6;
  const rb = EN_NODES[to] ? EN_R + 4 : 6;
  const x1 = a.x + (dx / len) * ra;
  const y1 = a.y + (dy / len) * ra;
  const x2 = b.x - (dx / len) * rb;
  const y2 = b.y - (dy / len) * rb;
  const mx = (x1 + x2) / 2 - (dy / len) * curve;
  const my = (y1 + y2) / 2 + (dx / len) * curve;
  return `M${x1.toFixed(1)} ${y1.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}`;
}

// One leg between a node and the hub. `out` = power flows from the hub to the node.
function enLeg(node, kw, out, cls) {
  const on = kw !== null && kw > EN_IDLE;
  const d = out ? enLine('hub', node, 0) : enLine(node, 'hub', 0);
  // Faster dots for more power.
  const dur = on ? Math.max(0.7, 2.6 - Math.log10(1 + kw * 4) * 1.5) : 0;
  return `<path class="en-track" d="${d}"/>
    ${on ? `<path class="en-flow ${cls}" d="${d}" style="animation-duration:${dur.toFixed(2)}s"/>` : ''}`;
}

const EN_ICON = {
  solar: `<g class="en-glyph" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M5 5h14l2.5 10h-19z"/><path d="M3.8 10h16.4M9.7 5l-.8 10M14.3 5l.8 10"/><path d="M12 15v4M8.5 19h7"/></g>`,
  grid: `<g class="en-glyph" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round">
    <path d="M8 22 12 2l4 20"/><path d="M5 6h14M6.8 11h10.4M9 16.5h6"/><path d="M8.6 6l6.6 5M15.4 6l-6.6 5M9.6 11l5.2 5.5M14.4 11l-5.2 5.5"/></g>`,
  home: `<path class="en-glyph" fill="currentColor" d="${ICONS.home}"/>`,
};

function enBatteryIcon(soc) {
  const level = soc === null ? 0 : Math.max(0, Math.min(100, soc));
  const h = (14.5 * level) / 100;
  return `<g class="en-glyph">
    <rect x="9.5" y="1.5" width="5" height="2.2" rx="0.8" fill="currentColor"/>
    <rect x="6.5" y="3.6" width="11" height="18.4" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/>
    ${h > 0.3 ? `<rect class="en-level${level < 15 ? ' low' : ''}" x="8.4" y="${(20.2 - h).toFixed(2)}" width="7.2" height="${h.toFixed(2)}" rx="1"/>` : ''}
  </g>`;
}

function enNode(key, glyph, entity, label, value, sub, labelAt) {
  const n = EN_NODES[key];
  const tag = entity ? `role="button" tabindex="0" data-energy="${esc(entity)}" aria-label="${esc(`${label}: ${value}${sub ? `, ${sub}` : ''}`)}"` : '';
  const anchor = labelAt === 'right' ? 'start' : 'middle';
  const lx = labelAt === 'right' ? n.x + EN_R + 12 : n.x;
  const ly = labelAt === 'right' ? n.y - 6 : n.y + EN_R + 20;
  return `<g class="en-node en-${key}" ${tag}>
    <circle class="en-ring" cx="${n.x}" cy="${n.y}" r="${EN_R}"/>
    <g transform="translate(${n.x - 14.4} ${n.y - 14.4}) scale(1.2)">${glyph}</g>
    <text class="en-label" x="${lx}" y="${ly}" text-anchor="${anchor}">${esc(label)}</text>
    <text class="en-value" x="${lx}" y="${ly + 19}" text-anchor="${anchor}">${esc(value)}</text>
    ${sub ? `<text class="en-sub" x="${lx}" y="${ly + 35}" text-anchor="${anchor}">${esc(sub)}</text>` : ''}
  </g>`;
}

// opts.title: the heading over the card ('' for none); opts.today: today's totals to show (defaults to the sensors').
function energyHtml(flow, ids, opts = {}) {
  const f = flow;
  const gridKw = f.buying > EN_IDLE ? f.buying : f.selling;
  const gridSub = !f.hasGrid ? '' : f.buying > EN_IDLE ? 'Buying' : f.selling > EN_IDLE ? 'Selling' : 'Idle';
  const batKw = f.charging > EN_IDLE ? f.charging : f.discharging;
  const batSub = f.charging > EN_IDLE ? 'Charging' : f.discharging > EN_IDLE ? 'Discharging' : f.raw.battery !== null ? 'Idle' : '';
  const batValue = f.soc !== null ? `${Math.round(f.soc)}%` : energyPower(batKw);
  const batLine = [f.soc !== null && f.raw.battery !== null ? energyPower(batKw) : '', batSub].filter(Boolean).join(' · ');

  const legs = [
    enLeg('solar', f.solar, false, 'solar'),
    f.hasGrid ? enLeg('grid', gridKw, f.selling > EN_IDLE, f.selling > EN_IDLE ? 'solar' : 'grid') : '',
    f.hasBattery ? enLeg('battery', batKw, f.charging > EN_IDLE, 'battery') : '',
    enLeg('home', f.home, true, 'home'),
  ].join('');

  const today = opts.today || Object.values(f.today);
  const title = opts.title ?? 'Solar and battery';
  return `<section class="energy">
    ${title ? `<h2 class="section-title">${esc(title)}</h2>` : ''}
    <div class="energy-card">
      <svg class="energy-svg" viewBox="0 0 360 280" role="group" aria-label="Power flow">
        ${legs}
        <circle class="en-hub" cx="${EN_HUB.x}" cy="${EN_HUB.y}" r="6"/>
        ${enNode('solar', EN_ICON.solar, ids.solar, 'Solar', energyPower(f.solar), '', 'right')}
        ${f.hasGrid ? enNode('grid', EN_ICON.grid, ids.grid, 'Grid', energyPower(gridKw), gridSub) : ''}
        ${enNode('home', EN_ICON.home, ids.home, 'Home', energyPower(f.home), '')}
        ${f.hasBattery ? enNode('battery', enBatteryIcon(f.soc), ids.soc || ids.battery, 'Battery', batValue, batLine, 'right') : ''}
      </svg>
      ${today.length ? `<div class="energy-today">${today.map(enStat).join('')}</div>` : ''}
    </div>
  </section>`;
}

// One of today's totals: a sensor's (tap for its history) or worked out from the last 24 hours ("est.").
function enStat(t) {
  const value = t.pct !== undefined
    ? `${Math.round(t.pct)}<small>%</small>`
    : `${t.kwh.toFixed(t.kwh < 100 ? 1 : 0)} <small>kWh</small>`;
  const body = `<span class="energy-stat-value">${value}</span>
    <span class="energy-stat-label">${esc(t.label)}${t.est ? ' <small title="Worked out from the power readings">est.</small>' : ''}</span>`;
  return t.id
    ? `<button type="button" class="energy-stat" data-energy="${esc(t.id)}">${body}</button>`
    : `<div class="energy-stat">${body}</div>`;
}

// After drawing: start each moving line where the clock says it should be, so redraws don't make the dots jump.
function energyAnimate(root) {
  const t = performance.now() / 1000;
  for (const el of root.querySelectorAll('.en-flow')) {
    const dur = parseFloat(el.style.animationDuration) || 1;
    el.style.animationDelay = `${-(t % dur).toFixed(2)}s`;
  }
}

// ---------- the last 24 hours ----------

const ENERGY_SLOT = 5 * 60_000; // charts and totals work in 5-minute slots

// Readings ([{ t, s }], oldest first) as one value per slot ending at `end`: the slot's readings averaged,
// or the last reading held through a quiet slot. null where the sensor had no number.
function enSlots(points, end, scale, hours = 24) {
  const n = (hours * 3_600_000) / ENERGY_SLOT;
  const start = end - n * ENERGY_SLOT;
  const out = new Array(n).fill(null);
  let i = 0;
  let last = null;
  const val = (p) => { const v = Number(p.s); return Number.isFinite(v) ? v * scale : null; };
  for (let k = 0; k < n; k++) {
    const a = start + k * ENERGY_SLOT;
    const b = a + ENERGY_SLOT;
    while (i < points.length && points[i].t < a) last = val(points[i++]);
    let sum = last ?? 0;
    let cnt = last === null ? 0 : 1;
    while (i < points.length && points[i].t < b) {
      last = val(points[i++]);
      if (last !== null) { sum += last; cnt++; }
    }
    out[k] = cnt && last !== null ? sum / cnt : null;
  }
  return out;
}

/**
 * Slot values for each role from recorded history, with the same signs as the live flow:
 * grid + buying, battery + charging, all in kW (battery level in %). Home is worked out when there is no sensor.
 * hist: role -> [{ t, s }]
 */
function energyHistoryModel(hist, ids, states, sign, end) {
  const scale = (id) => (states.get(id)?.attributes?.unit_of_measurement === 'W' ? 1 / 1000 : 1);
  const m = { end, start: end - 24 * 3_600_000 };
  for (const role of ['solar', 'grid', 'battery', 'home', 'soc']) {
    if (ids[role] && hist[role]) m[role] = enSlots(hist[role], end, role === 'soc' ? 1 : scale(ids[role]));
  }
  const times = (arr, k) => arr && arr.map((v) => (v === null ? null : v * k));
  m.grid = times(m.grid, sign.grid || 1);
  m.battery = times(m.battery, sign.battery || 1);
  if (m.solar) m.solar = m.solar.map((v) => (v === null ? null : Math.max(0, v)));
  if (!m.home && m.solar && m.grid) {
    m.home = m.solar.map((s, k) => (s === null || m.grid[k] === null ? null : Math.max(0, s + m.grid[k] - (m.battery?.[k] || 0))));
  }
  return m;
}

// kWh since midnight from slot values; part = 1 counts the positive side, -1 the negative side.
function enKwhToday(values, m, part = 1) {
  if (!values) return null;
  const midnight = new Date(m.end - 1);
  midnight.setHours(0, 0, 0, 0);
  const from = Math.max(0, Math.ceil((midnight - m.start) / ENERGY_SLOT));
  let kwh = 0;
  let seen = false;
  for (let k = from; k < values.length; k++) {
    if (values[k] === null) continue;
    seen = true;
    kwh += Math.max(0, part * values[k]) * (ENERGY_SLOT / 3_600_000);
  }
  return seen ? kwh : null;
}

/** Today's totals: the integration's own daily sensors where there are any, else worked out from history. */
function energyToday(flow, m) {
  const est = m ? {
    pvToday: enKwhToday(m.solar, m),
    importToday: enKwhToday(m.grid, m, 1),
    exportToday: enKwhToday(m.grid, m, -1),
    chargeToday: enKwhToday(m.battery, m, 1),
    dischargeToday: enKwhToday(m.battery, m, -1),
    homeToday: enKwhToday(m.home, m),
  } : {};
  const out = [];
  for (const t of ENERGY_TODAY) {
    if (flow.today[t.key]) out.push(flow.today[t.key]);
    else if (est[t.key] != null) out.push({ id: null, label: t.label, kwh: est[t.key], est: true });
  }
  const get = (k) => out.find((t) => t.label === ENERGY_TODAY.find((x) => x.key === k).label);
  const used = get('homeToday');
  const bought = get('importToday');
  if (used && bought && used.kwh > 0.5) {
    out.push({ id: null, label: 'Self-powered', pct: Math.max(0, Math.min(100, (1 - bought.kwh / used.kwh) * 100)), est: used.est || bought.est });
  }
  return out;
}

const EN_W = 600;
const EN_H = 120;
const enCharts = new Map(); // chart key -> { m, series } for the tap/hover readout

function enNice(v) {
  for (const s of [0.5, 1, 2, 3, 4, 5, 6, 8, 10, 12, 15, 20, 25, 30, 40, 50]) if (v <= s) return s;
  return Math.ceil(v / 10) * 10;
}

// Runs of values without gaps, as [[k, v], ...].
function enRuns(values) {
  const runs = [];
  let run = [];
  values.forEach((v, k) => {
    if (v === null) { if (run.length) runs.push(run); run = []; } else run.push([k, v]);
  });
  if (run.length) runs.push(run);
  return runs;
}

function enChart({ key, title, m, series, min, max, unit, summary }) {
  const n = m.start === undefined ? 0 : (m.end - m.start) / ENERGY_SLOT;
  const x = (k) => ((k + 0.5) / n) * EN_W;
  const y = (v) => EN_H - ((Math.max(min, Math.min(max, v)) - min) / (max - min)) * EN_H;
  const base = y(Math.max(min, 0));
  const paths = series.map((s) => enRuns(s.values).map((run) => {
    const line = run.map(([k, v], i) => `${i ? 'L' : 'M'}${x(k).toFixed(1)} ${y(v).toFixed(1)}`).join('');
    const first = x(run[0][0]).toFixed(1);
    const lastX = x(run[run.length - 1][0]).toFixed(1);
    return `${s.area ? `<path class="en-area ${s.cls}" d="M${first} ${base.toFixed(1)}L${line.slice(1)}L${lastX} ${base.toFixed(1)}Z"/>` : ''}
      <path class="en-line ${s.cls}" d="${line}" vector-effect="non-scaling-stroke"/>`;
  }).join('')).join('');
  const axisLabel = (v) => (unit === '%' ? `${v}%` : `${Math.abs(v)} kW`);
  const ticks = [];
  const tick = new Date(m.start);
  tick.setMinutes(0, 0, 0);
  while (+tick < m.end) {
    if (+tick > m.start + 3_600_000 && tick.getHours() % 6 === 0) {
      ticks.push(`<span style="left:${(((+tick - m.start) / (m.end - m.start)) * 100).toFixed(2)}%">${esc(tick.toLocaleTimeString(undefined, { hour: 'numeric' }))}</span>`);
    }
    tick.setHours(tick.getHours() + 1);
  }
  enCharts.set(key, { m, series });
  const legend = series.filter((s) => s.label).map((s) => `<span class="en-key ${s.cls}">${esc(s.label)}</span>`).join('');
  return `<figure class="en-chart" data-chart="${key}">
    <figcaption class="en-chart-head">
      <span class="en-chart-title">${esc(title)}</span>
      <span class="en-chart-info muted">${legend}${summary ? `<span>${esc(summary)}</span>` : ''}</span>
      <span class="en-readout" hidden></span>
    </figcaption>
    <div class="en-plot">
      <svg viewBox="0 0 ${EN_W} ${EN_H}" preserveAspectRatio="none" aria-hidden="true">
        <line class="en-grid-line" x1="0" x2="${EN_W}" y1="0.5" y2="0.5" vector-effect="non-scaling-stroke"/>
        <line class="en-grid-line zero" x1="0" x2="${EN_W}" y1="${base.toFixed(1)}" y2="${base.toFixed(1)}" vector-effect="non-scaling-stroke"/>
        ${min < 0 ? `<line class="en-grid-line" x1="0" x2="${EN_W}" y1="${EN_H - 0.5}" y2="${EN_H - 0.5}" vector-effect="non-scaling-stroke"/>` : ''}
        ${paths}
      </svg>
      <span class="en-y top" style="top:0">${axisLabel(max)}</span>
      ${min < 0 ? `<span class="en-y bottom" style="top:100%">${axisLabel(min)}</span>` : ''}
      <span class="en-cursor" hidden></span>
    </div>
    <div class="en-x muted">${ticks.join('')}</div>
  </figure>`;
}

function enPeak(values) {
  let best = -1;
  values.forEach((v, k) => { if (v !== null && (best < 0 || v > values[best])) best = k; });
  return best;
}

const enTime = (m, k) => new Date(m.start + (k + 0.5) * ENERGY_SLOT).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const enPos = (v) => (v === null ? null : Math.max(0, v));
const enNeg = (v) => (v === null ? null : Math.min(0, v));

/** The 24-hour charts: solar and home use, the grid, the battery. */
function energyChartsHtml(m, { loading = false, error = '' } = {}) {
  if (loading && !m) return '<div class="chart chart-loading"><div class="spinner" aria-hidden="true"></div></div>';
  if (error && !m) return `<p class="muted">History unavailable (${esc(error)}).</p>`;
  if (!m) return '';
  const top = (...arrs) => enNice(Math.max(0.1, ...arrs.flat().filter((v) => v !== null).map(Math.abs)));
  const charts = [];
  if (m.solar || m.home) {
    const peak = m.solar ? enPeak(m.solar) : -1;
    charts.push(enChart({
      key: 'solar',
      title: 'Solar and home use',
      m,
      series: [
        m.solar && { name: 'Solar', label: 'Solar', cls: 'solar', values: m.solar, area: true, fmt: (v) => `Solar ${energyPower(v)}` },
        m.home && { name: 'Home', label: 'Home', cls: 'home', values: m.home, fmt: (v) => `Home ${energyPower(v)}` },
      ].filter(Boolean),
      min: 0,
      max: top(m.solar || [], m.home || []),
      summary: peak >= 0 && m.solar[peak] > 0.05 ? `Peak ${energyPower(m.solar[peak])} at ${enTime(m, peak)}` : '',
    }));
  }
  if (m.grid) {
    const buy = m.grid.map(enPos);
    const sell = m.grid.map(enNeg);
    const hasSell = sell.some((v) => v !== null && v < -0.01);
    charts.push(enChart({
      key: 'grid',
      title: 'Grid',
      m,
      series: [
        { name: 'Bought', label: 'Bought', cls: 'grid', values: buy, area: true, fmt: (v) => (v > 0.005 ? `Buying ${energyPower(v)}` : null) },
        hasSell && { name: 'Sold', label: 'Sold', cls: 'solar', values: sell, area: true, fmt: (v) => (v < -0.005 ? `Selling ${energyPower(-v)}` : null) },
      ].filter(Boolean),
      min: hasSell ? -top(sell) : 0,
      max: top(buy),
    }));
  }
  if (m.soc) {
    charts.push(enChart({
      key: 'battery',
      title: 'Battery level',
      m,
      series: [{ name: 'Battery', cls: 'battery', values: m.soc, area: true, fmt: (v) => `Battery ${Math.round(v)}%` }],
      min: 0,
      max: 100,
      unit: '%',
    }));
  } else if (m.battery) {
    const lim = top(m.battery);
    charts.push(enChart({
      key: 'battery',
      title: 'Battery',
      m,
      series: [
        { name: 'Charging', label: 'Charging', cls: 'battery', values: m.battery.map(enPos), area: true, fmt: (v) => (v > 0.005 ? `Charging ${energyPower(v)}` : null) },
        { name: 'Discharging', label: 'Discharging', cls: 'home', values: m.battery.map(enNeg), area: true, fmt: (v) => (v < -0.005 ? `Discharging ${energyPower(-v)}` : null) },
      ],
      min: -lim,
      max: lim,
    }));
  }
  if (!charts.length) return '';
  return `<div class="en-charts">${charts.join('')}</div>`;
}

// Touch or hover a chart to read the values at that time; mouse readouts clear on leave, touch ones after a moment.
function energyChartsWire(root) {
  for (const fig of root.querySelectorAll('.en-chart')) {
    const data = enCharts.get(fig.dataset.chart);
    if (!data) continue;
    const plot = fig.querySelector('.en-plot');
    const cursor = fig.querySelector('.en-cursor');
    const info = fig.querySelector('.en-chart-info');
    const readout = fig.querySelector('.en-readout');
    const n = data.series[0].values.length;
    let timer = 0;
    const hide = () => { cursor.hidden = true; readout.hidden = true; info.hidden = false; };
    const show = (e) => {
      const r = plot.getBoundingClientRect();
      const k = Math.max(0, Math.min(n - 1, Math.floor(((e.clientX - r.left) / r.width) * n)));
      const parts = data.series.map((s) => (s.values[k] === null ? null : s.fmt(s.values[k]))).filter(Boolean);
      readout.textContent = `${enTime(data.m, k)} · ${parts.length ? parts.join(' · ') : (data.series[0].values[k] === null ? 'No reading' : 'Idle')}`;
      cursor.style.left = `${(((k + 0.5) / n) * 100).toFixed(2)}%`;
      cursor.hidden = false;
      readout.hidden = false;
      info.hidden = true;
      clearTimeout(timer);
      if (e.pointerType !== 'mouse') timer = setTimeout(hide, 4000);
    };
    plot.addEventListener('pointerdown', show);
    plot.addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse' || e.buttons) show(e); });
    plot.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hide(); });
  }
}

// ---- calendar.js ----
// Family calendar for Home: events from Home Assistant calendar.* entities, as an upcoming list or a month grid.


const CAL_COLORS = ['#2f6fde', '#e0598b', '#1f9d55', '#e09a1f', '#7c5cd6', '#1a8fb0', '#d4513b', '#6b7a8f'];
const CAL_DAY_MS = 86_400_000;

function calendarsOf(states) {
  return [...states.values()]
    .filter((s) => domainOf(s.entity_id) === 'calendar')
    .sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
}

const calStartOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const calAddDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const calDayKey = (d) =>
  `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const calFromKey = (k) => new Date(`${k}T00:00:00`);

/**
 * One event from calendar.get_events ({start: '2026-10-01' | ISO date-time}) or the REST API
 * ({start: {date} | {dateTime}}), as { cal, title, start, end, allDay, location, description }.
 */
function calParse(raw, cal) {
  const s = raw.start?.dateTime || raw.start?.date || raw.start;
  const e = raw.end?.dateTime || raw.end?.date || raw.end || s;
  const allDay = /^\d{4}-\d{2}-\d{2}$/.test(s);
  const parse = (v) => (allDay ? new Date(`${v}T00:00:00`) : new Date(v));
  const start = parse(s);
  let end = parse(e);
  if (allDay && end <= start) end = calAddDays(start, 1);
  if (end < start) end = start;
  return {
    cal,
    title: (raw.summary || raw.message || 'Event').trim(),
    start,
    end,
    allDay,
    location: raw.location || '',
    // Google Calendar descriptions can carry HTML; show them as plain text.
    description: (raw.description || '').replace(/<br\s*\/?>/gi, '\n').replace(/<[^>]+>/g, '').trim(),
  };
}

function calSort(a, b) {
  return (b.allDay - a.allDay) || (a.start - b.start) || a.title.localeCompare(b.title);
}

/** Events on one local day (multi-day events show on every day they cover). */
function calOnDay(events, day) {
  const from = calStartOfDay(day);
  const to = calAddDays(from, 1);
  return events
    .filter((ev) => ev.start < to && (ev.end > from || (+ev.end === +ev.start && ev.start >= from)))
    .sort(calSort);
}

const timeFmt = (d) => d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

function calTimeLabel(ev, day) {
  if (ev.allDay) return 'All day';
  const from = calStartOfDay(day);
  const to = calAddDays(from, 1);
  const startsToday = ev.start >= from;
  const endsToday = ev.end <= to;
  if (!startsToday && !endsToday) return 'All day';
  if (!startsToday) return `Until ${timeFmt(ev.end)}`;
  if (+ev.end === +ev.start) return timeFmt(ev.start);
  return endsToday ? `${timeFmt(ev.start)} – ${timeFmt(ev.end)}` : `From ${timeFmt(ev.start)}`;
}

// "9:00 AM – 10:00 AM" as the start with the end under it, so the time column stays narrow.
function calTimeHtml(label) {
  const [from, to] = label.split(' – ');
  return to ? `${esc(from)}<small>– ${esc(to)}</small>` : esc(label);
}

function calDayLabel(day, today) {
  const diff = Math.round((calStartOfDay(day) - calStartOfDay(today)) / CAL_DAY_MS);
  const date = day.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
  if (diff === 0) return `Today · ${date}`;
  if (diff === 1) return `Tomorrow · ${date}`;
  return date;
}

function calRow(ev, day, colors, now) {
  const done = !ev.allDay && ev.end <= now;
  return `<div class="cal-ev${done ? ' done' : ''}" style="--cal:${colors[ev.cal] || CAL_COLORS[0]}">
      <span class="cal-time">${calTimeHtml(calTimeLabel(ev, day))}</span>
      <span class="cal-title">${esc(ev.title)}${ev.location ? `<small>${esc(ev.location)}</small>` : ''}</span>
    </div>`;
}

/** The next `days` days, each day that has something on, with Today always shown. */
function calAgendaHtml(events, { now = new Date(), days = 14, colors = {} } = {}) {
  const today = calStartOfDay(now);
  const out = [];
  for (let i = 0; i < days; i++) {
    const day = calAddDays(today, i);
    const list = calOnDay(events, day);
    if (!list.length && i > 0) continue;
    out.push(`<button type="button" class="cal-day" data-cal-day="${calDayKey(day)}">
      <span class="cal-day-label">${esc(calDayLabel(day, now))}</span>
      ${list.length ? list.map((ev) => calRow(ev, day, colors, now)).join('') : '<span class="cal-none muted">Nothing on today</span>'}
    </button>`);
  }
  if (out.length === 1 && !calOnDay(events, today).length) {
    out.push(`<p class="muted cal-empty">Nothing in the next ${days} days.</p>`);
  }
  return `<div class="cal-agenda">${out.join('')}</div>`;
}

/** First day of the month grid: the Monday on or before the 1st. */
function calGridStart(month) {
  const first = new Date(month.getFullYear(), month.getMonth(), 1);
  return calAddDays(first, -((first.getDay() + 6) % 7));
}

function calMonthHtml(events, month, { now = new Date(), colors = {} } = {}) {
  const start = calGridStart(month);
  const todayKey = calDayKey(now);
  const names = [...Array(7)].map((_, i) => calAddDays(start, i).toLocaleDateString(undefined, { weekday: 'narrow' }));
  const weeks = [];
  for (let w = 0; w < 6; w++) {
    const first = calAddDays(start, w * 7);
    if (w >= 4 && first.getMonth() !== month.getMonth()) break;
    weeks.push([...Array(7)].map((_, i) => calAddDays(first, i)));
  }
  const cell = (day) => {
    const list = calOnDay(events, day);
    const other = day.getMonth() !== month.getMonth();
    const key = calDayKey(day);
    return `<button type="button" class="cal-cell${other ? ' other' : ''}${key === todayKey ? ' today' : ''}" data-cal-day="${key}"
        aria-label="${esc(day.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }))}, ${list.length} ${list.length === 1 ? 'event' : 'events'}">
      <span class="cal-num">${day.getDate()}</span>
      ${list.slice(0, 3).map((ev) => `<span class="cal-chip" style="--cal:${colors[ev.cal] || CAL_COLORS[0]}">${esc(ev.title)}</span>`).join('')}
      ${list.length > 3 ? `<span class="cal-more">+${list.length - 3}</span>` : ''}
    </button>`;
  };
  return `<div class="cal-month">
    <div class="cal-month-head">
      <button type="button" class="icon-btn" data-cal-month="-1" aria-label="Previous month">${icon('chevronLeft')}</button>
      <button type="button" class="cal-month-name" data-cal-month="0">${esc(month.toLocaleDateString(undefined, { month: 'long', year: 'numeric' }))}</button>
      <button type="button" class="icon-btn" data-cal-month="1" aria-label="Next month">${icon('chevronRight')}</button>
    </div>
    <div class="cal-grid">
      ${names.map((n) => `<span class="cal-wd">${esc(n)}</span>`).join('')}
      ${weeks.flat().map(cell).join('')}
    </div>
  </div>`;
}

/** Everything on one day, for the sheet. */
function calDaySheetHtml(events, day, { now = new Date(), colors = {}, calNames = {} } = {}) {
  const list = calOnDay(events, day);
  return `
    <div class="sheet-head">
      <span class="tile-icon">${icon('calendar')}</span>
      <div>
        <h2 id="detail-title">${esc(calDayLabel(day, now))}</h2>
        <p class="muted">${list.length ? `${list.length} ${list.length === 1 ? 'event' : 'events'}` : 'Nothing on'}</p>
      </div>
      <button type="button" class="icon-btn" data-close aria-label="Close">${icon('close')}</button>
    </div>
    <div class="sheet-body cal-sheet">
      ${list.map((ev) => `<div class="cal-ev big" style="--cal:${colors[ev.cal] || CAL_COLORS[0]}">
        <span class="cal-time">${calTimeHtml(calTimeLabel(ev, day))}</span>
        <span class="cal-title">${esc(ev.title)}
          <small>${esc([calNames[ev.cal], ev.location].filter(Boolean).join(' · '))}</small>
          ${ev.description ? `<span class="cal-desc">${esc(ev.description)}</span>` : ''}
        </span>
      </div>`).join('') || '<p class="muted">Nothing on this day.</p>'}
    </div>`;
}

// ---- brief.js ----
// The day-ahead summary on Home: facts gathered from Home Assistant, written up by an AI agent that is
// set up in Home Assistant (AI Task or a conversation agent), or by a simple template when there is none.


const WEATHER_WORDS = {
  'clear-night': 'clear', cloudy: 'cloudy', exceptional: 'unusual weather', fog: 'foggy', hail: 'hail',
  lightning: 'lightning', 'lightning-rainy': 'storms', partlycloudy: 'partly cloudy', pouring: 'heavy rain',
  rainy: 'rain', snowy: 'snow', 'snowy-rainy': 'sleet', sunny: 'sunny', windy: 'windy', 'windy-variant': 'windy',
};
const weatherWord = (c) => WEATHER_WORDS[c] || (c ? c.replace(/[-_]/g, ' ') : '');

function dayPart(now = new Date()) {
  const h = now.getHours();
  if (h >= 5 && h < 12) return 'morning';
  if (h >= 12 && h < 17) return 'afternoon';
  if (h >= 17 && h < 22) return 'evening';
  return 'night';
}

function greetingFor(now = new Date()) {
  return { morning: 'Good morning', afternoon: 'Good afternoon', evening: 'Good evening', night: 'Good night' }[dayPart(now)];
}

/** AI Task entities first (made for this), then conversation agents other than the built-in one. */
function briefAgents(states) {
  const all = [...states.values()];
  const pick = (d) => all.filter((s) => domainOf(s.entity_id) === d && s.state !== 'unavailable')
    .sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
  return [
    ...pick('ai_task').map((s) => ({ id: s.entity_id, name: nameOf(s), kind: 'ai_task' })),
    ...pick('conversation').filter((s) => s.entity_id !== 'conversation.home_assistant')
      .map((s) => ({ id: s.entity_id, name: nameOf(s), kind: 'conversation' })),
  ];
}

const fmtT = (d) => d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });

/**
 * What the summary is about. `key` changes only when something worth a new summary changes
 * (not every minute or every tenth of a degree).
 */
function briefFacts({ now = new Date(), place = '', weather = null, unit = '°', forecast = null, events = [], calNames = {}, people = [] }) {
  const part = dayPart(now);
  const today = calStartOfDay(now);
  const evLine = (ev, day) => `${calTimeLabel(ev, day)}: ${ev.title}${ev.location ? ` (${ev.location})` : ''}${calNames[ev.cal] ? ` [${calNames[ev.cal]}]` : ''}`;
  const todays = calOnDay(events, today).filter((ev) => ev.allDay || ev.end > now);
  const tomorrow = calAddDays(today, 1);
  const tomorrows = calOnDay(events, tomorrow);
  const w = weather && weather.state !== 'unavailable' ? weather : null;
  const facts = {
    part,
    date: now.toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'long' }),
    time: fmtT(now),
    place,
    weatherNow: w ? `${weatherWord(w.state)}${w.attributes?.temperature != null ? `, ${w.attributes.temperature}${unit}` : ''}` : '',
    forecast: forecast ? [
      weatherWord(forecast.condition),
      forecast.temperature != null ? `high ${Math.round(forecast.temperature)}${unit}` : '',
      forecast.templow != null ? `low ${Math.round(forecast.templow)}${unit}` : '',
      forecast.precipitation_probability != null ? `${forecast.precipitation_probability}% chance of rain` : '',
    ].filter(Boolean).join(', ') : '',
    today: todays.map((ev) => evLine(ev, today)),
    tomorrow: tomorrows.map((ev) => evLine(ev, tomorrow)),
    people: people.map((p) => `${p.name}: ${p.place}`),
    // for the template
    _today: todays,
    _tomorrow: tomorrows,
    _temp: w?.attributes?.temperature,
    _unit: unit,
  };
  facts.key = JSON.stringify([today.toDateString(), part, facts.today, facts.tomorrow,
    w?.state || '', forecast?.condition || '', forecast?.temperature != null ? Math.round(forecast.temperature) : '',
    people.map((p) => p.place === 'Home')]);
  return facts;
}

function briefPrompt(f) {
  const later = f.part === 'evening' || f.part === 'night';
  return [
    `Write a short day-ahead summary for a family's home dashboard${f.place ? ` (${f.place})` : ''}.`,
    `It is ${f.date}, ${f.time} (${f.part}).`,
    'Write 2 or 3 short, warm, practical sentences, at most 60 words, in plain text: no greeting (the dashboard already says hello), no lists, no emoji, no markdown.',
    later
      ? 'It is late in the day, so mention anything still on tonight and focus on what tomorrow brings.'
      : 'Focus on what is coming up today; mention tomorrow only if something early needs preparing tonight.',
    'Mention the weather and anything to bring or wear because of it. Only use the facts below and do not invent anything. Do not control any devices.',
    '',
    `Weather now: ${f.weatherNow || 'unknown'}`,
    `Forecast today: ${f.forecast || 'unknown'}`,
    `Still on today: ${f.today.length ? f.today.join('; ') : 'nothing on the calendar'}`,
    `Tomorrow: ${f.tomorrow.length ? f.tomorrow.join('; ') : 'nothing on the calendar'}`,
    f.people.length ? `Where everyone is: ${f.people.join('; ')}` : '',
  ].filter((l) => l !== null).join('\n');
}

const listEvents = (evs, day) => {
  const items = evs.slice(0, 3).map((ev) => `${ev.title}${ev.allDay ? '' : ` at ${fmtT(ev.start < day ? day : ev.start)}`}`);
  const more = evs.length > 3 ? ` and ${evs.length - 3} more` : '';
  if (items.length <= 1) return items[0] || '';
  return `${items.slice(0, -1).join(', ')}${more ? `, ${items.at(-1)}${more}` : ` and ${items.at(-1)}`}`;
};

/** The summary without AI, from the same facts. */
function briefLocal(f, now = new Date()) {
  const out = [];
  if (f.weatherNow || f.forecast) {
    const t = f._temp != null ? `${f._temp}${f._unit}` : '';
    const now0 = f.weatherNow ? `${f.weatherNow.split(',')[0].replace(/^\w/, (c) => c.toUpperCase())}${t ? `, ${t} now` : ''}` : '';
    out.push(`${[now0, f.forecast && !f.weatherNow ? f.forecast.replace(/^\w/, (c) => c.toUpperCase()) : f.forecast].filter(Boolean).join('. Today: ')}.`);
  }
  const today = calStartOfDay(now);
  const later = f.part === 'evening' || f.part === 'night';
  if (f._today.length) out.push(`${later ? 'Still on tonight' : 'On today'}: ${listEvents(f._today, today)}.`);
  else if (!later) out.push('Nothing on the calendar today.');
  if (f._tomorrow.length && (later || !f._today.length)) out.push(`Tomorrow: ${listEvents(f._tomorrow, calAddDays(today, 1))}.`);
  else if (later) out.push('Nothing on the calendar tomorrow.');
  return out.join(' ');
}

// ---- notify.js ----
// Recent Home Assistant notifications for Home: the ones waiting in Home Assistant's own notification
// list (persistent notifications) and the ones automations sent to phones (notify.* actions).


const NOTE_KEEP = 25;           // sent notifications remembered
const NOTE_DAYS = 7;                   // and for how long

/** Markdown (as Home Assistant notifications often use) to plain text. */
function noteText(s) {
  return String(s ?? '')
    .replace(/\[([^\]]*)\]\([^)]*\)/g, '$1')
    .replace(/[*_`]{1,3}([^*_`]+)[*_`]{1,3}/g, '$1')
    .replace(/^#+\s*/gm, '')
    .replace(/<[^>]+>/g, '')
    .trim();
}

/** Who a notify action went to: "Sam Pixel" for notify.mobile_app_sam_pixel, "Everyone" for notify.notify. */
function noteTarget(service, data) {
  if (service === 'send_message') {
    const ids = [].concat(data?.entity_id || []);
    return ids.length ? ids.map((id) => id.replace(/^notify\./, '')).join(', ').replace(/_/g, ' ') : '';
  }
  if (service === 'notify') return 'Everyone';
  return service.replace(/^mobile_app_/, '').replace(/_/g, ' ').replace(/\b\w/g, (c) => c.toUpperCase());
}

/** A notify.* call_service event as a remembered notification, or null for ones not worth showing. */
function noteFromCall(event) {
  const d = event?.data || {};
  if (d.domain !== 'notify') return null;
  const sd = d.service_data || {};
  const message = noteText(sd.message);
  // Phone commands ("clear_notification", "request_location_update"…) are not notifications.
  if (!message || /^(clear_notification|request_location_update|command_\w+|remove_channel)$/.test(message)) return null;
  return {
    id: event.context?.id || `${event.time_fired}-${d.service}`,
    title: noteText(sd.title),
    message,
    to: noteTarget(d.service, sd),
    at: event.time_fired || new Date().toISOString(),
  };
}

/** Keep the newest, drop duplicates (every open screen records the same event) and old ones. */
function noteMerge(...lists) {
  const cutoff = Date.now() - NOTE_DAYS * 86_400_000;
  const byId = new Map();
  for (const n of lists.flat()) if (n?.id && Date.parse(n.at) > cutoff) byId.set(n.id, n);
  return [...byId.values()].sort((a, b) => Date.parse(b.at) - Date.parse(a.at)).slice(0, NOTE_KEEP);
}

/** Both kinds of notification, newest first. */
function noteItems({ persistent = [], sent = [] } = {}) {
  return [
    ...persistent.map((n) => ({ ...n, kind: 'ha' })),
    ...sent.map((n) => ({ ...n, kind: 'sent' })),
  ].sort((a, b) => Date.parse(b.at) - Date.parse(a.at));
}

/** The list of notifications (or a note that there are none), as used on Home and in the bell's popup. */
function notesListHtml({ persistent = [], sent = [], canSeeSent = true, limit = 8 } = {}) {
  const items = noteItems({ persistent, sent }).slice(0, limit);
  const row = (n) => `<li class="note ${n.kind}">
      <span class="note-icon">${icon(n.kind === 'ha' ? 'alert' : 'bell')}</span>
      <div class="note-body">
        ${n.title ? `<strong>${esc(n.title)}</strong>` : ''}
        <p>${esc(n.message)}</p>
        <small class="muted">${esc(relativeTime(n.at))}${n.kind === 'sent' && n.to ? ` · to ${esc(n.to)}` : n.kind === 'ha' ? ' · in Home Assistant' : ''}</small>
      </div>
      ${n.kind === 'ha' ? `<button type="button" class="icon-btn note-dismiss" data-note-dismiss="${esc(n.id)}" aria-label="Dismiss">${icon('close')}</button>` : ''}
    </li>`;
  return items.length ? `<ul class="notes">${items.map(row).join('')}</ul>`
    : `<p class="muted notes-empty">No notifications in the last week.${canSeeSent ? '' : ' Notifications sent to phones show here for administrator logins.'}</p>`;
}

function notesHtml(opts = {}) {
  return `<section class="notes-wrap">
    <h2 class="section-title">Notifications</h2>
    <div class="notes-card">${notesListHtml(opts)}</div>
  </section>`;
}

/**
 * A soft bell "ding", made with Web Audio so there is no sound file to upload.
 * Safari (and the Home Assistant app on iPad and iPhone) only lets a page make sound after it has
 * been tapped, so the sound is switched on by the first tap anywhere; until then play() returns false.
 */
class Ding {
  constructor() {
    this.ctx = null;
    this.AC = window.AudioContext || window.webkitAudioContext;
    // Leave navigator.audioSession alone: 'playback' would stop the voice assistant's microphone on iPad.
    const unlock = () => this.unlock();
    for (const ev of ['pointerdown', 'touchend', 'keydown']) document.addEventListener(ev, unlock, { capture: true, passive: true });
  }

  get supported() { return !!this.AC; }
  get ready() { return this.ctx?.state === 'running'; }

  /** Call from a tap: creates or wakes the audio (Safari suspends it again when the page is hidden). */
  unlock() {
    if (!this.AC || this.ready) return;
    try {
      if (!this.ctx) this.ctx = new this.AC();
      // A silent blip inside the tap is what actually unlocks iOS.
      const buf = this.ctx.createBuffer(1, 1, 22050);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      src.connect(this.ctx.destination);
      src.start(0);
      this.ctx.resume?.().catch(() => {});
    } catch { /* ignore */ }
  }

  /** Ring once. Returns false when the browser has not allowed sound yet. */
  play(volume = 0.5) {
    if (!this.ready) return false;
    const ctx = this.ctx;
    const t = ctx.currentTime + 0.02;
    const out = ctx.createGain();
    out.gain.value = volume;
    out.connect(ctx.destination);
    // A struck bell: a fundamental and a few inharmonic partials that die away at different rates.
    for (const [ratio, gain, decay] of [[1, 0.6, 1.6], [2.0, 0.22, 0.9], [2.76, 0.14, 0.6], [5.4, 0.05, 0.25]]) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 1046.5 * ratio; // C6
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      osc.connect(g).connect(out);
      osc.start(t);
      osc.stop(t + decay + 0.05);
    }
    return true;
  }
}

// ---- home.js ----
// What a home needs at a glance, and a room's devices sorted into kinds.
// Rules go by domain, device class and device, never by one home's entity ids, so new blinds,
// switches and power points show up in the right place as soon as Home Assistant has them.
// Pure functions: app.js passes in what it knows about areas and devices.


/**
 * @typedef {object} HomeCtx
 * @property {Map<string, object>} states
 * @property {(id: string) => boolean} listed      shown on the dashboard at all
 * @property {(id: string) => string|null} deviceOf
 * @property {(id: string) => string|null} areaOf
 * @property {(id: string) => object} shown        state with any optimistic change applied
 */

const SAFETY_CLASSES = new Set(['smoke', 'gas', 'carbon_monoxide', 'moisture', 'safety', 'tamper']);
const OPENING_CLASSES = new Set(['door', 'window', 'opening', 'garage_door']);
const MOTION_CLASSES = new Set(['motion', 'occupancy', 'presence']);
// Appliances have doors too; a dishwasher left ajar to dry is not news.
const APPLIANCE_WORDS = /dishwasher|washing|washer|dryer|oven|fridge|refrigerator|freezer|microwave|airfryer|air fryer/i;
// Lights that are meant to stay on, so "lights on" is not always one.
const STATUS_LIGHTS = /notification|indicator|status|night ?light|led ring/i;
// Sensors that measure something other than the room.
const NOT_ROOM_TEMP = /fridge|freezer|refrigerat|oven|water|pool|spa|cpu|battery|inverter|probe|heater|outdoor|outside/i;

const isOn = (s) => s?.state === 'on';
const minutesSince = (iso) => (Date.now() - new Date(iso).getTime()) / 60000;

/**
 * When Home Assistant last started, judged from the minute most states last changed in: a restart
 * stamps everything with the same time, which says nothing about when a person walked past.
 */
function restartMinute(states) {
  const counts = new Map();
  for (const s of states.values()) {
    const m = Math.floor(Date.parse(s.last_changed) / 60000);
    if (Number.isFinite(m)) counts.set(m, (counts.get(m) || 0) + 1);
  }
  let best = null;
  let n = 0;
  for (const [m, c] of counts) if (c > n) { best = m; n = c; }
  return n >= Math.max(10, states.size * 0.25) ? best : null;
}

/** Entity ids by device, for pairing a power point with its own power reading. */
function devicesIndex(ctx) {
  const map = new Map();
  for (const id of ctx.states.keys()) {
    const d = ctx.deviceOf(id);
    if (!d) continue;
    if (!map.has(d)) map.set(d, []);
    map.get(d).push(id);
  }
  return map;
}

/** "Dryer Socket 1" -> "Dryer": the appliance a power point or switch is for. */
function applianceName(s) {
  return nameOf(s).replace(/\s*(smart\s*)?(socket|plug|outlet|power ?point|gpo|switch|relay)\s*\d*\s*$/i, '').trim();
}

function siblings(id, ctx, devices) {
  const d = ctx.deviceOf(id);
  return d ? (devices.get(d) || []).filter((x) => x !== id) : [];
}
