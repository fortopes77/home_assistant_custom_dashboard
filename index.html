/** The "running" sensor for an appliance: on the same device, or named after it ("Dryer Running"). */
function runningSensorFor(s, ctx, devices) {
  const own = siblings(s.entity_id, ctx, devices).find((x) => domainOf(x) === 'binary_sensor' && /running|in use|active/i.test(nameOf(ctx.states.get(x) || {})));
  if (own) return ctx.states.get(own);
  const base = applianceName(s).toLowerCase();
  if (!base || base === nameOf(s).toLowerCase()) return null;
  for (const r of ctx.states.values()) {
    if (domainOf(r.entity_id) !== 'binary_sensor') continue;
    const n = nameOf(r).toLowerCase();
    if (n.startsWith(base) && /running$/.test(n)) return r;
  }
  return null;
}

/** Live watts drawn through a switch or power point, when it measures them. */
function powerOf(s, ctx, devices) {
  let id = siblings(s.entity_id, ctx, devices).find((x) => domainOf(x) === 'sensor' && ctx.states.get(x)?.attributes?.device_class === 'power');
  if (!id) {
    const base = applianceName(s).toLowerCase();
    if (base && base !== nameOf(s).toLowerCase()) {
      id = [...ctx.states.values()].find((r) => domainOf(r.entity_id) === 'sensor' && r.attributes?.device_class === 'power'
        && nameOf(r).toLowerCase() === `${base} power`)?.entity_id;
    }
  }
  const r = id && ctx.states.get(id);
  if (!r || isUnavailable(r)) return null;
  const v = Number(r.state);
  if (!Number.isFinite(v)) return null;
  return r.attributes?.unit_of_measurement === 'kW' ? v * 1000 : v;
}

function fmtWatts(w) {
  if (w == null) return '';
  return Math.abs(w) >= 1000 ? `${(w / 1000).toFixed(1)} kW` : `${Math.round(w)} W`;
}

/** What a switch or power point tile adds to its state: "Running · 450 W". */
function switchNote(s, ctx, devices) {
  const parts = [];
  const running = runningSensorFor(s, ctx, devices);
  if (isOn(running)) parts.push('Running');
  const w = powerOf(s, ctx, devices);
  if (w != null && (s.state === 'on' || w > 0)) parts.push(fmtWatts(w));
  return parts.join(' · ');
}

// ---------- a room's devices, by kind ----------

const GROUPS = [
  ['alerts', 'Needs attention', 'alert'],
  ['cameras', 'Cameras', 'camera'],
  ['lights', 'Lights', 'light'],
  ['blinds', 'Blinds and curtains', 'cover'],
  ['doors', 'Doors and locks', 'door'],
  ['power', 'Switches and power points', 'outlet'],
  ['climate', 'Climate', 'climate'],
  ['media', 'Media', 'media_player'],
  ['scenes', 'Scenes', 'scene'],
  ['sensors', 'Sensors', 'sensor'],
];

function kindOf(s) {
  const domain = domainOf(s.entity_id);
  const dc = s.attributes?.device_class;
  switch (domain) {
    case 'camera': return 'cameras';
    case 'light': return 'lights';
    case 'cover': return isCoverDoor(s) ? 'doors' : 'blinds';
    case 'lock': return 'doors';
    case 'switch': case 'input_boolean': case 'siren': return 'power';
    case 'climate': case 'fan': case 'humidifier': case 'water_heater': return 'climate';
    case 'media_player': case 'remote': return 'media';
    case 'scene': case 'script': case 'button': case 'input_button': return 'scenes';
    case 'binary_sensor':
      if ((dc === 'problem' || SAFETY_CLASSES.has(dc)) && s.state === 'on') return 'alerts';
      if (OPENING_CLASSES.has(dc) && !APPLIANCE_WORDS.test(nameOf(s))) return 'doors';
      return 'sensors';
    default: return 'sensors';
  }
}

/**
 * A room's devices sorted into kinds, in the order people reach for them.
 * @returns {{key: string, title: string, icon: string, items: object[]}[]}
 */
function roomGroups(ents) {
  const by = new Map();
  for (const s of ents) {
    const k = kindOf(s);
    if (!by.has(k)) by.set(k, []);
    by.get(k).push(s);
  }
  return GROUPS.filter(([k]) => by.has(k)).map(([key, title, icon]) => ({ key, title, icon, items: by.get(key) }));
}

/** The temperature sensor that stands for the room, skipping fridges, water heaters and the like. */
function roomTemperature(ents) {
  return ents.find((s) => domainOf(s.entity_id) === 'sensor' && s.attributes?.device_class === 'temperature'
    && s.state !== '' && Number.isFinite(Number(s.state)) && !NOT_ROOM_TEMP.test(nameOf(s))
    && Number(s.state) > -15 && Number(s.state) < 50);
}

const isStatusLight = (s) => STATUS_LIGHTS.test(nameOf(s));

/** Open blinds, running appliances and live power in a room, for its label on the plan. */
function roomExtras(ents) {
  const blinds = ents.filter((s) => domainOf(s.entity_id) === 'cover' && !isCoverDoor(s) && !isUnavailable(s));
  const running = ents.filter((s) => domainOf(s.entity_id) === 'binary_sensor' && isOn(s) && /running$/i.test(nameOf(s)));
  return {
    blinds: blinds.length,
    blindsOpen: blinds.filter((s) => s.state !== 'closed').length,
    running: running.length,
  };
}

// ---------- at a glance ----------

/** Fold several items of one kind into the first (most recent first). */
function merge(items, match, fold) {
  const list = items.filter(match).sort((a, b) => (a.age ?? 0) - (b.age ?? 0));
  if (list.length < 2) return;
  const at = items.indexOf(list[0]);
  for (const i of list) items.splice(items.indexOf(i), 1);
  items.splice(at, 0, fold(list));
}

/**
 * The few things worth knowing about the home right now, most pressing first.
 * Each: { key, tone: 'alert'|'warn'|'info'|'ok', icon, text, sub?, open?: entity_id, href?, act?: {label, domain, service, ids} }
 */
function glanceItems(ctx, { areaName, solar } = {}) {
  const items = [];
  const devices = devicesIndex(ctx);
  const all = [...ctx.states.values()].filter((s) => ctx.listed(s.entity_id) && !isUnavailable(s)).map(ctx.shown);
  const where = (s) => {
    const a = ctx.areaOf(s.entity_id);
    const n = a ? areaName(a) : '';
    return n && !nameOf(s).toLowerCase().includes(n.toLowerCase()) ? n : '';
  };
  const since = (s) => relativeTime(s.last_changed).replace(/^in /, '');
  // Did this change really happen when it says? Seen on in this session, or not stamped by a restart.
  const boot = restartMinute(ctx.states);
  const real = (s) => ctx.seenOn?.(s.entity_id) || boot == null || Math.abs(Math.floor(Date.parse(s.last_changed) / 60000) - boot) > 1;

  const people = all.filter((s) => domainOf(s.entity_id) === 'person');
  const nobodyHome = people.length > 0 && people.every((p) => p.state !== 'home');

  for (const s of all) {
    const domain = domainOf(s.entity_id);
    const dc = s.attributes?.device_class;
    if (domain === 'alarm_control_panel' && s.state === 'triggered') {
      items.push({ key: s.entity_id, tone: 'alert', icon: 'alert', text: `${nameOf(s)} triggered`, open: s.entity_id });
    }
    if (domain === 'binary_sensor' && isOn(s) && (SAFETY_CLASSES.has(dc) || dc === 'problem')) {
      // A fault or leak needs doing something about; "rinse aid nearly empty" can wait for the next shop.
      const tone = SAFETY_CLASSES.has(dc) ? 'alert' : /fail|fault|leak|alarm|error|offline/i.test(nameOf(s)) ? 'warn' : 'info';
      items.push({ key: s.entity_id, tone, icon: 'alert', text: nameOf(s), sub: where(s), open: s.entity_id });
    }
    if (domain === 'cover' && isCoverDoor(s) && s.state !== 'closed') {
      items.push({ key: s.entity_id, tone: 'warn', icon: 'garageOpen', text: `${nameOf(s).replace(/\s+door\s+\d+$/i, ' door')} ${s.state === 'open' ? 'open' : s.state}`, sub: since(s), open: s.entity_id });
    }
    if (domain === 'lock' && (s.state === 'unlocked' || s.state === 'open')) {
      items.push({ key: s.entity_id, tone: 'warn', icon: 'lockOpen', text: `${nameOf(s)} unlocked`, sub: since(s), open: s.entity_id });
    }
    if (domain === 'binary_sensor' && OPENING_CLASSES.has(dc) && isOn(s) && !APPLIANCE_WORDS.test(nameOf(s))) {
      const n = nameOf(s).replace(/\b(door|window)\s+\1\b/i, '$1');
      items.push({ key: s.entity_id, tone: nobodyHome ? 'warn' : 'info', icon: 'door', text: `${n.charAt(0).toUpperCase()}${n.slice(1)} open`, sub: since(s), open: s.entity_id });
    }
    if (domain === 'sensor' && /warnings?$/i.test(nameOf(s)) && Number(s.state) > 0) {
      items.push({ key: s.entity_id, tone: 'warn', icon: 'weather', text: `${s.state} weather ${Number(s.state) === 1 ? 'warning' : 'warnings'}`, open: s.entity_id });
    }
  }

  // Cameras that saw someone in the last ten minutes.
  for (const s of all) {
    if (domainOf(s.entity_id) !== 'binary_sensor' || !MOTION_CLASSES.has(s.attributes?.device_class)) continue;
    const n = nameOf(s);
    if (!/person|people/i.test(n)) continue;
    const mins = minutesSince(s.last_changed);
    if (!isOn(s) && (mins > 10 || !real(s))) continue;
    const place = n.replace(/\s*(person|people)\s*(detected)?\s*$/i, '').trim();
    const cam = siblings(s.entity_id, ctx, devices).find((x) => domainOf(x) === 'camera')
      || [...ctx.states.keys()].find((x) => domainOf(x) === 'camera' && nameOf(ctx.states.get(x)).toLowerCase().startsWith(place.toLowerCase()));
    items.push({
      key: s.entity_id, tone: nobodyHome ? 'warn' : 'info', icon: 'person', age: isOn(s) ? 0 : mins,
      text: `Someone at ${place.replace(/\b([A-Z])([A-Z]+)\b/g, (m, a, b) => a + b.toLowerCase())}`,
      sub: isOn(s) ? 'now' : since(s), open: cam || s.entity_id,
    });
  }

  // Appliances: running now, or finished in the last 45 minutes.
  for (const s of all) {
    if (domainOf(s.entity_id) !== 'binary_sensor' || !/running$/i.test(nameOf(s))) continue;
    const appliance = nameOf(s).replace(/\s*running$/i, '');
    const mins = minutesSince(s.last_changed);
    if (isOn(s)) {
      const left = siblings(s.entity_id, ctx, devices).map((x) => ctx.states.get(x))
        .find((r) => r && /remaining|finish/i.test(nameOf(r)) && !isUnavailable(r));
      let sub = since(s).replace(/ ago$/, '');
      if (left && left.attributes?.device_class === 'timestamp') sub = `done ${relativeTime(left.state)}`;
      items.push({ key: s.entity_id, tone: 'info', icon: 'appliance', text: `${appliance} running`, sub: `for ${sub}`, open: s.entity_id });
    } else if (mins < 45 && real(s)) {
      items.push({ key: s.entity_id, tone: 'ok', icon: 'appliance', text: `${appliance} finished`, sub: since(s), open: s.entity_id, age: mins });
    }
  }

  const lightsOn = all.filter((s) => domainOf(s.entity_id) === 'light' && isOn(s) && !isStatusLight(s));
  if (lightsOn.length) {
    items.push({
      key: 'lights', tone: nobodyHome ? 'warn' : 'info', icon: 'light',
      text: `${lightsOn.length} ${lightsOn.length === 1 ? 'light' : 'lights'} on`,
      sub: lightsOn.length <= 2 ? lightsOn.map(nameOf).join(', ') : '',
      href: '#/entities?domain=light',
      act: { label: 'Turn off', domain: 'light', service: 'turn_off', ids: lightsOn.map((s) => s.entity_id) },
    });
  }

  const sun = ctx.states.get('sun.sun');
  const blindsOpen = all.filter((s) => domainOf(s.entity_id) === 'cover' && !isCoverDoor(s) && s.state === 'open');
  if (blindsOpen.length && sun?.state === 'below_horizon') {
    items.push({
      key: 'blinds', tone: 'info', icon: 'blindOpen', text: `${blindsOpen.length} ${blindsOpen.length === 1 ? 'blind' : 'blinds'} open`,
      sub: 'after dark', href: '#/entities?domain=cover',
      act: { label: 'Close', domain: 'cover', service: 'close_cover', ids: blindsOpen.map((s) => s.entity_id) },
    });
  }

  if (solar) items.push({ key: 'solar', tone: 'ok', icon: 'solar', text: solar.text, sub: solar.sub, href: '#/solar' });

  merge(items, (i) => i.icon === 'person', (list) => ({
    ...list[0], text: `${list[0].text} and ${list.length - 1} more`,
  }));
  merge(items, (i) => i.icon === 'appliance' && / finished$/.test(i.text), (list) => ({
    ...list[0], text: `${list.map((i) => i.text.replace(/ finished$/, '')).join(', ').replace(/, ([^,]*)$/, ' and $1')} finished`,
  }));

  const order = { alert: 0, warn: 1, info: 2, ok: 3 };
  items.sort((a, b) => order[a.tone] - order[b.tone]);
  if (nobodyHome) items.unshift({ key: 'away', tone: 'info', icon: 'home', text: 'Nobody home' });
  if (!items.some((i) => i.tone === 'alert' || i.tone === 'warn' || i.icon === 'door')) {
    items.push({ key: 'quiet', tone: 'ok', icon: 'check', text: 'Doors shut, all quiet' });
  }
  return items;
}

// ---- news.js ----
// Recent news from Home Assistant, two ways:
//  - a feed sensor that keeps a list of stories in an attribute (the HACS "feedparser" sensor's
//    `entries`, or a RESTful sensor reading an RSS feed into `item`), which is the full list;
//  - the Feedreader integration's event entities (event.just_in, ...), which only hold the latest
//    story. Each new one seen is added to a short log kept in the Home Assistant profile, so the
//    wall screen that is always on collects them for the phones.
// News websites block being read straight from the browser, so Home Assistant has to fetch them.


const NEWS_KEEP = 40;
const NEWS_DAYS = 3;

const strip = (s) => String(s ?? '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&')
  .replace(/&#39;|&rsquo;|&lsquo;/g, "'").replace(/&quot;|&ldquo;|&rdquo;/g, '"').replace(/\s+/g, ' ').trim();

function when(v) {
  const t = Date.parse(v);
  return Number.isFinite(t) ? t : null;
}

function story(raw, source) {
  const title = strip(raw.title?.['#text'] ?? raw.title);
  if (!title) return null;
  const link = String(raw.link?.['@href'] ?? raw.link ?? raw.guid?.['#text'] ?? raw.guid ?? '');
  const image = raw.image || raw['media:thumbnail']?.['@url'] || [].concat(raw['media:content'] || [])[0]?.['@url'] || '';
  return {
    id: link || title,
    title,
    link: /^https?:\/\//.test(link) ? link : '',
    summary: strip(raw.summary ?? raw.description ?? '').slice(0, 400),
    image: /^https?:\/\//.test(image) ? image : '',
    at: when(raw.published ?? raw.pubDate ?? raw.updated) ?? null,
    source,
  };
}

/** Sensors holding a list of stories, and Feedreader's event entities. */
function newsSources(states) {
  const lists = [];
  const events = [];
  for (const s of states.values()) {
    const d = domainOf(s.entity_id);
    const a = s.attributes || {};
    if (d === 'event' && (a.event_type === 'feedreader' || (a.event_types || []).includes('feedreader'))) events.push(s);
    else if (d === 'sensor' && [a.entries, a.item, a.items].some(Array.isArray)) lists.push(s);
  }
  return { lists, events };
}

/** The latest story an event entity holds right now. */
function storyFromEvent(s) {
  const a = s.attributes || {};
  const st = story({ title: a.title, link: a.link, description: a.description || a.content, published: a.published || s.state }, nameOf(s));
  if (st) st.at ||= when(s.state);
  return st;
}

/** Every story on show, newest first, without repeats. */
function newsItems(states, log = []) {
  const { lists, events } = newsSources(states);
  const all = [...log];
  for (const s of lists) {
    const a = s.attributes;
    for (const raw of [].concat(a.entries || a.items || a.item || [])) {
      const st = story(raw, nameOf(s).replace(/\s*(news)?\s*feed$/i, '') || 'News');
      if (st) all.push(st);
    }
  }
  for (const s of events) {
    const st = storyFromEvent(s);
    if (st) all.push(st);
  }
  return newsMerge(all);
}

function newsMerge(list) {
  const cutoff = Date.now() - NEWS_DAYS * 86_400_000;
  const seen = new Map();
  for (const n of list) {
    if (!n?.title || (n.at && n.at < cutoff)) continue;
    const key = n.link || n.title.toLowerCase();
    const had = seen.get(key);
    if (!had || (!had.summary && n.summary)) seen.set(key, { ...had, ...n });
  }
  return [...seen.values()].sort((a, b) => (b.at || 0) - (a.at || 0)).slice(0, NEWS_KEEP);
}

const ago = (t) => {
  if (!t) return '';
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} h ago`;
  return new Date(t).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
};

/** Headlines; each opens to its summary and a link to the full story. */
function newsHtml(items, { limit = 6, open = '' } = {}) {
  if (!items.length) return '';
  return `<ol class="news">${items.slice(0, limit).map((n) => {
    const isOpen = open === n.id;
    return `<li class="story${isOpen ? ' open' : ''}">
      <button type="button" class="story-head" data-story="${esc(n.id)}" aria-expanded="${isOpen}">
        ${n.image ? `<img class="story-img" src="${esc(n.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}
        <span class="story-title">${esc(n.title)}</span>
        <span class="story-meta">${esc([n.source, ago(n.at)].filter(Boolean).join(' · '))}</span>
      </button>
      ${isOpen ? `<div class="story-body">
        ${n.summary ? `<p>${esc(n.summary)}</p>` : ''}
        ${n.link ? `<a class="story-link" href="${esc(n.link)}" target="_blank" rel="noopener">Read the full story ${icon('openNew')}</a>` : ''}
      </div>` : ''}
    </li>`;
  }).join('')}</ol>`;
}

// ---- sky.js ----
// Live sky background, drawn on one canvas behind the page.
// The gradient follows the sun (elevation, and whether it is rising or setting) and the weather
// entity adds clouds, rain, snow, hail, fog and lightning. Colours ease towards their targets, so
// the sky drifts continuously through the day instead of jumping between fixed looks.

const skyClamp = (v, lo = 0, hi = 1) => Math.min(hi, Math.max(lo, v));
const skyLerp = (a, b, t) => a + (b - a) * t;
const skyHex = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
const skyMix = (c1, c2, t) => c1.map((v, i) => skyLerp(v, c2[i], t));
const skyRgb = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const skyLum = (c) => (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255;

// [sun elevation in degrees, [top, middle, horizon]]. Mornings run cool (rose, peach, gold);
// evenings run hot (tangerine, crimson, violet).
const NIGHT = ['#03071a', '#081130', '#111b40'];
const DAY_HIGH = ['#1c6ad8', '#4896ee', '#a2cfff'];
const RISING = [
  [-18, NIGHT],
  [-11, ['#0a1232', '#1a2453', '#36386a']],
  [-6, ['#18275a', '#4f4f8e', '#b98196']],
  [-2, ['#2f4b8a', '#a98bb4', '#ffb592']],
  [2, ['#4673bd', '#e9b4a8', '#ffd98f']],
  [8, ['#3b84dc', '#97c2ef', '#ffe7bf']],
  [20, ['#2479e2', '#5ca7f3', '#b5dcff']],
  [55, DAY_HIGH],
].map(([e, c]) => [e, c.map(skyHex)]);
const SETTING = [
  [-18, NIGHT],
  [-11, ['#0b0d2e', '#24194d', '#432657']],
  [-6, ['#191a4d', '#5c2b69', '#c24a4d']],
  [-2, ['#29296a', '#b0426a', '#ff7430']],
  [2, ['#36559f', '#e2735a', '#ffad42']],
  [8, ['#3679cf', '#93b6e4', '#ffcf8f']],
  [20, ['#2479e2', '#5ca7f3', '#b5dcff']],
  [55, DAY_HIGH],
].map(([e, c]) => [e, c.map(skyHex)]);

// How each weather condition changes the sky. grey: how far colours fade to an overcast grey.
const WEATHER_FX = {
  sunny: {}, 'clear-night': {},
  partlycloudy: { cloud: 0.4 },
  cloudy: { cloud: 0.85, grey: 0.6 },
  fog: { cloud: 0.3, grey: 0.6, fog: 1, pale: 0.35 },
  rainy: { cloud: 0.9, grey: 0.7, rain: 0.5, dark: 0.15 },
  pouring: { cloud: 1, grey: 0.85, rain: 1, dark: 0.3 },
  lightning: { cloud: 1, grey: 0.8, lightning: 0.6, dark: 0.3 },
  'lightning-rainy': { cloud: 1, grey: 0.85, rain: 0.85, lightning: 1, dark: 0.4 },
  snowy: { cloud: 0.9, grey: 0.65, snow: 0.8, pale: 0.4 },
  'snowy-rainy': { cloud: 0.9, grey: 0.7, rain: 0.35, snow: 0.45, pale: 0.15 },
  hail: { cloud: 1, grey: 0.8, hail: 0.8, dark: 0.2 },
  windy: { cloud: 0.35, wind: 1 },
  'windy-variant': { cloud: 0.7, grey: 0.35, wind: 1 },
  exceptional: { cloud: 0.7, grey: 0.5 },
};

// Scenes for Settings, so every look can be seen without waiting for the weather.
// sweep: [from, to, seconds] moves the sun so sunrise visibly rises and sunset visibly sets.
const SKY_PREVIEWS = {
  sunrise: { label: 'Sunrise', rising: true, condition: 'sunny', sweep: [-9, 6, 40] },
  day: { label: 'Clear day', elevation: 50, rising: true, condition: 'sunny' },
  partly: { label: 'Partly cloudy', elevation: 35, rising: false, condition: 'partlycloudy' },
  sunset: { label: 'Sunset', rising: false, condition: 'sunny', sweep: [6, -9, 40] },
  night: { label: 'Night', elevation: -30, rising: false, condition: 'clear-night' },
  rain: { label: 'Rain', elevation: 30, rising: true, condition: 'rainy' },
  storm: { label: 'Storm', elevation: 20, rising: false, condition: 'lightning-rainy' },
  snow: { label: 'Snow', elevation: 20, rising: true, condition: 'snowy' },
  fog: { label: 'Fog', elevation: 6, rising: true, condition: 'fog' },
  rainynight: { label: 'Rainy night', elevation: -25, rising: false, condition: 'pouring' },
};

function samplePalette(table, elevation) {
  if (elevation <= table[0][0]) return table[0][1];
  for (let i = 1; i < table.length; i++) {
    const [e1, c1] = table[i];
    if (elevation <= e1) {
      const [e0, c0] = table[i - 1];
      const t = (elevation - e0) / (e1 - e0);
      return c0.map((c, j) => skyMix(c, c1[j], t));
    }
  }
  return table[table.length - 1][1];
}

/** Rough sun position from the clock, for when Home Assistant has no sun.sun entity. */
function clockSun(date = new Date()) {
  const h = date.getHours() + date.getMinutes() / 60;
  return { elevation: 62 * Math.sin((Math.PI * (h - 6.5)) / 12.5) - 4, rising: h < 12.75 };
}

class Sky {
  constructor(canvas, { onTone } = {}) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.onTone = onTone;
    this.inputs = { ...clockSun(), condition: 'sunny' };
    this.preview = null;
    this.previewStart = 0;
    this.animate = true;
    this.running = false;
    this.cur = null;
    this.tone = null;
    this.night = null;
    this.t = 0;
    this.last = 0;
    this.lastDraw = 0;
    this.flash = 0;
    this.nextFlash = 3;
    this.bolt = null;
    this.cloudSprites = [];
    this.spriteColor = null;
    this.reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

    this.stars = Array.from({ length: 140 }, () => ({
      x: Math.random(), y: Math.random() ** 1.4 * 0.75, r: 0.4 + Math.random() ** 3 * 1.4, p: Math.random() * 6.28,
    }));
    this.clouds = Array.from({ length: 9 }, (_, i) => ({
      x: Math.random() * 1.4 - 0.2, y: 0.04 + (i % 5) * 0.11 + Math.random() * 0.05,
      s: 0.55 + Math.random() * 0.8, v: 0.6 + Math.random() * 0.8, k: i % 4,
    }));
    this.drops = [];
    this.flakes = [];

    this._frame = (now) => this._loop(now);
    this._onResize = () => this.resize();
    this._onVisible = () => (document.hidden ? this.stop() : this.start());
  }

  start() {
    if (this.running || document.hidden) return;
    if (!this.listening) {
      this.listening = true;
      window.addEventListener('resize', this._onResize);
      document.addEventListener('visibilitychange', this._onVisible);
      this.resize();
    }
    this.running = true;
    this.last = performance.now();
    requestAnimationFrame(this._frame);
  }

  stop() {
    this.running = false;
  }

  destroy() {
    this.stop();
    this.listening = false;
    window.removeEventListener('resize', this._onResize);
    document.removeEventListener('visibilitychange', this._onVisible);
  }

  /** elevation (deg), rising (bool), condition (HA weather state), wind (km/h, optional). */
  setInputs(inputs, { instant = false } = {}) {
    this.inputs = { ...this.inputs, ...inputs };
    // The first real reading replaces the clock-based guess at once rather than fading over.
    if (instant && this.cur) this.cur.snap = 1;
  }

  setPreview(key) {
    this.preview = SKY_PREVIEWS[key] || null;
    this.previewStart = this.t;
    // Jump close to the new scene so the preview responds straight away.
    if (this.cur) this.cur.snap = 0.85;
  }

  resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    const w = window.innerWidth;
    const h = Math.max(window.innerHeight, document.documentElement.clientHeight);
    // Keep the canvas to about 1.2 million pixels; the sky is soft, so more buys little.
    const scale = Math.min(dpr, Math.sqrt(1_200_000 / (w * h)));
    this.canvas.width = Math.round(w * scale);
    this.canvas.height = Math.round(h * scale);
    this.scale = scale;
    this.w = w;
    this.h = h;
    this.lastDraw = 0;
    if (!this.running) this._loop(performance.now(), true);
  }

  /** The look the sky is easing towards. */
  _target() {
    let { elevation, rising, condition, wind } = this.inputs;
    if (this.preview) {
      ({ rising, condition } = this.preview);
      const sw = this.preview.sweep;
      if (sw) {
        const p = ((this.t - this.previewStart) / sw[2]) % 1;
        elevation = skyLerp(sw[0], sw[1], p);
      } else {
        elevation = this.preview.elevation;
      }
      wind = 0;
    }
    const fx = { cloud: 0, grey: 0, rain: 0, snow: 0, hail: 0, fog: 0, lightning: 0, wind: 0, dark: 0, pale: 0, ...WEATHER_FX[condition] };
    if (wind > 30) fx.wind = Math.max(fx.wind, skyClamp((wind - 30) / 30));

    let stops = samplePalette(rising ? RISING : SETTING, elevation);
    const daylight = skyClamp((elevation + 10) / 25);
    if (fx.grey) {
      // Fade towards a grey of the same brightness, a touch blue, darker for heavy rain.
      stops = stops.map((c) => {
        const l = skyLum(c) * 255 * (1 - fx.dark);
        return skyMix(c, [l * 0.94, l * 0.98, l * 1.06], fx.grey);
      });
    }
    if (fx.pale) stops = stops.map((c) => skyMix(c, [214, 222, 232], fx.pale * daylight));

    // Warm glow around sunrise and sunset, strongest with the sun on the horizon.
    const glow = Math.exp(-(((elevation - 0.5) / 6) ** 2)) * (1 - fx.cloud * 0.75);
    const cloudy = fx.cloud;
    return {
      stops,
      elevation,
      rising: rising ? 1 : 0,
      glow,
      sunVis: skyClamp((elevation + 5) / 4) * (1 - cloudy) ** 1.5,
      stars: skyClamp((-elevation - 5) / 8) * (1 - cloudy * 0.95),
      moon: skyClamp((-elevation - 7) / 6) * (1 - cloudy * 0.8),
      cloud: fx.cloud,
      rain: fx.rain, snow: fx.snow, hail: fx.hail, fog: fx.fog, lightning: fx.lightning, wind: fx.wind,
      daylight,
    };
  }

  _ease(target, dt) {
    if (!this.cur) {
      this.cur = target;
      return;
    }
    const c = this.cur;
    // Ease over a few seconds, faster right after a preview change.
    const k = c.snap || 1 - Math.exp(-dt / 3);
    c.snap = 0;
    for (const key of Object.keys(target)) {
      if (key === 'stops') c.stops = c.stops.map((col, i) => skyMix(col, target.stops[i], k));
      else if (key === 'rising') c.rising = target.rising;
      else c[key] = skyLerp(c[key], target[key], k);
    }
  }

  _loop(now, once = false) {
    if (!once && !this.running) return;
    const still = !this.animate || this.reducedMotion.matches;
    const busy = this.cur && (this.cur.rain > 0.05 || this.cur.snow > 0.05 || this.cur.hail > 0.05 || this.cur.lightning > 0.05);
    // 30 fps for falling rain and snow, 20 for drifting clouds, a still frame every few seconds otherwise.
    const interval = still ? 4000 : busy ? 1000 / 30 : 1000 / 20;
    if (once || now - this.lastDraw >= interval - 4) {
      const elapsed = this.lastDraw ? Math.min(0.1, (now - this.lastDraw) / 1000) : 0;
      if (!still) this.t += elapsed;
      this._ease(this._target(), still ? 10 : elapsed);
      this._draw(still ? 0 : elapsed, still);
      this.lastDraw = now;
    }
    this.last = now;
    if (!once) requestAnimationFrame(this._frame);
  }

  _draw(dt, still) {
    const { ctx, cur: c } = this;
    const W = this.canvas.width;
    const H = this.canvas.height;
    const S = this.scale;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // The smooth layers (gradient, glow, sun, moon) change slowly, so they are painted at half
    // size a few times a second and stretched; only the moving details are drawn every frame.
    if (!this.base || this.t - this.baseAt > 0.2 || this.t < this.baseAt || still || this.base.width !== Math.ceil(W / 2)) {
      this._drawBase(Math.ceil(W / 2), Math.ceil(H / 2), S / 2);
      this.baseAt = this.t;
    }
    ctx.drawImage(this.base, 0, 0, W, H);

    // Stars.
    if (c.stars > 0.01) {
      ctx.fillStyle = '#fff';
      for (const s of this.stars) {
        const tw = 0.55 + 0.45 * Math.sin(this.t * 1.3 + s.p * 7);
        ctx.globalAlpha = c.stars * tw * (0.5 + s.r / 3);
        ctx.beginPath();
        ctx.arc(s.x * W, s.y * H, s.r * S, 0, 6.283);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
    // 5. Clouds, lit by the sky: white by day, pink at dawn and dusk, slate in the rain and at night.
    if (c.cloud > 0.02) {
      const base = skyMix([255, 255, 255], skyMix(c.stops[2], [255, 255, 255], 0.35), c.glow * 0.8);
      const dim = skyLerp(0.18, 1, Math.max(c.daylight, c.glow * 0.85)) * (1 - c.rain * 0.35 - c.lightning * 0.2);
      const col = base.map((v) => v * dim);
      this._ensureSprites(col);
      const count = Math.round(c.cloud * this.clouds.length);
      const speed = (6 + c.wind * 40) * S;
      for (let i = 0; i < this.clouds.length; i++) {
        const cl = this.clouds[i];
        cl.x += (dt * speed * cl.v) / W;
        if (cl.x > 1.25) cl.x = -0.45;
        const vis = skyClamp(c.cloud * this.clouds.length - i);
        if (i >= count + 1 || vis <= 0) continue;
        const spr = this.cloudSprites[cl.k];
        const w = W * 0.5 * cl.s;
        const h = (w * spr.height) / spr.width;
        ctx.globalAlpha = vis * skyLerp(0.75, 0.95, c.cloud);
        ctx.drawImage(spr, cl.x * W - w / 2, cl.y * H, w, h);
      }
      ctx.globalAlpha = 1;
    }

    // 6. Fog: wide pale bands rolling slowly across the lower sky.
    if (c.fog > 0.02) {
      for (let i = 0; i < 4; i++) {
        const y = H * (0.45 + i * 0.15);
        const x = W * (((this.t * (0.012 + i * 0.004) + i * 0.37) % 1.6) - 0.3);
        const fg = ctx.createRadialGradient(x, y, 0, x, y, W * 0.8);
        fg.addColorStop(0, skyRgb([235, 238, 242], 0.35 * c.fog));
        fg.addColorStop(1, skyRgb([235, 238, 242], 0));
        ctx.save();
        ctx.translate(0, y);
        ctx.scale(1, 0.3);
        ctx.translate(0, -y);
        ctx.fillStyle = fg;
        ctx.fillRect(0, y - H * 2, W, H * 4);
        ctx.restore();
      }
    }

    // 7. Rain, slanting with the wind.
    const area = (this.w * this.h) / 1800;
    this._fill(this.drops, Math.round(area * c.rain), () => ({
      x: Math.random() * 1.2 - 0.1, y: Math.random(), l: 0.5 + Math.random() * 0.8, v: 0.8 + Math.random() * 0.5,
    }));
    if (this.drops.length && c.rain > 0.01) {
      const slant = 0.12 + c.wind * 0.3;
      const night = 1 - c.daylight;
      ctx.strokeStyle = skyRgb(skyMix([210, 222, 238], [150, 170, 205], night), 0.45);
      ctx.lineWidth = 1.2 * S;
      ctx.lineCap = 'round';
      ctx.beginPath();
      for (const d of this.drops) {
        d.y += dt * d.v * 1.6;
        d.x += dt * d.v * 1.6 * slant * (this.h / this.w);
        if (d.y > 1.05) { d.y = -0.05; d.x = Math.random() * 1.2 - 0.15; }
        const len = d.l * 26 * S;
        const x = d.x * W;
        const y = d.y * H;
        ctx.moveTo(x, y);
        ctx.lineTo(x - len * slant, y - len);
      }
      ctx.stroke();
    }

    // 8. Snow and hail.
    const flakes = Math.round(area * 0.45 * c.snow) + Math.round(area * 0.6 * c.hail);
    this._fill(this.flakes, flakes, () => ({
      x: Math.random(), y: Math.random(), r: 1 + Math.random() * 2.4, v: 0.5 + Math.random() * 0.6, p: Math.random() * 6.28,
    }));
    if (this.flakes.length) {
      const hail = c.hail > c.snow;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      for (const f of this.flakes) {
        f.y += dt * f.v * (hail ? 1.1 : 0.09);
        f.x += dt * (Math.sin(this.t * 0.9 + f.p) * (hail ? 0 : 0.012) + c.wind * 0.05);
        if (f.y > 1.03) { f.y = -0.03; f.x = Math.random(); }
        if (f.x > 1.02) f.x -= 1.04;
        const r = (hail ? f.r * 0.6 : f.r) * S;
        ctx.moveTo(f.x * W + r, f.y * H);
        ctx.arc(f.x * W, f.y * H, r, 0, 6.283);
      }
      ctx.fill();
    }

    // 9. Lightning: an occasional flicker across the whole sky, sometimes with a bolt.
    if (c.lightning > 0.3 && !still) {
      this.nextFlash -= dt;
      if (this.nextFlash <= 0) {
        this.flash = 1;
        this.nextFlash = 4 + Math.random() * 9 / c.lightning;
        this.bolt = Math.random() < 0.6 ? this._makeBolt(W, H) : null;
      }
    }
    if (this.flash > 0.01) {
      const f = this.flash * (0.6 + 0.4 * Math.sin(this.flash * 40));
      ctx.fillStyle = `rgba(225,232,255,${0.45 * f})`;
      ctx.fillRect(0, 0, W, H);
      if (this.bolt) {
        ctx.strokeStyle = `rgba(255,255,255,${f})`;
        ctx.lineWidth = 2.2 * S;
        ctx.shadowColor = 'rgba(190,210,255,0.9)';
        ctx.shadowBlur = 18 * S;
        ctx.beginPath();
        this.bolt.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      this.flash = Math.max(0, this.flash - dt * 2.4);
    }

    this._report();
  }

  _drawBase(W, H, S) {
    if (!this.base) this.base = document.createElement('canvas');
    if (this.base.width !== W || this.base.height !== H) {
      this.base.width = W;
      this.base.height = H;
    }
    const ctx = this.base.getContext('2d');
    const c = this.cur;
    // 1. Base gradient. The middle stop breathes slowly so the sky never sits completely still.
    const breathe = Math.sin(this.t / 23) * 0.06;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, skyRgb(c.stops[0]));
    g.addColorStop(skyClamp(0.55 + breathe, 0.3, 0.8), skyRgb(c.stops[1]));
    g.addColorStop(1, skyRgb(c.stops[2]));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // Sun position: low on the left in the morning, low on the right in the evening, high mid-sky.
    const lift = skyClamp((c.elevation + 6) / 60);
    const sunX = W * (c.rising ? skyLerp(0.18, 0.5, lift) : skyLerp(0.82, 0.5, lift));
    const sunY = H * (0.92 - lift * 0.82);

    // 2. Sunrise / sunset glow, with soft bands of light that drift up at dawn and sink at dusk.
    if (c.glow > 0.01) {
      const warm = c.rising ? [255, 196, 140] : [255, 128, 52];
      const gy = Math.max(sunY, H * 0.8);
      const rg = ctx.createRadialGradient(sunX, gy, 0, sunX, gy, Math.max(W, H) * 0.85);
      rg.addColorStop(0, skyRgb(warm, 0.75 * c.glow));
      rg.addColorStop(0.35, skyRgb(warm, 0.28 * c.glow));
      rg.addColorStop(1, skyRgb(warm, 0));
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);

      for (let i = 0; i < 3; i++) {
        const p = (this.t / 18 + i / 3) % 1;
        const by = c.rising ? H * (0.95 - p * 0.5) : H * (0.5 + p * 0.45);
        const a = Math.sin(p * Math.PI) * 0.16 * c.glow;
        const band = ctx.createRadialGradient(sunX, by, 0, sunX, by, W * 0.9);
        band.addColorStop(0, skyRgb(c.rising ? [255, 226, 180] : [255, 150, 90], a));
        band.addColorStop(1, skyRgb([255, 200, 150], 0));
        ctx.save();
        ctx.translate(0, by);
        ctx.scale(1, 0.22);
        ctx.translate(0, -by);
        ctx.fillStyle = band;
        ctx.fillRect(0, by - H * 3, W, H * 6);
        ctx.restore();
      }
    }

    // Moon.
    if (c.moon > 0.01) {
      const mx = W * 0.8;
      const my = H * 0.16;
      const mr = Math.min(W, H) * 0.035 + 10 * S;
      const mg = ctx.createRadialGradient(mx, my, mr * 0.5, mx, my, mr * 5);
      mg.addColorStop(0, skyRgb([220, 228, 255], 0.22 * c.moon));
      mg.addColorStop(1, skyRgb([220, 228, 255], 0));
      ctx.fillStyle = mg;
      ctx.fillRect(mx - mr * 5, my - mr * 5, mr * 10, mr * 10);
      ctx.globalAlpha = c.moon;
      ctx.fillStyle = '#eef1fb';
      ctx.beginPath();
      ctx.arc(mx, my, mr, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = skyRgb(c.stops[0]);
      ctx.globalAlpha = c.moon * 0.92;
      ctx.beginPath();
      ctx.arc(mx + mr * 0.45, my - mr * 0.2, mr * 0.9, 0, 6.283);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // 4. Sun, yellow-white overhead and deep orange on the horizon.
    if (c.sunVis > 0.01) {
      const low = 1 - skyClamp((c.elevation + 2) / 22);
      const core = skyMix([255, 250, 228], c.rising ? [255, 196, 120] : [255, 120, 40], low);
      const r = Math.min(W, H) * 0.045 + 8 * S;
      const sg = ctx.createRadialGradient(sunX, sunY, r * 0.6, sunX, sunY, r * 7);
      sg.addColorStop(0, skyRgb(core, 0.55 * c.sunVis));
      sg.addColorStop(0.25, skyRgb(core, 0.18 * c.sunVis));
      sg.addColorStop(1, skyRgb(core, 0));
      ctx.fillStyle = sg;
      ctx.fillRect(sunX - r * 7, sunY - r * 7, r * 14, r * 14);
      ctx.globalAlpha = c.sunVis;
      ctx.fillStyle = skyRgb(core);
      ctx.beginPath();
      ctx.arc(sunX, sunY, r, 0, 6.283);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

  }

  _fill(list, n, make) {
    while (list.length < n) list.push(make());
    if (list.length > n) list.length = n;
  }

  _makeBolt(W, H) {
    const pts = [];
    let x = W * (0.2 + Math.random() * 0.6);
    let y = 0;
    while (y < H * (0.35 + Math.random() * 0.25)) {
      pts.push([x, y]);
      x += (Math.random() - 0.5) * W * 0.06;
      y += H * (0.03 + Math.random() * 0.04);
    }
    return pts;
  }

  // Cloud sprites are drawn once per colour, not every frame.
  _ensureSprites(col) {
    const key = col.map((v) => Math.round(v / 10)).join();
    if (key === this.spriteColor) return;
    this.spriteColor = key;
    const shade = col.map((v) => v * 0.78);
    this.cloudSprites = [0, 1, 2, 3].map((k) => {
      const cv = document.createElement('canvas');
      cv.width = 360;
      cv.height = 200;
      const x = cv.getContext('2d');
      const grad = x.createLinearGradient(0, 30, 0, 140);
      grad.addColorStop(0, skyRgb(col));
      grad.addColorStop(1, skyRgb(shade));
      x.fillStyle = grad;
      x.filter = 'blur(6px)';
      const puffs = [
        [[80, 100, 48], [150, 72, 62], [230, 88, 52], [290, 108, 38], [180, 112, 50]],
        [[70, 104, 40], [130, 84, 50], [200, 64, 58], [270, 92, 46], [180, 112, 52]],
        [[90, 96, 54], [170, 78, 60], [250, 102, 44], [140, 114, 46]],
        [[60, 110, 34], [120, 92, 46], [190, 80, 52], [260, 98, 44], [310, 114, 30], [190, 116, 48]],
      ][k];
      x.beginPath();
      for (const [px, py, r] of puffs) {
        x.moveTo(px + r, py);
        x.arc(px, py, r, 0, 6.283);
      }
      x.fill();
      return cv;
    });
  }

  // Tell the page whether text on the sky should be light or dark, and whether it is night.
  _report() {
    const c = this.cur;
    const l = skyLum(c.stops[0]) * 0.55 + skyLum(c.stops[1]) * 0.45 + c.fog * 0.1;
    let tone = this.tone;
    if (tone !== 'light' && l > 0.6) tone = 'light';
    else if (tone !== 'dark' && l < 0.52) tone = 'dark';
    else if (!tone) tone = l > 0.56 ? 'light' : 'dark';
    const night = c.elevation < -4;
    if (tone !== this.tone || night !== this.night) {
      this.tone = tone;
      this.night = night;
      this.onTone?.({ tone, night, top: skyRgb(c.stops[0]) });
    }
  }
}

// ---- wall.js ----
// Wall mode for an always-on tablet: a clock screen after a spell without touches, software
// dimming (more at night), keeping the screen awake, and full screen.

const IDLE_CHOICES = [[0, 'Never'], [1, '1 min'], [2, '2 min'], [5, '5 min'], [10, '10 min']];
const DIM_CHOICES = [[0, 'Off'], [0.35, 'Low'], [0.55, 'Medium'], [0.75, 'High']];

class Wall {
  /**
   * @param {object} opts
   * @param {HTMLElement} opts.overlay  The clock screen element.
   * @param {HTMLElement} opts.dimmer   Full-screen black layer used for dimming.
   * @param {() => object} opts.prefs   Returns { wall, idleMinutes, dim, dimNight, keepAwake }.
   * @param {() => boolean} opts.isNight
   * @param {() => void} opts.onIdle    Called as the clock screen appears (e.g. go back to Home).
   * @param {() => void} opts.onWake    Called when a touch dismisses it.
   * @param {() => void} opts.paint     Fills in the clock screen's content.
   */
  constructor(opts) {
    Object.assign(this, opts);
    this.idle = false;
    this.lastActivity = Date.now();
    this.wakeLock = null;
    this.wakeLockError = '';
    this.shiftTimer = null;

    const activity = () => { this.lastActivity = Date.now(); };
    for (const ev of ['pointerdown', 'keydown', 'wheel', 'touchstart']) {
      document.addEventListener(ev, activity, { capture: true, passive: true });
    }
    // The touch that wakes the screen should not also press whatever is underneath.
    this.overlay.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      this.wake();
    });
    document.addEventListener('keydown', () => this.idle && this.wake(), true);
    document.addEventListener('visibilitychange', () => this.applyWakeLock());
    setInterval(() => this.check(), 5000);
  }

  get enabled() {
    return !!this.prefs().wall;
  }

  /** Re-read the settings: call after they change. */
  update() {
    if (!this.enabled && this.idle) this.wake();
    document.documentElement.classList.toggle('wall', this.enabled);
    this.applyDim();
    this.applyWakeLock();
  }

  check() {
    const { idleMinutes } = this.prefs();
    if (this.idle) {
      this.paint();
      this.applyDim();
      return;
    }
    if (!this.enabled || !idleMinutes || document.hidden) return;
    if (Date.now() - this.lastActivity >= idleMinutes * 60_000) this.sleep();
  }

  sleep() {
    if (this.idle) return;
    this.idle = true;
    this.onIdle?.();
    this.paint();
    this.overlay.hidden = false;
    document.documentElement.classList.add('is-idle');
    this.shift();
    this.shiftTimer = setInterval(() => this.shift(), 60_000);
    this.applyDim();
  }

  wake() {
    if (!this.idle) return;
    this.idle = false;
    this.lastActivity = Date.now();
    this.overlay.hidden = true;
    document.documentElement.classList.remove('is-idle');
    clearInterval(this.shiftTimer);
    this.applyDim();
    this.onWake?.();
  }

  // Nudge the clock a little each minute so nothing sits in one spot all night.
  shift() {
    const x = (Math.random() - 0.5) * 8;
    const y = (Math.random() - 0.5) * 8;
    this.overlay.style.setProperty('--shift', `translate(${x.toFixed(1)}vw, ${y.toFixed(1)}vh)`);
  }

  applyDim() {
    const { dim = 0, dimNight } = this.prefs();
    let level = this.idle ? dim : 0;
    if (this.idle && dimNight && this.isNight()) level = Math.min(0.8, Math.max(level, 0.5) + 0.2);
    this.dimmer.style.opacity = String(level);
  }

  async applyWakeLock() {
    const want = this.enabled && this.prefs().keepAwake && document.visibilityState === 'visible';
    if (!want) {
      this.wakeLock?.release().catch(() => {});
      this.wakeLock = null;
      return;
    }
    if (this.wakeLock || !('wakeLock' in navigator)) {
      if (!('wakeLock' in navigator)) {
        this.wakeLockError = window.isSecureContext
          ? 'This browser cannot keep the screen on.'
          : 'Keeping the screen on needs the https address of Home Assistant.';
      }
      return;
    }
    try {
      const lock = await navigator.wakeLock.request('screen');
      this.wakeLock = lock;
      this.wakeLockError = '';
      lock.addEventListener('release', () => {
        if (this.wakeLock === lock) this.wakeLock = null;
      });
    } catch (err) {
      this.wakeLockError = err.message || 'The browser refused to keep the screen on.';
    }
  }

  static get canFullscreen() {
    const el = document.documentElement;
    return !!(el.requestFullscreen || el.webkitRequestFullscreen);
  }

  static toggleFullscreen() {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      (el.requestFullscreen || el.webkitRequestFullscreen).call(el)?.catch?.(() => {});
    }
  }
}

// ---- install.js ----
// "Install as an app": a web app manifest and icons, generated in the page so the dashboard
// still ships as one index.html. Browsers only offer to install a page served over https.


const installState = { prompt: null, installed: false, listeners: new Set() };

function appIcon(size, maskable = false) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, size);
  g.addColorStop(0, '#2b6c74');
  g.addColorStop(0.6, '#3f8a86');
  g.addColorStop(1, '#e0912a');
  x.fillStyle = g;
  if (maskable) {
    x.fillRect(0, 0, size, size);
  } else {
    const r = size * 0.22;
    x.beginPath();
    x.roundRect ? x.roundRect(0, 0, size, size, r) : x.rect(0, 0, size, size);
    x.fill();
  }
  // The house from the favicon, centred inside the maskable safe zone.
  const s = (size * (maskable ? 0.5 : 0.62)) / 24;
  x.translate((size - 24 * s) / 2, (size - 24 * s) / 2);
  x.scale(s, s);
  x.fillStyle = '#ffffff';
  x.fill(new Path2D(ICONS.home));
  return c.toDataURL('image/png');
}

function setupInstall() {
  const isStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  installState.installed = !!isStandalone;

  // Opened inside Home Assistant (an iframe), installing makes no sense.
  if (window.top === window) {
    const here = location.origin + location.pathname;
    const name = document.title || 'Home';
    const manifest = {
      name,
      short_name: name.slice(0, 12),
      id: here,
      start_url: here + location.search,
      scope: here.replace(/[^/]*$/, ''),
      display: 'standalone',
      orientation: 'any',
      background_color: '#f3f1ec',
      theme_color: '#2b6c74',
      icons: [
        { src: appIcon(192), sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: appIcon(512), sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: appIcon(512, true), sizes: '512x512', type: 'image/png', purpose: 'maskable' },
      ],
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = `data:application/manifest+json,${encodeURIComponent(JSON.stringify(manifest))}`;
    document.head.append(link);

    const touch = document.createElement('link');
    touch.rel = 'apple-touch-icon';
    touch.href = appIcon(180, true);
    document.head.append(touch);
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    installState.prompt = e;
    notifyInstall();
  });
  window.addEventListener('appinstalled', () => {
    installState.prompt = null;
    installState.installed = true;
    notifyInstall();
  });
}

function notifyInstall() {
  for (const fn of installState.listeners) fn();
}

function onInstallChange(fn) {
  installState.listeners.add(fn);
}

/** What Settings should say about installing, and whether it can show an Install button. */
function installInfo() {
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (window.top !== window) {
    return { text: 'You are viewing this inside Home Assistant. Open the dashboard address directly in the browser to install it as an app.' };
  }
  if (installState.installed) return { text: 'Running as an installed app.' };
  if (installState.prompt) return { canInstall: true, text: 'Install the dashboard as an app with its own icon, full screen and no browser bars.' };
  if (ios) return { text: 'In Safari, tap Share and then Add to Home Screen. It opens full screen like an app.' };
  if (!window.isSecureContext) {
    return { text: 'Browsers only install apps from https addresses. Open the dashboard through your https Home Assistant address (for example Home Assistant Cloud) to install it. On http you can still use Add to Home screen in the browser menu for a shortcut.' };
  }
  return { text: 'Use Install app or Add to Home screen in the browser menu.' };
}

async function promptInstall() {
  const p = installState.prompt;
  if (!p) return false;
  p.prompt();
  const { outcome } = await p.userChoice;
  installState.prompt = null;
  notifyInstall();
  return outcome === 'accepted';
}

// Talk to Home Assistant's Assist, the voice assistant set up in Home Assistant (Settings → Voice assistants).
// Speech goes to Home Assistant over the same WebSocket (assist_pipeline/run): Home Assistant turns it into
// text, hands it to the conversation agent (its own, or an AI such as Claude, OpenAI or Gemini) and speaks

const VOICE_KEY = 'ha-dash.voice';
const VOICE_RATE = 16000;          // what Home Assistant's speech-to-text expects: 16 kHz, 16-bit, mono
const VOICE_MAX_MS = 15_000;       // stop listening after this even if Home Assistant hears no end
const VOICE_CLOSE_MS = 60_000;     // close the panel this long after the last answer (the wall clock screen goes over it)

const VOICE_ERRORS = {
  'stt-no-text-recognized': "Sorry, I didn't catch that.",
  'stt-stream-failed': 'Home Assistant could not turn the speech into text.',
  'stt-provider-missing': 'This assistant has no speech-to-text set up in Home Assistant.',
  'pipeline-not-found': 'That assistant no longer exists in Home Assistant. Pick another one.',
  'intent-failed': 'The assistant could not answer.',
  'tts-failed': 'Home Assistant could not speak the answer.',
  timeout: 'The assistant took too long to answer.',
