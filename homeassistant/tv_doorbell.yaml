# TV doorbell pop-up over any app (Jellyfin, Disney+…), for a Google TV / Android TV.
#
# The dashboard's own pop-up only shows while the TV screen is open. For a camera picture over whatever is
# playing, use Home Assistant's "Notifications for Android TV / Fire TV" integration:
#   1. On the TV, install "Notifications for Android TV" from the Play Store and open it once
#      (allow it to display over other apps).
#   2. In Home Assistant: Settings → Devices & services → Add integration → "Notifications for Android TV / Fire TV",
#      and enter the TV's IP address. It makes a notify action such as notify.living_room_tv.
#   3. Paste this into a new automation (⋮ → Edit in YAML), then change the four entity ids marked CHANGE.
#
# The TV's IP changes when it moves rooms only if your router gives it a new one; reserve it in the router.

alias: TV doorbell pop-up
description: Shows the front door camera on the TV when someone is there or the doorbell rings.
mode: single
max_exceeded: silent
triggers:
  - trigger: state
    entity_id:
      - binary_sensor.front_door_person    # CHANGE: the camera's person sensor
      - binary_sensor.front_door_visitor   # CHANGE: the doorbell's "visitor" (ring) sensor, or remove this line
    to: "on"
actions:
  - action: camera.snapshot
    target:
      entity_id: camera.front_door_fluent  # CHANGE: the camera
    data:
      filename: /config/www/tv_doorbell.jpg
  - action: notify.living_room_tv          # CHANGE: the notify action the integration made
    data:
      title: "{{ 'Doorbell' if 'visitor' in trigger.entity_id else 'Someone at the front door' }}"
      message: "{{ now().strftime('%-I:%M %p') }}"
      data:
        duration: 20
        position: bottom-right
        transparency: 0%
        interrupt: false
        image:
          path: /config/www/tv_doorbell.jpg
  - delay: "00:00:30"   # one pop-up per visit
